default:
  tags:
    - oci-fixed-amd

stages:
  - config_check
  - lint
  - build
  - deploy
  - validate
  - docs_check
  # E2E scenarios are split across three sequential stages instead of
  # one 9-way parallel matrix.  Running 9 kind clusters + DinD daemons
  # concurrently on the shared ``oci-fixed-amd`` runner pool created
  # CPU contention severe enough to starve CoreDNS, which manifested
  # as silent ``startup.sh`` failures (EAI_AGAIN at DB init time) and
  # false-positive test failures.  Three groups of three reduces the
  # peak concurrent load by ~3× while keeping wall-clock time
  # reasonable.  Heavy/known-flaky tests (the ``upgrade-*`` pair and
  # ``externaldb``) are spread one per group rather than piled in one,
  # so no single stage is the bottleneck.
  - e2e_group_a
  - e2e_group_b
  - e2e_group_c

# Prevent duplicate pipelines for push events to branches that also have open MRs
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

.run-deploy:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME =~ /^release\/.*$/'
    - when: never

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  DOCKER_AUTH_CONFIG: ${_DOCKER_AUTH_CONFIG}
  # Guard for helm-deploy-agent-docker-hub. The agent-family charts are all 0.1.0 / appVersion
  # "develop" previews, so their version does not move between pushes the way kasm-helm's does and
  # a re-push would silently replace a published preview with different content. That job therefore
  # refuses any chart whose version already exists under kasmweb/. Set this to "true" when running
  # the pipeline (Run pipeline -> Variables, or the manual job's own variables) to make the
  # overwrite deliberate.
  FORCE_REPUBLISH: "false"

cache:
  key: "${CI_PROJECT_ID}"
  paths:
    - bin/
    - .helm/

# This job is for observability. It will only be triggered by
# kasm_backend and show that a config change.
config_check:
  stage: config_check
  image: ubuntu:24.04
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never
  tags: ["oci-fixed-amd"]
  script: 
    - |
      # ENCODED_FILE_LIST is coming from a trigger in the Kasm_backend job
      # This job will only run if there were changes to a config in the backend
      echo -e "=== CONFIG FILES THAT CHANGED ===\n"
      echo "$ENCODED_FILE_LIST" | base64 -d
      exit 1

helm-lint:
  stage: lint
  image: 
    name: alpine/helm:latest
    entrypoint: [""]
  extends:
    - .run-deploy
  script:
    - helm lint ./charts/kasm-helm
  tags: ["oci-fixed-amd"]

helm-build:
  stage: build
  image: 
    name: alpine/helm:latest
    entrypoint: [""]
  extends:
    - .run-deploy
  script:
    - helm package charts/kasm-helm
  artifacts:
    paths:
      - kasm-helm-1.*.tgz
  tags: ["oci-fixed-amd"]

# The agent-chart-family counterpart to helm-build above. Same stage, same .run-deploy gating; a
# different image because packaging these four is not a one-liner and the Makefile already owns it:
#
#   make deps-agent          builds dependencies inside-out -- charts/kasm-agent first (its 6 local
#                            subcharts + 3 remote deps), then charts/kasm-platform, which archives
#                            charts/kasm-agent off disk and so needs kasm-agent's own charts/ staged
#                            already. Reversing the two produces a kasm-platform archive whose
#                            embedded kasm-agent is missing all 9 of its dependencies.
#   make package-agent       charts/kasm-agent -> dist/, self-contained (this is also the airgap
#                            artifact documented in the kasm-agent README).
#   make package-agent-all   adds kasm-platform, kasm-agent-crds and kasm-egress-installer.
#   make images-agent        renders every scenario and writes dist/kasm-agent-images.txt, the
#                            mirror list for airgapped installs.
#
# One `make` invocation, not four: the targets share prerequisites (deps-agent, render-agent) and
# make runs each at most once per invocation, so the remote dependency fetch happens exactly once.
# python:3.12-bookworm rather than alpine/helm because the Makefile downloads its own pinned helm
# into bin/ (cached above) -- the same arrangement the validate and docs-check jobs use.
helm-build-agent:
  stage: build
  image: python:3.12-bookworm
  extends:
    - .run-deploy
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash curl make git ca-certificates
  script:
    # First, and cheaply (pure stdlib, no tool downloads): refuse to package anything while a
    # file:// pin is stale. `helm package` does not re-resolve dependencies, so a parent whose pin
    # has fallen behind the subchart it names packages the OLD subchart and exits 0 -- the archive
    # is wrong and nothing downstream says so. `make test` runs this too, but the validate stage
    # runs after build and deploy, which is too late to stop a bad archive being published.
    - make version-check-agent
    - make deps-agent package-agent package-agent-all images-agent
  artifacts:
    paths:
      - dist/*.tgz
      - dist/kasm-agent-images.txt
  tags: ["oci-fixed-amd"]

helm-deploy-docker-hub:
  stage: deploy
  image: 
    name: alpine/helm:latest
    entrypoint: [""]
  extends:
    - .run-deploy
  script:
    - echo "$DOCKER_HUB_PASSWORD" | helm registry login registry-1.docker.io -u "$DOCKER_HUB_USERNAME" --password-stdin
    - helm push kasm-helm-1.*.tgz "oci://registry-1.docker.io/kasmweb/"
  tags: ["oci-fixed-amd"]

helm-deploy-gitlab:
  resource_group: helm-repo-publish
  stage: deploy
  image: 
    name: alpine/helm:latest
    entrypoint: [""]
  extends:
    - .run-deploy
  script:
    - apk add --no-cache git gnupg
    - echo "$GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
    - git config --global user.email "$GPG_COMMITTER_EMAIL"
    - git config --global user.name "CI Bot"
    - git config --global user.signingkey "$GPG_KEY_ID"
    - git config --global commit.gpgsign true
    - git config --global gpg.program gpg
    - git clone -b main --single-branch https://oauth2:${HELM_REPO_TOKEN}@gitlab.com/kasm-technologies/internal/kasm-helm-repo.git
    - cp kasm-helm-1.*.tgz kasm-helm-repo/public/
    - helm repo index kasm-helm-repo/public/ --url https://helm.kasm.com --merge kasm-helm-repo/public/index.yaml
    - cd kasm-helm-repo
    - git add public/index.yaml public/kasm-helm-1.*.tgz
    - git commit -S -m "AUTOMATIC PUSH FROM KASM-HELM"
    - git push origin HEAD
  tags: ["oci-fixed-amd"]

# Publishes the four archives helm-build-agent left in dist/ to the same OCI registry and namespace
# helm-deploy-docker-hub uses, with the same credentials and the same `helm registry login`
# pattern. It deviates from that job in exactly two ways, both forced by these charts being 0.1.0
# previews rather than a moving release line:
#
#   when: manual        kasm-helm's version advances every release, so pushing it automatically on
#                       every develop/release commit is always a new tag. The agent charts sit at
#                       0.1.0 with appVersion "develop", so an automatic push would re-push the
#                       same version on every commit -- and the guard below would then fail the
#                       pipeline every time. Publishing a preview is a decision, so it is a button.
#   allow_failure: true required, not cosmetic: deploy runs *before* validate, docs_check and the
#                       three e2e stages, and a blocking manual job (allow_failure: false) would
#                       hold every one of them until someone clicked it. Non-blocking keeps the
#                       rest of the pipeline running; a refused or failed push still shows as a
#                       warning on the job, and the script prints exactly what it refused.
#
# The guard itself: `helm show chart oci://.../<name> --version <v>` succeeds only if that exact
# version is already published, so it is a cheap existence probe. It fails safe: a probe that errors
# for any other reason (auth, rate limit) reads as "not published" and the push is attempted, which
# then fails loudly rather than silently skipping a chart. Publishing over an existing preview is
# allowed, but only when FORCE_REPUBLISH=true says so. Every archive is probed before anything is
# refused, so one conflict does not hide the others.
helm-deploy-agent-docker-hub:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  # Same branch condition as .run-deploy, spelled out because a child job's `rules` replaces the
  # extended one wholesale -- there is no way to add `when: manual` to an inherited rules list.
  rules:
    - if: '$CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME =~ /^release\/.*$/'
      when: manual
      allow_failure: true
    - when: never
  script:
    - |
      set -eu
      if ! ls dist/*.tgz >/dev/null 2>&1; then
        echo "ERROR: no dist/*.tgz artifacts to publish -- helm-build-agent did not run or its artifacts expired."
        exit 1
      fi
      echo "$DOCKER_HUB_PASSWORD" | helm registry login registry-1.docker.io -u "$DOCKER_HUB_USERNAME" --password-stdin
      refused=""
      for archive in dist/*.tgz; do
        # Read the identity out of the archive rather than off the filename: "<name>-<version>.tgz"
        # cannot be split on the last hyphen once a version carries a prerelease tag (0.1.0-rc.1).
        chart_name=$(helm show chart "$archive" | awk '/^name:/ {print $2; exit}')
        chart_version=$(helm show chart "$archive" | awk '/^version:/ {print $2; exit}')
        if helm show chart "oci://registry-1.docker.io/kasmweb/$chart_name" --version "$chart_version" >/dev/null 2>&1; then
          if [ "${FORCE_REPUBLISH:-false}" = "true" ]; then
            echo "REPUBLISH  $chart_name $chart_version -- already in kasmweb/, overwriting (FORCE_REPUBLISH=true)"
          else
            echo "REFUSED    $chart_name $chart_version -- already in kasmweb/"
            refused="$refused $chart_name-$chart_version"
            continue
          fi
        else
          echo "PUBLISH    $chart_name $chart_version -- not yet in kasmweb/"
        fi
        helm push "$archive" "oci://registry-1.docker.io/kasmweb/"
      done
      if [ -n "$refused" ]; then
        echo ""
        echo "ERROR: refused to overwrite already-published version(s):$refused"
        echo ""
        echo "These charts are 0.1.0 / appVersion 'develop' previews, so the same version is what"
        echo "every build produces -- re-pushing replaces a published preview with different content"
        echo "under an unchanged version number, which no consumer can detect."
        echo ""
        echo "Either bump the chart (and every pin naming it) --"
        echo "  python3 scripts/agent_versions.py --bump <chart> <version> --write"
        echo "  make version-check-agent"
        echo "-- or re-run this job with FORCE_REPUBLISH=true to overwrite deliberately."
        exit 1
      fi
  tags: ["oci-fixed-amd"]

# `make test` also runs version-check-agent (scripts/agent_versions.py --check), the guard on the
# hand-maintained file:// dependency pins in charts/kasm-agent and charts/kasm-platform. It belongs
# here rather than in a job of its own: a stale pin is a build-correctness problem in the same class
# as crds-sync-check, which this job already covers.
#
# It is also run standalone at the top of helm-build-agent, and has to be: the validate stage comes
# *after* build and deploy, so this job cannot gate what those two publish. The copy there is the
# gate; this one is the report.
validate:
  stage: validate
  image: python:3.12-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash curl make git ca-certificates
  script:
    - make test
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# Documentation checks run in parallel as a matrix in the docs_check stage:
#
#   readme       — verifies charts/kasm-helm/README.md is in sync with values.yaml + README.md.gotmpl
#   changelog    — verifies charts/kasm-helm/CHANGELOG.md has been updated relative to the target branch
#   readme-all   — same as readme, but for every chart (kasm-helm + all 8 kasm-agent-family charts) —
#                  the drift guard the agent-family charts otherwise lack
#   changelog-all — same as changelog, but for every touched chart's own CHANGELOG.md
#
# All four gate e2e (docs_check precedes all e2e_* stages) while keeping unit-test
# and lint results visible regardless of docs drift state.  The changelog checks
# skip silently on develop and release/* — those are integration targets where
# diffing against themselves is meaningless.
docs-check:
  stage: docs_check
  image: python:3.12-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash curl make git ca-certificates
  parallel:
    matrix:
      - CHECK: [readme, changelog, readme-all, changelog-all]
  script:
    - |
      if [ "$CHECK" = "readme" ]; then
        make readme-check
      elif [ "$CHECK" = "changelog" ]; then
        BASE_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}" make changelog-check
      elif [ "$CHECK" = "readme-all" ]; then
        make readme-check-all
      elif [ "$CHECK" = "changelog-all" ]; then
        BASE_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-develop}" make changelog-check-all
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

.e2e_kind_base:
  # Hidden template (leading dot) — not run directly.  Each concrete
  # ``e2e_group_*`` job extends this and supplies its own ``stage`` and
  # ``parallel.matrix``.  Keeps before_script / script / after_script /
  # retry / rules in one place so future tweaks land everywhere at once.
  image: python:3.12-bookworm
  services:
    - name: docker:28.2.2-dind
      alias: docker
      command: ["--mtu=1460"]
  before_script:
    # On retry attempts, pause before doing anything else.  Many of the
    # transient failures we retry on are CPU-contention-induced (CoreDNS
    # starvation, scheduler pressure under matrix concurrency); jumping
    # straight back into work on the same shared runner pool is likely
    # to land in the same contended window.  5 minutes is long enough
    # for the matrix peers that started near us to either finish or
    # move past their own peak-load phases.  CI_JOB_ATTEMPT is a
    # GitLab-predefined var (>=16.6) that increments on each retry;
    # ``:-1`` covers older GitLab versions by treating an unset value
    # as the first attempt (no sleep).
    - |
      if [ "${CI_JOB_ATTEMPT:-1}" -gt 1 ]; then
        echo "Job retry attempt ${CI_JOB_ATTEMPT}; sleeping 300s to let runner CPU contention subside before re-running ${E2E_TARGET}"
        sleep 300
      fi
    - apt-get update
    - apt-get install -y --no-install-recommends bash curl make git ca-certificates docker.io
    - python -m pip install --upgrade pip
    - echo $DOCKER_HUB_PASSWORD | docker login -u $DOCKER_HUB_USERNAME --password-stdin
    # Purge orphaned docker state from any previous job that may have shared
    # this DinD service. If a prior job crashed (or was force-killed) before
    # its cleanup ran, leftover containers/volumes/networks can survive into
    # this job and cause stale-data races (e.g. a "fresh" PVC mounting an
    # empty-but-existing kasm schema, or an external postgres reusing a
    # previously seeded data volume). Each step is `|| true` so a clean
    # runner is a no-op.
    #
    # Kill orphan kind node containers (kind labels these per-cluster).
    - docker ps -aq --filter "label=io.x-k8s.kind.cluster" | xargs -r docker rm -f || true
    # Kill any lingering pytest harness container from a force-killed run.
    - docker ps -aq --filter "ancestor=kasm-e2e-pytest" | xargs -r docker rm -f || true
    # Reuse the canonical external-postgres cleanup so any future change to
    # what counts as "external-postgres state" lands in one place. Normally
    # this runs via Makefile trap on test exit; we re-run it here to cover
    # the case where a prior job was force-killed and skipped the trap.
    # Removes the kasm-e2e-postgres container and kasm-e2e-postgres-data-*
    # volumes; preserves kasm-e2e-postgres-ssl (disposable, regenerated
    # on demand by start_external_postgres.sh).
    - ./tests/e2e/stop_external_postgres.sh || true
    # Drop the shared kind docker network so `kind-up` recreates it with
    # its required 172.30.0.0/16 subnet (needed by start_external_postgres.sh
    # --ip pinning). Without removal, `kind-up` reuses whatever subnet the
    # network already has, which on a kind-auto-created network won't match.
    - docker network rm kind || true
    # NOTE: deliberately *not* pruning anonymous volumes broadly. kind's
    # leftover node-filesystem volumes are unlabeled 64-hex-char names, but
    # so are anonymous volumes from any other workload sharing this docker
    # daemon — a blanket prune risks nuking unrelated state. Removing the
    # labeled kind containers above is enough to prevent the stale-mount
    # race; the orphan volumes they leave behind are disk-space only, not
    # a correctness problem, and accumulate slowly.
    # Per-job cluster/namespace/release names so concurrent or back-to-back
    # jobs on the same runner cannot collide on the hardcoded `kasm-e2e`.
    # CI_JOB_ID is unique per GitLab job; truncate to keep k8s name length
    # constraints (DNS-1123: 63 chars) safe with downstream resource suffixes.
    - export KIND_CLUSTER_NAME="kasm-e2e-${CI_JOB_ID}"
    - export E2E_NAMESPACE="${KIND_CLUSTER_NAME}"
    - export E2E_RELEASE="${KIND_CLUSTER_NAME}"
  script:
    - make tools
    - make kind-up
    - make ${E2E_TARGET}
  after_script:
    # `after_script` runs in a fresh shell, so re-derive the per-job name.
    - export KIND_CLUSTER_NAME="kasm-e2e-${CI_JOB_ID}"
    - make kind-down
  # Re-run a failed matrix entry up to twice before failing the
  # pipeline.  Even with the 3-stage split below, some residual
  # contention is possible on busy runner pools.  ``script_failure``
  # is the right scope: real test regressions still surface (after 3
  # attempts they're not flakes), but environment-induced races get
  # a chance to land on a less contended scheduling window.  Excludes
  # ``stuck_or_timeout_failure`` so a runaway job doesn't burn 3× the
  # budget.
  retry:
    max: 2
    when:
      - script_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - charts/**/*
        - tests/e2e/**/*
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# Group A: one heavy (upgrade-included) + one medium (multizone) +
# two light (basic, json-logging).
e2e_group_a:
  extends: .e2e_kind_base
  stage: e2e_group_a
  parallel:
    matrix:
      - E2E_TARGET:
          - e2e-basic
          - e2e-multizone
          - e2e-upgrade-included
          - e2e-json-logging

# Group B: one heavy (upgrade-standalone) + one medium (backup) +
# two light (trustedca, preseed).  Standalone-DB upgrade and backup both
# touch external-postgres state via DinD volumes; spreading them across
# different stages avoids two of them stepping on each other's
# kasm-e2e-postgres-data-* volumes within one stage. e2e-preseed guards
# the kasmConfig preseed feature (custom_properties.yaml generation,
# zone/primary resolution, existingDefaultPropertiesSecret) against
# regressions on merge.
e2e_group_b:
  extends: .e2e_kind_base
  stage: e2e_group_b
  parallel:
    matrix:
      - E2E_TARGET:
          - e2e-trustedca
          - e2e-backup
          - e2e-upgrade-standalone
          - e2e-preseed

# Group C: one external-DB (externaldb) + one PSS-restricted
# variant (backup-pss) + one light (pss).
e2e_group_c:
  extends: .e2e_kind_base
  stage: e2e_group_c
  parallel:
    matrix:
      - E2E_TARGET:
          - e2e-pss
          - e2e-backup-pss
          - e2e-externaldb
