deploymentSize: "small"
publicAddr: "kasm.contoso.com"

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  labels: {}

route:
  enabled: false
  tls: {}
  annotations: {}
  labels: {}

proxyService:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-name: kasm-ingress-lb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:<region>:<account-id>:certificate/<certificate-id>"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: 443
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    ## Below are optional
    service.beta.kubernetes.io/aws-load-balancer-subnets: '["subnet-01234567890abcdef", "subnet-109876543210fedcba"]'
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: 8443
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/api/__healthcheck"
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
  labels: {}

certificate:
  secretName: ""
  certManager:
    enabled: false
    addWildCard: true
    issuerName: ""
    issuerKind: ""
    issuerGroup: ""

database:
  # database.standalone -- To use RDS, set the database.standalone = true, then configure settings below for DB connection
  #
  standalone: true
  # database.hostname -- Set this to the Write URL or IP of the RDS instance that the Kasm pods will use to access the DB.
  #
  hostname: <instance name>.<unique rds id>.<region>.rds.amazonaws.com
  # database.port -- Set to the PostgreSQL port used to access the RDS instance.
  #
  port: 5432
  # database.kasmDbName -- The Kasm application database name to use for this deployment instance.
  #
  kasmDbName: kasm
  # database.kasmDbUser -- The Kasm application database user to use for DB access and management by Kasm services
  #
  kasmDbUser: kasmapp
  # database.postgresMasterUser -- This object defines the master user credentials to be used by the db-init-job to create
  # and initialize the Kasm database on the RDS instance. This can be left if you created your RDS instance either with
  # the `kasmapp` user as the master user and the `kasm` as the default DB.
  #
  postgresMasterUser:
    username: postgres
    secret:
      name: k8s-postgres-secret
      key: rds-db-password
  # database.initialize_db -- Set to true to ensure the db-init-job handles initializing the `kasm` database
  #
  initialize_db: true
  ## The below database settings will be ignored since database.standalone = true.
  ##
  image:
    repository: kasmweb/postgres
    tag: 1.17.0
  storage:
    storageClassName: ""
    retentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
  annotations: {}
  resources: {}
  labels: {}

components:
  proxy:
    image:
      repository: kasmweb/proxy
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  api:
    image:
      repository: kasmweb/api
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  manager:
    image:
      repository: kasmweb/manager
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  guac:
    image:
      repository: kasmweb/kasm-guac
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  rdpGateway:
    image:
      repository: kasmweb/rdp-gateway
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  rdpHttpsGateway:
    image:
      repository: kasmweb/rdp-https-gateway
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  share:
    image:
      repository: kasmweb/share
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  redis:
    image:
      repository: redis
      tag: 5-alpine
    annotations: {}
    resources: {}
    labels: {}

imagePullPolicy: "IfNotPresent"
imagePullSecrets: ""
imagePullCredentials: {}
clusterDomain: "cluster.local"
affinity: {}
applySecurity: true
applyHealthChecks: true
restartPolicy: "Always"
labels: {}
nodeSelector: {}

annotations:
  certSecret: {}
  configMap: {}
  deployment: {}
  pod: {}
  service: {}
  secret: {}
  statefulSet: {}

extraLabels:
  certSecret: {}
  configMap: {}
  deployment: {}
  pod: {}
  secret: {}
  service: {}
  job: {}
  jobPod: {}
  statefulSet: {}
