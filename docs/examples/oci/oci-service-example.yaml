deploymentSize: "small"
publicAddr: "kasm.contoso.com"
kasmZones: []

# proxyService -- Configure the external-facing service type to use.
# Allowed service types: ClusterIP or LoadBalancer
#
# The service.annotations defined here only apply to the `proxy` service. If you wish to apply annotations
# to all services, use the annotations.service value at the bottom of this chart.
#
# NOTE: If ingress.enabled or route.enabled set to `true` service.type MUST be set to `ClusterIP`.
#
proxyService:
  type: LoadBalancer
  annotations:
    oci.oraclecloud.com/load-balancer-type: "lb"
    external-dns.alpha.kubernetes.io/hostname: "kasm.contoso.com"
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "1000"
    service.beta.kubernetes.io/oci-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/oci-load-balancer-tls-secret: "cert-secret-name"
    service.beta.kubernetes.io/oci-load-balancer-backend-protocol: "HTTP"
    service.beta.kubernetes.io/oci-load-balancer-tls-backendset-secret: "backendset-cert-secret-name"
    # Below are optional
    service.beta.kubernetes.io/oci-load-balancer-subnet1: "ocid1.subnet.oc1.iad.aaaaaaaa..."
    oci.oraclecloud.com/oci-network-security-groups: "ocid1.networksecuritygroup.oc1.iad.aaaaaaaa..."
    oci.oraclecloud.com/oci-load-balancer-backendset-ssl-config: '{"CipherSuiteName":"oci-default-http2-tls-12-13-ssl-cipher-suite-v1", "Protocols":["TLSv1.2","TLSv1.3"]}'
    oci.oraclecloud.com/oci-load-balancer-listener-ssl-config: '{"CipherSuiteName":"oci-default-http2-tls-12-13-ssl-cipher-suite-v1", "Protocols":["TLSv1.2","TLSv1.3"]}'
  labels: {}

ingress:
  enabled: false
  tls: true
  backendProtocol: http
  ingressClassName: ""
  annotations: {}
  labels: {}

route:
  enabled: false
  tls: {}
  annotations: {}
  labels: {}

certificate:
  # certificate.secretName -- This secret is used to store the certificate used for this deployment. The certificate can either be a trusted public certificate,
  # generated by cert-manager (use settings in `certificate.certManager`), an externally generated certificate added to Kubernetes as a
  # secret, or a self-signed certificate.
  #
  # If you use the OCI Certificate Manager service refer to the
  # [Obtain a Certificate from the Certificates Service](https://docs.oracle.com/en-us/iaas/Content/ContEng/Tasks/contengsettingupnativeingresscontroller-configuring.htm#contengsettingupnativeingresscontroller-https_tls__section_certificate_yourself)
  # documentation for additional configuration steps.
  #
  # NOTE: If you do not enable `cert-manager`, you must generate your own certificates and add them as a Kubernetes secret.
  # Refer to [Kubernetes Secrets](https://kubernetes.io/docs/concepts/configuration/secret/), and 
  # [Kubernetes TLS Secret](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_tls/)
  # for more information.
  #
  # If you use your own certificate the key and certificate MUST be named `tls.key` and `tls.crt`.
  #
  #
  secretName: cert-secret-name
  certManager:
    enabled: true
    addWildCard: true
    issuerName: cert-issuer-name
    issuerKind: Issuer
    issuerGroup: ""
    annotations: {}
    labels: {}

database:
  standalone: false
  hostname: kasm-db
  port: 5432
  kasmDbName: kasm
  kasmDbUser: kasmapp
  kasmDbSecret: {}
  postgresMasterUser: {}
  image:
    repository: kasmweb/postgres
    tag: 1.17.0
  storage:
    storageClassName: oci-storage-class
    pvcSize: 0
    retentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
  annotations: {}
  resources: {}
  labels: {}

dbManagement:
  initialize: true
  upgrade:
    enable: false
    oldDbSecretsName: "kasm-secrets"
    oldDbBackupPvc: "kasm-db-dump-pvc"
    oldDbBackupFileName: "kasm_dump.tar"
  backupCron:
    enabled: false
    pvcName: ""
    schedule: ""
    timeZone: ""
    storageClass: ""
    pvcSize: 0

