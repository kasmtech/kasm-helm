    annotations: {}
    resources: {}
    labels: {}

imagePullPolicy: "IfNotPresent"
imagePullSecrets:
  enabled: false
  name: ""
  type: ""
  server: ""
  username: ""
  password: ""
  email: ""
  labels: {}
  annotations: {}

clusterDomain: "cluster.local"
affinity: {}
applySecurity: true
applyHealthChecks: true
restartPolicy: "Always"
labels: {}
nodeSelector: {}

annotations:
  certSecret: {}
  configMap: {}
  cron: {}
  cronPod: {}
  deployment: {}
  pod: {}
  pvc: {}
  service: {}
  secret: {}
  statefulSet: {}

extraLabels:
  certSecret: {}
  configMap: {}
  cron: {}
  cronPod: {}
  deployment: {}
  pod: {}
  secret: {}
  service: {}
  job: {}
  jobPod: {}
  pvc: {}
  statefulSet: {}

extraObjects: []