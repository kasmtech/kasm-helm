deploymentSize: "small"
publicAddr: "kasm.contoso.com"
kasmZones: []

# proxyService -- Configure the external-facing service type to use.
# Allowed service types: ClusterIP or LoadBalancer
#
# The service.annotations defined here only apply to the `proxy` service. If you wish to apply annotations
# to all services, use the annotations.service value at the bottom of this chart.
#
# NOTE: If ingress.enabled or route.enabled set to `true` service.type MUST be set to `ClusterIP`.
#
proxyService:
  type: LoadBalancer
  annotations:
    cloud.google.com/app-protocols: '{"":"HTTPS"}'
    cloud.google.com/l4-rbs: "enabled"
    cloud.google.com/backend-config: '{"default": "kasm-proxy-backend-config"}'
    networking.gke.io/load-balancer-ip-addresses: 'eu-west2-test'
  labels: {}

ingress:
  enabled: false
  tls: true
  backendProtocol: http
  ingressClassName: ""
  annotations: {}
  labels: {}

route:
  enabled: false
  tls: {}
  annotations: {}
  labels: {}

certificate:
  # certificate.secretName -- This secret is used to store the certificate used for this deployment. The certificate can either be a trusted public certificate,
  # generated by cert-manager (use settings in `certificate.certManager`), an externally generated certificate added to Kubernetes as a
  # secret, or a self-signed certificate.
  #
  # NOTE: If you do not enable `cert-manager`, you must generate your own certificates and add them as a Kubernetes secret.
  # Refer to [Kubernetes Secrets](https://kubernetes.io/docs/concepts/configuration/secret/), and
  # [Kubernetes TLS Secret](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_tls/)
  # for more information.
  #
  # If you use your own certificate the key and certificate MUST be named `tls.key` and `tls.crt`.
  #
  secretName: cert-secret-name
  certManager:
    enabled: false
    addWildCard: true
    issuerName: cert-issuer-name
    issuerKind: Issuer
    issuerGroup: ""
    annotations: {}
    labels: {}

database:
  standalone: false
  hostname: kasm-db
  port: 5432
  kasmDbName: kasm
  kasmDbUser: kasmapp
  kasmDbSecret: {}
  postgresMasterUser: {}
  image:
    repository: kasmweb/postgres
    tag: 1.17.0
  storage:
    storageClassName: ""
    pvcSize: 0
    retentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
  annotations: {}
  resources: {}
  labels: {}

dbManagement:
  initialize: true
  upgrade:
    enable: false
    oldDbSecretsName: kasm-secrets
    oldDbBackupPvc: kasm-db-dump-pvc
    oldDbBackupFileName: kasm_dump.tar
  backupCron:
    enabled: false
    pvcName: ""
    schedule: ""
    timeZone: ""
    storageClass: ""
    pvcSize: 0

components:
  proxy:
    image:
      repository: kasmweb/proxy
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  api:
    image:
      repository: kasmweb/api
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  manager:
    image:
      repository: kasmweb/manager
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  guac:
    image:
      repository: kasmweb/kasm-guac
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  rdpGateway:
    image:
      repository: kasmweb/rdp-gateway
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  rdpHttpsGateway:
    image:
      repository: kasmweb/rdp-https-gateway
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  share:
    image:
      repository: kasmweb/share
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  redis:
    image:
      repository: redis
      tag: 5-alpine
    annotations: {}
    resources: {}
    labels: {}

imagePullPolicy: "IfNotPresent"
imagePullSecrets:
  enabled: false
  name: ""
  type: ""
  server: ""
  username: ""
  password: ""
  email: ""
  labels: {}
  annotations: {}

clusterDomain: "cluster.local"
affinity: {}
applySecurity: true
applyHealthChecks: true
restartPolicy: "Always"
labels: {}
nodeSelector: {}

annotations:
  certSecret: {}
  configMap: {}
  cron: {}
  cronPod: {}
  deployment: {}
  pod: {}
  pvc: {}
  service: {}
  secret: {}
  statefulSet: {}

extraLabels:
  certSecret: {}
  configMap: {}
  cron: {}
  cronPod: {}
  deployment: {}
  pod: {}
  secret: {}
  service: {}
  job: {}
  jobPod: {}
  pvc: {}
  statefulSet: {}

extraObjects:
  - apiVersion: cloud.google.com/v1
    kind: BackendConfig
    metadata:
      name: kasm-proxy-backend-config
    spec:
      timeoutSec: 28800
      connectionDraining:
        drainingTimeoutSec: 60