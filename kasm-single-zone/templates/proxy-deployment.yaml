{{/*
Kasm Proxy server Deployment definition
*/}}
{{- $proxyComponent := "proxy" -}}
{{- $proxyName := (printf "%s-%s" .Release.Name $proxyComponent) -}}
{{- $proxyImage := (printf "%s:%s" .Values.components.proxy.image.repository .Values.components.proxy.image.tag) -}}
{{- $proxyReplicas := include "replicas.preset" (dict "node" $proxyComponent "size" .Values.deploymentSize) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $proxyName }}-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $proxyName }}
    app.kubernetes.io/component: {{ $proxyComponent }}
    {{- include "kasm.defaultLabels" . | indent 4 }}
  {{- if or .Values.components.proxy.labels .Values.extraLabels.deployment .Value.labels }}
    {{- with .Values.components.proxy.labels }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.extraLabels.deployment }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
  {{- if or .Values.components.proxy.annotations .Values.annotations.deployment }}
  annotations:
    {{- with .Values.annotations.deployment }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.components.proxy.annotations }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
spec:
  replicas: {{ $proxyReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: {{ add1 $proxyReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $proxyName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $proxyName }}
        app.kubernetes.io/component: {{ $proxyComponent }}
        {{- include "kasm.defaultLabels" . | indent 8 }}
      {{- if or .Values.components.proxy.labels .Values.extraLabels.pod .Value.labels }}
        {{- with .Values.components.proxy.labels }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.extraLabels.pod }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
      {{- end }}
      {{- if or .Values.components.proxy.annotations .Values.annotations.pod }}
      annotations:
        {{- with .Values.annotations.pod }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.components.proxy.annotations }}{{- toYaml . | indent 8 }}{{- end }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.global.image.restartPolicy }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      {{- end }}
      {{- if .Values.applyHardening }}
        {{- include "kasm.podSecurity" . | indent 6 }}
      {{- end }}
      initContainers:
        {{- if .Values.applyHardening }}
        - name: {{ $proxyName }}-data-perms
          image: {{ $apiImage }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              echo "Setting permissions and ownership for /var/cache/nginx..." && chown -R 1000:1000 /var/cache/nginx && chmod -R 755 /var/cache/nginx
              echo "Setting permissions and ownership for /var/log/external/nginx..." && chown -R 1000:1000 /var/log/external/nginx && chmod -R 755 /var/log/external/nginx
              echo "Setting permissions and ownership for /tmp..." && chmod -R 777 /tmp
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: {{ $proxyName }}-data
              mountPath: /var/cache/nginx
            - name: {{ $proxyName }}-data
              mountPath: /var/log/external/nginx
            - name: {{ $proxyName }}-data
              mountPath: /run
        {{- end }}
        {{- include "kasm.initContainer" (dict "serviceName" $apiSvcName "servicePort" $apiSvcPort "path" "/api/__healthcheck" "schema" "http") | nindent 8 }}
        {{- if .Values.applyHardening }}
          {{- include "kasm.containerSecurity" . | indent 10 }}
        {{- end }}
        {{- include "kasm.initContainer" (dict "serviceName" $managerSvcName "servicePort" $managerSvcPort "path" "/__healthcheck" "schema" "http") | nindent 8 }}
        {{- if .Values.applyHardening }}
          {{- include "kasm.containerSecurity" . | indent 10 }}
        {{- end }}
        {{- if .Values.components.share.enabled }}
          {{- include "kasm.initContainer" (dict "serviceName" $shareSvcName "servicePort" $shareSvcPort "path" "/__healthcheck" "schema" "http") | nindent 8 }}
          {{- if .Values.applyHardening }}
            {{- include "kasm.containerSecurity" . | indent 10 }}
          {{- end }}
        {{- end }}
        {{- if .Values.components.guac.enabled }}
          {{- include "kasm.initContainer" (dict "serviceName" $guacSvcName "servicePort" $guacSvcPort "path" "/__healthcheck" "schema" "http") | nindent 8 }}
          {{- if .Values.applyHardening }}
            {{- include "kasm.containerSecurity" . | indent 10 }}
          {{- end }}
        {{- end }}
        {{- if .Values.components.rdpGateway.enabled }}
          {{- include "kasm.initContainer" (dict "serviceName" $rdpSvcName "servicePort" $rdpSvcPort "path" "/__healthcheck" "schema" "http") | nindent 8 }}
          {{- if .Values.applyHardening }}
            {{- include "kasm.containerSecurity" . | indent 10 }}
          {{- end }}
        {{- end }}
      containers:
        - name: {{ $proxyName }}-container
          image: {{ $proxyImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if .Values.components.proxy.resources }}
          resources: {{- toYaml .Values.components.proxy.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" $proxyComponent "size" .Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- if .Values.applyHardening }}
            {{- include "kasm.containerSecurity" . | indent 10 }}
          {{- end }}
          volumeMounts:
            - name: {{ $proxyName }}-cert
              mountPath: /etc/ssl/certs/kasm_nginx.crt
              subPath: tls.crt
            - name: {{ $proxyName }}-cert
              mountPath: /etc/ssl/private/kasm_nginx.key
              subPath: tls.key
            - name: {{ $proxyName }}-settings-config
              mountPath: /etc/nginx/conf.d
            - name: {{ $proxyName }}-services-config
              mountPath: /etc/nginx/conf.d/services.d
            - name: {{ $proxyName }}-base-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- if .Values.applyHardening }}
            - name: {{ $proxyName }}-data
              mountPath: /var/cache/nginx
            - name: {{ $proxyName }}-data
              mountPath: /var/log/external/nginx
            - name: {{ $proxyName }}-data
              mountPath: /run
            {{- end }}
          ports:
            - name: {{ $proxyName }}-pt
              containerPort: {{ $proxyHttpPort }}
              protocol: TCP
          {{- if .Values.addHealthChecks }}
          livenessProbe:
            {{- include "health.tcp" (dict "portName" (printf "%s-pt" $proxyName) ) | indent 12 }}
          {{- end }}
          {{- if .Values.addHealthChecks }}
          readinessProbe:
            {{- include "health.command" (dict "command" "nginx -t") | indent 12 }}
          {{- end }}
      volumes:
        - name: {{ $proxyName }}-cert
          secret:
            secretName: {{ $proxyName }}-certs
        - name: {{ $proxyName }}-base-config
          configMap:
            name: {{ $proxyName }}-base-configmap
        - name: {{ $proxyName }}-settings-config
          configMap:
            name: {{ $proxyName }}-settings-configmap
        - name: {{ $proxyName }}-services-config
          configMap:
            name: {{ $proxyName }}-services-configmap
        {{- if .Values.applyHardening }}
        - name: {{ $proxyName }}-data
          emptyDir:
            sizeLimit: 1Gi
        {{- end }}
