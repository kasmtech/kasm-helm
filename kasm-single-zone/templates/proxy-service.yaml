{{/*
Deploy the Kasm Proxy service
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $constants.proxy.svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $constants.proxy.svc }}-svc
    app.kubernetes.io/component: {{ $constants.proxy.component }}
    {{- include "kasm.defaultLabels" . | indent 4 }}
    {{- with .Values.components.proxy.labels }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with .Values.extraLabels.service }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with .Values.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $constants.proxy.name }}
  ports:
    - name: {{ printf "%s-svc-%s" $constants.proxy.svc ($constants.proxy.http | toString) }}
      protocol: TCP
      port: {{ $constants.proxy.http }}
    - name: {{ printf "%s-svc-%s" $constants.proxy.svc ($constants.proxy.https | toString) }}
      protocol: TCP
      port: {{ $constants.proxy.https }}
