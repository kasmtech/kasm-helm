{{/*
Add Docker Login auth credentials
*/}}
{{- if .Values.imagePullCredentials }}
  {{- if $.Values.imagePullSecrets }}
    {{- $combined := printf "%s:%s" $.Values.imagePullCredentials.username $.Values.imagePullCredentials.password | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecrets }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.imagePullSecrets }}
    {{- include "kasm.defaultLabels" . | indent 4 }}
    {{- with .Values.extraLabels.secret }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with .Values.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-delete
    {{- with .Values.annotations.secret }}{{- toYaml . | nindent 4 }}{{- end }}
type: kubernetes.io/dockerconfigjson
data:
    .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .Values.imagePullCredentials.registry .Values.imagePullCredentials.username .Values.imagePullCredentials.password .Values.imagePullCredentials.email $combined | b64enc }}
  {{- else }}
    {{- printf "ERROR: Image Pull Secrets (imagePullSecrets) value in your values.yaml must be set if you are using Docker Credentials." | fail }}
  {{- end }}
{{- end }}