{{/*
Deploy the RDP Gateway if .Values.components.rdpGateway.enabled set to true
*/}}
{{- $values := (include "kasm.constants" . | fromYaml) -}}
{{- $rdpGatewayReplicas := include "replicas.preset" (dict "node" $values.rdpGateway.component "size" .Values.deploymentSize) -}}
{{- if eq .Values.components.rdpGateway.enabled true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $values.rdpGateway.name }}-deployment
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $values.rdpGateway.name }}
    app.kubernetes.io/component: {{ $values.rdpGateway.component }}
    {{- include "kasm.defaultLabels" . | indent 4 }}
  {{- if or $.Values.components.rdpGateway.labels $.Values.extraLabels.deployment $.Values.labels }}
    {{- with $.Values.components.rdpGateway.labels }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with $.Values.extraLabels.deployment }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with $.Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
  {{- if or $.Values.components.rdpGateway.annotations $.Values.annotations.deployment }}
  annotations:
    {{- with $.Values.annotations.deployment }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with $.Values.components.rdpGateway.annotations }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
spec:
  replicas: {{ $rdpGatewayReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: {{ add1 $rdpGatewayReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $values.rdpGateway.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $values.rdpGateway.name }}
        app.kubernetes.io/component: {{ $values.rdpGateway.component }}
        {{- include "kasm.defaultLabels" . | indent 8 }}
      {{- if or $.Values.components.rdpGateway.labels $.Values.extraLabels.pod $.Values.labels }}
        {{- with $.Values.components.rdpGateway.labels }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with $.Values.extraLabels.pod }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with $.Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
      {{- end }}
      {{- if or $.Values.components.rdpGateway.annotations .Values.annotations.pod }}
      annotations:
        {{- with $.Values.annotations.pod }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with $.Values.components.rdpGateway.annotations }}{{- toYaml . | indent 8 }}{{- end }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.restartPolicy }}
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecrets }}
      {{- end }}
      {{- if $.Values.applySecurity }}
        {{- include "kasm.podSecurity" . | indent 6 }}
      {{- end }}
      initContainers:
        - name: {{ $values.rdpGateway.name }}-tmp-perms
          image: {{ $values.api.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              echo "Setting ownership and permissions for /usr/local/etc/rdpproxy/var..." && chown -R 1000:1000 /usr/local/etc/rdpproxy/var && chmod -R 777 /usr/local/etc/rdpproxy/var
              echo "Setting ownership and permissions for /opt/kasm/current/log..." && chown -R 1000:1000 /opt/kasm/current/log && chmod -R 777 /opt/kasm/current/log
              echo "Setting ownership and permissions for /tmp" && chown -R 1000:1000 /tmp && chmod -R 777 /tmp
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: {{ $values.rdpGateway.component }}-data
              mountPath: /usr/local/etc/rdpproxy/var
            - name: {{ $values.rdpGateway.component }}-data
              mountPath: /opt/kasm/current/log
            - name: {{ $values.rdpGateway.component }}-data
              mountPath: /tmp
        {{- include "kasm.initContainer" (dict "serviceName" $values.api.svc "servicePort" $values.api.port "path" "/api/__healthcheck" "schema" "http" "image" $values.api.image) | indent 8 }}
        {{- if $.Values.applySecurity }}
          {{- include "kasm.containerSecurity" . | indent 10 }}
        {{- end }}
      containers:
        - name: {{ $values.rdpGateway.name }}-container
          image: {{ $values.rdpGateway.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: SERVER_ZONE_NAME
              value: "default"
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: service-token
            - name: KUBERNETES_SERVICE_HOST
              value: "true"
          ports:
            - name: {{ $values.rdpGateway.name }}-pt
              containerPort: 5555
              protocol: TCP
          {{- if $.Values.addHealthChecks }}
          livenessProbe:
            {{- include "health.tcp" (dict "portName" (printf "%s-pt" $values.rdpGateway.name) ) | indent 12 }}
          {{- end }}
          {{- if $.Values.addHealthChecks }}
          readinessProbe:
            {{- include "health.http" (dict "path" "/__healthcheck" "portName" (printf "%s-pt" $values.rdpGateway.name) ) | indent 12 }}
          {{- end }}
          {{- if $.Values.components.rdpGateway.resources }}
          resources: {{- toYaml $.Values.components.rdpGateway.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" $values.rdpGateway.component "size" $.Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- if $.Values.applySecurity }}
            {{- include "kasm.containerSecurity" . | indent 10 }}
          {{- end }}
          volumeMounts:
            - name: {{ $values.rdpGateway.name }}-cert
              mountPath: /usr/local/etc/rdpproxy/rdpproxy.crt
              subPath: tls.crt
            - name: {{ $values.rdpGateway.name }}-cert
              mountPath: /usr/local/etc/rdpproxy/rdpproxy.key
              subPath: tls.key
            - name: {{ $values.rdpGateway.name }}-data
              mountPath: /usr/local/etc/rdpproxy/var
            - name: {{ $values.rdpGateway.name }}-data
              mountPath: /opt/kasm/current/log
            - name: {{ $values.rdpGateway.name }}-data
              mountPath: /tmp
            - name: {{ $values.rdpGateway.name }}-config
              mountPath: /usr/local/etc/rdpproxy/conf/passthrough.app.config.yaml
              subPath: passthrough.app.config.yaml
      volumes:
        - name: {{ $values.rdpGateway.name }}-cert
          secret:
            secretName: {{ $values.proxy.name }}-certs
        - name: {{ $values.rdpGateway.name }}-data
          emptyDir:
            sizeLimit: 1Gi
        - name: {{ $values.rdpGateway.name }}-config
          configMap:
            name: {{ $values.rdpGateway.name }}-configmap
{{- end }}