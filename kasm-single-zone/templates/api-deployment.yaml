{{/*
Kasm API server Deployment definition
*/}}
{{- $apiComponent := "api" -}}
{{- $apiName := (printf "%s-%s" .Release.Name $apiComponent) -}}
{{- $apiImage := (printf "%s:%s" .Values.components.api.image.repository .Values.components.api.image.tag) -}}
{{- $apiReplicas := include "replicas.preset" (dict "node" $apiComponent "size" .Values.deploymentSize) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $apiName }}-deployment
  namespace: {{ .Release.Namespace }}
  {{- if .Values.components.api.annotations }}
  annotations:
  {{- .Values.components.api.annotations | indent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ $apiName }}
    app.kubernetes.io/component: {{ $apiComponent }}
    {{- include "kasm.defaultLabels" . | indent 4 }}
  {{- if or .Values.components.api.labels .Values.extraLabels.deployment .Value.labels }}
    {{- with .Values.components.api.labels }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.extraLabels.deployment }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
  {{- if or .Values.components.api.annotations .Values.annotations.deployment }}
  annotations:
    {{- with .Values.annotations.deployment }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.components.api.annotations }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
spec:
  replicas: {{ $apiReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: {{ add1 $apiReplicas }}
  selector:
    matchLabels:
        app.kubernetes.io/name: {{ $apiName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $apiName }}
        app.kubernetes.io/component: {{ $apiComponent }}
        {{- include "kasm.defaultLabels" . | indent 8 }}
      {{- if or .Values.components.api.labels .Values.extraLabels.pod .Value.labels }}
        {{- with .Values.components.api.labels }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.extraLabels.pod }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
      {{- end }}
      {{- if or .Values.components.api.annotations .Values.annotations.pod }}
      annotations:
        {{- with .Values.annotations.pod }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.components.api.annotations }}{{- toYaml . | indent 8 }}{{- end }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.restartPolicy }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      {{- end }}
      {{- if .Values.applySecurity }}
        {{- include "kasm.podSecurity" . | indent 6 }}
      {{- end }}
      initContainers:
        - name: db-is-ready
          image: {{ $apiImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: db-password
          command:
            - /bin/bash
            - -c
          args:
            - |
              while [ ! $(PGPASSWORD=$POSTGRES_PASSWORD psql -U kasmapp -d kasm -h db -t -c "select zone_id from zones" 2>/dev/null | wc -l) -ge 2 ]; do echo "Waiting for DB to initialize..."; sleep 5; done
          {{- if .Values.applySecurity }}
            {{- include "kasm.containerSecurity" . | indent 10 }}
          {{- end }}
      containers:
        - name: {{ $apiName }}-container
          image: {{ $apiImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: START_SERVICES
              value: "true"
            - name: KUBERNETES_SERVICE_HOST
              value: "true"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: db-password
          ports:
            - name: {{ $apiName }}-pt
              containerPort: {{ $apiSvcPort }}
              protocol: TCP
          {{- if .Values.addHealthChecks }}
          livenessProbe:
            {{- include "health.tcp" (dict "portName" (printf "%s-pt" $apiName) ) | indent 12 }}
          readinessProbe:
            {{- include "health.http" (dict "path" "/api/__healthcheck" "portName" (printf "%s-pt" $apiName) ) | indent 12 }}
          {{- end }}
          {{- if .Values.components.api.resources }}
          resources: {{- toYaml .Values.components.api.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" $apiComponent "size" .Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- if .Values.applyPodSecurity }}
            {{- include "kasm.containerSecurity" . | indent 10 }}
          {{- end }}
