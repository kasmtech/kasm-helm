{{/*
Deploy the Redis if .Values.components.rdpHttpsGateway.enabled set to true
*/}}
{{- $rdpHttpsGatewaySvcName  := "kasm-rdp-https-gateway" -}}
{{- $rdpHttpsGatewaySvcPort := 9443 -}}
{{- if eq .Values.components.rdpHttpsGateway.enabled true }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $rdpHttpsGatewaySvcName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $rdpHttpsGatewaySvcName }}-svc
    app.kubernetes.io/component: {{ $rdpHttpsGatewayComponent }}
    {{- include "kasm.defaultLabels" $values | indent 4 }}
  {{- if or $.Values.components.rdpHttpsGateway.labels $.Values.extraLabels.service $.Value.labels }}
    {{- with $.Values.components.rdpHttpsGateway.labels }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with $.Values.extraLabels.service }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with $.Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
  {{- with $.Values.annotations.service }}
  annotations: {{ toYaml . | indent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: {{ $rdpHttpsGatewayName }}
  ports:
    - name: {{ printf "%s-svc-%s" $rdpHttpsGatewaySvcName $rdpHttpsGatewaySvcPort }}
      protocol: TCP
      port: {{ $rdpHttpsGatewaySvcPort }}
{{- end }}