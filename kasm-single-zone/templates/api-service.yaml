{{/*
Deploy Kasm API Service .Values.components.api service definition
*/}}
{{- $values := (include "kasm.constants" . | fromYaml) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $values.api.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $values.api.name }}-svc
    app.kubernetes.io/component: {{ $values.api.component }}
    {{- include "kasm.defaultLabels" . | indent 4 }}
  {{- if or .Values.components.api.labels .Values.extraLabels.service .Values.labels }}
    {{- with .Values.components.api.labels }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.extraLabels.service }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
  {{- with .Values.annotations.service }}
  annotations: {{ toYaml . | indent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: {{ $values.api.name }}
  ports:
    - name: {{ printf "%s-svc-%s" $values.api.name ($values.api.port | toString) }}
      protocol: TCP
      port: {{ $values.api.port }}