{{/*
Deploy Kasm API Service .Values.components.api service definition
*/}}
{{- $apiSvcName  := "kasm-api" -}}
{{- $apiSvcPort := 8080 -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $apiSvcName }}
  namespace: {{ Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $apiSvcName }}-svc
    app.kubernetes.io/component: {{ $apiComponent }}
    {{- include "kasm.defaultLabels" $values | indent 4 }}
  {{- if or .Values.components.api.labels .Values.extraLabels.service .Value.labels }}
    {{- with .Values.components.api.labels }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.extraLabels.service }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
  {{- with .Values.annotations.service }}
  annotations: {{ toYaml . | indent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: {{ $apiName }}
  ports:
    - name: {{ printf "%s-svc-%s" $apiSvcName $apiSvcPort }}
      protocol: TCP
      port: {{ $apiSvcPort }}