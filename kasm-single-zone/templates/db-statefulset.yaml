{{/*
Kasm DB server StatefullSet definition
*/}}
{{- $values := (include "kasm.constants" . | fromYaml) -}}
{{- $dbReplicas := include "replicas.preset" (dict "node" $values.db.component "size" .Values.deploymentSize) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $values.db.name }}-statefulset
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $values.db.name }}
    app.kubernetes.io/component: {{ $values.db.component }}
    {{- include "kasm.defaultLabels" . | indent 4 }}
  {{- if or .Values.database.labels .Values.extraLabels.statefulSet .Values.labels }}
    {{- with .Values.database.labels }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.extraLabels.statefulSet }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
  {{- if or .Values.database.annotations .Values.annotations.statefulSet }}
  annotations:
    {{- with .Values.annotations.statefulSet }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.database.annotations }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
spec:
  replicas: 1
  serviceName: {{ $values.db.component }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $values.db.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $values.db.name }}
        app.kubernetes.io/component: {{ $values.db.component }}
        {{- include "kasm.defaultLabels" . | indent 8 }}
      {{- if or .Values.database.labels .Values.extraLabels.pod .Values.labels }}
        {{- with .Values.database.labels }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.extraLabels.pod }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
      {{- end }}
      {{- if or .Values.database.annotations .Values.annotations.pod }}
      annotations:
        {{- with .Values.annotations.pod }}{{- toYaml . | indent 8 }}{{- end }}
        {{- with .Values.database.annotations }}{{- toYaml . | indent 8 }}{{- end }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.restartPolicy }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      {{- end }}
      {{- include "db.podSecurity" . | indent 6 }}
      initContainers:
        - name: {{ $values.db.name }}-data-perms
          image: busybox
          command:
            - /bin/sh
            - -ec
          args:
            - |
              echo "Setting permissions and ownership on /var/lib/postgresql/data..." && mkdir -p /var/lib/postgresql/data/postgres && chown -R 70:70 /var/lib/postgresql/data && chmod -R 0700 /var/lib/postgresql/data
              echo "Setting permissions and ownership on /var/run/postgresql..." && chown -R 70:70 /var/run/postgresql && chmod -R 0700 /var/run/postgresql
              echo "Setting permissions and ownership on /tmp..." && mkdir -p /tmp/postgres && chmod -R 0700 /tmp/postgres && chmod -R 777 /tmp
              echo "Done"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: {{ $values.db.name }}-data
              mountPath: /var/lib/postgresql/data
            - name: {{ $values.db.name }}-data
              mountPath: /tmp
            {{- if .Values.applySecurity }}
            - name: {{ $values.db.name }}-data
              mountPath: /var/run/postgresql
            {{- end }}
      containers:
        - name: {{ $values.db.name }}-container
          image: {{ $values.db.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: POSTGRES_DB
              value: kasm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: db-password
            - name: POSTGRES_USER
              value: kasmapp
          ports:
            - name: {{ $values.db.name }}-pt
              containerPort: {{ $values.db.port }}
              protocol: TCP
          {{- if .Values.addHealthChecks }}
          livenessProbe:
            {{- include "health.command" (dict "command" "pg_isready --port=($values.db.port) -t 10") | indent 12 }}
          {{- end }}
          {{- if .Values.addHealthChecks }}
          readinessProbe:
            {{- include "health.command" (dict "command" "psql -d kasm -U kasmapp -c 'SELECT 1' || exit 1") | indent 12 }}
          {{- end }}
          {{- if .Values.database.resources }}
          resources: {{- toYaml .Values.database.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" $values.db.component "size" .Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- if .Values.applySecurity }}
            {{- include "db.containerSecurity" . | indent 10 }}
          {{- end }}
          volumeMounts:
          - name: {{ $values.db.name }}-data
            mountPath: /var/lib/postgresql/data
            subPath: postgres
          - name: {{ $values.db.name }}-configs
            mountPath: /docker-entrypoint-initdb.d/data.sql
            subPath: data.sql
          - name: {{ $values.db.name }}-configs
            mountPath: /var/lib/postgresql/conf/postgresql.conf
            subPath: postgresql.conf
          - name: {{ $values.db.name }}-configs
            mountPath: /var/lib/postgresql/conf/pg_hba.conf
            subPath: pg_hba.conf
          - name: {{ $values.db.name }}-cert
            mountPath: /etc/ssl/certs/db_server.crt
            subPath: tls.crt
          - name: {{ $values.db.name }}-cert
            mountPath: /etc/ssl/certs/db_server.key
            subPath: tls.key
          - name: {{ $values.db.name }}-data
            mountPath: /tmp
          {{- if .Values.applySecurity }}
          - name: {{ $values.db.name }}-data
            mountPath: /var/run/postgresql
          {{- end }}
      volumes:
        - name: {{ $values.db.name }}-configs
          configMap:
            name: {{ $values.db.name }}-configmap
            defaultMode: 0o644
        - name: {{ $values.db.name }}-cert
          secret:
            secretName: {{ .Values.certificate.secretName }}
            defaultMode: 0o600
  {{- if .Values.database.storage.retentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.database.storage.retentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.database.storage.retentionPolicy.whenScaled }}
  {{- end }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ $values.db.name }}-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if ne .Values.database.storage.storageClassName "" }}
        storageClassName: {{ .Values.database.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: 8Gi