{{/*
Deploy Kasm API Service .Values.database service definition
*/}}
{{- $dbSvcName  := "kasm-db" -}}
{{- $dbSvcPort := 5432 -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $dbSvcName }}
  namespace: {{ Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $dbSvcName }}-svc
    app.kubernetes.io/component: {{ $dbComponent }}
    {{- include "kasm.defaultLabels" $values | indent 4 }}
  {{- if or .Values.database.labels .Values.extraLabels.service .Value.labels }}
    {{- with .Values.database.labels }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.extraLabels.service }}{{- toYaml . | indent 4 }}{{- end }}
    {{- with .Values.labels }}{{- toYaml . | indent 4 }}{{- end }}
  {{- end }}
  {{- with .Values.annotations.service }}
  annotations: {{ toYaml . | indent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: {{ $dbName }}
  ports:
    - name: {{ printf "%s-svc-%s" $dbSvcName $dbSvcPort }}
      protocol: TCP
      port: {{ $dbSvcPort }}