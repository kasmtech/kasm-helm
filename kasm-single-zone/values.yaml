# deploymentSize -- Define the estimated size of the Kasm deployment in expected session load.
#  small  = Up to 10-15 sessions
#  medium = Up to 25-30 sessions
#  large  = Up to 50+ sessions
deploymentSize: "small"

# publicAddr-- Set the access URL to be used for the Kasm deployment.
# This is the value that should be used when generating a certificate and that this
# chart uses when the `certificate.certManager.enabled` is set to true.
publicAddr: ""

# ingress -- Configure an Ingress for your Kasm deployment. 
# 
ingress:
  enabled: false
  ingressClassName: ""
  annotations:
    ingress-annotations: "ingress-annotation"
  labels:
    ingress-annotations: "ingress-label"

# ingress -- Configure an OpenShift Route for your Kasm deployment. 
# 
route:
  enabled: true
  tls:
    termination: "edge"
    insecureEdgeTerminationPolicy: true
    certificate: |
      SOME CERT VALUE
    key: |
      SOME KEY VALUE
    caCertificate: |
      SOME CA VALUE
    destinationCACertificate: |
      SOME DEST CA VALUE
  annotations:
    route-annotations: "route-annotation"
  labels:
    route-labels: "route-label"

# service -- Configure the external-facing service type to use.
# Allowed service types: ClusterIP or LoadBalancer
#
# The service.annotations defined here only apply to the `proxy` service. If you wish to apply annotations
# to all services, use the annotations.service value at the bottom of this chart.
#
# NOTE: If ingress.enabled set to `true` service.type value MUST be set to `ClusterIP`.
#
service:
  type: ClusterIP
  annotations:
    service-annotations: "service-annotation"
  labels:
    service-labels: "service-label"

# Configure certificate settings.
# You can create your own certificate and upload it to the `secretName` supplied below, or if you have
# an existing cert-manager configured and you wish to use that, set the `secretName` and configure the
# associated cert-manager settings.
#
certificate:
  # certificate.secretName -- Set the secret name where the certificate is stored
  # This secret name will store a certificate created by `cert-manager` if you set `cert-manager.enabled` to true
  #
  secretName: "somesecret"
  # For additional cert-manager configuration/deployment information refer to the online documentation
  # [Cert Manager Docs](https://cert-manager.io/v1.1-docs/installation/kubernetes/)
  # 
  # NOTE: If you do not enable `cert-manager`, you must generate your own certificates and add them to
  # Kubernetes
  #
  certManager:
    enabled: true
    # certificate.certManager.addWildCard -- Setting addWildCard to true will automatically add *.<publicAddr> as a hostname served
    # by the Ingress, as well as adding it to the list of domains to generate a certificate for.
    addWildCard: true
    # certificate.certManager.issuerName -- Name of the Issuer/ClusterIssuer to use for certs
    # NOTE: You will always need to create this yourself when `certManager.enabled` is true.
    issuerName: ""
    # certificate.certManager.issuerKind -- Provide the kind of certificate to use, defaults to `Issuer` for security to scope the certificate to the
    # Kasm namespace.
    issuerKind: ""
    # certificate.certManager.issuerGroup -- Provide the group of Issuer that cert-manager should use, defaults to 'cert-manager.io' which is the
    # default Issuer group.
    issuerGroup: ""

# Kasm DB settings and configuration options
#
database:
  standalone: false
  hostname: kasm-db
  port: 5432
  kasmDbName: kasm
  kasmDbUser: kasmapp
  postgresMasterUser:
    username: postgres
    secret:
      name: postgres-secret
      key: db-password
  # database.initialize_db -- Setting `initialize_db` to true assumes you want a newly initialized Kasm deployment. Setting this to false
  # is useful for deployment if running Kasm upgrades, or if you previously initialized Kasm, retained the data, and wish to redeploy.
  initialize_db: true
  # database.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
  # container registry instead of our public DockerHub hosted one.
  image:
    repository: kasmweb/postgres
    tag: 1.17.0
  storage:
    # database.storage.storageClassName -- Set the storage class to attach to the DB for storage.
    # NOTE: Leaving this blank will use the cluster-default storage class
    storageClassName: ""
    # database.storage.retentionPolicy -- Configure how the DB volume should be retained or deleted throughout the DB's lifecycle
    retentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
  annotations:
    database-annotation: "db-annotation-value"
  resources: {}
  labels:
    database-label: "db-label-value"

# Kasm component resources and associated settings
#
components:
  # Configuration settings for the Kasm Nginx Proxy service
  proxy:
    # components.proxy.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    image:
      repository: kasmweb/proxy
      tag: 1.17.0
    annotations:
      proxy-annotation: "proxy-annotation-value"
    resources: {}
    labels:
      proxy-label: "proxy-label-value"
  # Configuration settings for the Kasm API service
  api:
    # components.api.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    image:
      repository: kasmweb/api
      tag: 1.17.0
    annotations:
      api-annotation: "api-annotation-value"
    resources: {}
    labels:
      api-label: "api-label-value"
  # Configuration settings for the Kasm Manager service
  manager:
    # components.manager.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    image:
      repository: kasmweb/manager
      tag: 1.17.0
    annotations:
      manager-annotation: "manager-annotation-value"
    resources: {}
    labels:
      manager-label: "manager-label-value"
  # Configuration settings for the Kasm Guac RDP service
  guac:
    # components.guac.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    image:
      repository: kasmweb/kasm-guac
      tag: 1.17.0
    # -- Use this setting to enable/disable deployment of the Kasm Guacamole web RDP service
    # https://kasmweb.com/docs/latest/guide/connection_proxies.html#guacamole-guac
    enabled: true
    annotations:
      guac-annotation: "guac-annotation-value"
    resources: {}
    labels:
      guac-label: "guac-label-value"
  # Configuration settings for the Kasm RDP Gateway service
  rdpGateway:
    # components.rdpGateway.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    image:
      repository: kasmweb/rdp-gateway
      tag: 1.17.0
    # components.rdpGateway.enabled -- Use this setting to enable/disable deployment of the Kasm RDP Gateway service
    # https://kasmweb.com/docs/latest/guide/connection_proxies.html#rdp-gateway
    enabled: true
    annotations:
      rdpGateway-annotation: "rdpGateway-annotation-value"
    resources: {}
    labels:
      rdpGateway-label: "rdpGateway-label-value"
  # Configuration settings for the Kasm RDP HTTPS Gateway service
  rdpHttpsGateway:
    # components.rdpHttpsGateway.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    image:
      repository: kasmweb/rdp-https-gateway
      tag: 1.17.0
    # components.rdpHttpsGateway.enabled -- Use this setting to enable/disable deployment of the Kasm RDP HTTPS Gateway service.
    # This service allows users to use native RDP clients via HTTPS connections rather than exposing 3389.
    # https://kasmweb.com/docs/latest/guide/connection_proxies.html#rdp-https-gateway
    enabled: true
    annotations:
      rdpHttpsGateway-annotation: "rdpHttpsGateway-annotation-value"
    resources: {}
    labels:
      rdpHttpsGateway-label: "rdpHttpsGateway-label-value"
  # Configuration settings for the Kasm Share service
  share:
    # components.share.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    image:
      repository: kasmweb/share
      tag: 1.17.0
    # -- Use this setting to enable/disable deployment of the Kasm Share and associated Redis services
    # https://kasmweb.com/docs/latest/guide/session_sharing.html
    enabled: true
    annotations:
      share-annotation: "share-annotation-value"
    resources: {}
    labels:
      share-label: "share-label-value"
  # Configuration settings for the Kasm Share Redis backend service
  redis:
    # components.redis.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    image:
      repository: redis
      tag: 5-alpine
    annotations:
      redis-annotation: "redis-annotation-value"
    resources: {}
    labels:
      redis-label: "redis-label-value"

####################################
# Extra Kubernetes config settings #
####################################

# imagePullPolicy -- Configure global image pull policy
imagePullPolicy: "IfNotPresent"

# imagePullSecrets -- Use credentials for custom images or image repositories. Useful for offline or self-hosted repos, or dev builds.
imagePullSecrets: ""

# imagePullCredentials -- Create a dockerconfigjson secret as an image pull credential. Useful for offline or self-hosted repos, or dev builds.
imagePullCredentials: {}

# clusterDomain -- Cluster-wide Kubernetes DNS domain name
clusterDomain: "cluster.local"

# nodeSelector -- Configure node selector settings for your Kasm pods
# https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
nodeSelector:
  node-role: infrastructure

# nodeAffinity -- Configure node affinity settings for Kasm pods: 
# https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
# Kasm is not guaranteed to work with Affinity settings - use caution if you must configuring these settings.
# The below, optional object passes in raw Affinity rules for Pods, Nodes, etc. for your environment. Make sure you
# use the correct values below as this Helm chart will not do any error checking for you.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: In
          values:
          - antarctica-east1
          - antarctica-west1
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      preference:
        matchExpressions:
        - key: another-node-label-key
          operator: In
          values:
          - another-node-label-value

# applySecurity -- Apply Pod/Container security settings for Kasm resources
applySecurity: true

# applyHealthChecks -- Add Pod/Container healthchecks settings for Kasm resources
applyHealthChecks: true

# restartPolicy -- Configure global Pod restart policy for Kasm resources
restartPolicy: "Always"

# labels -- Custom labels to apply to all deployed resources
labels:
  global-label: "global-value"

# Additional resource annotations to apply to resources created by this chart
annotations:
  # annotations.certSecret -- Additional certSecret annotations to apply to resources created by this chart
  certSecret:
    global-certSecret-annotation: "global-certSecret-annotation"
  # annotations.configMap -- Additional configMap annotations to apply to resources created by this chart
  configMap:
    global-configMap-annotation: "global-configMap-annotation"
  # annotations.deployment -- Additional deployment annotations to apply to resources created by this chart
  deployment:
    global-deployment-annotation: "global-deployment-annotation"
  # annotations.pod -- Additional pod annotations to apply to resources created by this chart
  pod:
    global-pod-annotation: "global-pod-annotation"
  # annotations.service -- Additional service annotations to apply to resources created by this chart
  service:
    global-service-annotation: "global-service-annotation"
  # annotations.secret -- Additional secret annotations to apply to resources created by this chart
  secret:
    global-secret-annotation: "global-secret-annotation"
  # annotations.statefulSet -- Additional statefulSet annotations to apply to resources created by this chart
  statefulSet:
    global-statefulSet-annotation: "global-statefulSet-annotation"

# Additional Kubernetes labels to apply to resources created by this chart
# See https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/ for more information
#
extraLabels:
  # extraLabels.certSecret -- Additional statefulSet labels to apply to resources created by this chart
  certSecret:
    global-extra-certSecret-label: "global-certSecret-label"
  # extraLabels.configMap -- Additional configMap labels to apply to resources created by this chart
  configMap:
    global-extra-configMap-label: "global-configMap-label"
  # extraLabels.deployment -- Additional deployment labels to apply to resources created by this chart
  deployment:
    global-extra-deployment-label: "global-deployment-label"
  # extraLabels.pod -- Additional pod labels to apply to resources created by this chart
  pod:
    global-extra-pod-label: "global-pod-label"
  # extraLabels.secret -- Additional secret labels to apply to resources created by this chart
  secret:
    global-extra-secret-label: "global-secret-label"
  # extraLabels.service -- Additional service labels to apply to resources created by this chart
  service:
    global-extra-service-label: "global-service-label"
  # extraLabels.job -- Additional job labels to apply to resources created by this chart
  job:
    global-extra-job-label: "global-job-label"
  # extraLabels.jobPod -- Additional jobPod labels to apply to resources created by this chart
  jobPod:
    global-jobPod-label: "global-jobPod-label"
  # extraLabels.statefulSet -- Additional statefulSet labels to apply to resources created by this chart
  statefulSet:
    global-extra-statefulSet-label: "global-statefulSet-label"
