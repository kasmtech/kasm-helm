# -- Define the estimated size of the Kasm deployment in expected session load.
#      small  = Up to 10-15 sessions
#      medium = Up to 25-30 sessions
#      large  = Up to 50+ sessions
deploymentSize: "small"

# -- Set the access URL to be used for the Kasm deployment.
# This is the value that should be used when generating a certificate and that this
# chart uses when the `certificate.certManager.enabled` is set to true.
publicAddr: ""

# 
ingress:
  enabled: true
  ingressClassName: ""
  annotations: {}
  labels: {}

#
service:
  type: ClusterIP
  annotations: {}

# -- Configure certificate settings.
# You can create your own certificate and upload it to the `secretName` supplied below, or if you have
# an existing cert-manager configured and you wish to use that, set the `secretName` and configure the
# associated cert-manager settings.
#
certificate:
  # -- Set the secret name where the certificate is stored
  # This secret name will store a certificate created by `cert-manager` if you set `cert-manager.enabled` to true
  secretName: ""
  # -- For additional cert-manager configuration/deployment information refer to the online documentation
  # https://cert-manager.io/v1.1-docs/installation/kubernetes/
  # 
  # NOTE: If you do not enable `cert-manager`, you must generate your own certificates and add them to
  # Kubernetes
  certManager:
    enabled: true
    # -- Setting addWildCard to true will automatically add *.<publicAddr> as a hostname served
    # by the Ingress, as well as adding it to the list of domains to generate a certificate for.
    addWildCard: true
    # -- Name of the Issuer/ClusterIssuer to use for certs
    # NOTE: You will always need to create this yourself when `certManager.enabled` is true.
    issuerName: ""
    # -- Provide the kind of certificate to use, defaults to `Issuer` for security to scope the certificate to the
    # Kasm namespace.
    issuerKind: ""
    # -- Provide the group of Issuer that cert-manager should use, defaults to 'cert-manager.io' which is the
    # default Issuer group.
    issuerGroup: ""

# -- Kasm DB settings and configuration options
#
database:
  # -- Setting `initialize_db` to true assumes you want a newly initialized Kasm deployment. Setting this to false
  # is useful for deployment testing where you don't want to wait for DB initialization before using Kasm, or if
  # running Kasm upgrades.
  initialize_db: true
  image:
    repository: kasmweb/postgres
    tag: 1.17.0
  storage:
    # -- Set the storage class to attach to the DB for storage.
    # NOTE: Leaving this blank will use the cluster-default storage class
    storageClassName: ""
    # -- Configure how the DB volume should be retained or deleted throughout the DB's lifecycle
    retentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
  annotations: {}
  resources: {}
  labels: {}

# Kasm component resources and associated settings
#
components:
  # -- Configuration settings for the Kasm Nginx Proxy service
  proxy:
    image:
      repository: kasmweb/proxy
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  # -- Configuration settings for the Kasm API service
  api:
    image:
      repository: kasmweb/api
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  # -- Configuration settings for the Kasm Manager service
  manager:
    image:
      repository: kasmweb/manager
      tag: 1.17.0
    annotations: {}
    resources: {}
    labels: {}
  # -- Configuration settings for the Kasm Guac RDP service
  guac:
    image:
      repository: kasmweb/kasm-guac
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  # -- Configuration settings for the Kasm RDP Gateway service
  rdpGateway:
    image:
      repository: kasmweb/rdp-gateway
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  # -- Configuration settings for the Kasm RDP HTTPS Gateway service
  rdpHttpsGateway:
    image:
      repository: kasmweb/rdp-https-gateway
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  # -- Configuration settings for the Kasm Share service
  share:
    image:
      repository: kasmweb/share
      tag: 1.17.0
    enabled: true
    annotations: {}
    resources: {}
    labels: {}
  # -- Configuration settings for the Kasm Share Redis backend service
  redis:
    image:
      repository: redis
      tag: 5-alpine
    annotations: {}
    resources: {}
    labels: {}

