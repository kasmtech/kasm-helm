apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kasm-require-resources
  annotations:
    policies.kyverno.io/title: Require cpu/memory requests and limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    # NOTE ON foreach SHAPE: a foreach entry carries `list`, `preconditions`, `context`,
    # `elementScope` and the check itself (`pattern`/`deny`) DIRECTLY. Nesting the check under
    # an extra `validate:` key inside the entry does not fail schema validation loudly -- the
    # rule is simply dropped, and the whole policy silently loads 0 rules. Keep the checks at
    # the top level of each entry (as tests/kyverno/pod-security.baseline.yaml does).
    - name: require-resources-deployments-statefulsets-daemonsets
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: "All containers and initContainers must set resources.requests and resources.limits for cpu and memory."
        foreach:
          - list: "request.object.spec.template.spec.containers"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
          - list: "request.object.spec.template.spec.initContainers || []"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"

    - name: require-resources-jobs
      match:
        any:
          - resources:
              kinds:
                - Job
      validate:
        message: "All containers and initContainers must set resources.requests and resources.limits for cpu and memory."
        foreach:
          - list: "request.object.spec.template.spec.containers"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
          - list: "request.object.spec.template.spec.initContainers || []"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"

    - name: require-resources-cronjobs
      match:
        any:
          - resources:
              kinds:
                - CronJob
      validate:
        message: "All containers and initContainers must set resources.requests and resources.limits for cpu and memory."
        foreach:
          - list: "request.object.spec.jobTemplate.spec.template.spec.containers"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
          - list: "request.object.spec.jobTemplate.spec.template.spec.initContainers || []"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"

    - name: require-resources-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "All containers and initContainers must set resources.requests and resources.limits for cpu and memory."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
          - list: "request.object.spec.initContainers || []"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
