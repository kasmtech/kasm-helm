kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kasm-e2e
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            bind-address: "0.0.0.0"
          certSANs:
            - "kind.kasm.local"
            - "0.0.0.0"
            - "127.0.0.1"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
