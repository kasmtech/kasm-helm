kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kasm-e2e
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
nodes:
  - role: control-plane
    # Explicit node image pin (kind v0.33.0's default), matching KUBECTL_VERSION in
    # the Makefile. Must be >=1.31 for cloud-provider-kind's Ingress/Gateway API
    # controllers, which require the Kubernetes ServiceCIDR API (GA in 1.31). See F12.
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            bind-address: "0.0.0.0"
          certSANs:
            - "kind.kasm.local"
            - "0.0.0.0"
            - "127.0.0.1"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
