deploymentSize: small

publicAddr: kasm.apps.example.test

isOpenshift: true

# H5: isOpenshift forces the nginxLogs sidecar path for nginx log collection (the hostLogs
# DaemonSet needs hostPath + runAsUser:0, which requires an SCC this chart does not ship).
observability:
  hostLogs:
    enabled: false
  nginxLogs:
    enabled: true

proxyService:
  type: ClusterIP

ingress:
  enabled: false

route:
  enabled: true
  backendProtocol: http
  wildcardPolicy: None
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

dbManagement:
  backupCron:
    enabled: false
