# DEV-31 branch-build image overrides for the observability e2e scenarios (test_12/13/14/15 and
# the extended test_06 case). This chart change depends on backend code that only exists on
# feature/DEV-31 (OTel instrumentation, ClickHouse env vars, the ngx_otel_module-carrying proxy
# image), so those scenarios must run against branch builds rather than the released tags the
# other e2e scenarios use.
#
# There is no `postgres-private:feature_DEV-31` build, so `database.image` is deliberately left
# untouched here — it stays on the chart's default released `kasmweb/postgres` tag.
#
# Applied automatically by the `e2e-observability*` make targets via E2E_IMAGE_VALUES; also usable
# by hand: helm upgrade --install ... -f tests/values/observability-*.yaml -f tests/values/dev31-images.yaml
#
# Tags verified present on this host (2026-08-10) against the running DEV-31 Docker install:
#   kasmweb/{api,manager,kasm-guac,proxy,rdp-gateway,rdp-https-gateway}-private:feature_DEV-31
# `kasmweb/api:develop` and friends do NOT contain the telemetry code (no `kasm_telemetry` module),
# so running these scenarios on released/develop tags yields zero api/manager logs and traces.
components:
  api:
    image:
      repository: kasmweb/api-private
      tag: "feature_DEV-31"
  manager:
    image:
      repository: kasmweb/manager-private
      tag: "feature_DEV-31"
  proxy:
    image:
      repository: kasmweb/proxy-private
      tag: "feature_DEV-31"
  connectionProxy:
    nginx:
      image:
        repository: kasmweb/proxy-private
        tag: "feature_DEV-31"
    guac:
      image:
        repository: kasmweb/kasm-guac-private
        tag: "feature_DEV-31"
    rdpGateway:
      image:
        repository: kasmweb/rdp-gateway-private
        tag: "feature_DEV-31"
    rdpHttpsGateway:
      image:
        repository: kasmweb/rdp-https-gateway-private
        tag: "feature_DEV-31"
