# Private-registry image overrides applied to every e2e scenario via the E2E_IMAGE_VALUES default
# (Makefile). All app images (api, proxy, connectionProxy's nginx/guac/rdpGateway/
# rdpHttpsGateway) come from kasm_backend's develop build: the backend/OTel rework (API absorbing
# the manager role, BullMQ-on-PostgreSQL pub/sub, OTel instrumentation) is not in a released tag.
#
# There is no postgres-private develop build, so `database.image` is deliberately left untouched
# here — it stays on the chart's default released `kasmweb/postgres` tag (D021).
#
# The develop tags are only refreshed when kasm_builder promotes a develop build, so they lag
# develop until "build Kasm" has run on a kasm_backend develop pipeline.
components:
  api:
    image:
      repository: kasmweb/api-private
      tag: "develop"
  proxy:
    image:
      repository: kasmweb/proxy-private
      tag: "develop"
  connectionProxy:
    nginx:
      image:
        repository: kasmweb/proxy-private
        tag: "develop"
    guac:
      image:
        repository: kasmweb/kasm-guac-private
        tag: "develop"
    rdpGateway:
      image:
        repository: kasmweb/rdp-gateway-private
        tag: "develop"
    rdpHttpsGateway:
      image:
        repository: kasmweb/rdp-https-gateway-private
        tag: "develop"
