# Image overrides applied to every e2e scenario via the E2E_IMAGE_VALUES default (Makefile). All app
# images (api, proxy, connectionProxy's nginx/guac/rdpGateway/rdpHttpsGateway) come from
# kasm_backend's develop build: the backend/OTel rework (API absorbing the manager role,
# BullMQ-on-PostgreSQL pub/sub, OTel instrumentation) is not in a released tag.
#
# develop publishes only refresh the public kasmweb/<image>:develop tags; the -private develop tags
# are stale. Feature-branch and candidate-* tags exist only in the -private repos, so switch the
# repositories to kasmweb/<image>-private when pointing this overlay at a branch build.
#
# `database.image` is deliberately left untouched here (D021).
components:
  api:
    image:
      repository: kasmweb/appserver
      tag: "develop"
  proxy:
    image:
      repository: kasmweb/proxy
      tag: "develop"
  connectionProxy:
    nginx:
      image:
        repository: kasmweb/proxy
        tag: "develop"
    guac:
      image:
        repository: kasmweb/kasm-guac
        tag: "develop"
    rdpGateway:
      image:
        repository: kasmweb/rdp-gateway
        tag: "develop"
    rdpHttpsGateway:
      image:
        repository: kasmweb/rdp-https-gateway
        tag: "develop"
