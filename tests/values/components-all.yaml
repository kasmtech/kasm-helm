extraEnv:
  - name: SCENARIO_GLOBAL_VAR
    value: "global"

components:
  connectionProxy:
    guac:
      enabled: true
    rdpGateway:
      enabled: true
    rdpHttpsGateway:
      enabled: true
    extraEnv:
      - name: SCENARIO_COMPONENT_VAR
        valueFrom:
          secretKeyRef:
            name: scenario-secret
            key: scenario-key
