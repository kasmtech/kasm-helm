# Minimal scenario, but exercises every path: a single registration, k8sEvents, plus a tee. This
# is the one scenario `make otel-validate` renders (Makefile CHART_VALUES_DIRS always points at
# <values_dir>/default.yaml), so all three get run through the real collector binary in CI.
ingestAuth:
  existingSecret:
    name: kasm-otel-router-secrets
    key: otel-bearer-token

registrations:
  - namespace: kasm-prod
    endpoint: "otel-gateway.kasm-prod.svc.cluster.local:4317"
    tokenSecret:
      name: kasm-prod-secrets
      key: otel-bearer-token

k8sEvents:
  enabled: true

tee:
  enabled: true
  endpoint: "siem-collector.example.com:4317"
  insecure: false
  tokenSecret:
    name: siem-tee-secret
    key: token
