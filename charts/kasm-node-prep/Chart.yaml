name: kasm-node-prep
description: Privileged DaemonSet that builds and loads the kernel modules Kasm Workspaces sessions depend on (v4l2loopback for webcam passthrough, WireGuard for VPN sidecars on kernels older than 5.6) on every matching node, re-applying them after node reboots.
