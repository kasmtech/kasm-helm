suite: node prep service account and OpenShift SCC grant

# configmap.yaml is listed so the DaemonSet's checksum/config annotation can resolve it.
templates:
  - templates/serviceaccount.yaml
  - templates/openshift-scc.yaml
  - templates/daemonset.yaml
  - templates/configmap.yaml

tests:
  - it: creates a token-less ServiceAccount and runs the DaemonSet under it
    set:
      modules.v4l2loopback.enabled: true
    asserts:
      - template: templates/serviceaccount.yaml
        hasDocuments:
          count: 1
      - template: templates/serviceaccount.yaml
        isKind:
          of: ServiceAccount
      - template: templates/serviceaccount.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-kasm-node-prep
      - template: templates/serviceaccount.yaml
        equal:
          path: automountServiceAccountToken
          value: false
      - template: templates/daemonset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kasm-node-prep
      - template: templates/openshift-scc.yaml
        hasDocuments:
          count: 0

  - it: honours serviceAccount.name with create=false and grants nothing
    set:
      modules.v4l2loopback.enabled: true
      serviceAccount.create: false
      serviceAccount.name: node-ops
    asserts:
      - template: templates/serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: templates/daemonset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: node-ops

  - it: falls back to the namespace default account when nothing is created or named
    set:
      modules.v4l2loopback.enabled: true
      serviceAccount.create: false
    asserts:
      - template: templates/daemonset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: renders no ServiceAccount for a KMM-only install, which runs no DaemonSet
    set:
      modules.v4l2loopback.enabled: true
      modules.v4l2loopback.method: kmm
      modules.v4l2loopback.kmm.image.registry: registry.example.test
      modules.v4l2loopback.kmm.image.repository: kmods/v4l2loopback
      openshift.scc.enabled: true
    asserts:
      - template: templates/serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: templates/openshift-scc.yaml
        hasDocuments:
          count: 0

  - it: grants the privileged SCC to the DaemonSet's account on OpenShift
    set:
      modules.v4l2loopback.enabled: true
      openshift.scc.enabled: true
    asserts:
      - template: templates/openshift-scc.yaml
        hasDocuments:
          count: 2
      - template: templates/openshift-scc.yaml
        documentIndex: 0
        isKind:
          of: ClusterRole
      - template: templates/openshift-scc.yaml
        documentIndex: 0
        equal:
          path: rules[0]
          value:
            apiGroups: ["security.openshift.io"]
            resources: ["securitycontextconstraints"]
            resourceNames: ["privileged"]
            verbs: ["use"]
      - template: templates/openshift-scc.yaml
        documentIndex: 1
        isKind:
          of: RoleBinding
      - template: templates/openshift-scc.yaml
        documentIndex: 1
        equal:
          path: roleRef.name
          value: RELEASE-NAME-kasm-node-prep-scc
      - template: templates/openshift-scc.yaml
        documentIndex: 1
        equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: RELEASE-NAME-kasm-node-prep
            namespace: NAMESPACE

  - it: grants a differently named SCC when asked
    set:
      tuning.sysctls.enabled: true
      openshift.scc.enabled: true
      openshift.scc.name: kasm-node-ops
    asserts:
      - template: templates/openshift-scc.yaml
        documentIndex: 0
        equal:
          path: rules[0].resourceNames
          value: ["kasm-node-ops"]
