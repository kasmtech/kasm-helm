suite: KMM mode

# The two templates that exist only for modules.v4l2loopback.method=kmm. Neither renders anything
# while the method is build, which the first test pins down.
templates:
  - templates/kmm-module.yaml
  - templates/kmm-dockerfile-configmap.yaml

tests:
  - it: renders no KMM objects at all with the default build method
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Module and its Dockerfile ConfigMap when the method is kmm
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - hasDocuments:
          count: 1
        template: templates/kmm-module.yaml
      - hasDocuments:
          count: 1
        template: templates/kmm-dockerfile-configmap.yaml

  # --- The Module custom resource ----------------------------------------------------------------
  #
  # Schema per kmm.sigs.x-k8s.io_modules.yaml at KMM v2.7.0.

  - it: renders a Module carrying the same modprobe parameters the reconcile script would use
    template: templates/kmm-module.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Module
      - isAPIVersion:
          of: kmm.sigs.x-k8s.io/v1beta1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-v4l2
      - equal:
          path: spec.moduleLoader.container.modprobe.moduleName
          value: v4l2loopback
      - equal:
          path: spec.moduleLoader.container.modprobe.parameters
          value:
            - devices=20
            - exclusive_caps=1
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].regexp
          value: ^.*$
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].build.dockerfileConfigMap.name
          value: RELEASE-NAME-v4l2-dockerfile
      # Not configured, so neither block is present.
      - isNull:
          path: spec.moduleLoader.container.kernelMappings[0].sign
      - isNull:
          path: spec.imageRepoSecret
      - isNull:
          path: spec.tolerations
      # spec.selector is required by the CRD; an empty nodeSelector selects every node.
      - equal:
          path: spec.selector
          value: {}
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: node-prep
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: kasm-node-prep-1.1200.0-develop

  - it: follows the module parameter values the same way the build method does
    template: templates/kmm-module.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          videoDevices: 12
          exclusiveCaps: false
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - equal:
          path: spec.moduleLoader.container.modprobe.parameters
          value:
            - devices=12
            - exclusive_caps=0

  # KMM -- not Helm, and not a shell -- expands ${KERNEL_FULL_VERSION}, so it has to reach the
  # cluster as those 22 literal characters.
  - it: defaults the image tag to the literal ${KERNEL_FULL_VERSION} KMM substitutes per kernel
    template: templates/kmm-module.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].containerImage
          value: 'registry.contoso.com/kasm/v4l2loopback:${KERNEL_FULL_VERSION}'

  - it: pins one image for every kernel when a tag is set
    template: templates/kmm-module.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            kernelRegexp: '^6\.8\..*$'
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
              tag: "0.13.2-6.8.0-generic"
    asserts:
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].containerImage
          value: registry.contoso.com/kasm/v4l2loopback:0.13.2-6.8.0-generic
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].regexp
          value: ^6\.8\..*$

  - it: joins a digest pinned image tag without a second separator
    template: templates/kmm-module.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
              tag: "@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576"
    asserts:
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].containerImage
          value: registry.contoso.com/kasm/v4l2loopback@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576

  - it: adds the sign block and the registry secret when they are configured
    template: templates/kmm-module.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
            imageRepoSecret: kasm-registry
            sign:
              enabled: true
              keySecret: kasm-mok-key
              certSecret: kasm-mok-cert
    asserts:
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].sign.keySecret.name
          value: kasm-mok-key
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].sign.certSecret.name
          value: kasm-mok-cert
      # A glob, not an interpolated kernel release: the CRD documents Ash globs for filesToSign.
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].sign.filesToSign
          value:
            - /opt/lib/modules/*/extra/v4l2loopback.ko
      - equal:
          path: spec.imageRepoSecret.name
          value: kasm-registry

  - it: carries the chart's scheduling values onto the Module so KMM reaches the same nodes
    template: templates/kmm-module.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
      nodeSelector:
        kasm.com/workspaces: "true"
      tolerations:
        - key: kasm.com/workspaces
          operator: Exists
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.selector["kasm.com/workspaces"]
          value: "true"
      - contains:
          path: spec.tolerations
          content:
            key: kasm.com/workspaces
            operator: Exists
            effect: NoSchedule

  - it: honors fullnameOverride for both KMM object names
    set:
      fullnameOverride: node-prep
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - equal:
          path: metadata.name
          value: node-prep-v4l2
        template: templates/kmm-module.yaml
      - equal:
          path: metadata.name
          value: node-prep-v4l2-dockerfile
        template: templates/kmm-dockerfile-configmap.yaml

  # --- The Dockerfile ConfigMap ------------------------------------------------------------------

  - it: renders a two stage Dockerfile in the layout KMM expects, under the dockerfile key
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-v4l2-dockerfile
      - exists:
          path: data.dockerfile
      # KMM passes KERNEL_FULL_VERSION as a build arg, once per kernel release it finds.
      - matchRegex:
          path: data.dockerfile
          pattern: 'ARG KERNEL_FULL_VERSION'
      # Stage 1 builds against the *target* kernel's headers, in the chart's own builder image.
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04 AS builder'
      - matchRegex:
          path: data.dockerfile
          pattern: '"linux-headers-\$\{KERNEL_FULL_VERSION\}"'
      - matchRegex:
          path: data.dockerfile
          pattern: 'build-essential'
      - matchRegex:
          path: data.dockerfile
          pattern: 'libelf1'
      - matchRegex:
          path: data.dockerfile
          pattern: 'git clone --depth 1 --branch ''v0\.15\.4'' ''https://github\.com/umlaeute/v4l2loopback\.git'' v4l2loopback'
      - matchRegex:
          path: data.dockerfile
          pattern: 'make -C /usr/src/v4l2loopback KERNELRELEASE="\$\{KERNEL_FULL_VERSION\}"'
      # Stage 2 ships only the .ko, in <dirName>/lib/modules/<kernel>/, indexed by depmod -b /opt.
      - matchRegex:
          path: data.dockerfile
          pattern: 'COPY --from=builder /usr/src/v4l2loopback/v4l2loopback\.ko /opt/lib/modules/\$\{KERNEL_FULL_VERSION\}/extra/'
      - matchRegex:
          path: data.dockerfile
          pattern: 'depmod -b /opt "\$\{KERNEL_FULL_VERSION\}"'

  # One Dockerfile for every builder family: each RUN asks the image which package manager it has,
  # in the order the reconcile script tries them on the node, so image.* can point at a Debian,
  # RHEL-family, Amazon Linux, Azure Linux or SUSE image without any other value changing.
  - it: detects the builder's package manager at build time instead of assuming apt-get
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - matchRegex:
          path: data.dockerfile
          pattern: 'if command -v apt-get >/dev/null 2>&1; then'
      - matchRegex:
          path: data.dockerfile
          pattern: 'elif command -v dnf >/dev/null 2>&1; then'
      - matchRegex:
          path: data.dockerfile
          pattern: 'elif command -v microdnf >/dev/null 2>&1; then'
      - matchRegex:
          path: data.dockerfile
          pattern: 'elif command -v yum >/dev/null 2>&1; then'
      - matchRegex:
          path: data.dockerfile
          pattern: 'elif command -v tdnf >/dev/null 2>&1; then'
      - matchRegex:
          path: data.dockerfile
          pattern: 'elif command -v zypper >/dev/null 2>&1; then'
      # Tried in this order: dnf before its microdnf and yum stand-ins, the two RPM outliers last.
      - matchRegex:
          path: data.dockerfile
          pattern: 'command -v apt-get[\s\S]*command -v dnf[\s\S]*command -v microdnf[\s\S]*command -v yum[\s\S]*command -v tdnf[\s\S]*command -v zypper'
      # None of the six: the build fails naming all of them and the image it looked in.
      - matchRegex:
          path: data.dockerfile
          pattern: 'echo "kasm-node-prep: builder image" ''docker\.io/library/ubuntu:22\.04'' "has none of apt-get, dnf, microdnf, yum, tdnf or zypper, so the kernel headers and toolchain cannot be installed\.[^"]*" >&2; \\\n\s+exit 1;'
      # Every branch cleans its package cache, as the apt-get one always did.
      - matchRegex:
          path: data.dockerfile
          pattern: '&& rm -rf /var/lib/apt/lists/\*;'
      - matchRegex:
          path: data.dockerfile
          pattern: '&& dnf clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: '&& microdnf clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: '&& yum clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: '&& tdnf clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: '&& zypper --non-interactive clean --all;'

  # The headers package is spelled differently by every family. The dnf families are given the
  # *path* of the build tree, which dnf resolves to whichever -devel package owns it -- kernel-devel,
  # kernel6.12-devel on Amazon Linux 2023, kernel-uek-devel on Oracle UEK -- rather than a package
  # name the chart would have to guess.
  - it: asks each package manager for the target kernel's headers in the form it resolves
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - matchRegex:
          path: data.dockerfile
          pattern: 'apt-get install -y --no-install-recommends \\\n\s+build-essential git ca-certificates libelf1 \\\n\s+"linux-headers-\$\{KERNEL_FULL_VERSION\}"'
      # dnf, microdnf and yum share one branch: the tool found first is $pm, dnf alone gets the
      # weak-deps option, and an Oracle Linux image under a UEK kernel adds --enablerepo for the
      # matching ol<N>_UEKR<R> repository, which the stock image ships disabled.
      - matchRegex:
          path: data.dockerfile
          pattern: 'if command -v dnf >/dev/null 2>&1; then pm=dnf; opts="--setopt=install_weak_deps=False"; \\\n\s+elif command -v microdnf >/dev/null 2>&1; then pm=microdnf; opts=""; \\\n\s+else pm=yum; opts=""; fi; \\\n\s+"\$\{pm\}" install -y \$\{opts\} \$\{repo\} \\\n\s+gcc make git ca-certificates elfutils-libelf-devel \\\n\s+"/usr/src/kernels/\$\{KERNEL_FULL_VERSION\}"'
      - matchRegex:
          path: data.dockerfile
          pattern: '6\.12\.\*\) r=8'
      - matchRegex:
          path: data.dockerfile
          pattern: 'repo="--enablerepo=ol\$\{VERSION_ID%%\.\*\}_UEKR\$\{r\}"'
      # tdnf cannot resolve a path, so Azure Linux gets the package by name and release.
      - matchRegex:
          path: data.dockerfile
          pattern: 'tdnf install -y \\\n\s+gcc make binutils git ca-certificates elfutils-libelf-devel \\\n\s+"kernel-devel-\$\{KERNEL_FULL_VERSION\}"'
      # zypper: the release's flavor suffix picks the -devel package and the rest pins its version,
      # as one "name = version" argument; a release without a suffix falls back to kernel-default.
      - matchRegex:
          path: data.dockerfile
          pattern: 'flavor="\$\{KERNEL_FULL_VERSION##\*-\}"'
      - matchRegex:
          path: data.dockerfile
          pattern: 'headers="kernel-default-devel = \$\{KERNEL_FULL_VERSION\}"'
      - matchRegex:
          path: data.dockerfile
          pattern: 'headers="kernel-\$\{flavor\}-devel = \$\{KERNEL_FULL_VERSION%-\*\}"'
      - matchRegex:
          path: data.dockerfile
          pattern: 'zypper --non-interactive install --no-recommends \\\n\s+gcc make git ca-certificates libelf-devel "\$\{headers\}"'
      # Ubuntu HWE headers pin the gcc the kernel was built with (gcc-12 for 6.8 on 22.04), which
      # build-essential does not provide: the apt-get branch reads it from the kernel's config and
      # installs it when it is not already on the PATH.
      - matchRegex:
          path: data.dockerfile
          pattern: 'CONFIG_CC_VERSION_TEXT[^\n]*"/lib/modules/\$\{KERNEL_FULL_VERSION\}/build/\.config"'
      - matchRegex:
          path: data.dockerfile
          pattern: '\*gcc-\[0-9\]\*\) command -v "gcc-\$\{cc##\*gcc-\}" >/dev/null 2>&1 \\\n\s+\|\| apt-get install -y --no-install-recommends "gcc-\$\{cc##\*gcc-\}" ;;'

  # Oracle's UEK R8 is built with gcc 14 from gcc-toolset-14 while the el9 userland has gcc 11: the
  # toolset matching the kernel's CONFIG_CC_VERSION_TEXT is installed on the RPM families when it
  # is missing, and put first on PATH for the make step.
  - it: switches to the gcc-toolset the kernel was built with on the RPM families
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - matchRegex:
          path: data.dockerfile
          pattern: 'want="\$\(sed -nE ''s/\^CONFIG_CC_VERSION_TEXT="\[\^ \]\*gcc \\\(\[\^\)\]\*\\\) \(\[0-9\]\+\)\\\.\.\*/\\1/p'' "\$\{cfg\}"'
      - matchRegex:
          path: data.dockerfile
          pattern: 'if command -v dnf >/dev/null 2>&1; then dnf install -y --setopt=install_weak_deps=False "gcc-toolset-\$\{want\}" && dnf clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: 'microdnf install -y "gcc-toolset-\$\{want\}"'
      - matchRegex:
          path: data.dockerfile
          pattern: 'yum install -y "gcc-toolset-\$\{want\}"'
      - matchRegex:
          path: data.dockerfile
          pattern: '(?s)export PATH="/opt/rh/gcc-toolset-\$\{want\}/root/usr/bin:\$\{PATH\}"; \\\n\s+fi; \\\n\s+make -C /usr/src/v4l2loopback KERNELRELEASE="\$\{KERNEL_FULL_VERSION\}" KERNEL_DIR="\$\{kernel_dir\}" v4l2loopback\.ko'

  # v4l2loopback's Makefile defaults KERNEL_DIR to /lib/modules/<release>/build, a symlink the Debian
  # headers package creates but the RPM -devel packages do not (kernel-core owns it there), so the
  # build tree is resolved first and handed to make explicitly, next to KERNELRELEASE.
  - it: resolves the kernel build tree and passes it to make as KERNEL_DIR
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - matchRegex:
          path: data.dockerfile
          pattern: 'kernel_dir="/lib/modules/\$\{KERNEL_FULL_VERSION\}/build"; \\\n\s+\[ -d "\$\{kernel_dir\}" \] \|\| kernel_dir="/usr/src/kernels/\$\{KERNEL_FULL_VERSION\}";'
      # Only the .ko target: the default target also builds v4l2loopback-ctl, which is not shipped
      # and needs libc headers a minimal builder image may not carry.
      - matchRegex:
          path: data.dockerfile
          pattern: 'make -C /usr/src/v4l2loopback KERNELRELEASE="\$\{KERNEL_FULL_VERSION\}" KERNEL_DIR="\$\{kernel_dir\}" v4l2loopback\.ko'
      # Neither candidate present: a message naming both, not make's "No such file or directory".
      - matchRegex:
          path: data.dockerfile
          pattern: 'no kernel build tree for \$\{KERNEL_FULL_VERSION\} at /lib/modules/\$\{KERNEL_FULL_VERSION\}/build or /usr/src/kernels/\$\{KERNEL_FULL_VERSION\}'

  # Stage 2 starts from the builder image again and needs kmod for depmod, so it goes through the
  # same detection. Everything asserted here sits after the second FROM -- the one without
  # "AS builder".
  - it: installs kmod in the second stage through the same package manager detection
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04\n[\s\S]*if command -v apt-get >/dev/null 2>&1; then \\\n\s+apt-get update \\\n\s+&& apt-get install -y --no-install-recommends kmod \\\n\s+&& rm -rf /var/lib/apt/lists/\*;'
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04\n[\s\S]*elif command -v dnf >/dev/null 2>&1; then \\\n\s+dnf install -y --setopt=install_weak_deps=False kmod \\\n\s+&& dnf clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04\n[\s\S]*elif command -v microdnf >/dev/null 2>&1; then \\\n\s+microdnf install -y kmod \\\n\s+&& microdnf clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04\n[\s\S]*elif command -v yum >/dev/null 2>&1; then \\\n\s+yum install -y kmod \\\n\s+&& yum clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04\n[\s\S]*elif command -v tdnf >/dev/null 2>&1; then \\\n\s+tdnf install -y kmod \\\n\s+&& tdnf clean all;'
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04\n[\s\S]*elif command -v zypper >/dev/null 2>&1; then \\\n\s+zypper --non-interactive install --no-recommends kmod \\\n\s+&& zypper --non-interactive clean --all;'
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04\n[\s\S]*"has none of apt-get, dnf, microdnf, yum, tdnf or zypper, so kmod \(for depmod\) cannot be installed\.[^"]*" >&2; \\\n\s+exit 1;'
      # ...and depmod only runs once kmod is in place.
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM docker\.io/library/ubuntu:22\.04\n[\s\S]*command -v zypper[\s\S]*depmod -b /opt "\$\{KERNEL_FULL_VERSION\}"'

  - it: clones the configured mirror and ref, and follows a custom builder image
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      image:
        registry: registry.contoso.com
        repository: kasm/builder
        tag: "24.04"
      modules:
        v4l2loopback:
          method: kmm
          sourceRepo: https://git.contoso.com/mirrors/v4l2loopback.git
          sourceRef: v0.13.1
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM registry\.contoso\.com/kasm/builder:24\.04 AS builder'
      - matchRegex:
          path: data.dockerfile
          pattern: 'FROM registry\.contoso\.com/kasm/builder:24\.04\n'
      # The same reference is what the no-package-manager message names.
      - matchRegex:
          path: data.dockerfile
          pattern: 'echo "kasm-node-prep: builder image" ''registry\.contoso\.com/kasm/builder:24\.04'' "has none of'
      - matchRegex:
          path: data.dockerfile
          pattern: 'git clone --depth 1 --branch ''v0\.13\.1'' ''https://git\.contoso\.com/mirrors/v4l2loopback\.git'' v4l2loopback'

  - it: clones the default branch when no sourceRef is pinned
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          sourceRef: ""
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - matchRegex:
          path: data.dockerfile
          pattern: 'git clone --depth 1 ''https://github\.com/umlaeute/v4l2loopback\.git'' v4l2loopback'
      - notMatchRegex:
          path: data.dockerfile
          pattern: '--branch'

  # Airgap mode A: images are built in connected CI and only pulled here, so there is nothing to
  # build in the cluster -- no Dockerfile ConfigMap, and no build block on the Module.
  - it: omits the Dockerfile ConfigMap and the build block when in-cluster builds are off
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            build:
              enabled: false
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - hasDocuments:
          count: 0
        template: templates/kmm-dockerfile-configmap.yaml
      - hasDocuments:
          count: 1
        template: templates/kmm-module.yaml
      - isNull:
          path: spec.moduleLoader.container.kernelMappings[0].build
        template: templates/kmm-module.yaml
      # The image is still per-kernel: one prebuilt tag per kernel in the fleet.
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].containerImage
          value: 'registry.contoso.com/kasm/v4l2loopback:${KERNEL_FULL_VERSION}'
        template: templates/kmm-module.yaml

  # --- Required values ---------------------------------------------------------------------------

  - it: fails when the kmm image registry is not set
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              repository: kasm/v4l2loopback
    template: templates/kmm-module.yaml
    asserts:
      - failedTemplate:
          errorMessage: "kasm-node-prep: modules.v4l2loopback.kmm.image.registry must be set when modules.v4l2loopback.method=kmm. KMM loads the module from a container image, so it needs a registry to pull it from (and, with kmm.build.enabled, to push the built image to)."

  - it: fails when the kmm image repository is not set
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
    template: templates/kmm-module.yaml
    asserts:
      - failedTemplate:
          errorMessage: "kasm-node-prep: modules.v4l2loopback.kmm.image.repository must be set when modules.v4l2loopback.method=kmm. KMM loads the module from a container image, so it needs a repository to pull it from (and, with kmm.build.enabled, to push the built image to)."

  - it: fails when signing is enabled without a key secret
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
            sign:
              enabled: true
              certSecret: kasm-mok-cert
    template: templates/kmm-module.yaml
    asserts:
      - failedTemplate:
          errorMessage: "kasm-node-prep: modules.v4l2loopback.kmm.sign.keySecret must be set when modules.v4l2loopback.kmm.sign.enabled is true. It names the Secret holding the private Machine Owner Key that KMM signs the built module with."

  - it: fails when signing is enabled without a cert secret
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
            sign:
              enabled: true
              keySecret: kasm-mok-key
    template: templates/kmm-module.yaml
    asserts:
      - failedTemplate:
          errorMessage: "kasm-node-prep: modules.v4l2loopback.kmm.sign.certSecret must be set when modules.v4l2loopback.kmm.sign.enabled is true. It names the Secret holding the public certificate matching modules.v4l2loopback.kmm.sign.keySecret."

  # sourcePath points inside *this chart's* builder image, which a KMM build pod never runs. The
  # airgapped KMM path is prebuilt images (kmm.build.enabled=false), not a vendored source tree.
  - it: fails when sourcePath is combined with the kmm method
    set:
      modules:
        v4l2loopback:
          method: kmm
          sourcePath: /opt/kasm-modules/v4l2loopback
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    template: templates/kmm-module.yaml
    asserts:
      - failedTemplate:
          errorMessage: "kasm-node-prep: modules.v4l2loopback.sourcePath applies to method=build only -- it points at a source tree inside this chart's builder image, which a KMM build pod never runs. A KMM in-cluster build clones modules.v4l2loopback.sourceRepo; for an airgapped fleet set modules.v4l2loopback.kmm.build.enabled=false and pull prebuilt per-kernel images instead."

  - it: fails on an unknown method
    set:
      modules:
        v4l2loopback:
          method: operator
    template: templates/kmm-module.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'kasm-node-prep: modules.v4l2loopback.method must be "build" or "kmm", got "operator".'

  # WireGuard has the key only so the two modules read alike; there is no second implementation.
  - it: fails when wireguard is pointed at KMM
    set:
      modules:
        wireguard:
          enabled: true
          method: kmm
    template: templates/kmm-module.yaml
    asserts:
      - failedTemplate:
          errorMessage: "kasm-node-prep: wireguard via KMM is not supported: kernels >= 5.6 ship WireGuard in-tree; use method: build for older kernels."

  - it: single-quotes the clone url, ref and builder image inside the Dockerfile so shell metacharacters stay literal
    template: templates/kmm-dockerfile-configmap.yaml
    set:
      image:
        repository: kasm/x$(id)
      modules:
        v4l2loopback:
          method: kmm
          sourceRepo: https://example.com/x$(id).git
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - matchRegex:
          path: data.dockerfile
          pattern: "git clone --depth 1 --branch 'v0\\.15\\.4' 'https://example\\.com/x\\$\\(id\\)\\.git' v4l2loopback"
      # The builder reference reaches the shell only inside the failure message, and only quoted.
      - matchRegex:
          path: data.dockerfile
          pattern: "echo \"kasm-node-prep: builder image\" 'docker\\.io/kasm/x\\$\\(id\\):22\\.04' \"has none of"

  - it: refuses a source repository secret together with a kmm build
    template: templates/kmm-module.yaml
    set:
      modules:
        v4l2loopback:
          method: kmm
          sourceRepoSecret: v4l2loopback-git
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - failedTemplate:
          errorPattern: 'sourceRepoSecret applies to method=build only'


  # --- Naming against KMM's webhook limit --------------------------------------------------------

  - it: keeps the Module name short enough for an umbrella release in a long namespace
    template: templates/kmm-module.yaml
    release:
      name: kasm-agent
      namespace: kasm-agent
    set:
      nameOverride: kasm-node-prep
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      # 15 + 10 = 25 characters; the chart-name form would have been 48 and refused by KMM.
      - equal:
          path: metadata.name
          value: kasm-agent-v4l2
      - equal:
          path: spec.moduleLoader.container.kernelMappings[0].build.dockerfileConfigMap.name
          value: kasm-agent-v4l2-dockerfile

  - it: fails the render when the Module name and namespace together exceed KMM's 41 characters
    template: templates/kmm-module.yaml
    release:
      name: a-release-name-that-is-far-too-long-for-kmm
      namespace: kasm-node-prep
    set:
      modules:
        v4l2loopback:
          method: kmm
          kmm:
            image:
              registry: registry.contoso.com
              repository: kasm/v4l2loopback
    asserts:
      - failedTemplate:
          errorPattern: 'combined length of 62 characters, and KMM.s admission webhook refuses more than 41'
