{{- include "kasmNodePrep.validateEnabled" . }}
{{- include "kasmNodePrep.validateMethods" . }}
{{- include "kasmNodePrep.validateInputs" . }}
{{/*
  Rendered alongside the DaemonSet, and for a KMM-loaded module: KMM runs its build and loader
  pods in this namespace under the Module's spec.moduleLoader.serviceAccountName, which is this
  account, so that on OpenShift it can hold the SCC those privileged hostPath pods need.
*/}}
{{- if and .Values.serviceAccount.create (or (include "kasmNodePrep.daemonSetNeeded" .) (include "kasmNodePrep.v4l2loopbackKmm" .)) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kasmNodePrep.serviceAccountName" . }}
  labels:
    {{- include "kasmNodePrep.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
