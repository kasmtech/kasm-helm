{{- include "kasmNodePrep.validateEnabled" . }}
{{- include "kasmNodePrep.validateMethods" . }}
{{- include "kasmNodePrep.validateInputs" . }}
{{/*
  Rendered only alongside the DaemonSet: a KMM-only install runs no pod of its own, so it has no
  account to run under (KMM's worker pods use KMM's own ServiceAccounts).
*/}}
{{- if and .Values.serviceAccount.create (include "kasmNodePrep.daemonSetNeeded" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kasmNodePrep.serviceAccountName" . }}
  labels:
    {{- include "kasmNodePrep.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
