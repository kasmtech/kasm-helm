{{- include "kasmNodePrep.validateEnabled" . }}
{{- include "kasmNodePrep.validateMethods" . }}
{{- include "kasmNodePrep.validateInputs" . }}
{{/*
  The reconcile script executed by the node prep DaemonSet.

  Only the sections for enabled modules and enabled tuning features are rendered, so a disabled one
  leaves no trace in the script (and, via the checksum annotation on the DaemonSet, toggling one
  rolls the pods).
*/}}
{{- define "kasmNodePrep.ensureModulesScript" -}}
{{- $v4l2 := .Values.modules.v4l2loopback -}}
{{- $wireguard := .Values.modules.wireguard -}}
{{- $swap := .Values.tuning.swap -}}
{{- $sysctls := .Values.tuning.sysctls -}}
{{/*
  True per module when this script is the thing that builds it, i.e. it is enabled *and* its
  method is "build". A module delegated to the Kernel Module Management operator
  (modules.v4l2loopback.method=kmm) leaves no trace in here at all: KMM builds the .ko into a
  container image and runs its own worker pods to load it, so every section below would be a
  second, competing implementation.
*/}}
{{- $v4l2Build := and $v4l2.enabled (eq $v4l2.method "build") -}}
{{- $wireguardBuild := and $wireguard.enabled (eq $wireguard.method "build") -}}
{{/*
  True when at least one kernel module is built here. The entire module build machinery is rendered
  only when this holds, so neither a tuning-only nor a KMM-only install produces a script that
  touches the toolchain.
*/}}
{{- $anyModule := include "kasmNodePrep.anyBuildModuleEnabled" . -}}
{{/*
  True when the script may have to install a package: a module built here needs the toolchain and
  the kernel headers, and swap needs util-linux in a builder image that lacks it. The package
  manager detection and the generic installer are rendered only when this holds, so a sysctls-only
  or KMM-only script carries no package manager at all.
*/}}
{{- $needsPackages := or $anyModule $swap.enabled -}}
{{/*
  True when at least one module built here still has to be fetched over the network, i.e. it has no
  modules.<name>.sourcePath pointing at a source tree baked into the builder image. Everything that
  needs git -- the presence check, the clone helper -- is rendered only when this holds, so a fully
  pre-baked (airgapped) install produces a script with no git in it at all.
*/}}
{{- $needsClone := or (and $v4l2Build (not $v4l2.sourcePath)) (and $wireguardBuild (not $wireguard.sourcePath)) -}}
#!/usr/bin/env bash
#
# kasm-node-prep: ensure this node is in the state Kasm Workspaces sessions need -- the kernel
# modules built and loaded, and any enabled host tuning applied.
#
# Rendered by the kasm-node-prep Helm chart. Runs forever: every pass re-checks each requested
# module and rebuilds it when it is missing, and re-asserts any enabled tuning, which is how both
# survive node reboots.

set -euo pipefail

RECONCILE_INTERVAL={{ include "kasmNodePrep.shq" (int .Values.reconcileIntervalSeconds) }}
KERNEL_RELEASE="$(uname -r)"
{{- if $anyModule }}
# The kernel build tree the modules are compiled against. Re-pointed by resolve_kernel_build when
# the tree exists but this symlink does not (see there).
KERNEL_BUILD="/lib/modules/${KERNEL_RELEASE}/build"
BUILD_ROOT="/tmp/kasm-node-prep"
MOK_DIR="/etc/kasm-mok"
DEPS_READY=""
{{- end }}
{{- if $needsPackages }}
# The package manager this builder image carries (see detect_pkg_manager) and whether apt's package
# index has been refreshed yet. Both are remembered for the container's lifetime.
PKG_MANAGER=""
APT_UPDATED=""
{{- end }}
{{- if $swap.enabled }}
SWAP_DIR={{ include "kasmNodePrep.shq" ($swap.hostPath) }}
SWAP_FILE={{ include "kasmNodePrep.shq" (printf "%s/kasm.swap" $swap.hostPath) }}
SWAP_SIZE_MIB={{ include "kasmNodePrep.shq" (int $swap.sizeMib) }}
SWAP_SWAPPINESS={{ include "kasmNodePrep.shq" (int $swap.swappiness) }}
{{- if not $swap.force }}
# Read-only mounts of the node's kubelet configuration, used only to confirm that swap is safe to
# enable here. See kubelet_allows_swap().
K3S_CONFIG_DIR="/host/etc/rancher/k3s"
KUBELET_CONFIG="/host/var/lib/kubelet/config.yaml"
{{- end }}
{{- end }}
{{- if $v4l2Build }}
V4L2_DEVICES={{ include "kasmNodePrep.shq" (int .Values.modules.v4l2loopback.videoDevices) }}
V4L2_EXCLUSIVE_CAPS={{ include "kasmNodePrep.shq" (ternary 1 0 .Values.modules.v4l2loopback.exclusiveCaps) }}
V4L2_SOURCE_REPO={{ include "kasmNodePrep.shq" (.Values.modules.v4l2loopback.sourceRepo) }}
V4L2_SOURCE_REF={{ include "kasmNodePrep.shq" (.Values.modules.v4l2loopback.sourceRef) }}
V4L2_SOURCE_PATH={{ include "kasmNodePrep.shq" (.Values.modules.v4l2loopback.sourcePath) }}
{{- end }}
{{- if $wireguardBuild }}
WIREGUARD_SOURCE_REPO={{ include "kasmNodePrep.shq" (.Values.modules.wireguard.sourceRepo) }}
WIREGUARD_SOURCE_PATH={{ include "kasmNodePrep.shq" (.Values.modules.wireguard.sourcePath) }}
{{- end }}

log() {
  printf '%s [kasm-node-prep] %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"
}

err() {
  log "ERROR: $*" >&2
}

# Print a repository URL with any user:password@ part removed, for log lines. Credentials never
# belong in the URL (the render rejects them); this keeps a mis-set one out of the log regardless.
scrub_url() {
  printf '%s' "$1" | sed -E 's#(://)[^/@]*@#\1#'
}
{{- if $needsPackages }}

# Find the package manager this builder image carries and record it in PKG_MANAGER: apt, dnf,
# microdnf, yum, tdnf or zypper, checked in that order, or empty when there is none, in which case
# this returns 1. The lookup runs once per container lifetime.
detect_pkg_manager() {
  local tool

  if [ -z "$PKG_MANAGER" ]; then
    for tool in apt-get dnf microdnf yum tdnf zypper; do
      if command -v "$tool" >/dev/null 2>&1; then
        # Keyed on the family name, so apt-get is recorded as apt.
        PKG_MANAGER="${tool%-get}"
        break
      fi
    done
  fi

  [ -n "$PKG_MANAGER" ]
}

# Install the named packages with the builder image's package manager, non-interactively and
# without recommended or weak dependencies, so only what is asked for lands in the container. apt
# refreshes its package index once per container lifetime first; the RPM-based managers fetch
# repository metadata on their own.
pkg_install() {
  if ! detect_pkg_manager; then
    err "No supported package manager (apt-get, dnf, microdnf, yum, tdnf or zypper) was found in this builder image, so $* cannot be installed."
    return 1
  fi

  case "$PKG_MANAGER" in
    apt)
      if [ -z "$APT_UPDATED" ]; then
        if ! apt-get update -qq; then
          err "apt-get update failed. The builder image needs access to its package repositories (or a local mirror)."
          return 1
        fi
        APT_UPDATED=1
      fi
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$@"
      ;;
    dnf)
      dnf install -y --setopt=install_weak_deps=False "$@"
      ;;
    microdnf)
      microdnf install -y "$@"
      ;;
    yum)
      yum install -y "$@"
      ;;
    tdnf)
      tdnf install -y "$@"
      ;;
    zypper)
      zypper --non-interactive install --no-recommends "$@"
      ;;
  esac
}
{{- end }}
{{- if $anyModule }}

# Return 0 when the named module is present in the running kernel. Reads /proc/modules
# directly rather than piping lsmod into grep: under `set -o pipefail` a long module list
# makes `grep -q` exit on its early match while lsmod is still writing, the resulting
# SIGPIPE fails the pipeline, and a genuinely loaded module reads as missing. Bonus: this
# also works before the kmod package is installed in a fresh builder container.
module_loaded() {
  grep -qE "^$1[[:space:]]" /proc/modules 2>/dev/null
}

# Like module_loaded, but with a short grace period: immediately after a successful
# modprobe/insmod the module list can lag by a moment, and a same-second check reports a
# false failure for a module that is in fact loaded.
module_loaded_wait() {
  local i
  for i in 1 2 3 4 5; do
    if module_loaded "$1"; then
      return 0
    fi
    sleep 1
  done
  return 1
}

# Point KERNEL_BUILD at the build tree of the running kernel. Every distribution links
# /lib/modules/<release>/build to it, but on the RPM families that symlink belongs to the kernel
# package rather than to the headers, so a builder image that installed only kernel-devel has the
# tree at /usr/src/kernels/<release> and no link to it. Called before the presence check and again
# after the headers are installed; every make invocation is handed the result explicitly.
resolve_kernel_build() {
  if [ -d "/lib/modules/${KERNEL_RELEASE}/build" ]; then
    KERNEL_BUILD="/lib/modules/${KERNEL_RELEASE}/build"
  elif [ -d "/usr/src/kernels/${KERNEL_RELEASE}" ]; then
    KERNEL_BUILD="/usr/src/kernels/${KERNEL_RELEASE}"
  fi
}

# The major version of the compiler the kernel was built with, read from CONFIG_CC_VERSION_TEXT in
# its .config: "aarch64-linux-gnu-gcc-12 (Ubuntu 12.3.0-1ubuntu1~22.04.3) 12.3.0" (Ubuntu names the
# versioned binary) or "gcc (GCC) 14.2.1 20250110 (Red Hat 14.2.1-13)" (the RPM families name plain
# gcc and give the version after the vendor). Empty when the build tree carries no .config.
kernel_gcc_major() {
  sed -nE 's/^CONFIG_CC_VERSION_TEXT="([^"]*)".*/\1/p' "${KERNEL_BUILD}/.config" 2>/dev/null \
    | sed -nE -e 's/^[^ ]*gcc-([0-9]+)([^0-9].*)?$/\1/p' -e 's/^[^ ]*gcc \([^)]*\) ([0-9]+)\..*/\1/p' \
    | head -1
}

# Make the compiler the kernel was built with the one kbuild finds, when it is not the builder
# image's default gcc. Two distributions ship kernels ahead of their default compiler:
#   - Ubuntu's HWE headers pin the exact binary in their Makefile (CC = gcc-12 for the 6.8 kernels
#     on 22.04) without depending on it, while build-essential brings gcc-11, so every module
#     compile there fails with "gcc-12: not found". Installing gcc-<N> is enough: the pinned CC
#     finds it by itself.
#   - Oracle's UEK R8 (a 6.12 kernel on the el9 userland) is built with gcc 14 from gcc-toolset-14,
#     which its kernel-uek-devel pulls in, and its Makefile passes flags the system gcc 11 rejects
#     ("-fmin-function-alignment=8"). kbuild resolves gcc, ld and objcopy through PATH, so the
#     toolset's bin directory goes first on PATH for the rest of this container's life. The same
#     mechanism covers any RHEL 9 rebuild whose repositories carry gcc-toolset-<N>.
# Families with no gcc-toolset (Amazon Linux, Azure Linux, SUSE) build their kernels with their own
# default gcc, so a mismatch there can only mean a builder image that does not match the node; it
# is logged and the compile is left to speak for itself.
ensure_kernel_compiler() {
  local want have toolset

  want="$(kernel_gcc_major)"
  if [ -z "$want" ] || command -v "gcc-${want}" >/dev/null 2>&1; then
    return 0
  fi
  have="$(gcc -dumpversion 2>/dev/null | cut -d. -f1)"

  case "$PKG_MANAGER" in
    apt)
      log "Kernel ${KERNEL_RELEASE} was built with gcc-${want}, which is not installed; installing it with ${PKG_MANAGER}"
      if ! pkg_install "gcc-${want}"; then
        err "Failed to install gcc-${want}, the compiler kernel ${KERNEL_RELEASE} was built with and its build tree requires. Skipping this pass."
        return 1
      fi
      log "Installed gcc-${want}"
      ;;
    *)
      if [ "$want" = "${have:-}" ]; then
        return 0
      fi
      toolset="/opt/rh/gcc-toolset-${want}/root/usr/bin"
      if [ ! -x "${toolset}/gcc" ]; then
        case "$PKG_MANAGER" in
          dnf|microdnf|yum)
            log "Kernel ${KERNEL_RELEASE} was built with gcc ${want} and this builder image has gcc ${have:-none}; installing gcc-toolset-${want} with ${PKG_MANAGER}"
            if ! pkg_install "gcc-toolset-${want}" || [ ! -x "${toolset}/gcc" ]; then
              err "Kernel ${KERNEL_RELEASE} was built with gcc ${want}, this builder image has gcc ${have:-none}, and gcc-toolset-${want} could not be installed. Use a builder image whose repositories carry gcc-toolset-${want} (RHEL 9 and its rebuilds, Oracle Linux 9), or bake it into the image configured by image.registry/image.repository/image.tag. Skipping this pass."
              return 1
            fi
            ;;
          *)
            log "Kernel ${KERNEL_RELEASE} was built with gcc ${want} but this builder image has gcc ${have:-none} and no gcc-toolset to switch to; the compile may fail if the kernel's Makefile needs newer compiler flags"
            return 0
            ;;
        esac
      fi
      export PATH="${toolset}:${PATH}"
      log "Using gcc-toolset-${want} (${toolset}) for kernel ${KERNEL_RELEASE}: built with gcc ${want}, builder image has gcc ${have:-none}"
      ;;
  esac
}

# Return 0 when everything this pass needs to build a module is already in the builder image. This
# runs before any package manager is even looked for, so a pre-baked image from any OS family
# satisfies it and the script never touches the network.
build_deps_present() {
  local tool

  # gcc and make are the toolchain; insmod ships with kmod, alongside modprobe and depmod.
  for tool in gcc make insmod; do
    if ! command -v "$tool" >/dev/null 2>&1; then
      return 1
    fi
  done
{{- if $needsClone }}

  # At least one enabled module is still cloned from git (no modules.*.sourcePath set for it).
  if ! command -v git >/dev/null 2>&1; then
    return 1
  fi
{{- end }}

  # Secure Boot signing shells out to the kernel's sign-file helper, which needs openssl.
  if [ -d "$MOK_DIR" ] && ! command -v openssl >/dev/null 2>&1; then
    return 1
  fi

  # Nothing can be compiled without the kernel build tree matching the running kernel.
  [ -d "$KERNEL_BUILD" ]
}

# Oracle Linux ships its UEK repositories disabled in the oraclelinux:<N> images, so a builder
# running under a UEK kernel (release ends in .el<N>uek.<arch>) would find no kernel-uek-devel
# for the headers-by-path install. Print the dnf flag that enables the matching repository,
# ol<N>_UEKR<R> (UEK R6 is 5.4, R7 is 5.15, R8 is 6.12), or nothing on any other kernel or family.
uek_repo_args() {
  local id="" major="" r=""
  case "$KERNEL_RELEASE" in *uek*) ;; *) return 0 ;; esac
  [ -r /etc/os-release ] || return 0
  id=$(. /etc/os-release; printf '%s' "${ID:-}")
  major=$(. /etc/os-release; printf '%s' "${VERSION_ID%%.*}")
  [ "$id" = "ol" ] && [ -n "$major" ] || return 0
  case "$KERNEL_RELEASE" in
    5.4.*)  r=6 ;;
    5.15.*) r=7 ;;
    6.12.*) r=8 ;;
    *) return 0 ;;
  esac
  printf '%s' "--enablerepo=ol${major}_UEKR${r}"
}

# Make the toolchain and the kernel headers matching the node kernel available. The container shares
# the node kernel, so "uname -r" here is the node's kernel release. Runs at most once per container
# lifetime.
#
# A builder image that already carries everything short-circuits on build_deps_present and performs
# no package operations at all -- see the "Airgapped / offline nodes" section of this chart's README.
# Otherwise the packages come from the BUILDER IMAGE's own repositories, through whichever package
# manager it carries. The container shares the node's kernel but not its userland, so this only
# works when that image is the same distribution family and release as the node: that is the only
# place the headers package for the node's kernel exists.
ensure_build_deps() {
  local headers_args=""
  local -a toolchain
  local headers_spec

  if [ -n "$DEPS_READY" ]; then
    return 0
  fi

  resolve_kernel_build
  if build_deps_present; then
    # No package manager has been looked up, so this can only switch to a gcc-toolset that is
    # already baked into the image; it never installs one here.
    if ! ensure_kernel_compiler; then
      return 1
    fi
    DEPS_READY=1
    log "build prerequisites already present; skipping package installation"
    return 0
  fi

  if ! detect_pkg_manager; then
    err "Build prerequisites are missing and this builder image has none of apt-get, dnf, microdnf, yum, tdnf or zypper to install them. Either use a builder image of the node's own distribution family and release (Debian/Ubuntu, RHEL and its rebuilds, Fedora, Amazon Linux, Azure Linux, or openSUSE/SLES) with access to its package repositories, or pre-bake gcc, make, kmod and the kernel build tree at ${KERNEL_BUILD} into the image configured by image.registry/image.repository/image.tag. Skipping this pass."
    return 1
  fi

  # Per family: the toolchain, and the argument that installs the headers of the running kernel.
  case "$PKG_MANAGER" in
    apt)
      # ca-certificates: the module sources are cloned over HTTPS, and the slim base image
      # ships no CA bundle, so TLS verification fails without it.
      # libelf1: kbuild's objtool is dynamically linked against libelf.so.1; without it every
      # module compile fails with "Error 127" even though gcc and the headers are fine.
      toolchain=(build-essential git kmod ca-certificates libelf1)
      headers_spec="linux-headers-${KERNEL_RELEASE}"
      ;;
    dnf|microdnf|yum)
      # RHEL and its rebuilds, Fedora, Amazon Linux. The headers are requested by the path of the
      # build tree, which these resolve to the package owning it -- kernel-devel, or the variant
      # matching the running kernel line (kernel6.12-devel on Amazon Linux 2023, kernel-uek-devel
      # on Oracle UEK). Not /lib/modules/<release>/build, which kernel-core owns and would drag a
      # whole kernel in, and not a kernel*-devel glob, which also matches kernel-debug-devel.
      # On an Oracle Linux builder under a UEK kernel, uek_repo_args enables the UEK repository the
      # stock image ships disabled, without which the path resolves to nothing.
      toolchain=(gcc make kmod git ca-certificates elfutils-libelf-devel)
      headers_spec="/usr/src/kernels/${KERNEL_RELEASE}"
      headers_args=$(uek_repo_args)
      ;;
    tdnf)
      # Azure Linux. tdnf cannot resolve a path, but accepts the name-version-release form.
      toolchain=(gcc make binutils kmod git ca-certificates elfutils-libelf-devel)
      headers_spec="kernel-devel-${KERNEL_RELEASE}"
      ;;
    zypper)
      # openSUSE Leap and SLES. The release is <version>-<flavor> (6.4.0-150600.23.17-default) and
      # the headers package is kernel-<flavor>-devel, which provides the version without the rpm
      # release suffix, so the capability form "kernel-default-devel = 6.4.0-150600.23.17" selects
      # the exact build as one argument. A release without a flavor suffix means the default one.
      toolchain=(gcc make kmod git ca-certificates libelf-devel)
      if [[ "$KERNEL_RELEASE" == *-* ]]; then
        headers_spec="kernel-${KERNEL_RELEASE##*-}-devel = ${KERNEL_RELEASE%-*}"
      else
        headers_spec="kernel-default-devel = ${KERNEL_RELEASE}"
      fi
      ;;
    *)
      err "Package manager ${PKG_MANAGER} has no toolchain mapping in this script. Skipping this pass."
      return 1
      ;;
  esac

  log "Installing build dependencies for kernel ${KERNEL_RELEASE} with ${PKG_MANAGER}"
  if ! pkg_install "${toolchain[@]}"; then
    err "Failed to install ${toolchain[*]} with ${PKG_MANAGER}. The builder image needs access to its package repositories (or a local mirror) to build kernel modules. Skipping this pass."
    return 1
  fi

  if [ ! -d "$KERNEL_BUILD" ]; then
    log "No kernel build tree at ${KERNEL_BUILD}; installing ${headers_spec} with ${PKG_MANAGER}${headers_args:+ ($headers_args)}"
    # shellcheck disable=SC2086 -- headers_args is a single flag or empty, never a path
    if ! pkg_install $headers_args "$headers_spec"; then
      err "Kernel headers for ${KERNEL_RELEASE} could not be installed: ${PKG_MANAGER} found nothing for '${headers_spec}'. The headers come from the builder image's repositories, so image.registry/image.repository/image.tag must name an image of the same distribution family AND release as the node (a Rocky Linux 9 node needs a Rocky Linux 9 builder image, an Ubuntu 22.04 node needs ubuntu:22.04, and so on). Alternatively pre-install the matching headers on the node, pre-bake them into the builder image, or hand the module to KMM (modules.v4l2loopback.method=kmm); this pass will succeed on the next reconcile once the build tree exists. Skipping this pass."
      return 1
    fi
    resolve_kernel_build
    if [ ! -d "$KERNEL_BUILD" ]; then
      err "Installed ${headers_spec}, but no kernel build tree appeared at /lib/modules/${KERNEL_RELEASE}/build or /usr/src/kernels/${KERNEL_RELEASE}. The package that resolved does not match the running kernel; check that the builder image release matches the node's. Skipping this pass."
      return 1
    fi
    log "Kernel build tree for ${KERNEL_RELEASE} is at ${KERNEL_BUILD}"
  else
    log "Kernel build tree already present at ${KERNEL_BUILD}"
  fi

  if ! ensure_kernel_compiler; then
    return 1
  fi

  if [ -d "$MOK_DIR" ] && ! pkg_install openssl; then
    err "Failed to install openssl, which Secure Boot module signing needs. Skipping this pass."
    return 1
  fi

  DEPS_READY=1
  log "Build dependencies ready"
}

# Sign a freshly built module with the enrolled Machine Owner Key, when one is mounted.
# A node with Secure Boot enabled refuses to insert an unsigned module.
sign_module() {
  local ko="$1"
  local sign_file

  if [ ! -d "$MOK_DIR" ]; then
    return 0
  fi

  if [ ! -s "${MOK_DIR}/mokPrivateKey" ] || [ ! -s "${MOK_DIR}/mokPublicKey" ]; then
    err "Secure Boot signing is configured but ${MOK_DIR}/mokPrivateKey or ${MOK_DIR}/mokPublicKey is missing or empty."
    return 1
  fi

  sign_file="/usr/src/linux-headers-${KERNEL_RELEASE}/scripts/sign-file"
  if [ ! -x "$sign_file" ]; then
    sign_file="${KERNEL_BUILD}/scripts/sign-file"
  fi
  if [ ! -x "$sign_file" ]; then
    err "Secure Boot signing is configured but no sign-file helper was found for kernel ${KERNEL_RELEASE}."
    return 1
  fi

  log "Signing ${ko} with the enrolled MOK key"
  "$sign_file" sha256 "${MOK_DIR}/mokPrivateKey" "${MOK_DIR}/mokPublicKey" "$ko"
}

# Stage a module source tree into a clean directory under BUILD_ROOT. A source tree baked into the
# builder image (modules.*.sourcePath) is copied, which needs no network; otherwise the tree is
# cloned from the configured git repository.
stage_source() {
  local repo="$1"
  local ref="$2"
  local dest="$3"
  local source_path="$4"
  local git_user="${5:-}"
  local git_pass="${6:-}"

  rm -rf "$dest"
  mkdir -p "$BUILD_ROOT"

  if [ -n "$source_path" ]; then
    if [ ! -d "$source_path" ]; then
      err "Configured source path ${source_path} is not a directory in the builder image."
      return 1
    fi
    log "Copying module sources from ${source_path} into ${dest}"
    cp -a "$source_path" "$dest"
    return 0
  fi
{{- if $needsClone }}

  # Optional HTTPS login from modules.*.sourceRepoSecret, handed to git through a credential helper so
  # it never appears in the URL, the process list, or this log.
  local -a git_auth=()
  if [ -n "$git_user" ] && [ -n "$git_pass" ]; then
    git_auth=(-c 'credential.helper=!f() { printf "username=%s\npassword=%s\n" "$KASM_GIT_USER" "$KASM_GIT_PASS"; }; f')
  fi
  if [ -n "$ref" ]; then
    log "Cloning $(scrub_url "$repo") at ${ref} into ${dest}"
    GIT_TERMINAL_PROMPT=0 KASM_GIT_USER="$git_user" KASM_GIT_PASS="$git_pass" \
      git ${git_auth[@]+"${git_auth[@]}"} clone --quiet --depth 1 --branch "$ref" "$repo" "$dest"
  else
    log "Cloning $(scrub_url "$repo") into ${dest}"
    GIT_TERMINAL_PROMPT=0 KASM_GIT_USER="$git_user" KASM_GIT_PASS="$git_pass" \
      git ${git_auth[@]+"${git_auth[@]}"} clone --quiet --depth 1 "$repo" "$dest"
  fi
{{- else }}

  err "No source path is configured for ${dest}, and this script was rendered with every enabled module built from modules.*.sourcePath, so there is no git fallback."
  return 1
{{- end }}
}
{{- end }}
{{- if $v4l2Build }}

# Return 0 when at least one /dev/video* device exists on the node.
video_devices_present() {
  local dev
  for dev in /dev/video*; do
    if [ -e "$dev" ]; then
      return 0
    fi
  done
  return 1
}

# Build, sign and load v4l2loopback with the configured device count.
ensure_v4l2loopback() {
  local src="${BUILD_ROOT}/v4l2loopback"

  if module_loaded v4l2loopback; then
    log "v4l2loopback is already loaded"
    return 0
  fi

  log "v4l2loopback is not loaded; building it for kernel ${KERNEL_RELEASE}"

  if ! ensure_build_deps; then
    return 1
  fi

  # v4l2loopback links against the kernel's V4L2 core (the videodev module). Minimal kernel
  # flavors -- Ubuntu's -kvm and some cloud kernels -- are built with CONFIG_MEDIA_SUPPORT
  # unset and ship no videodev at all, so the build can never succeed there; on other
  # distributions the core is a module in a package the node may simply not have installed.
  # Fail with the real reason instead of a wall of undefined-symbol modpost errors every pass.
  if ! modinfo videodev >/dev/null 2>&1 && ! grep -qE '^CONFIG_VIDEO_DEV=(m|y)' "${KERNEL_BUILD}/.config" 2>/dev/null; then
    err "Kernel ${KERNEL_RELEASE} has no V4L2 core (videodev): CONFIG_MEDIA_SUPPORT/CONFIG_VIDEO_DEV are not enabled in this kernel flavor, or the package carrying videodev.ko is not installed on the node. Webcam support needs a kernel that ships the V4L2 core. It lives in linux-modules-extra-${KERNEL_RELEASE} on Ubuntu (generic flavor only: the -kvm and cloud flavors are built without media support and can never work, so install the generic kernel there), in kernel-modules on RHEL, Rocky Linux and AlmaLinux (installed by the kernel metapackage), in kernel-modules-extra on Amazon Linux 2023, and in kernel-uek-modules (UEK R7) or kernel-uek-modules-desktop (UEK R8) on Oracle Linux. Install it on the node; skipping v4l2loopback until then."
    return 1
  fi
  # The V4L2 core may exist as a module but not be loaded yet; v4l2loopback needs it present
  # at insertion time.
  modprobe videodev 2>/dev/null || true

  if ! stage_source "$V4L2_SOURCE_REPO" "$V4L2_SOURCE_REF" "$src" "$V4L2_SOURCE_PATH" "${V4L2_GIT_USERNAME:-}" "${V4L2_GIT_PASSWORD:-}"; then
{{- if $v4l2.sourcePath }}
    err "Failed to stage v4l2loopback from ${V4L2_SOURCE_PATH}. modules.v4l2loopback.sourcePath must point at a source tree baked into the builder image. Skipping this pass."
{{- else }}
    err "Failed to clone v4l2loopback from $(scrub_url "$V4L2_SOURCE_REPO") at ${V4L2_SOURCE_REF}. The node needs access to that repository (or an internal mirror), or set modules.v4l2loopback.sourcePath to a source tree baked into the builder image. Skipping this pass."
{{- end }}
    return 1
  fi

  # KERNEL_DIR is the v4l2loopback Makefile's name for the kernel tree; passing it keeps the build
  # off the /lib/modules/<release>/build default, which the RPM families may not have.
  if ! make -C "$src" KERNEL_DIR="$KERNEL_BUILD"; then
    err "Failed to build v4l2loopback against kernel ${KERNEL_RELEASE}. Skipping this pass."
    return 1
  fi

  if ! sign_module "${src}/v4l2loopback.ko"; then
    return 1
  fi

  if ! make -C "$src" KERNEL_DIR="$KERNEL_BUILD" install-module && ! make -C "$KERNEL_BUILD" M="$src" modules_install; then
    log "Could not install v4l2loopback into /lib/modules; falling back to inserting the built module directly"
    if ! insmod "${src}/v4l2loopback.ko" "devices=${V4L2_DEVICES}" "exclusive_caps=${V4L2_EXCLUSIVE_CAPS}"; then
      err "insmod of ${src}/v4l2loopback.ko failed. Skipping this pass."
      return 1
    fi
  else
    depmod -a || true
    log "Loading v4l2loopback with devices=${V4L2_DEVICES} exclusive_caps=${V4L2_EXCLUSIVE_CAPS}"
    if ! modprobe v4l2loopback "devices=${V4L2_DEVICES}" "exclusive_caps=${V4L2_EXCLUSIVE_CAPS}"; then
      err "modprobe v4l2loopback failed. Skipping this pass."
      return 1
    fi
  fi

  if ! module_loaded_wait v4l2loopback; then
    err "v4l2loopback still does not appear in lsmod after insertion. Skipping this pass."
    return 1
  fi

  if video_devices_present; then
    log "v4l2loopback loaded; /dev/video* devices are present on the node"
  else
    err "v4l2loopback is loaded but no /dev/video* device appeared. Check that devtmpfs is mounted on the node."
    return 1
  fi
}
{{- end }}
{{- if $wireguardBuild }}

# Build, sign and load the out-of-tree WireGuard module, unless the kernel already provides it.
ensure_wireguard() {
  local src="${BUILD_ROOT}/wireguard-linux-compat"

  if grep -q wg_ /proc/kallsyms 2>/dev/null; then
    log "WireGuard is built into kernel ${KERNEL_RELEASE} (wg_ symbols found in /proc/kallsyms); nothing to build"
    return 0
  fi

  if module_loaded wireguard; then
    log "wireguard is already loaded"
    return 0
  fi

  log "wireguard is not available; building it for kernel ${KERNEL_RELEASE}"

  if ! ensure_build_deps; then
    return 1
  fi

  if ! stage_source "$WIREGUARD_SOURCE_REPO" "" "$src" "$WIREGUARD_SOURCE_PATH" "${WIREGUARD_GIT_USERNAME:-}" "${WIREGUARD_GIT_PASSWORD:-}"; then
{{- if $wireguard.sourcePath }}
    err "Failed to stage WireGuard from ${WIREGUARD_SOURCE_PATH}. modules.wireguard.sourcePath must point at a source tree baked into the builder image. Skipping this pass."
{{- else }}
    err "Failed to clone WireGuard from $(scrub_url "$WIREGUARD_SOURCE_REPO"). The node needs access to that repository (or an internal mirror), or set modules.wireguard.sourcePath to a source tree baked into the builder image. Skipping this pass."
{{- end }}
    return 1
  fi

  # KERNELDIR is wireguard-linux-compat's name for the kernel tree; passing it keeps the build off
  # the /lib/modules/<release>/build default, which the RPM families may not have.
  if ! make -C "${src}/src" KERNELDIR="$KERNEL_BUILD" module; then
    err "Failed to build the WireGuard module against kernel ${KERNEL_RELEASE}. Skipping this pass."
    return 1
  fi

  if ! sign_module "${src}/src/wireguard.ko"; then
    return 1
  fi

  if ! make -C "${src}/src" KERNELDIR="$KERNEL_BUILD" module-install && ! make -C "$KERNEL_BUILD" M="${src}/src" modules_install; then
    log "Could not install wireguard into /lib/modules; falling back to inserting the built module directly"
    if ! insmod "${src}/src/wireguard.ko"; then
      err "insmod of ${src}/src/wireguard.ko failed. Skipping this pass."
      return 1
    fi
  else
    depmod -a || true
    log "Loading wireguard"
    if ! modprobe wireguard; then
      err "modprobe wireguard failed. Skipping this pass."
      return 1
    fi
  fi

  if ! module_loaded_wait wireguard; then
    err "wireguard still does not appear in lsmod after insertion. Skipping this pass."
    return 1
  fi

  log "wireguard loaded"
}
{{- end }}

{{- if or $sysctls.enabled $swap.enabled }}

# Collapse runs of tabs and spaces to one space and trim the ends, so a tuple that /proc/sys renders
# with tabs ("4096<tab>87380<tab>6291456") compares equal to the space-separated value in the chart.
sysctl_normalize() {
  printf '%s' "$1" | sed -E 's/[[:blank:]]+/ /g; s/^ //; s/ $//'
}

# Set one kernel tunable on the node by writing /proc/sys directly, exactly as sysctl(8) would,
# which spares the builder image from carrying procps. Writing is idempotent, so this runs every
# pass; the current value is read first so an already-correct setting stays silent and only real
# changes reach the log.
apply_sysctl() {
  local key="$1"
  local value="$2"
  local path
  local current

  # sysctl(8) naming: a key carrying "/" is already a path below /proc/sys, otherwise every "."
  # separates a path component (so a "." inside an interface name is written as a path key,
  # net/ipv4/conf/eth0.1/rp_filter).
  if [[ "$key" == */* ]]; then
    path="/proc/sys/${key}"
  else
    path="/proc/sys/${key//.//}"
  fi

  current="$(cat "$path" 2>/dev/null || true)"
  if [ "$(sysctl_normalize "$current")" = "$(sysctl_normalize "$value")" ]; then
    return 0
  fi

  if ! printf '%s\n' "$value" >"$path" 2>/dev/null; then
    err "Failed to set ${key}=${value}. Either the node kernel does not expose that tunable, or this container is not sharing the node's sysctl namespace. Skipping it this pass."
    return 1
  fi

  log "sysctl ${key}: ${current:-unset} -> ${value}"
}
{{- end }}
{{- if $sysctls.enabled }}

# Re-apply the configured kernel tunables. Nothing is written to /etc/sysctl.d: the reconcile loop
# is the persistence mechanism, so a rebooted node is re-tuned by the next pass and uninstalling
# this chart leaves no configuration behind on the node.
ensure_sysctls() {
  local status=0
{{- range $key, $value := $sysctls.values }}
  apply_sysctl {{ include "kasmNodePrep.shq" $key }} {{ include "kasmNodePrep.shq" (include "kasmNodePrep.sysctlValue" $value) }} || status=1
{{- end }}

  return "$status"
}
{{- end }}
{{- if $swap.enabled }}

# Make sure swapon and mkswap are available. Both ship in util-linux, which the Debian and Ubuntu
# base images carry but the Amazon Linux and Azure Linux ones do not. A builder image that already
# has them is left untouched: no package operation, nothing logged.
ensure_swap_tools() {
  if command -v swapon >/dev/null 2>&1 && command -v mkswap >/dev/null 2>&1; then
    return 0
  fi

  if ! detect_pkg_manager; then
    err "swapon or mkswap is missing from this builder image, and it has none of apt-get, dnf, microdnf, yum, tdnf or zypper to install util-linux with. Use a builder image that ships util-linux, or bake it into the image configured by image.registry/image.repository/image.tag. Skipping swap this pass."
    return 1
  fi

  log "swapon or mkswap is missing from this builder image; installing util-linux with ${PKG_MANAGER}"
  if ! pkg_install util-linux; then
    err "Failed to install util-linux with ${PKG_MANAGER}, which provides swapon and mkswap. The builder image needs access to its package repositories (or a local mirror), or util-linux baked in. Skipping swap this pass."
    return 1
  fi
}

# Return 0 when our swapfile is already active on this node, read straight from /proc/swaps. The
# host directory is mounted at the same path inside the container, so the entry normally reads
# identically on both sides -- but the kernel renders each entry's path relative to the mount the
# file was activated through, and a replacement pod (an upgrade, a crash, a new builder image) holds
# a different mount of the same directory, from which that path is unreachable and collapses to a
# bare "/kasm.swap". Matching the chart-owned file name as well as the full path keeps a pod restart
# from taking an active swapfile for a missing one and failing mkswap on it every pass. Only entries
# of type "file" count, so a swap partition of the same name elsewhere cannot satisfy this.
swap_active() {
  local name type

  while read -r name type _; do
    if [ "$type" = file ] && { [ "$name" = "$SWAP_FILE" ] || [ "${name##*/}" = "${SWAP_FILE##*/}" ]; }; then
      return 0
    fi
  done </proc/swaps

  return 1
}
{{- if not $swap.force }}

# Confirm the node's kubelet tolerates swap *before* any is activated. This is the footgun the
# check exists for: a kubelet running with the default failSwapOn=true refuses to start while the
# node has swap active, so switching swap on underneath it turns the next kubelet restart -- or the
# next node reboot -- into a NotReady node. Best effort by design: it reads only the on-disk
# kubelet configuration mounted read-only into this pod, and tuning.swap.force=true bypasses it.
kubelet_allows_swap() {
  local config

  # k3s and RKE2 pass kubelet flags through as kubelet-arg entries in the agent/server config.
  for config in "${K3S_CONFIG_DIR}/config.yaml" "${K3S_CONFIG_DIR}"/config.yaml.d/*.yaml; do
    if [ -f "$config" ] && grep -q 'fail-swap-on=false' "$config"; then
      log "kubelet swap support confirmed: ${config} carries fail-swap-on=false"
      return 0
    fi
  done

  # kubeadm and most other distributions: the kubelet component config on disk.
  if [ -f "$KUBELET_CONFIG" ] && grep -qE '^[[:space:]]*failSwapOn:[[:space:]]*false' "$KUBELET_CONFIG"; then
    log "kubelet swap support confirmed: ${KUBELET_CONFIG} sets failSwapOn: false"
    return 0
  fi

  return 1
}
{{- end }}

# Resolve the swapfile size in MiB: tuning.swap.sizeMib, or -- when that is 0 -- half of the node's
# MemTotal clamped to [4096, 16384] MiB, the range of the menu Kasm's own agent installer offers.
swap_size_mib() {
  local size="$SWAP_SIZE_MIB"
  local mem_total_kib

  if [ "$size" -gt 0 ]; then
    printf '%s\n' "$size"
    return 0
  fi

  mem_total_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
  size=$(( mem_total_kib / 2048 ))
  if [ "$size" -lt 4096 ]; then
    size=4096
  elif [ "$size" -gt 16384 ]; then
    size=16384
  fi

  printf '%s\n' "$size"
}

# Create and activate the node's swapfile, then apply vm.swappiness.
#
# /etc/fstab is deliberately never touched. The reconcile loop is the persistence mechanism: after
# a reboot the swap is off, the next pass sees that and runs swapon again -- the same self-healing
# contract as the kernel modules. It also means backing the feature out is a values change plus a
# node reboot, with no node file to edit back.
ensure_swap() {
  local size
  local existing_bytes

  if ! ensure_swap_tools; then
    return 1
  fi

  if swap_active; then
    log "swapfile ${SWAP_FILE} is already active"
  else
{{- if $swap.force }}
    log "tuning.swap.force is set; activating swap without confirming that the kubelet tolerates it"
{{- else }}
    if ! kubelet_allows_swap; then
      err "tuning.swap.enabled is set, but this node's kubelet could not be confirmed to tolerate swap: neither ${K3S_CONFIG_DIR}/config.yaml nor ${K3S_CONFIG_DIR}/config.yaml.d/*.yaml carries 'fail-swap-on=false', and ${KUBELET_CONFIG} does not set 'failSwapOn: false'. A kubelet running with the default failSwapOn=true refuses to start while the node has swap active, so enabling swap now would take this node NotReady at its next kubelet restart or reboot. Configure the kubelet first: on k3s add 'kubelet-arg: [fail-swap-on=false, config=/etc/rancher/k3s/kubelet.yaml]' to /etc/rancher/k3s/config.yaml with 'memorySwap: {swapBehavior: LimitedSwap}' in that kubelet config file and restart k3s; on kubeadm set 'failSwapOn: false' in /var/lib/kubelet/config.yaml and restart kubelet. Set tuning.swap.force=true to skip this check when the kubelet is configured somewhere this script cannot read. Skipping swap this pass."
      return 1
    fi
{{- end }}

    size="$(swap_size_mib)"

    if [ ! -d "$SWAP_DIR" ]; then
      err "Swap directory ${SWAP_DIR} is not present in this container. It is a hostPath mount rendered from tuning.swap.hostPath, so this should not happen unless the DaemonSet was edited by hand. Skipping swap this pass."
      return 1
    fi

    # A leftover file of a different size means tuning.swap.sizeMib changed since it was created.
    # It is provably not in use here -- swap_active said so for exactly this path -- so replace it.
    if [ -f "$SWAP_FILE" ]; then
      existing_bytes="$(stat -c %s "$SWAP_FILE" 2>/dev/null || echo 0)"
      if [ "$existing_bytes" -ne $(( size * 1024 * 1024 )) ]; then
        log "Existing ${SWAP_FILE} is ${existing_bytes} bytes, not ${size} MiB; recreating it"
        rm -f "$SWAP_FILE"
      fi
    fi

    if [ ! -f "$SWAP_FILE" ]; then
      log "Creating a ${size} MiB swapfile at ${SWAP_FILE}"
      # fallocate is instant; dd is the fallback for builder images without util-linux's fallocate
      # and for filesystems where a fallocated file cannot be used as swap.
      if ! fallocate -l "${size}MiB" "$SWAP_FILE" 2>/dev/null; then
        log "fallocate is unavailable or failed on this filesystem; falling back to dd"
        if ! dd if=/dev/zero of="$SWAP_FILE" bs=1M count="$size" status=none; then
          err "Failed to create ${SWAP_FILE}. Check that the filesystem behind ${SWAP_DIR} has at least ${size} MiB free on the node. Skipping swap this pass."
          rm -f "$SWAP_FILE"
          return 1
        fi
      fi
    fi

    # swapon refuses a swapfile that is readable by group or other.
    chmod 600 "$SWAP_FILE"

    # Unconditional rather than only-when-just-created: re-running mkswap on a file that is not in
    # use only rewrites its header, and it repairs a file left half-initialised by an earlier pass.
    if ! mkswap "$SWAP_FILE" >/dev/null 2>&1; then
      err "mkswap failed on ${SWAP_FILE}. Skipping swap this pass."
      return 1
    fi

    if ! swapon "$SWAP_FILE"; then
      err "swapon failed on ${SWAP_FILE}. A swapfile has to live on a filesystem that supports one: ext4 and xfs do, btrfs needs a nodatacow file, and overlayfs and tmpfs never will. Point tuning.swap.hostPath at a directory on a real node disk. Skipping swap this pass."
      return 1
    fi

    log "Swap is active: ${SWAP_FILE} (${size} MiB)"
  fi

  # Kasm's reason for swap is parking the memory of idle and stopped Workspaces, not absorbing peak
  # load, so this is deliberately more eager than the kernel default of 60.
  apply_sysctl vm.swappiness "$SWAP_SWAPPINESS"
}
{{- end }}

terminate() {
  log "Received a termination signal; exiting"
  exit 0
}
trap terminate INT TERM

log "Starting node prep on kernel ${KERNEL_RELEASE}, reconciling every ${RECONCILE_INTERVAL}s"
{{- if $anyModule }}
if [ -d "$MOK_DIR" ]; then
  log "Secure Boot MOK keys are mounted at ${MOK_DIR}; built modules will be signed before insertion"
fi
{{- end }}

while true; do
  log "--- reconcile pass starting ---"
  pass_status=0
{{- if $v4l2Build }}
  ensure_v4l2loopback || pass_status=1
{{- end }}
{{- if $wireguardBuild }}
  ensure_wireguard || pass_status=1
{{- end }}
{{- if $sysctls.enabled }}
  ensure_sysctls || pass_status=1
{{- end }}
{{- if $swap.enabled }}
  ensure_swap || pass_status=1
{{- end }}

  if [ "$pass_status" -eq 0 ]; then
    log "--- reconcile pass complete: the node is in the requested state ---"
  else
    err "--- reconcile pass finished with errors; retrying in ${RECONCILE_INTERVAL}s ---"
  fi

  # Backgrounded so the termination trap fires immediately instead of waiting out the sleep.
  sleep "$RECONCILE_INTERVAL" &
  wait $! || true
done
{{- end -}}
{{/*
  No DaemonSet, no script. A KMM-only install with tuning off has nothing for the reconcile loop
  to do -- the Module CR is the whole payload -- so it renders neither this ConfigMap nor the
  DaemonSet that mounts it, and is still a valid install.
*/}}
{{- if include "kasmNodePrep.daemonSetNeeded" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kasmNodePrep.fullname" . }}
  labels:
    {{- include "kasmNodePrep.labels" . | nindent 4 }}
data:
  ensure-modules.sh: |
    {{- include "kasmNodePrep.ensureModulesScript" . | nindent 4 }}
{{- end }}
