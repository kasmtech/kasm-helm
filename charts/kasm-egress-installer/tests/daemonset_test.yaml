suite: egress installer daemonset

templates:
  - templates/daemonset.yaml

tests:
  - it: renders one privileged DaemonSet with hostPID and hostNetwork
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kasm-egress-installer
      - equal:
          path: spec.template.spec.hostPID
          value: true
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirstWithHostNet
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true

  - it: sets the default env vars from values
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: EGRESS_SOCKET_DIR
              value: /var/run/kasm-egress
            - name: CNI_BIN_DIR
              value: /opt/cni/bin
            - name: EGRESS_CNI_MODE
              value: chain
            - name: CNI_CONF_DIRS
              value: /etc/cni/net.d,/var/lib/rancher/k3s/agent/etc/cni/net.d,/var/lib/rancher/rke2/agent/etc/cni/net.d
            - name: CONTAINERD_CONFIG_PATHS
              value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml,/var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.tmpl,/var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl,/var/lib/rancher/rke2/agent/etc/containerd/config.toml,/var/lib/rancher/rke2/agent/etc/containerd/config-v3.toml.tmpl,/var/lib/rancher/rke2/agent/etc/containerd/config.toml.tmpl,/etc/containerd/config.toml
            - name: OPENVPN_BINARY
              value: /usr/sbin/openvpn

  - it: omits EGRESS_EXCLUDE_CIDRS when excludedCIDRs is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EGRESS_EXCLUDE_CIDRS

  - it: sets EGRESS_EXCLUDE_CIDRS when excludedCIDRs is set
    set:
      excludedCIDRs:
        - 10.0.0.0/8
        - 192.168.0.0/16
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EGRESS_EXCLUDE_CIDRS
            value: 10.0.0.0/8,192.168.0.0/16

  - it: uses the Kasm-built image by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/kasmweb/egress-daemon:develop
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: allows the image to be sourced from a mirror
    set:
      image:
        registry: registry.contoso.com
        repository: mirrors/kasm-egress-daemon
        tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.contoso.com/mirrors/kasm-egress-daemon:v1.2.3

  - it: mounts the socket dir, cni bin dir, cni conf dirs, and containerd conf dirs as host paths
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: socket-dir
            hostPath:
              path: /var/run/kasm-egress
              type: DirectoryOrCreate
      - equal:
          path: spec.template.spec.volumes[1]
          value:
            name: cni-bin
            hostPath:
              path: /opt/cni/bin
              type: DirectoryOrCreate
      - equal:
          path: spec.template.spec.volumes[2].hostPath.path
          value: /etc/cni/net.d
      - equal:
          path: spec.template.spec.volumes[5].hostPath.path
          value: /var/lib/rancher/k3s/agent/etc/containerd
      - equal:
          path: spec.template.spec.volumes[6].hostPath.path
          value: /var/lib/rancher/rke2/agent/etc/containerd
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[5].readOnly
          value: true

  - it: applies nodeSelector and tolerations
    set:
      nodeSelector:
        kasm.com/workspaces: "true"
      tolerations:
        - key: kasm.com/workspaces
          operator: Exists
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kasm.com/workspaces: "true"
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: kasm.com/workspaces

  - it: sets priorityClassName by default
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-node-critical
  - it: omits priorityClassName entirely when cleared
    set:
      priorityClassName: ""
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: uses the chart service account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kasm-egress-installer

  - it: renders imagePullSecrets when set
    set:
      imagePullSecrets:
        - name: my-registry-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: my-registry-secret

  - it: derives the vanilla CNI bin dir from the distro preset
    set:
      distro: vanilla
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].hostPath.path
          value: /opt/cni/bin
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CNI_BIN_DIR
            value: /opt/cni/bin

  - it: derives the k3s CNI bin dir from the distro preset
    set:
      distro: k3s
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].hostPath.path
          value: /var/lib/rancher/k3s/data/cni
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CNI_BIN_DIR
            value: /var/lib/rancher/k3s/data/cni

  - it: lets an explicit cniBinDir override the distro preset
    set:
      distro: k3s
      cniBinDir: /custom/cni/bin
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].hostPath.path
          value: /custom/cni/bin

  - it: fails on an unrecognized distro with no explicit cniBinDir
    set:
      distro: rke2
    asserts:
      - failedTemplate:
          errorMessage: 'kasm-egress-installer: distro "rke2" has no built-in CNI bin dir. Set cniBinDir explicitly, or use distro: k3s | vanilla | openshift.'
