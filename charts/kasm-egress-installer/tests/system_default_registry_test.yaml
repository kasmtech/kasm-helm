suite: global.cattle.systemDefaultRegistry (Rancher's system default registry)

templates:
  - templates/daemonset.yaml

tests:
  - it: replaces the image registry when Rancher sets the global, trailing slash tolerated
    set:
      image.tag: t
      global.cattle.systemDefaultRegistry: mirror.example.com/
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/kasmweb/kasm-egress-daemon:t

  - it: wins over an explicit image.registry
    set:
      image.tag: t
      image.registry: own.example.com
      global.cattle.systemDefaultRegistry: mirror.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/kasmweb/kasm-egress-daemon:t

  - it: leaves image.registry in charge when the global is empty
    set:
      image.tag: t
      image.registry: own.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: own.example.com/kasmweb/kasm-egress-daemon:t

  - it: renders the default registry when no global block exists at all
    set:
      image.tag: t
      global: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/kasmweb/kasm-egress-daemon:t
