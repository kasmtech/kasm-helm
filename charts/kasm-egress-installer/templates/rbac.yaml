{{/*
  Minimal, read-only RBAC. The daemon makes single-object GET calls (no watches, no lists) against
  the Kubernetes API to resolve optional annotation-based egress config from a session's own pod, and
  to look up KASM_API_HOST/PORT from a sibling container's env — see fetchPodObject, fetchNodeObject,
  fetchServiceObject, and fetchPodAnnotation in apps/kasm-egress-daemon. It never watches or lists
  anything, and never writes to the API. Cluster-scoped because the pod being inspected can be in any
  namespace (the daemon serves every node's pods, not just one namespace's).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kasmEgressInstaller.fullname" . }}
  labels:
    {{- include "kasmEgressInstaller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kasmEgressInstaller.fullname" . }}
  labels:
    {{- include "kasmEgressInstaller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kasmEgressInstaller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kasmEgressInstaller.fullname" . }}
    namespace: {{ .Release.Namespace }}
