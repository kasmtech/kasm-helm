suite: video device plugin service account and OpenShift SCC grant

templates:
  - templates/serviceaccount.yaml
  - templates/openshift-scc.yaml
  - templates/daemonset.yaml

tests:
  - it: creates a token-less ServiceAccount and runs the DaemonSet under it
    asserts:
      - template: templates/serviceaccount.yaml
        hasDocuments:
          count: 1
      - template: templates/serviceaccount.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-kasm-video-device-plugin
      - template: templates/serviceaccount.yaml
        equal:
          path: automountServiceAccountToken
          value: false
      - template: templates/daemonset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kasm-video-device-plugin
      - template: templates/openshift-scc.yaml
        hasDocuments:
          count: 0

  - it: honours serviceAccount.name with create=false
    set:
      serviceAccount.create: false
      serviceAccount.name: devices
    asserts:
      - template: templates/serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: templates/daemonset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: devices

  - it: grants the privileged SCC to the DaemonSet's account on OpenShift
    set:
      openshift.scc.enabled: true
    asserts:
      - template: templates/openshift-scc.yaml
        hasDocuments:
          count: 2
      - template: templates/openshift-scc.yaml
        documentIndex: 0
        isKind:
          of: ClusterRole
      - template: templates/openshift-scc.yaml
        documentIndex: 0
        equal:
          path: rules[0]
          value:
            apiGroups: ["security.openshift.io"]
            resources: ["securitycontextconstraints"]
            resourceNames: ["privileged"]
            verbs: ["use"]
      - template: templates/openshift-scc.yaml
        documentIndex: 1
        isKind:
          of: RoleBinding
      - template: templates/openshift-scc.yaml
        documentIndex: 1
        equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: RELEASE-NAME-kasm-video-device-plugin
            namespace: NAMESPACE
