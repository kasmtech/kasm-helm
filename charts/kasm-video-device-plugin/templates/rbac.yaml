{{- /* A dri plugin publishes its node's GPUs and their capabilities (the
       kasm.com/dri-devices annotation and kasm.com/dri.* labels) on its own
       Node, where the agent reads them to report GPUs to the Kasm manager and
       to place sessions. RBAC cannot scope a ClusterRole to "the pod's own
       node", so it may get and patch any Node; the plugin is a privileged
       DaemonSet with the host's /dev already. */}}
{{- if eq .Values.deviceKind "dri" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kasmVideoDevicePlugin.fullname" . }}
  labels:
    {{- include "kasmVideoDevicePlugin.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kasmVideoDevicePlugin.fullname" . }}
  labels:
    {{- include "kasmVideoDevicePlugin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kasmVideoDevicePlugin.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kasmVideoDevicePlugin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
