# The catalog.cattle.io/* annotations are read by Rancher's Apps catalog (display name, the
# release name its form proposes, the version gates, and for the umbrella charts the CRD chart to
# install first). Every other Helm client ignores them. See docs/how-to/install/rancher.md.
annotations:
  catalog.cattle.io/display-name: Kasm Agent CRDs
  catalog.cattle.io/release-name: kasm-agent-crds
  catalog.cattle.io/hidden: "true"
  catalog.cattle.io/provides-gvr: agents.agent.kasm.com/v1alpha1
  catalog.cattle.io/kube-version: '>= 1.26.0-0'
  catalog.cattle.io/rancher-version: '>= 2.9.0-0'
  catalog.cattle.io/permits-os: linux
apiVersion: v2
name: kasm-agent-crds
description: The CustomResourceDefinitions the Kasm Agent operator owns — agents, kasmworkspaces and kasmimagepullers in the agent.kasm.com group — and nothing else. It ships them as ordinary Helm templates so that a release of this chart owns their lifecycle and `helm upgrade` applies schema changes, for fleets that would rather upgrade CRDs through Helm than through the documented kubectl side channel. The kasm-agent-operator chart keeps its own copy in crds/ for one-command installs; install and upgrade this release before the kasm-agent or kasm-platform releases.
appVersion: "develop"
keywords:
  - kasm
  - operator
  - crds
maintainers:
  - name: Kasm Technologies, Inc.
    url: https://github.com/kasmtech/kasm-helm
version: 1.1190.8-agent.1
kubeVersion: '>= 1.26.0-0'
