                      agent is running, which is the load a proxy carries: a websocket relay
                      uses little CPU, so a CPU-based autoscaler would never fire before its
                      connections ran out. Set, Replicas is ignored; status.sessionProxy has
                      the count. The alternative is ExternallyScaled.
                    properties:
                      maxReplicas:
