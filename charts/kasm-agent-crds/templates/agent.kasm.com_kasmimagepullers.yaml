                    image:
                      description: Image is the full image reference (registry/repo:tag).
                      minLength: 1
                      type: string
                    imagePullSecrets:
                      description: |-
                        ImagePullSecrets are pull secrets for this specific image. They are merged
                        into the DaemonSet pod's imagePullSecrets (the kubelet selects the matching
                        secret per image), so per-image credentials work within one pod.
                      items:
                        description: |-
