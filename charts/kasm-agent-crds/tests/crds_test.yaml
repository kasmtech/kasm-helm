suite: helm-managed custom resource definitions

templates:
  - templates/agent.kasm.com_agents.yaml
  - templates/agent.kasm.com_kasmimagepullers.yaml
  - templates/agent.kasm.com_kasmworkspaces.yaml
  - templates/pools.kasm.ai_warmpools.yaml
  - templates/pools.kasm.ai_warmpoolinstances.yaml

tests:
  # ---------- the full set renders ----------
  - it: renders exactly one CustomResourceDefinition per template, five in all
    asserts:
      - hasDocuments:
          count: 1
        template: templates/agent.kasm.com_agents.yaml
      - hasDocuments:
          count: 1
        template: templates/agent.kasm.com_kasmimagepullers.yaml
      - hasDocuments:
          count: 1
        template: templates/agent.kasm.com_kasmworkspaces.yaml
      - hasDocuments:
          count: 1
        template: templates/pools.kasm.ai_warmpools.yaml
      - hasDocuments:
          count: 1
        template: templates/pools.kasm.ai_warmpoolinstances.yaml
      - isKind:
          of: CustomResourceDefinition
      - isAPIVersion:
          of: apiextensions.k8s.io/v1

  # ---------- names, groups, and kinds ----------
  - it: installs the three agent.kasm.com definitions under their canonical names
    asserts:
      - equal:
          path: metadata.name
          value: agents.agent.kasm.com
        template: templates/agent.kasm.com_agents.yaml
      - equal:
          path: spec.names.kind
          value: Agent
        template: templates/agent.kasm.com_agents.yaml
      - equal:
          path: metadata.name
          value: kasmimagepullers.agent.kasm.com
        template: templates/agent.kasm.com_kasmimagepullers.yaml
      - equal:
          path: spec.names.kind
          value: KasmImagePuller
        template: templates/agent.kasm.com_kasmimagepullers.yaml
      - equal:
          path: metadata.name
          value: kasmworkspaces.agent.kasm.com
        template: templates/agent.kasm.com_kasmworkspaces.yaml
      - equal:
          path: spec.names.kind
          value: KasmWorkspace
        template: templates/agent.kasm.com_kasmworkspaces.yaml
      - equal:
          path: spec.group
          value: agent.kasm.com
        template: templates/agent.kasm.com_agents.yaml
      - equal:
          path: spec.group
          value: agent.kasm.com
        template: templates/agent.kasm.com_kasmimagepullers.yaml
      - equal:
          path: spec.group
          value: agent.kasm.com
        template: templates/agent.kasm.com_kasmworkspaces.yaml

  - it: installs the two pools.kasm.ai definitions under their canonical names
    asserts:
      - equal:
          path: metadata.name
          value: warmpools.pools.kasm.ai
        template: templates/pools.kasm.ai_warmpools.yaml
      - equal:
          path: spec.names.kind
          value: WarmPool
        template: templates/pools.kasm.ai_warmpools.yaml
      - equal:
          path: metadata.name
          value: warmpoolinstances.pools.kasm.ai
        template: templates/pools.kasm.ai_warmpoolinstances.yaml
      - equal:
          path: spec.names.kind
          value: WarmPoolInstance
        template: templates/pools.kasm.ai_warmpoolinstances.yaml
      - equal:
          path: spec.group
          value: pools.kasm.ai
        template: templates/pools.kasm.ai_warmpools.yaml
      - equal:
          path: spec.group
          value: pools.kasm.ai
        template: templates/pools.kasm.ai_warmpoolinstances.yaml

  # ---------- the resource policy that makes uninstall non-destructive ----------
  # Without this annotation on every one of the five, `helm uninstall` would delete the CRD and
  # cascade-delete every custom resource stored in it — every Agent, every live KasmWorkspace.
  - it: keeps every definition, and its stored custom resources, on uninstall
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: leaves the upstream controller-gen annotation alongside the resource policy
    asserts:
      - equal:
          path: metadata.annotations["controller-gen.kubebuilder.io/version"]
          value: v0.18.0

  # ---------- static manifests, not templates ----------
  # These files carry no Go template constructs at all: the schemas are synced byte for byte from
  # charts/kasm-agent-operator/crds/ (enforced by `make crds-sync-check`), so nothing here may be
  # release-, namespace-, or values-dependent. An unrendered `{{` or a stray release name in the
  # output would mean someone started templating them.
  - it: renders identically whatever the release name and namespace are
    release:
      name: fleet-crds
      namespace: kasm-fleet
    asserts:
      - notExists:
          path: metadata.namespace
      - notExists:
          path: metadata.labels
      - equal:
          path: metadata.name
          value: agents.agent.kasm.com
        template: templates/agent.kasm.com_agents.yaml
      - equal:
          path: metadata.name
          value: warmpoolinstances.pools.kasm.ai
        template: templates/pools.kasm.ai_warmpoolinstances.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z.]+$

  - it: exposes served and stored versions on every definition
    asserts:
      - equal:
          path: spec.scope
          value: Namespaced
      - equal:
          path: spec.versions[0].served
          value: true
      - equal:
          path: spec.versions[0].storage
          value: true
      - isNotNullOrEmpty:
          path: spec.versions[0].schema.openAPIV3Schema
