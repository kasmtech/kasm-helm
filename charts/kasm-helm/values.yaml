# yaml-language-server: $schema=values.schema.json
# deploymentSize -- Define the estimated size of the Kasm deployment in expected session load.
#  small  = Up to 10-15 sessions
#  medium = Up to 25-30 sessions
#  large  = Up to 50+ sessions
#
deploymentSize: "small"

# publicAddr -- Set the access URL to be used for the Kasm deployment. This is the URL you will use to access
# your Kasm deployment. This URL can be a private address, it just needs to be resolvable by systems you use
# to interface with Kasm.
# 
# If you create a self-signed or custom certificate, this is the value you should assign as the Common Name
# associated with the certificate. If `certificate.certManager.enabled` is set to true, this is the
# name used to generate the certificate.
#
publicAddr: ""

# kasmZones -- This is a list of objects defining different Kasm Zone configurations for your deployment. This
# configuration is typically used for multi-region, large, or custom deployments where the customer requires a
# high degree of configurability and has multiple resources in disparate areas.
#
# NOTE: If you configure custom zones below, you MUST use a valid `ingress` configuration due to the increased
# deployment complexity of a multi-zone Kasm deployment. Refer to the Kasm
# [Deployment Zones](https://docs.kasm.com/docs/latest/guide/deployment_zones) documentation for more
# information on Kasm Zones.
#
# The zone marked `primary: true` is treated as the primary zone; if no zone is marked primary,
# the first zone in the list is used instead. At most one zone may be marked `primary: true`.
# Traffic to the configured `publicAddr` in the ingress rule will be routed to this primary zone.
#
# Each zone requires a `name` (or the `zone_name` alias, if `name` is not set; `name` wins if both are set).
#
# Each zone's `proxy_hostname` is used to build the ingress/route/certificate hostnames for that zone,
# as well as the zone's preseed `proxy_hostname` value. `proxyAddress` is a deprecated alias for
# `proxy_hostname`, kept for backwards compatibility; if both are set, `proxy_hostname` wins.
#
kasmZones: []
# Example Kasm Zone configuration:
#   - name: zonea
#     proxy_hostname: zonea.kasm.contoso.com
#   - name: zoneb
#     proxy_hostname: zoneb.kasm.contoso.com

# isOpenshift -- Use this flag to remove Pod and Container security ID values and allow OpenShift to dynamically
# set them in accordance with [OpenShift UIDs](https://www.redhat.com/en/blog/a-guide-to-openshift-and-uids) documentation.
isOpenshift: false

# nginxResolver -- The IP address used by the `resolver` directive in the Kasm nginx configs (proxy and
# connection-proxy) for dynamic upstream DNS resolution.
#
# Leave empty (the default) to auto-detect the cluster's kube-dns Service ClusterIP at install/upgrade time.
# Auto-detection requires a live cluster and read access to Services in the kube-system namespace; it silently
# falls back to the historical hardcoded value, 127.0.0.11, when running `helm template`/`--dry-run`, when RBAC
# denies the lookup, or when the cluster's DNS Service isn't named `kube-dns` in `kube-system` (uncommon, but
# some distros differ).
#
# Set this explicitly to skip auto-detection and pin a specific resolver IP, such as a known CoreDNS/kube-dns
# ClusterIP, or 127.0.0.11 to restore the previous unconditional default.
#
nginxResolver: ""

# proxyService -- Configure the external-facing service type to use.
# Allowed service types: ClusterIP, LoadBalancer, or NodePort. 
#
# The proxyService.annotations defined here only apply to the `proxy` service (`proxy-service-external.yaml` file).
# If you wish to apply annotations to all services, use the annotations.service value at the bottom of this chart.
#
# NOTE: If ingress.enabled or route.enabled set to `true` service.type MUST be set to `ClusterIP`. Also, if you
# wish to deploy a multi-zone Kasm (see [Deployment Zones](https://docs.kasm.com/docs/latest/guide/deployment_zones)
# documentation for reference), you MUST use either a Route or an Ingress and set the `proxyService.type` to `ClusterIP`.
#
proxyService:
  type: LoadBalancer
  annotations: {}
  labels: {}

# directRdpService -- Configure the direct RDP Service for the Kasm RDP Gateway. Only applicable when
# `components.connectionProxy.rdpGateway.enabled` is true.
#
# One Service is created per connection-proxy replica. See [Direct RDP Service](./README.md#direct-rdp-service)
# for load balancer requirements, per-replica settings, and cost.
#
directRdpService:
  # directRdpService.enabled -- Enable exposure of the RDP Gateway via a separate Service of the type
  # defined in `directRdpService.type`.
  #
  enabled: false
  # directRdpService.rdpAccessURL -- Legacy single access URL. Only honored with 1 replica and an empty
  # `perServiceSettings`. Use `perServiceSettings` instead.
  #
  rdpAccessURL: ""
  # directRdpService.type -- Service type to use. Allowed values: LoadBalancer, NodePort.
  # RDP is raw TCP, so a LoadBalancer must be a layer 4 / network load balancer, not an HTTP one.
  #
  type: LoadBalancer
  # directRdpService.loadBalancerPort -- External port exposed when `type` is LoadBalancer. Overridden per
  # Service by `perServiceSettings[i].loadBalancerPort`. No effect when `type` is NodePort.
  #
  loadBalancerPort: 3389
  # directRdpService.annotations -- Annotations added to every per-replica Service. Values that must be
  # unique per Service (external-dns hostnames, static IP allocations) belong in `perServiceSettings`.
  #
  annotations: {}
  # directRdpService.labels -- Labels added to every per-replica Service.
  #
  labels: {}
  # directRdpService.perServiceSettings -- Per-replica Service settings. Required with more than one
  # replica; rendering fails if there are fewer entries than replicas. Entry `annotations`/`labels` override
  # the shared values above. With exactly one primary-region zone (kasmZones), ordinal is the entry's
  # position in this list (`zone` may be omitted). With more than one zone, every entry needs a `zone`
  # field naming which zone it belongs to; ordinal is then the entry's position among that zone's entries.
  # Example (single zone):
  #   perServiceSettings:
  #     - rdpAccessURL: rdp0.kasm.example.com
  #       loadBalancerPort: 3389
  #       annotations:
  #         external-dns.alpha.kubernetes.io/hostname: rdp0.kasm.example.com
  #     - rdpAccessURL: rdp1.kasm.example.com
  #       annotations:
  #         external-dns.alpha.kubernetes.io/hostname: rdp1.kasm.example.com
  # Example (multiple zones):
  #   perServiceSettings:
  #     - zone: zone-a
  #       rdpAccessURL: rdp0.zone-a.kasm.example.com
  #     - zone: zone-b
  #       rdpAccessURL: rdp0.zone-b.kasm.example.com
  #
  perServiceSettings: []

# Configure an Ingress for your Kasm deployment. 
# 
ingress:
  # ingress.enabled -- Set the enabled value to `true` to use a pre-defined Ingress service to expose Kasm
  #
  enabled: false
  # ingress.tls -- Set tls value to `true` to eanble TLS configuration for the hostname defined at `publicAddr` parameter
  #
  tls: true
  # ingress.backendProtocol -- The backend protocol to for the Ingress to communicate with the Kasm proxy service.
  # Valid values: http or https
  #
  backendProtocol: http
  # ingress.ingressClassName -- Define the ingress Class to use for your Kasm ingress
  #
  ingressClassName: ""
  annotations: {}
  labels: {}

# route -- Configure an OpenShift Route for your Kasm deployment.
#
# With kasmZones set, one Route is rendered per zone (plus a primary Route
# for publicAddr). The TLS cert must cover publicAddr and every zone's
# proxyAddress; route.* settings apply to all Routes.
#
route:
  # route.enabled -- Set the enabled value to `true` to use a pre-defined Route service to expose Kasm
  enabled: false
  # route.backendProtocol -- The backend protocol to for the OpenShift Route to communicate with the Kasm proxy service.
  # Valid values: http or https
  #
  backendProtocol: http
  # route.wildcardPolicy -- Set the wildcard policy for the OpenShift Route.
  # Valid values: None, Subdomain
  #
  wildcardPolicy: None
  # route.tls -- Object to define the TLS configuration for your OpenShift Route - 
  # [Configuring Secure Routes](https://docs.redhat.com/en/documentation/openshift_dedicated/4/html/networking/configuring-routes#configuring-default-certificate).
  #
  tls: {}
  # Example TLS configuration
  #   termination: edge
  #   insecureEdgeTerminationPolicy: Redirect
  #   key: |-
  #     -----BEGIN PRIVATE KEY-----
  #     [...]
  #     -----END PRIVATE KEY-----
  #   certificate: |-
  #     -----BEGIN CERTIFICATE-----
  #     [...]
  #     -----END CERTIFICATE-----
  #   caCertificate: |-
  #     -----BEGIN CERTIFICATE-----
  #     [...]
  #     -----END CERTIFICATE-----
  #
  annotations: {}
  labels: {}

# Configure certificate settings.
# You can create your own certificate and upload it to the `secretName` supplied below, or if you have
# an existing cert-manager configured and you wish to use that, set the `secretName` and configure the
# associated cert-manager settings.
#
certificate:
  # certificate.secretName -- Set the secret name where the certificate is stored.
  # This secret name will store a certificate created by `cert-manager` if you set `cert-manager.enabled` to true
  #
  secretName: ""
  # certificate.certManager -- For additional cert-manager configuration/deployment information refer to the online documentation
  # [Cert Manager Docs](https://cert-manager.io/v1.1-docs/installation/kubernetes/). 
  # 
  # NOTE: If you do not enable `cert-manager`, you must generate your own certificates and add them as a Kubernetes secret, or
  # present cloud-managed certificates.
  #
  # Refer to [Kubernetes Secrets](https://kubernetes.io/docs/concepts/configuration/secret/), and 
  # [Kubernetes TLS Secret](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_secret_tls/)
  # for more information.
  #
  certManager:
    enabled: false
    addWildCard: true
    issuerName: ""
    issuerKind: ""
    issuerGroup: ""
    annotations: {}
    labels: {}

# Configure a trusted CA certificate bundle to be added to Kasm services.
# You can either pre-create the configmap containing the CA bundle, or have the Helm chart create it for you.
# To have the Helm chart create the configmap, provide the CA bundle data in PEM format in the `caBundle` field.
#
trustedCaBundle:
  # trustedCaBundle.enabled -- Set to true to enable the trusted CA bundle configuration
  #
  enabled: false
  # trustedCaBundle.configmapName -- The name of the Kubernetes configmap where the CA bundle is stored.
  # If you are populating the trustedCaBundle.caCerts field, you can leave this blank, if you pre-created
  # the configmap, you MUST provide the name here.
  #
  configMapName: ""
  # trustedCaBundle.caCerts -- The CA certificates to be stored in the configmap. This is an object where you
  # can paste your PEM-formatted CA certificates in a key-value format where the key is the file name and the value
  # is the PEM-formatted certificate data. All keys MUST end with a `.crt` extension.
  #
  caCerts: {}
  # Example CA Certs configuration
  # ca-cert-1.crt: |-
  #   -----BEGIN CERTIFICATE-----
  #   [...]
  #   -----END CERTIFICATE-----
  # ca-cert-2.crt: |-
  #   -----BEGIN CERTIFICATE-----
  #   [...]
  #   -----END CERTIFICATE-----

# kasmSecrets -- Use this to create custom Kasm Password secret, or to reference an existing one. If this is left blank
# then Helm will automatically generate random passwords and store them as `<Release-Name>-secrets` in your deployment
# namespace.
#
# To reference a secret you already created yourself, set `create: false` and `name: "<existing secret name>"`,
# leaving `passwords` at its defaults; the chart will not manage that secret and will read the credentials from it.
#
# To have the chart create the secret but pin one or more specific credential values (leaving the rest randomly
# generated), keep `create: true`, optionally set `name`, and set the desired key(s) under `passwords`.
#
kasmSecrets:
  # kasmSecrets.create -- Set to false to use an existing Kasm Password secret. Default = `true`.
  #
  create: true
  # kasmSecrets.name -- The name of the Kasm Password secret to create. If a value is provided here and `create=true`,
  # Helm will use that as the secret name. If `create=false` then you MUST provide the name of an existing Kasm Password
  # secret in your deployment namespace.
  #
  name: ""
  # kasmSecrets.passwords -- Set any of the five well-known keys below to a non-empty value to pin that credential to
  # a specific value instead of letting the chart generate (or preserve, on upgrade) a random one. An explicitly set
  # value here always wins, even if a Secret with that key already exists in the namespace.
  #
  # This object also accepts additional, arbitrary keys beyond the five below. Any extra key you add is written into
  # the generated Secret's `data` as a literal base64-encoded value (no random generation, since the chart has no
  # other source of truth for a custom key) - useful for seeding extra application secrets alongside the standard
  # Kasm credentials.
  #
  # NOTE: Only used when `kasmSecrets.create` is `true`. Has no effect when referencing an existing secret.
  #
  passwords:
    manager-token: ""
    service-token: ""
    db-password: ""
    admin-password: ""
    user-password: ""
    clickhouse-password: ""
    clickhouse-ro-password: ""
    otel-bearer-token: ""
  # Example additional custom secret value:
  #   my-custom-secret: "some-value"
  # kasmSecrets.annotations -- Custom annotations to add to the Kasm Password secret
  annotations: {}
  # kasmSecrets.labels -- Custom labels to add to the Kasm Kasm Password secret
  labels: {}

# useImageTags -- Chart-wide image tag used when a component's `image.tag` is empty. Per-component tag wins if set.
# To override the tag for a single component, see `components.<x>.image.tag` (or `database.image.tag`).
# Examples:
#   "1.19.0-rolling"             rolling tag, receives ongoing bug-fix updates within 1.19.x
#   "1.19.0"                     frozen point-in-time tag
#   "1.19.0-rolling-2026-06-02"  date-locked rolling tag, pins a specific rolling build
#
useImageTags: "develop"

# Kasm DB settings and configuration options
#
database:
  # database.standalone -- Setting standalone to true will prevent the deployment of the Kasm DB StatefulSet and requires
  # the user to have a self-hosted PostgreSQL Database v16 server already setup and awaiting connections. Use the below
  # database configuration values to connect to your external DB.
  # see, https://docs.kasm.com/docs/latest/how-to/remote_database#requirements for list of full db requirements.
  standalone: false
  # database.hostname -- The hostname of the external PostgreSQL server.
  # Only used when database.standalone is true.
  hostname: ""
  # database.port -- The port Kasm will use to connect to the PostgreSQL DB server
  #
  port: 5432
  # database.kasmDbName -- The name of the database where Kasm is to be initialized and that Kasm services are to connect
  #
  kasmDbName: kasm
  # database.kasmDbUser -- The name of the Kasm database User with READ/WRITE permission to the Kasm database
  #
  kasmDbUser: kasmapp
  # database.kasmDbSecret -- The name of the Kasm database password secret to use for a user-created, custom Database password
  # secret value.
  #
  # NOTE: Leave this empty to use the password created by this Helm chart. If you create a custom DB secret, define the `kasmDbSecret`
  # object below in the example format.
  #
  kasmDbSecret: {}
  # Example Custom DB Secret configuration
  #   name: kasm-db-secret
  #   key: kasm-db-secret-key

  # database.postgresMasterUser -- An object defining the PostgreSQL DB Master user and the Kubernetes secret and key values for
  # the Master DB password. These credentials are only used by the `db-init-job` to create the `kasmDbName` database, the `kasmDbUser`
  # user account, set permissions for the user account, and initialize and pre-seed the Kasm Database.
  #
  postgresMasterUser: {}
  # Example DB Master User configuration
  #   username: postgres
  #   secret:
  #     name: postgres-secret
  #     key: db-password

  # database.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
  # container registry instead of our public DockerHub hosted one.
  #
  image:
    registry: docker.io
    repository: kasmweb/postgres
    # database.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
    tag: ""
  # Configure the Storage for the Kasm DB StatefulSet
  #
  storage:
    # database.storage.storageClassName -- Set the storage class to attach to the DB for storage.
    # NOTE: Leaving this blank will use the cluster-default storage class.
    #
    storageClassName: ""
    # database.storage.pvcSize -- Set the size of the PVC to attach to your Kubernetes-hosted Database server. The default
    # size is 8Gi. Just supply the integer value of the PVC size in GB you wish to use.
    #
    pvcSize: 0
    # database.storage.retentionPolicy -- Configure how the DB volume should be retained or deleted throughout the DB's lifecycle
    #
    retentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
  # database.annotations -- Custom annotations to add to the Kasm DB StatefulSet
  annotations: {}
  # database.resources -- Manually configure the Kasm DB StatefulSet resources. This overrides the pre-defined `deploymentSize` values.
  resources: {}
  # database.healthCheckTiming -- Override the pod's default healthcheck timing values for liveness and/or readiness probes.
  #  Values provided individually override their respective timing value, e.g. livenessProbe.timeoutSeconds: 10 will override only
  #  the timeoutSeconds value of the livenessProbe.
  #  Example:
  #    healthCheckTiming:
  #      livenessProbe:
  #        timeoutSeconds: 10
  #        initialDelaySeconds: 20
  #        periodSeconds: 60
  #        failureThreshold: 5
  #      readinessProbe:
  #        periodSeconds: 60
  #        successThreshold: 3
  healthCheckTiming:
    livenessProbe: {}
    readinessProbe: {}
  # database.labels -- Custom labels to add to the Kasm DB StatefulSet
  labels: {}
  # database.extraVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
  #  like custom SSL certificates, config files, or data volumes to the Kasm Database container
  # Example:
  #   extraVolumes:
  #     - secret:
  #         defaultMode: 420
  #         secretName: kasm-custom-tls
  #       name: pkichain
  extraVolumes: []
  # database.extraVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
  #  like custom SSL certificates, config files, or data volumes Kasm Database container
  # Example: 
  #   extraVolumeMounts:
  #     - mountPath: /etc/ssl/certs/ca-certificates.crt
  #       name: pkichain
  #       readOnly: true
  #       subPath: ca.crt
  extraVolumeMounts: []
  # database.extraContainers -- Additional sidecar containers to run in the pod
  # Example
  #  - name: sidecar-example
  #    image: busybox
  #    command: [/bin/sh, -c, 'echo "Hello world"']
  extraContainers: []
  # database.extraInitContainers -- Additional sidecar containers to run in the pod
  # Example
  #  - name: init-example
  #    image: busybox
  #    command: [/bin/sh, -c, 'echo "Hello world"']
  extraInitContainers: []

# Configure the Kasm Database management functions
#
dbManagement:
  # dbManagement.initialize -- Initialize the DB. This is required for an initial deployment of Kasm to configure the DB for Kasm usage
  #
  initialize: true
  # dbManagement.initJobTTLSecondsAfterFinished -- The time in seconds the DB initialization job remains after successful completion.
  #
  initJobTTLSecondsAfterFinished: 300
  # dbManagement.dbConnectionTimeout -- The time in seconds to wait for the DB to respond to initContainer connection attempts.
  dbConnectionTimeout: 10
  # Use this to manage Kasm DB Schema and data upgrade operations
  #
  upgrade:
    # dbManagement.upgrade.enabled -- Enable the DB upgrade job to run.
    #
    # NOTE: You cannot set both `dbManagement.initialize` and `dbManagement.upgrade.enabled` to true. You can either initialize the
    # DB for a new installation, or you can upgrade an existing DB to a new Kasm version, but you cannot do both.
    #
    enable: false
    # dbManagement.upgrade.oldDbHostname -- Hostname of the database from the previous Helm release.
    # Only required if your old deployment used a non-default DB hostname (i.e. not kasm-db).
    # Leave empty if using a standalone DB or to fall back to the default.
    #
    oldDbHostname: ""
    # dbManagement.upgrade.skipBackupAndRestore -- Skip the chart-included pre-upgrade DB backup AND
    # restore steps. The chart will NOT render the backup PVC + Job, and the upgrade Job will NOT attempt
    # to `pg_restore` from a dump file — it will only run the Kasm schema (alembic) migration against
    # the DB it finds.
    #
    # ONLY supported with `database.standalone=true`. Setting this to true with the bundled
    # (in-chart) DB will cause the upgrade Job to fail-render with an explanatory error.
    #
    # When this is true, the operator is responsible for performing the data-plane upgrade manually,
    # in this order, BEFORE running `helm upgrade`:
    #   1. pg_dump the existing standalone DB (old Postgres major version).
    #   2. Stand up the new Postgres major version server.
    #   3. pg_restore the dump into the new Postgres server.
    #   4. Run `helm upgrade` with this flag set to true — the chart's upgrade Job then runs only
    #      the Kasm schema migration (alembic) against the already-restored DB.
    #
    # When this is true, `oldDbHostname` and `oldDbBackupFileName` are ignored.
    #
    skipBackupAndRestore: false
    # dbManagement.upgrade.backupStorageClass -- The storageClass to use to create PV for the backup PVC.
    #
    backupStorageClass: ""
    # dbManagement.upgrade.oldDbSecretsName -- The name of an existing Kubernetes secret to use as the source for
    # credential lookup during upgrades. Leave empty to use the current release's '<release>-secrets' secret.
    # Set to a different secret name only when upgrading from a deployment that stored credentials under a
    # non-default name.
    #
    oldDbSecretsName: ""
    # dbManagement.upgrade.oldDbBackupFileName -- The file name of the database backup to restore and upgrade.
    #
    oldDbBackupFileName: kasm_dump.tar
  # Enable and configure a Kubernetes-based DB Backup cron job to run at specified intervals to automatically handle DB backups
  # to a specified PVC. You can use an NFS or other shared or external PVC specified by `storageClass` to keep this backup tarball.
  #
  backupCron:
    # dbManagement.backupCron.enabled -- Set to true to enable automatic Kasm DB backups
    #
    enabled: false
    # dbManagement.backupCron.pvcName -- The name of the Persistent Volume Claim to use for DB Backups
    #
    pvcName: ""
    # dbManagement.backupCron.schedule -- Use a cron-style syntax to schedule how often the backup cron job runs. The default value
    # will run a backup every 24 hours at midnight UTC. Refer to the
    # [Kubernetes CronJob](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/) documentation for more information.
    #
    schedule: ""
    # dbManagement.backupCron.timeZone -- The time zone to use for the backup cron job. The default is UTC.
    #
    timeZone: ""
    # dbManagement.backupCron.storageClass -- The `storageClassName` to attach the DB backup job for storage of regular DB backups.
    # Leave the value empty to use your default Kubernetes storageClass
    #
    storageClass: ""
    # dbManagement.backupCron.pvcSize -- Set the size of the PVC to attach to your Kubernetes-hosted Database backup job. The default
    # size is 5Gi. Just supply the integer value of the PVC size in GB you wish to use.
    #
    pvcSize: 0

# Kasm component resources and associated settings
#
components:
  # Configuration settings for the Kasm Nginx Proxy service
  #
  proxy:
    # components.proxy.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    #
    image:
      registry: docker.io
      repository: kasmweb/proxy
      # components.proxy.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
      tag: ""
    # components.proxy.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
    replicas: 0
    # components.proxy.healthCheckTiming -- Override the pod's default healthcheck timing values for liveness and/or readiness probes.
    #  Values provided individually override their respective timing value, e.g. livenessProbe.timeoutSeconds: 10 will override only
    #  the timeoutSeconds value of the livenessProbe.
    #  Example:
    #    healthCheckTiming:
    #      livenessProbe:
    #        timeoutSeconds: 10
    #        initialDelaySeconds: 20
    #        periodSeconds: 60
    #        failureThreshold: 5
    #      readinessProbe:
    #        periodSeconds: 60
    #        successThreshold: 3
    healthCheckTiming:
      livenessProbe: {}
      readinessProbe: {}
    # components.proxy.annotations -- Custom annotations to add to the Kasm Proxy Deployment
    annotations: {}
    # components.proxy.resources -- Manually configure the Kasm Proxy Deployment resources. This overrides the pre-defined `deploymentSize` values.
    resources: {}
    # components.proxy.labels -- Custom labels to add to the Kasm Proxy Deployment
    labels: {}
    # components.proxy.extraVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the Kasm Proxy container
    # Example:
    #   extraVolumes:
    #     - secret:
    #         defaultMode: 420
    #         secretName: kasm-custom-tls
    #       name: pkichain
    extraVolumes: []
    # components.proxy.extraVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes Kasm Proxy container
    # Example: 
    #   extraVolumeMounts:
    #     - mountPath: /etc/ssl/certs/ca-certificates.crt
    #       name: pkichain
    #       readOnly: true
    #       subPath: ca.crt
    extraVolumeMounts: []
    # components.proxy.extraContainers -- Additional sidecar containers to run in the pod
    # Example
    #  - name: sidecar-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraContainers: []
    # components.proxy.extraInitContainers -- Additional sidecar containers to run in the pod
    # Example
    #  - name: init-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraInitContainers: []

  # Configuration settings for the Kasm API service
  #
  api:
    # components.api.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    #
    image:
      registry: docker.io
      repository: kasmweb/api
      # components.api.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
      tag: ""
    # components.api.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
    replicas: 0
    # components.api.healthCheckTiming -- Override the pod's default healthcheck timing values for liveness and/or readiness probes.
    #  Values provided individually override their respective timing value, e.g. livenessProbe.timeoutSeconds: 10 will override only
    #  the timeoutSeconds value of the livenessProbe.
    #  Example:
    #    healthCheckTiming:
    #      livenessProbe:
    #        timeoutSeconds: 10
    #        initialDelaySeconds: 20
    #        periodSeconds: 60
    #        failureThreshold: 5
    #      readinessProbe:
    #        periodSeconds: 60
    #        successThreshold: 3
    healthCheckTiming:
      livenessProbe: {}
      readinessProbe: {}
    # components.api.annotations -- Custom annotations to add to the Kasm api Deployment
    annotations: {}
    # components.api.resources -- Manually configure the Kasm api Deployment resources. This overrides the pre-defined `deploymentSize` values.
    resources: {}
    # components.api.labels -- Custom labels to add to the Kasm api Deployment
    labels: {}
    # components.api.extraVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the Kasm API container
    # Example:
    #   extraVolumes:
    #     - secret:
    #         defaultMode: 420
    #         secretName: kasm-custom-tls
    #       name: pkichain
    extraVolumes: []
    # components.api.extraVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes Kasm API container
    # Example: 
    #   extraVolumeMounts:
    #     - mountPath: /etc/ssl/certs/ca-certificates.crt
    #       name: pkichain
    #       readOnly: true
    #       subPath: ca.crt
    extraVolumeMounts: []
    # components.api.extraContainers -- Additional sidecar containers to run in the pod
    # Example
    #  - name: sidecar-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraContainers: []
    # components.api.extraInitContainers -- Additional sidecar containers to run in the pod
    # Example
    #  - name: init-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraInitContainers: []
    # components.api.threadPool -- Number of CherryPy worker threads for the API server.
    #  Increase under high concurrency. Default is 20.
    threadPool: 20
    # components.api.threadPoolLogInterval -- Seconds between background logs of CherryPy thread-pool usage
    #  (Threads/Active/Idle/Queue). Set to 0 to disable. Default is 0.
    threadPoolLogInterval: 0

  # Configuration settings for the consolidated Kasm Connection Proxy service. This StatefulSet fronts
  # the Kasm Guac, RDP Gateway, and RDP HTTPS Gateway service containers behind a single nginx container.
  #
  connectionProxy:
    # components.connectionProxy.enabled -- Use this setting to enable/disable deployment of the entire Kasm
    # Connection Proxy workload (nginx plus the guac, rdp-gateway, and rdp-https-gateway service containers).
    # When false, no StatefulSet, Services, or ConfigMaps are rendered for this component.
    #
    enabled: true
    # components.connectionProxy.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
    replicas: 0
    # components.connectionProxy.annotations -- Custom annotations to add to the Kasm Connection Proxy StatefulSet
    annotations: {}
    # components.connectionProxy.labels -- Custom labels to add to the Kasm Connection Proxy StatefulSet
    labels: {}
    # components.connectionProxy.nginx -- Configuration for the consolidated nginx container fronting the guac,
    # rdp-gateway, and rdp-https-gateway service containers.
    #
    nginx:
      # components.connectionProxy.nginx.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
      # container registry instead of our public DockerHub hosted one.
      #
      image:
        registry: docker.io
        repository: kasmweb/proxy
        # components.connectionProxy.nginx.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
        tag: ""
      # components.connectionProxy.nginx.resources -- Manually configure resources for the nginx container. Leave empty to use the chart default.
      resources: {}
      # components.connectionProxy.nginx.healthCheckTiming -- Override the pod's default healthcheck timing values for liveness and/or readiness probes.
      #  Values provided individually override their respective timing value, e.g. livenessProbe.timeoutSeconds: 10 will override only
      #  the timeoutSeconds value of the livenessProbe.
      #  Example:
      #    healthCheckTiming:
      #      livenessProbe:
      #        timeoutSeconds: 10
      #        initialDelaySeconds: 20
      #        periodSeconds: 60
      #        failureThreshold: 5
      #      readinessProbe:
      #        periodSeconds: 60
      #        successThreshold: 3
      healthCheckTiming:
        livenessProbe: {}
        readinessProbe: {}

    # components.connectionProxy.guac -- Configuration settings for the Kasm Guac service container running inside the Connection Proxy pod.
    #
    guac:
      # components.connectionProxy.guac.enabled -- Use this setting to enable/disable deployment of the Kasm Guacamole web RDP service -
      # [Kasm Guac Service](https://docs.kasm.com/docs/latest/guide/connection_proxies#guacamole-guac).
      #
      enabled: true
      # components.connectionProxy.guac.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
      # container registry instead of our public DockerHub hosted one.
      #
      image:
        registry: docker.io
        repository: kasmweb/kasm-guac
        # components.connectionProxy.guac.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
        tag: ""
      # components.connectionProxy.guac.guacClusterSize -- Override the Cluster Size count set by deploymentSize. Use this value to set the number of `guacd`
      # processes running in the Guacamole pod. Set to 0 to use deploymentSize preset (default).
      guacClusterSize: 0
      # components.connectionProxy.guac.resources -- Manually configure the Kasm Guac container resources. This overrides the pre-defined `deploymentSize` values.
      resources: {}
      # components.connectionProxy.guac.healthCheckTiming -- Override the pod's default healthcheck timing values for liveness and/or readiness probes.
      #  Values provided individually override their respective timing value, e.g. livenessProbe.timeoutSeconds: 10 will override only
      #  the timeoutSeconds value of the livenessProbe.
      #  Example:
      #    healthCheckTiming:
      #      livenessProbe:
      #        timeoutSeconds: 10
      #        initialDelaySeconds: 20
      #        periodSeconds: 60
      #        failureThreshold: 5
      #      readinessProbe:
      #        periodSeconds: 60
      #        successThreshold: 3
      healthCheckTiming:
        livenessProbe: {}
        readinessProbe: {}
      # components.connectionProxy.guac.recordingData -- PVC backing guac /tmp for session recording segments.
      # See [Session Recording](https://docs.kasm.com/docs/latest/guide/session_recording) for sizing guidance.
      recordingData:
        # components.connectionProxy.guac.recordingData.pvcSize -- PVC size in GiB.
        pvcSize: 10
        # components.connectionProxy.guac.recordingData.storageClassName -- StorageClass. Blank uses the cluster default.
        storageClassName: ""

    # components.connectionProxy.rdpGateway -- Configuration settings for the Kasm RDP Gateway service container running inside the Connection Proxy pod.
    #
    rdpGateway:
      # components.connectionProxy.rdpGateway.enabled -- Use this setting to enable/disable deployment of the Kasm RDP Gateway service -
      # [Kasm RDP Gateway](https://docs.kasm.com/docs/latest/guide/connection_proxies#rdp-gateway).
      #
      enabled: true
      # components.connectionProxy.rdpGateway.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
      # container registry instead of our public DockerHub hosted one.
      #
      image:
        registry: docker.io
        repository: kasmweb/rdp-gateway
        # components.connectionProxy.rdpGateway.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
        tag: ""
      # components.connectionProxy.rdpGateway.iniConfigMapName -- Name of a user-created ConfigMap
      # providing a custom `rdpproxy.ini` for the rdp-gateway pod. See the Kasm
      # documentation for details.
      #
      iniConfigMapName: ""
      # components.connectionProxy.rdpGateway.resources -- Manually configure the Kasm RDP Gateway container resources. This overrides the pre-defined `deploymentSize` values.
      resources: {}
      # components.connectionProxy.rdpGateway.healthCheckTiming -- Override the pod's default healthcheck timing values for liveness and/or readiness probes.
      #  Values provided individually override their respective timing value, e.g. livenessProbe.timeoutSeconds: 10 will override only
      #  the timeoutSeconds value of the livenessProbe.
      #  Example:
      #    healthCheckTiming:
      #      livenessProbe:
      #        timeoutSeconds: 10
      #        initialDelaySeconds: 20
      #        periodSeconds: 60
      #        failureThreshold: 5
      #      readinessProbe:
      #        periodSeconds: 60
      #        successThreshold: 3
      healthCheckTiming:
        livenessProbe: {}
        readinessProbe: {}

    # components.connectionProxy.rdpHttpsGateway -- Configuration settings for the Kasm RDP HTTPS Gateway service container running inside the Connection Proxy pod.
    #
    rdpHttpsGateway:
      # components.connectionProxy.rdpHttpsGateway.enabled -- Use this setting to enable/disable deployment of the Kasm RDP HTTPS Gateway service.
      # This service allows users to use native RDP clients via HTTPS connections rather than exposing 3389 -
      # [Kasm RDP HTTPS Gateway](https://docs.kasm.com/docs/latest/guide/connection_proxies#rdp-https-gateway).
      #
      enabled: true
      # components.connectionProxy.rdpHttpsGateway.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
      # container registry instead of our public DockerHub hosted one.
      #
      image:
        registry: docker.io
        repository: kasmweb/rdp-https-gateway
        # components.connectionProxy.rdpHttpsGateway.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
        tag: ""
      # components.connectionProxy.rdpHttpsGateway.resources -- Manually configure the Kasm RDP HTTPS Gateway container resources. This overrides the pre-defined `deploymentSize` values.
      resources: {}
      # components.connectionProxy.rdpHttpsGateway.healthCheckTiming -- Override the pod's default healthcheck timing values for liveness and/or readiness probes.
      #  Values provided individually override their respective timing value, e.g. livenessProbe.timeoutSeconds: 10 will override only
      #  the timeoutSeconds value of the livenessProbe.
      #  Example:
      #    healthCheckTiming:
      #      livenessProbe:
      #        timeoutSeconds: 10
      #        initialDelaySeconds: 20
      #        periodSeconds: 60
      #        failureThreshold: 5
      #      readinessProbe:
      #        periodSeconds: 60
      #        successThreshold: 3
      healthCheckTiming:
        livenessProbe: {}
        readinessProbe: {}

    # components.connectionProxy.extraVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the Kasm Connection Proxy pod
    # Example:
    #   extraVolumes:
    #     - secret:
    #         defaultMode: 420
    #         secretName: kasm-custom-tls
    #       name: pkichain
    extraVolumes: []
    # components.connectionProxy.extraVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the Kasm Connection Proxy containers
    # Example:
    #   extraVolumeMounts:
    #     - mountPath: /etc/ssl/certs/ca-certificates.crt
    #       name: pkichain
    #       readOnly: true
    #       subPath: ca.crt
    extraVolumeMounts: []
    # components.connectionProxy.extraContainers -- Additional sidecar containers to run in the pod
    # Example
    #  - name: sidecar-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraContainers: []
    # components.connectionProxy.extraInitContainers -- Additional sidecar containers to run in the pod
    # Example
    #  - name: init-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraInitContainers: []

  # Configuration settings for the OpenTelemetry gateway Collector. This is the only OTel Collector
  # tier in the chart: every Kasm service, every Collector sidecar, and any out-of-cluster senders
  # export straight to it. It makes the trace-sampling decision and is the only writer to
  # ClickHouse. Behaviour is configured under `observability.collector.gateway`.
  #
  otelGateway:
    # components.otelGateway.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    #
    image:
      registry: docker.io
      repository: otel/opentelemetry-collector-contrib
      # components.otelGateway.image.tag -- Tag for this component's image. Pinned by the chart rather than
      # falling back to the chart-wide `useImageTags`, because the Collector is versioned independently of Kasm.
      tag: "0.156.0"
    # components.otelGateway.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the
    # deploymentSize preset (default, which is 1 at every size).
    #
    # Pinned to 1: every sender exports straight to the gateway, and nothing in front of it
    # partitions traces by ID, so a second replica would make tail_sampling decide on partial
    # traces and silently drop spans. The chart fails at render time if this is set above 1.
    replicas: 0
    # components.otelGateway.annotations -- Custom annotations to add to the gateway Collector Deployment
    annotations: {}
    # components.otelGateway.resources -- Manually configure the gateway Collector Deployment resources. This overrides the pre-defined `deploymentSize` values.
    # The memory_limiter and num_traces settings baked into the gateway config are sized from the
    # deploymentSize preset, not from this value, so a manual memory limit set below the preset can
    # let the container OOM before memory_limiter has a chance to shed load.
    resources: {}
    # components.otelGateway.labels -- Custom labels to add to the gateway Collector Deployment
    labels: {}
    # components.otelGateway.extraVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the gateway Collector container
    extraVolumes: []
    # components.otelGateway.extraVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the gateway Collector container
    extraVolumeMounts: []
    # components.otelGateway.extraContainers -- Additional sidecar containers to run in the pod
    extraContainers: []
    # components.otelGateway.extraInitContainers -- Additional init containers to run in the pod
    extraInitContainers: []

  # Configuration settings for the OpenTelemetry Collector sidecar. A sidecar runs in every pod that
  # produces telemetry only readable from inside the pod: the Kasm Proxy and Connection Proxy (nginx
  # log files and connection metrics) and the Kasm DB (PostgreSQL log files). In pods that have one,
  # the other containers export OTLP to it over loopback and the sidecar is the pod's single egress
  # point to the gateway. This is not a workload of its own, so it has no replicas.
  #
  otelSidecar:
    # components.otelSidecar.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    #
    image:
      registry: docker.io
      repository: otel/opentelemetry-collector-contrib
      # components.otelSidecar.image.tag -- Tag for this component's image. Pinned by the chart rather than
      # falling back to the chart-wide `useImageTags`, because the Collector is versioned independently of Kasm.
      tag: "0.156.0"
    # components.otelSidecar.resources -- Manually configure the Collector sidecar resources. This overrides the pre-defined
    # `deploymentSize` values. Applied to every sidecar; note that a large deployment runs one per Proxy replica, one per
    # Connection Proxy replica, and one in the DB pod.
    resources: {}

  # Configuration settings for ClickHouse, the telemetry store that backs Kasm reporting. Behaviour,
  # including the database identity and retention windows, is configured under
  # `observability.clickhouse`.
  #
  clickhouse:
    # components.clickhouse.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    #
    image:
      registry: docker.io
      repository: clickhouse/clickhouse-server
      # components.clickhouse.image.tag -- Tag for this component's image. Pinned by the chart rather than
      # falling back to the chart-wide `useImageTags`, because ClickHouse is versioned independently of Kasm.
      tag: "24.12-alpine"
    # components.clickhouse.annotations -- Custom annotations to add to the ClickHouse StatefulSet
    annotations: {}
    # components.clickhouse.resources -- Manually configure the ClickHouse StatefulSet resources. This overrides the pre-defined `deploymentSize` values.
    resources: {}
    # components.clickhouse.labels -- Custom labels to add to the ClickHouse StatefulSet
    labels: {}
    # components.clickhouse.healthCheckTiming -- Override the pod's default healthcheck timing values for
    # liveness and/or readiness probes. Values provided individually override their respective timing value.
    healthCheckTiming:
      livenessProbe: {}
      readinessProbe: {}
    # Configure the storage for the ClickHouse StatefulSet.
    #
    storage:
      # components.clickhouse.storage.storageClassName -- Set the storage class to attach to ClickHouse for
      # storage. Leaving this blank will use the cluster-default storage class.
      #
      storageClassName: ""
      # components.clickhouse.storage.pvcSize -- Size of the PVC backing ClickHouse, in GiB. Telemetry volume
      # scales with session count and retention; see the observability documentation for sizing guidance.
      #
      pvcSize: 20
      # components.clickhouse.storage.retentionPolicy -- Configure how the ClickHouse volume should be retained
      # or deleted throughout the StatefulSet's lifecycle. Defaults to Retain so telemetry history survives an
      # uninstall.
      #
      retentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
    # components.clickhouse.extraVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the ClickHouse container
    extraVolumes: []
    # components.clickhouse.extraVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the ClickHouse container
    extraVolumeMounts: []
    # components.clickhouse.extraContainers -- Additional sidecar containers to run in the pod
    extraContainers: []
    # components.clickhouse.extraInitContainers -- Additional init containers to run in the pod
    extraInitContainers: []

# Configure the Kasm observability stack (OpenTelemetry Collector + ClickHouse). Kasm services emit
# logs, traces, and metrics over OTLP to a Collector, which stores them in ClickHouse where they back
# the reporting UI. See [Observability](./docs/observability.md) for architecture and sizing guidance.
#
observability:
  # observability.enabled -- Master switch for the whole observability stack. Set to false to deploy
  # no Collector and no ClickHouse, disable the OpenTelemetry SDKs in every Kasm service, and serve a
  # disabled browser-telemetry stub. Reporting features that read telemetry will return empty results.
  #
  enabled: true

  # Configure the behaviour of the OpenTelemetry Collector tiers. Deployment settings for each tier
  # (image, replicas, resources) live under `components.otelGateway` and `components.otelSidecar`.
  #
  # Telemetry flows through two hops. A Collector *sidecar* runs in every pod that produces telemetry
  # only readable from inside the pod (the Kasm Proxy and Connection Proxy nginx logs, and the Kasm DB
  # PostgreSQL logs) and is that pod's single egress point. Every sidecar, and every Kasm service that
  # exports directly, sends straight to the single cluster-wide *gateway*, which makes the
  # trace-sampling decision and is the only writer to ClickHouse.
  #
  collector:
    # observability.collector.gateway -- Configure the single cluster-wide gateway Collector, which makes
    # the trace-sampling decision and is the only writer to ClickHouse.
    #
    gateway:
      # observability.collector.gateway.existingConfigMap -- Name of a user-created ConfigMap holding a
      # complete configuration for the gateway Collector, under the key `config.yaml`. Set this to take
      # full ownership of the gateway config: the chart renders none of its own, and the sibling values that
      # only shape that config (`tailSamplePercentage` and `forward`, plus `clickhouse.retention`) are
      # ignored.
      #
      existingConfigMap: ""
      # observability.collector.gateway.tailSamplePercentage -- Percentage (0-100) of traces to keep after the
      # always-keep rules. Traces containing an error, and traces slower than one second, are always kept
      # regardless of this value. Applied at the gateway, which is the only tier that sees a whole trace.
      #
      tailSamplePercentage: 10
      # observability.collector.gateway.forward -- Forward a copy of all telemetry to an external OTLP/HTTP
      # endpoint in addition to storing it in ClickHouse. Useful for shipping to a vendor or a central
      # Collector. Applied at the gateway, so a forwarded copy reflects the sampling decision.
      #
      forward:
        # observability.collector.gateway.forward.endpoint -- OTLP/HTTP endpoint to forward to (e.g.
        # `https://otlp-gateway.example.com/otlp`). Leave empty to disable forwarding.
        endpoint: ""
        # observability.collector.gateway.forward.token -- Bearer token for the forwarding endpoint. Prefer
        # `existingSecret` over putting a credential in values.
        token: ""
        # observability.collector.gateway.forward.existingSecret -- Read the forwarding bearer token from an
        # existing Secret instead of `token`. Both `name` and `key` are required when used.
        existingSecret:
          name: ""
          key: ""

  # Configure ClickHouse, the telemetry store that backs Kasm reporting.
  #
  clickhouse:
    # observability.clickhouse.enabled -- Deploy a ClickHouse StatefulSet to store telemetry. To use a
    # ClickHouse you already run, leave this true and set `standalone` instead. Setting this to false is
    # only valid when the gateway has somewhere else to send telemetry: set
    # `observability.collector.gateway.forward.endpoint` to an external OTLP/HTTP backend, or the render
    # fails rather than deploying a Collector that would discard every signal. Kasm reporting features
    # read from ClickHouse, so they return empty results whenever no ClickHouse is configured.
    #
    enabled: true
    # observability.clickhouse.standalone -- Setting standalone to true will prevent the deployment of the
    # ClickHouse StatefulSet and requires you to have a ClickHouse server already set up and awaiting
    # connections. Use the endpoint values below to connect to your external instance.
    #
    standalone: false
    # observability.clickhouse.nativeEndpoint -- DSN for ClickHouse's native interface, used by the
    # Collector to write telemetry (e.g. `tcp://clickhouse.example.com:9440?secure=true&skip_verify=true`).
    # A bare `host:port` is wrapped with the chart's defaults. Only used when `standalone` is true, and
    # required together with `httpEndpoint`.
    #
    nativeEndpoint: ""
    # observability.clickhouse.httpEndpoint -- URL for ClickHouse's HTTP interface, used by Kasm to read
    # reports and logs (e.g. `https://clickhouse.example.com:8443`). Only used when `standalone` is true,
    # and required together with `nativeEndpoint`.
    #
    httpEndpoint: ""
    # observability.clickhouse.database -- Name of the ClickHouse database holding Kasm telemetry.
    #
    # Changing this on an existing deployment requires starting from an empty ClickHouse volume.
    # The audit-log retention tier depends on a column created by the initial schema, which only runs
    # when the data directory is empty; pointing an existing volume at a new database name silently
    # drops audit logs to the shorter `retention.logsDays` window. See
    # [Observability](./docs/observability.md) for the procedure and a way to check an existing
    # deployment.
    #
    database: kasm_otel
    # observability.clickhouse.username -- ClickHouse user Kasm connects as. Also the writer credential
    # used by the gateway Collector and the retention Job.
    #
    username: kasm_otel
    # observability.clickhouse.readUsername -- ClickHouse user api uses to read reports, holding
    # only GRANT SELECT ON <db>.* instead of `username`'s full access. When the chart manages
    # ClickHouse (`enabled: true`, `standalone: false`), leaving this empty still gets you a
    # read-only user: it defaults to `kasm_otel_ro`. For a `standalone` external ClickHouse, leaving
    # this empty instead keeps api on `username` (no read-only user is rendered) unless you
    # set this to a read-only user you have provisioned there yourself.
    #
    readUsername: ""
    # observability.clickhouse.existingSecret -- Read the ClickHouse password(s) from an existing Secret
    # instead of the chart-generated `clickhouse-password`/`clickhouse-ro-password` keys. `name` and `key`
    # (for `username`) are required together when used; `readKey` (for `readUsername`) is optional and
    # falls back to `key` when unset, matching `readUsername`'s own fallback to `username`.
    #
    existingSecret:
      name: ""
      key: ""
      readKey: ""
    # observability.clickhouse.tls -- Enable TLS on the bundled ClickHouse's 8443 (HTTPS) and 9440 (native)
    # ports using the same certificate as the rest of Kasm, mirroring how the bundled Kasm DB is configured.
    # Requires `certificate.secretName` or cert-manager. Has no effect when `standalone` is true.
    #
    tls: true
    # observability.clickhouse.caCert -- PEM-encoded CA certificate trusted when connecting to a
    # *standalone* ClickHouse over TLS (e.g. `httpEndpoint: https://...` behind a private or self-signed
    # CA). Ignored for the bundled ClickHouse, which already uses the shared Kasm certificate.
    # `clickhouse_connect` (the Python client Kasm's api uses) requires an explicit CA file — it does
    # not consult `SSL_CERT_FILE`/`REQUESTS_CA_BUNDLE` or this chart's `trustedCaBundle` mechanism — so
    # setting this renders a dedicated ConfigMap and mounts it into the api container. Leave empty
    # to use the system trust store, or set `tlsVerify: false` to skip verification instead. Mutually
    # exclusive with `caCertConfigMap`.
    #
    caCert: ""
    # observability.clickhouse.caCertConfigMap -- Name of an existing ConfigMap containing the CA
    # certificate for a standalone ClickHouse, under the key `ca.crt`. Use this instead of `caCert` if you
    # already manage the certificate as a ConfigMap. Ignored for the bundled ClickHouse.
    #
    caCertConfigMap: ""
    # observability.clickhouse.tlsVerify -- Whether the api container verifies a standalone
    # ClickHouse's TLS certificate at all. Set to false to skip verification (not recommended). Ignored
    # when `caCert` or `caCertConfigMap` is set (an explicit CA always wins), and for the bundled
    # ClickHouse, whose certificate is always verified.
    #
    tlsVerify: true
    # observability.clickhouse.retention -- How long each class of telemetry is kept before ClickHouse deletes it.
    # Applied to the schema at install time and re-applied by a post-upgrade Job when these values change.
    #
    retention:
      # observability.clickhouse.retention.logsDays -- Retention in days for general application logs.
      logsDays: 30
      # observability.clickhouse.retention.auditLogsDays -- Retention in days for security-relevant audit logs
      # (login and logout events). Usually longer than general logs to satisfy audit requirements.
      auditLogsDays: 365
      # observability.clickhouse.retention.tracesDays -- Retention in days for distributed traces.
      tracesDays: 7
      # observability.clickhouse.retention.metricsDays -- Retention in days for metrics.
      metricsDays: 90

  # observability.browser -- Collect real-user telemetry from the Kasm web UI in the user's browser.
  #
  browser:
    # observability.browser.enabled -- Serve the browser telemetry runtime configuration so the Kasm web UI
    # reports page loads and user interactions. When false (the default), a stub is served that disables
    # the browser SDK without producing console errors.
    enabled: false

