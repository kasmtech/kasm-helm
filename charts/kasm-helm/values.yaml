    # Example
    #  - name: init-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraInitContainers: []
    # components.guac.recordingData -- PVC backing guac /tmp for session recording segments.
    # See [Session Recording](https://docs.kasm.com/docs/latest/guide/session_recording) for sizing guidance.
    recordingData:
      # components.guac.recordingData.pvcSize -- PVC size in GiB.
      pvcSize: 10
      # components.guac.recordingData.storageClassName -- StorageClass. Blank uses the cluster default.
      storageClassName: ""

  # Configuration settings for the Kasm RDP Gateway service
  #
  rdpGateway:
    # components.rdpGateway.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    #
    image:
      registry: docker.io
      repository: kasmweb/rdp-gateway
      # components.rdpGateway.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
      tag: ""
    # components.rdpGateway.enabled -- Use this setting to enable/disable deployment of the Kasm RDP Gateway service - 
    # [Kasm RDP Gateway](https://docs.kasm.com/docs/latest/guide/connection_proxies#rdp-gateway).
    #
    enabled: true
    # components.rdpGateway.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
    #
    # NOTE: must be 0 (preset) or 1. Multi-replica rdp-gateway is not supported
    # in this release.
    replicas: 0
    # components.rdpGateway.annotations -- Custom annotations to add to the Kasm RDP Gateway Deployment
    annotations: {}
    # components.rdpGateway.resources -- Manually configure the Kasm RDP Gateway Deployment resources. This overrides the pre-defined `deploymentSize` values.
    resources: {}
    # components.rdpGateway.nginxSidecar -- Configuration for the nginx sidecar container.
    nginxSidecar:
      # components.rdpGateway.nginxSidecar.resources -- Manually configure resources for the nginx sidecar container. Leave empty to use the chart default.
      resources: {}
    # components.rdpGateway.labels -- Custom labels to add to the Kasm RDP Gateway Deployment
    labels: {}
    # components.rdpGateway.extraVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the Kasm RDP Gateway container
    # Example:
    #   extraVolumes:
    #     - secret:
    #         defaultMode: 420
