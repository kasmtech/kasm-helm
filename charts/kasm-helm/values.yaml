    #       name: pkichain
    extraVolumes: []
    # components.rdpGateway.extraVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes Kasm RDP Gateway container
    # Example: 
    #   extraVolumeMounts:
    #     - mountPath: /etc/ssl/certs/ca-certificates.crt
    #       name: pkichain
    #       readOnly: true
    #       subPath: ca.crt
    extraVolumeMounts: []
    # database.extraContainers -- Additional sidecar containers to run in the pod
    # Example
    #  - name: sidecar-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraContainers: []
    # components.rdpGateway.extraInitContainers -- Additional sidecar containers to run in the pod
    # Example
    #  - name: init-example
    #    image: busybox
    #    command: [/bin/sh, -c, 'echo "Hello world"']
    extraInitContainers: []
    # components.rdpGateway.iniConfigMapName -- Name of a user-created ConfigMap
    # providing a custom `rdpproxy.ini` for the rdp-gateway pod. See the Kasm
    # documentation for details.
    iniConfigMapName: ""

  # Configuration settings for the Kasm RDP HTTPS Gateway service
  #
  rdpHttpsGateway:
    # components.rdpHttpsGateway.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
    # container registry instead of our public DockerHub hosted one.
    #
    image:
      registry: docker.io
      repository: kasmweb/rdp-https-gateway
