# kasmConfig -- Use fields in the `kasmConfig` section to apply customization to a Kasm deployment
# during database initialization.
#
# NOTE: This data is only used during DB initialization and does not have any effect on live Kasm
# configuration settings. 
#
kasmConfig:
  # kasmConfig.generatePreseed -- Generate a custom DB initialization configuration (`kasmConfig.config`,
  # plus what the chart seeds on its own: the default zone's `proxy_port` for a NodePort proxy, and
  # `auto_agent` from `kasmConfig.autoEnableAgents`) and merge it into Kasm's default seed data at
  # database initialization. Unset (null), it is on for a release installed through Rancher's
  # catalog, which has both of those to seed, and off everywhere else; `true`/`false` decides
  # explicitly.
  # @default -- `null`: on under Rancher, else off
  generatePreseed: null
  # kasmConfig.autoEnableAgents -- Seed the manager setting "Automatically Enable Agents" (`auto_agent`),
  # so agents come up enabled as they register instead of waiting for a click under Infrastructure ->
  # Agents. Takes effect at database initialization only, through the generated preseed. Unset (null),
  # it is on for a release installed through Rancher's catalog and off everywhere else; an
  # `auto_agent` entry in `kasmConfig.config.settings` wins over it as written.
  # @default -- `null`: on under Rancher, else off
  autoEnableAgents: null
  # kasmConfig.defaultUsers -- Creates a series of 4 users and 5 groups with a standard set of
  # permissions accommodating most standard deployment scenarios. Refer to the [Default Users](../../docs/reference/default-users.md)
  # for additional information about what this flag creates.
  #
  defaultUsers: false
  # kasmConfig.defaultApiUsers -- Creates two predefined sets of API credentials with permissions
  # accommodating most standard deployment scenarios. Refer to the [Default API Users](../../docs/reference/default-api-users.md)
  # for additional information about what this flag creates.
  #
  defaultApiUsers: false
  # kasmConfig.adminUsername -- Change the username seeded on the admin-group member. Default: `admin@kasm.local`,
  # the only true built-in admin account. Setting this to any other value seeds that account with generated
  # (non-built-in) credentials stored under a `<local-part>-password`/`<local-part>-salt` key pair in the
  # passwords/salts Secrets (e.g. `system@kasm.local` -> `system-password`) instead of the built-in
  # admin-password-Secret-backed credentials. The chart will not create an `admin-password` key at all in that
  # case, and the db-init Job will not be given a DEFAULT_ADMIN_PASSWORD env var. See docs/default-users.md.
  #
  adminUsername: "admin@kasm.local"
  # kasmConfig.authDomain -- Set the `kasm_auth_domain` global setting, which scopes the Kasm session cookie.
  # Defaults to `""`, leaving Kasm's own `$request_host$` default in place (cookie scoped to whichever hostname
  # served the page).
  #
  # Applies at DATABASE INITIALIZATION, so it takes effect on FRESH INSTALLS ONLY. On an existing database the
  # db-init Job no longer seeds anything; change the value in the admin UI under Settings -> Auth, or through the
  # admin API (`POST /api/admin/get_settings` for the `setting_id`, then `POST /api/admin/update_setting`).
  #
  # Why it exists: with a Kubernetes agent, browsers connect to the agent's session-proxy hostname directly,
  # which is a different hostname from `publicAddr`. A cookie scoped to `publicAddr` is never sent to the agent
  # and every session connection fails with a 401. Set this to the common parent domain of both hostnames — for
  # `kasm.example.com` and `sessions.example.com`, that is `example.com`. Pick the two hostnames as siblings
  # under one parent from the start; there is no fixing this later without renaming one.
  #
  # Unlike `kasmConfig.config.settings`, this is applied last against the finished seed file, so it wins over
  # both `existingDefaultPropertiesSecret` and the `kasmConfig.config` merge. It does not require
  # `generatePreseed`. See the "Running alongside the kasm-helm control plane" section of
  # [charts/kasm-agent/README.md](../kasm-agent/README.md) for the full agent pairing.
  #
  authDomain: ""
  # kasmConfig.existingDefaultPropertiesSecret -- Reference a customer-managed Secret containing a complete
  # `default_properties.yaml` seed file, for infrastructure-as-code workflows that manage the seed file directly
  # as a Kubernetes Secret rather than expressing it through kasmConfig.config values.
  #
  # When `name` is set, its contents (at `key`) replace the image's baked-in default_properties.yaml as the base
  # seed file. This works independently of generatePreseed: set generatePreseed=true as well to additionally merge
  # kasmConfig.config-generated values on top of the customer-provided file, or leave it false to use the
  # customer-provided file as-is with no chart-side merge.
  #
  existingDefaultPropertiesSecret:
    name: ""
    key: "default_properties.yaml"
  # kasmConfig.config -- Kasm DB pre-seed configuration settings in YAML format. Refer to the
  # [Preseed Documentation](../../docs/reference/preseed.md) and to the [Kasm Slip-Stream Install](https://docs.kasm.com/docs/1.19.0/how-to/administration/import-export/slipstream-install)
  # documentation for additional details.
  #
  config: {}