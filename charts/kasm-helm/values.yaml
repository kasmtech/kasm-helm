      resources: {}
    # components.rdpHttpsGateway.labels -- Custom labels to add to the Kasm RDP HTTPS Gateway Deployment
    labels: {}
    # components.rdpHttpsGateway.extraVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes to the Kasm RDP HTTPS Gateway container
    # Example:
