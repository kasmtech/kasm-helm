    #       name: pkichain
    extraVolumes: []
    # components.rdpHttpsGateway.extraVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
    #  like custom SSL certificates, config files, or data volumes Kasm RDP HTTPS Gateway container
    # Example: 
