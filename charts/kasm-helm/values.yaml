    extraInitContainers: []

####################################
# Extra Kubernetes config settings #
####################################

# useImageTags -- Chart-wide image tag used when a component's `image.tag` is empty. Per-component tag wins if set.
# To override the tag for a single component, see `components.<x>.image.tag` (or `database.image.tag`).
# Examples:
#   "1.19.0-rolling"             rolling tag, receives ongoing bug-fix updates within 1.19.x
#   "1.19.0"                     frozen point-in-time tag
#   "1.19.0-rolling-2026-06-02"  date-locked rolling tag, pins a specific rolling build
#
useImageTags: "develop"

# imagePullPolicy -- Configure global image pull policy
#
imagePullPolicy: "Always"

# Create an image pull credential. Useful for offline or self-hosted repos, or dev builds.
#
imagePullSecrets:
  # imagePullSecrets.enabled -- Enable/disable image pull secrets
  enabled: false
  # imagePullSecrets.name -- Secret name to use. If left blank, will be dynamically generated.
  # To use an existing Image pull secret, or one you manually created, set `imagePullSecrets.enabled`, and provide the
  # name of the Image Pull Secret you created, making sure to leave all other values below empty.
  #
  name: ""
  # imagePullSecrets.registry -- The Registry to use when pulling images (e.g. index.docker.io, myprivateregistry.com)
  registry: ""
  # imagePullSecrets.username -- The username used to authenticate agaisnt your Registry.
  username: ""
  # imagePullSecrets.password -- The password used to authenticate agaisnt your Registry.
  password: ""
  # imagePullSecrets.email -- The email address used to authenticate (optional, used by some registries).
  email: ""
  # imagePullSecrets.labels -- Additional labels for this secret
  labels: {}
  # imagePullSecrets.annotations -- Additional annotations for this secret
  annotations: {}

# clusterDomain -- Cluster-wide Kubernetes DNS domain name
#
clusterDomain: "cluster.local"

# nodeSelector -- Configure node selector settings for your Kasm pods -
# [Kubernetes Node Selector](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector).
#
nodeSelector: {}

# affinity -- Configure node affinity settings for Kasm pods - 
# [Kubernetes Affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
# Kasm is not guaranteed to work with Affinity settings - use caution if you must configuring these settings.
# The below, optional object passes in raw Affinity rules for Pods, Nodes, etc. for your environment. Make sure you
# use the correct values below as this Helm chart will not do any error checking for you.
#
affinity: {}

# applySecurity -- Apply Pod/Container security settings for Kasm resources
#
applySecurity: true

# applyHealthChecks -- Add Pod/Container healthchecks settings for Kasm resources
#
applyHealthChecks: true

# restartPolicy -- Configure global Pod restart policy for Kasm resources
#
restartPolicy: "Always"

# labels -- Custom labels to apply to all deployed resources
#
labels: {}

# annotations -- Custom annotations to apply to all deployed resources
#
annotations: {}

# Additional resource annotations to apply to resources created by this chart.
# See [Kubernetes Annotations](https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/)
# for more information.
#
extraAnnotations:
  # extraAnnotations.configMap -- Additional configMap annotations to apply to resources created by this chart
  configMap: {}
  # extraAnnotations.cronJob -- Additional cronJob annotations to apply to resources created by this chart
  cronJob: {}
  # extraAnnotations.cronPod -- Additional annotations to apply to the pod template inside CronJobs created by this chart
  cronPod: {}
  # extraAnnotations.deployment -- Additional deployment annotations to apply to resources created by this chart
  deployment: {}
  # extraAnnotations.job -- Additional job annotations to apply to resources created by this chart
  job: {}
  # extraAnnotations.pod -- Additional pod annotations to apply to resources created by this chart
  pod: {}
  # extraAnnotations.pvc -- Additional PersistentVolumeClaim annotations to apply to resources created by this chart
  pvc: {}
  # extraAnnotations.service -- Additional service annotations to apply to resources created by this chart
  service: {}
  # extraAnnotations.secret -- Additional secret annotations to apply to resources created by this chart
  secret: {}
  # extraAnnotations.statefulSet -- Additional statefulSet annotations to apply to resources created by this chart
  statefulSet: {}

# Additional Kubernetes labels to apply to resources created by this chart.
# See [Kubernetes Labels](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/)
# for more information.
#
extraLabels:
  # extraLabels.configMap -- Additional configMap labels to apply to resources created by this chart
  configMap: {}
  # extraLabels.deployment -- Additional deployment labels to apply to resources created by this chart
  deployment: {}
  # extraLabels.pod -- Additional pod labels to apply to resources created by this chart
  pod: {}
  # extraLabels.secret -- Additional secret labels to apply to resources created by this chart
  secret: {}
  # extraLabels.service -- Additional service labels to apply to resources created by this chart
  service: {}
  # extraLabels.job -- Additional job labels to apply to resources created by this chart
  job: {}
  # extraLabels.cronJob -- Additional cronJob labels to apply to resources created by this chart
  cronJob: {}
  # extraLabels.cronPod -- Additional labels to apply to the pod template inside CronJobs created by this chart
  cronPod: {}
  # extraLabels.pvc -- Additional PersistentVolumeClaim labels to apply to resources created by this chart
  pvc: {}
  # extraLabels.statefulSet -- Additional statefulSet labels to apply to resources created by this chart
  statefulSet: {}

# extraContainerVolumes -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
#  like custom SSL certificates, config files, or data volumes to all Kasm containers
# Example:
#   extraContainerVolumes:
#     - secret:
#         defaultMode: 420
#         secretName: kasm-custom-tls
#       name: pkichain
extraVolumes: []

# extraContainerVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
#  like custom SSL certificates, config files, or data volumes to all Kasm containers
# Example: 
#   extraContainerVolumeMounts:
#     - mountPath: /etc/ssl/certs/ca-certificates.crt
#       name: pkichain
#       readOnly: true
#       subPath: ca.crt
extraContainerVolumeMounts: []

# extraInitVolumeMounts -- A list of objects for additional secrets, configmaps, or volume mounts. Useful for adding things
#  like custom SSL certificates, config files, or data volumes to all Kasm Service Init containers
# Example: 
#   extraInitVolumeMounts:
#     - mountPath: /etc/ssl/certs/ca-certificates.crt
#       name: pkichain
#       readOnly: true
#       subPath: ca.crt
extraInitVolumeMounts: []

# extraContainers -- Additional sidecar containers to run in every pod
# Example
#  - name: sidecar-example
#    image: busybox
#    command: [/bin/sh, -c, 'echo "Hello world"']
extraContainers: []

# extraContainers -- Additional sidecar containers to run in every pod
# Example
#  - name: init-example
#    image: busybox
#    command: [/bin/sh, -c, 'echo "Hello world"']
extraInitContainers: []

# extraObjects -- Deploy additional Kubernetes manifests.
# This field is expected to be either a multi-line string, a list of strings, or a list of objects.
#
extraObjects: []
