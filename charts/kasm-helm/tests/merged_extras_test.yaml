suite: Merged extras (volumes, mounts, sidecars)

templates:
  - templates/api-deployment.yaml
  - templates/proxy-deployment.yaml
  - templates/db-statefulset.yaml
  - templates/connection-proxy-statefulset.yaml

tests:
  - it: supports component-specific extras using proxy as example
    template: templates/proxy-deployment.yaml
    set:
      components:
        proxy:
          extraContainers:
            - name: proxy-sidecar
              image: nginx
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name=="proxy-sidecar")]

  - it: attaches merged volumes and mounts to db container
    template: templates/db-statefulset.yaml
    set:
      database:
        extraVolumeMounts:
          - name: extra-db-volume
            mountPath: /etc/db-extra
        extraVolumes:
          - name: extra-db-volume
            configMap:
              name: db-extra-config
      extraVolumes:
        - name: extra-global-volume
          configMap:
            name: test-config
      extraContainerVolumeMounts:
        - name: extra-global-volume
          mountPath: /etc/extra
    asserts:
      - exists:
          path: spec.template.spec.volumes[?(@.name=="extra-global-volume")]
      - exists:
          path: spec.template.spec.containers[*].volumeMounts[?(@.name=="extra-global-volume" && @.mountPath=="/etc/extra")]
      - exists:
          path: spec.template.spec.volumes[?(@.name=="extra-db-volume")]
      - exists:
          path: spec.template.spec.containers[*].volumeMounts[?(@.name=="extra-db-volume" && @.mountPath=="/etc/db-extra")]

  - it: merges global and component initContainers and mounts
    templates:
      - templates/api-deployment.yaml
      - templates/proxy-deployment.yaml
    set:
      extraInitContainers:
        - name: init-global
          image: busybox
          volumeMounts:
            - name: data
              mountPath: /data
      extraVolumes:
        - name: extra-global-volume
          emptyDir: {}
      extraInitVolumeMounts:
        - name: extra-global-volume
          mountPath: /etc/extra
      components:
        api:
          extraInitContainers:
            - name: init-component
              image: alpine
        proxy:
          extraInitContainers:
            - name: init-component
              image: alpine
    asserts:
      - exists:
          path: spec.template.spec.initContainers[?(@.name=="init-global")]
      - exists:
          path: spec.template.spec.initContainers[?(@.name=="init-component")]
      - exists:
          path: spec.template.spec.volumes[?(@.name=="extra-global-volume")]
      - exists:
          path: spec.template.spec.initContainers[*].volumeMounts[?(@.name=="extra-global-volume" && @.mountPath=="/etc/extra")]

  - it: component extraContainers override global by name
    template: templates/api-deployment.yaml
    set:
      extraContainers:
        - name: shared-sidecar-global
          image: busybox:1.36
      components:
        api:
          extraContainers:
            - name: shared-sidecar-api
              image: alpine:3.20
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name=="shared-sidecar-api" && @.image=="alpine:3.20")]
      - exists:
          path: spec.template.spec.containers[?(@.name=="shared-sidecar-global" && @.image=="busybox:1.36")]

  # ---------- connectionProxy extraVolumes/extraVolumeMounts (pod-level, componentName "connectionProxy") ----------
  # extraVolumes/extraVolumeMounts/extraContainers/extraInitContainers moved from three
  # per-service trees (guac/rdpGateway/rdpHttpsGateway nginxSidecar.*) to a single
  # pod-level components.connectionProxy.* tree, since the StatefulSet now runs one
  # pod with up to four containers instead of three separate pods each with their own
  # nginx sidecar. kasm.mergedValues dedup/merge semantics are otherwise unchanged.

  - it: connectionProxy extraVolumes/extraVolumeMounts attach to every container via extraContainerVolumeMounts-style global mount, and to a named container via extraVolumeMounts on the pod spec
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        connectionProxy:
          extraVolumes:
            - name: cp-extra
              secret:
                secretName: cp-extra-secret
          extraVolumeMounts:
            - name: cp-extra
              mountPath: /etc/cp-extra
              readOnly: true
    asserts:
      - exists:
          path: spec.template.spec.volumes[?(@.name=="cp-extra")]
      - exists:
          path: spec.template.spec.containers[1].volumeMounts[?(@.name=="cp-extra" && @.mountPath=="/etc/cp-extra")]
      - exists:
          path: spec.template.spec.containers[2].volumeMounts[?(@.name=="cp-extra" && @.mountPath=="/etc/cp-extra")]

  - it: connectionProxy extraContainers/extraInitContainers are added once to the single consolidated pod
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        connectionProxy:
          extraContainers:
            - name: cp-sidecar
              image: busybox
          extraInitContainers:
            - name: cp-init
              image: busybox
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name=="cp-sidecar")]
      - exists:
          path: spec.template.spec.initContainers[?(@.name=="cp-init")]
      # nginx, guac, rdp-gateway, rdp-https-gateway, cp-sidecar: exactly one of each,
      # proving the extra container is added once to the single consolidated pod
      # rather than once per former per-service workload.
      - lengthEqual:
          path: spec.template.spec.containers
          count: 5

  - it: global extraVolumes/extraContainers merge with connectionProxy-scoped extras, component-scoped wins on name collision
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      extraContainers:
        - name: shared-sidecar-global
          image: busybox:1.36
      components:
        connectionProxy:
          extraContainers:
            - name: shared-sidecar-global
              image: alpine:3.20
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name=="shared-sidecar-global" && @.image=="alpine:3.20")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="shared-sidecar-global" && @.image=="busybox:1.36")]
