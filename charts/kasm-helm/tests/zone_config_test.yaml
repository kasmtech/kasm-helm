suite: zone configuration — primary selection, region routing, resource fan-out
templates:
  - templates/connection-proxy-statefulset.yaml
  - templates/connection-proxy-services.yaml
  - templates/api-deployment.yaml
  - templates/proxy-deployment.yaml

tests:

  # ---------------------------------------------------------------------------
  # Primary zone selection — primary at a non-first index
  #
  # guac, rdp-gateway, and rdp-https-gateway used to be three separate zone-scoped
  # workloads (each asserted separately). They are now three containers inside one
  # connection-proxy StatefulSet, so the three old per-service "primary selection"
  # tests collapse into one assertion against the single consolidated document.
  # ---------------------------------------------------------------------------

  - it: uses the primary-flagged zone for connection-proxy statefulset when primary is not at index 0
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zoneb
          proxyAddress: zoneb.example.com
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"
      - notMatchRegex:
          path: metadata.name
          pattern: ".*zoneb.*"

  - it: deploys api for all zones regardless of primary position
    template: templates/api-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zoneb
          proxyAddress: zoneb.example.com
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: metadata.name
          pattern: ".*zoneb.*"
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"
        documentIndex: 1

  - it: sets ZONE env var to the zone name in the guac container when primary is not at index 0
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zoneb
          proxyAddress: zoneb.example.com
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
    asserts:
      - exists:
          path: spec.template.spec.containers[*].env[?(@.name=="ZONE" && @.value=="zonea")]

  # ---------------------------------------------------------------------------
  # Same region_name — full stack for every zone in the region
  # ---------------------------------------------------------------------------

  - it: deploys one connection-proxy statefulset per zone when both share region_name
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: us-east
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ".*zoneb.*"
        documentIndex: 1

  - it: deploys one connection-proxy headless service per zone when both share region_name
    template: templates/connection-proxy-services.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: us-east
    asserts:
      - hasDocuments:
          count: 2

  # ---------------------------------------------------------------------------
  # Different region_name — connection-proxy only for primary region
  # ---------------------------------------------------------------------------

  - it: deploys only one connection-proxy statefulset when zones have different region_name
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: eu-west
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"

  - it: deploys api for all zones when regions differ
    template: templates/api-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: eu-west
    asserts:
      - hasDocuments:
          count: 2

  - it: deploys proxy for all zones when regions differ
    template: templates/proxy-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: eu-west
    asserts:
      - hasDocuments:
          count: 2

  # ---------------------------------------------------------------------------
  # No region_name — full stack only for primary zone
  # ---------------------------------------------------------------------------

  - it: deploys only one connection-proxy statefulset when no zones have region_name
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
        - name: zoneb
          proxyAddress: zoneb.example.com
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"

  - it: deploys api for all zones when no zones have region_name
    template: templates/api-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
        - name: zoneb
          proxyAddress: zoneb.example.com
    asserts:
      - hasDocuments:
          count: 2

  # ---------------------------------------------------------------------------
  # SERVER_INTERNAL_SCHEMA routing by region
  # ---------------------------------------------------------------------------

  - it: sets SERVER_INTERNAL_SCHEMA=http for the primary region api and https for a different region
    template: templates/api-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: eu-west
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="SERVER_INTERNAL_SCHEMA" && @.value=="https")]
        documentIndex: 0
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="SERVER_INTERNAL_SCHEMA" && @.value=="https")]
        documentIndex: 1

  - it: sets SERVER_INTERNAL_SCHEMA=http for all zones sharing the primary region_name
    template: templates/api-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: us-east
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="SERVER_INTERNAL_SCHEMA" && @.value=="https")]
        documentIndex: 0
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="SERVER_INTERNAL_SCHEMA" && @.value=="https")]
        documentIndex: 1

  - it: sets SERVER_INTERNAL_SCHEMA=http for primary zone and https for others when no region_name set
    template: templates/api-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
        - name: zoneb
          proxyAddress: zoneb.example.com
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="SERVER_INTERNAL_SCHEMA" && @.value=="https")]
        documentIndex: 0
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="SERVER_INTERNAL_SCHEMA" && @.value=="https")]
        documentIndex: 1

  # ---------------------------------------------------------------------------
  # Proxy init containers — always just api-wait + manager-wait, regardless of
  # region/primary status. Proxy no longer waits for guac/rdp-gateway readiness:
  # since guac/rdp-gateway now reach the API through the proxy (and gate their
  # own readiness on it), proxy waiting on them back would deadlock.
  # ---------------------------------------------------------------------------

  - it: primary-region proxy has only api-wait and manager-wait init containers
    template: templates/proxy-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: eu-west
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
        documentIndex: 0

  - it: non-primary-region proxy has no guac or rdp-gateway init containers
    template: templates/proxy-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: eu-west
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
        documentIndex: 1

  - it: primary-zone proxy has only api-wait and manager-wait init containers when no region_name set
    template: templates/proxy-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
        - name: zoneb
          proxyAddress: zoneb.example.com
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
        documentIndex: 0

  - it: non-primary-zone proxy has no guac or rdp-gateway init containers when no region_name set
    template: templates/proxy-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
        - name: zoneb
          proxyAddress: zoneb.example.com
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
        documentIndex: 1

  # ---------------------------------------------------------------------------
  # Service names embed the correct zone slug
  #
  # guac and rdp-https-gateway used to have separate headless Services; they now
  # share the single consolidated connection-proxy headless Service.
  # ---------------------------------------------------------------------------

  - it: connection-proxy headless service uses zone-specific name
    template: templates/connection-proxy-services.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ".*connection-proxy-zonea.*"

  - it: rdp-https-gateway container's SERVER_HOSTNAME references the zone-specific headless service
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[3].env[?(@.name=="SERVER_HOSTNAME")].value
          pattern: ".*connection-proxy-zonea.*"

  - it: guac container's SERVER_ADDRESS references the zone-specific headless service
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[1].env[?(@.name=="SERVER_ADDRESS")].value
          pattern: ".*connection-proxy-zonea.*"

  # ---------------------------------------------------------------------------
  # kasm.initContainer "is-ready" naming — must not embed the release name
  # twice or exceed the 63-char Kubernetes name limit under a long release
  # name and zone name (e.g. CI's "kasm-e2e-<job-id>" release names).
  # ---------------------------------------------------------------------------

  - it: proxy is-ready init container names stay short and unique under a long release+zone name
    template: templates/proxy-deployment.yaml
    release:
      name: kasm-e2e-15341393551
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: preseed-zone
          proxyAddress: preseed-zone.example.com
          primary: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: kasm-e2e-15341393551-api-is-ready
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: kasm-e2e-15341393551-manager-is-ready
