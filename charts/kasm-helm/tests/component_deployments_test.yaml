suite: per-component deployment specifics (api/manager/connection-proxy)
# guac, rdp-gateway, and rdp-https-gateway are no longer separate workloads; they are
# containers[1], containers[2], and containers[3] respectively inside the consolidated
# connection-proxy StatefulSet (containers[0] is the shared nginx), per components-all.yaml
# (all three services enabled). Disabling one service no longer zeroes out the whole
# template — the StatefulSet still renders as long as at least one service remains enabled —
# so the old "is not rendered when disabled" assertions are replaced with "container is
# omitted" assertions.

templates:
  - templates/api-deployment.yaml
  - templates/manager-deployment.yaml
  - templates/connection-proxy-statefulset.yaml

tests:
  # ---------- api ----------
  - it: api wires KASM_THREAD_POOL + KASM_THREAD_POOL_LOG_INTERVAL from defaults
    template: templates/api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_THREAD_POOL
            value: "20"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_THREAD_POOL_LOG_INTERVAL
            value: "0"

  - it: api honors custom threadPool and threadPoolLogInterval overrides
    template: templates/api-deployment.yaml
    set:
      components:
        api:
          threadPool: 50
          threadPoolLogInterval: 30
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_THREAD_POOL
            value: "50"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_THREAD_POOL_LOG_INTERVAL
            value: "30"

  - it: schema rejects non-integer threadPool
    template: templates/api-deployment.yaml
    set:
      components:
        api:
          threadPool: "not-a-number"
    asserts:
      - failedTemplate:
          errorPattern: "threadPool.*integer|got string"

  # ---------- manager ----------
  - it: manager builds image from registry/repository/tag
    template: templates/manager-deployment.yaml
    set:
      components:
        manager:
          image:
            registry: registry.example.test
            repository: kasm/manager
            tag: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.test/kasm/manager:1.2.3

  - it: manager exposes container port 8181
    template: templates/manager-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8181

  - it: manager wires SERVER_ZONE_NAME from the zone
    template: templates/manager-deployment.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVER_ZONE_NAME
            value: zonea

  - it: manager uses default db password secret when no override
    template: templates/manager-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: db-password

  - it: manager uses external kasmDbSecret when provided
    template: templates/manager-deployment.yaml
    set:
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password

  - it: manager honors deploymentSize=large with 3 replicas
    template: templates/manager-deployment.yaml
    set:
      deploymentSize: large
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: manager honors explicit resource override
    template: templates/manager-deployment.yaml
    set:
      components:
        manager:
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi

  - it: manager applies imagePullSecrets when enabled
    template: templates/manager-deployment.yaml
    set:
      imagePullSecrets:
        enabled: true
        name: my-pull-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-pull-secret

  - it: manager omits imagePullSecrets when disabled
    template: templates/manager-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: manager wires KASM_MANAGER_UPDATE_TIMER + KASM_MANAGER_SUPPORT_BUNDLE_TIMER from defaults
    template: templates/manager-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_MANAGER_UPDATE_TIMER
            value: "86400"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_MANAGER_SUPPORT_BUNDLE_TIMER
            value: "60"

  - it: manager honors custom updateTimer and supportBundleTimer overrides
    template: templates/manager-deployment.yaml
    set:
      components:
        manager:
          updateTimer: 3600
          supportBundleTimer: 30
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_MANAGER_UPDATE_TIMER
            value: "3600"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_MANAGER_SUPPORT_BUNDLE_TIMER
            value: "30"

  - it: schema rejects non-integer updateTimer
    template: templates/manager-deployment.yaml
    set:
      components:
        manager:
          updateTimer: "not-a-number"
    asserts:
      - failedTemplate:
          errorPattern: "updateTimer.*integer|got string"

  # ---------- guac ----------
  # No "is not rendered when disabled" case: disabling guac alone no longer zeroes the
  # StatefulSet since rdpGateway/rdpHttpsGateway (enabled by default) keep it rendering.
  # That behavior — and the "everything disabled" case — is covered in
  # connection_proxy_statefulset_test.yaml and connection_proxy_test.yaml instead.
  - it: guac container is omitted from the StatefulSet when components.connectionProxy.guac.enabled=false
    template: templates/connection-proxy-statefulset.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="RELEASE-NAME-connection-proxy-guac")]

  - it: guac exposes container port 3000
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 3000

  - it: guac wires API_PORT to proxy http port and SERVER_PORT to the consolidated nginx port
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: API_PORT
            value: "8080"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: SERVER_PORT
            value: "8443"

  - it: guac uses primary zone in multizone deployments
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: ZONE
            value: zonea

  # ---------- rdp gateway ----------
  - it: rdp-gateway container is omitted from the StatefulSet when disabled
    template: templates/connection-proxy-statefulset.yaml
    set:
      components:
        connectionProxy:
          rdpGateway:
            enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="RELEASE-NAME-connection-proxy-rdp-gateway")]

  - it: rdp gateway exposes container port 5555
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[2].ports[0].containerPort
          value: 5555

  # The old assertion that directRdpService.rdpAccessURL becomes SERVER_HOSTNAME directly no
  # longer has a static equivalent: SERVER_HOSTNAME in the env list is always the per-pod FQDN
  # now, and the ordinal-specific access URL is picked at container start (see the /start.sh
  # wrapper, asserted in connection_proxy_statefulset_test.yaml) from RDP_ACCESS_URLS. What is
  # asserted here instead is that the configured URL(s) flow into RDP_ACCESS_URLS.
  - it: rdp gateway wires directRdpService.rdpAccessURL into RDP_ACCESS_URLS for runtime ordinal selection
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      directRdpService:
        enabled: true
        type: LoadBalancer
        rdpAccessURL: rdp.kasm.example.test
    asserts:
      - contains:
          path: spec.template.spec.containers[2].env
          content:
            name: RDP_ACCESS_URLS
            value: rdp.kasm.example.test

  # The old "fails when rdpAccessURL is unset" case does not apply to the StatefulSet anymore:
  # that validation (effective URL count must be >= replica count) now lives in
  # connection-proxy-services.yaml, covered in connection_proxy_test.yaml. The StatefulSet
  # itself renders fine with an empty RDP_ACCESS_URLS.

  # ---------- rdp https gateway ----------
  - it: rdp-https-gateway container is omitted from the StatefulSet when disabled
    template: templates/connection-proxy-statefulset.yaml
    set:
      components:
        connectionProxy:
          rdpHttpsGateway:
            enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="RELEASE-NAME-connection-proxy-rdp-https-gateway")]

  - it: rdp https gateway main container exposes no ports (nginx handles all ingress)
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[3].ports

  - it: rdp https gateway wires SERVER_PORT env to the consolidated nginx port
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[3].env
          content:
            name: SERVER_PORT
            value: "8443"
