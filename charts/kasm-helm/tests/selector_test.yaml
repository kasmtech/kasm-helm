suite: match selector parity
templates:
  - templates/api-deployment.yaml
  - templates/api-service.yaml
  - templates/db-service.yaml
  - templates/db-statefulset.yaml
  - templates/proxy-deployment.yaml
  - templates/proxy-service.yaml
  - templates/proxy-service-external.yaml
  - templates/guac-statefulset.yaml
  - templates/guac-service.yaml
  - templates/rdp-https-gateway-statefulset.yaml
  - templates/rdp-https-gateway-service.yaml

tests:
  - it: api selectors are identical
    template: templates/api-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-default

  - it: api service selector matches deployment pod selectors
    template: templates/api-service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-default

  - it: db service selector matches statefulset pod labels
    template: templates/db-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: db
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-db

  - it: db statefulset matches service pod selectors
    template: templates/db-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: db
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-db

  - it: proxy clusterip service selector matches proxy pods
    template: templates/proxy-service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-proxy-default

  - it: proxy external service selector matches proxy pods when rendered
    template: templates/proxy-service-external.yaml
    set:
      ingress:
        enabled: false
      route:
        enabled: false
      proxyService:
        type: LoadBalancer
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-proxy-default

  - it: proxy deployment matches service pod selectors
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-proxy-default

  - it: guac statefulset selector labels match the headless service selector
    template: templates/guac-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: guac
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME-guac-default

  - it: guac headless service selector matches guac pod labels
    template: templates/guac-service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: guac
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-guac-default

  - it: rdp-https-gateway statefulset selector labels are consistent
    template: templates/rdp-https-gateway-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: rdp-https-gateway
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: rdp-https-gateway headless service selector matches pod labels
    template: templates/rdp-https-gateway-service.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: rdp-https-gateway
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
