suite: match selector parity
templates:
  - templates/api-deployment.yaml
  - templates/api-service.yaml
  - templates/db-service.yaml
  - templates/db-statefulset.yaml
  - templates/proxy-deployment.yaml
  - templates/proxy-service.yaml
  - templates/proxy-service-external.yaml
  - templates/connection-proxy-statefulset.yaml
  - templates/connection-proxy-services.yaml

tests:
  - it: api selectors are identical
    template: templates/api-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-default

  - it: api service selector matches deployment pod selectors
    template: templates/api-service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-default

  - it: db service selector matches statefulset pod labels
    template: templates/db-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: db
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-db

  - it: db statefulset matches service pod selectors
    template: templates/db-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: db
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-db

  - it: proxy clusterip service selector matches proxy pods
    template: templates/proxy-service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-proxy-default

  - it: proxy external service selector matches proxy pods when rendered
    template: templates/proxy-service-external.yaml
    set:
      ingress:
        enabled: false
      route:
        enabled: false
      proxyService:
        type: LoadBalancer
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-proxy-default

  - it: proxy deployment matches service pod selectors
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-proxy-default

  # connection-proxy consolidates the old guac/rdp-gateway/rdp-https-gateway StatefulSet+Service
  # pairs into one StatefulSet fronted by one headless Service. Both the StatefulSet's
  # spec.selector.matchLabels and the headless Service's spec.selector must agree.
  - it: connection-proxy statefulset selector labels match the headless service selector
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: connection-proxy
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME-connection-proxy-default

  - it: connection-proxy headless service selector matches connection-proxy pod labels
    template: templates/connection-proxy-services.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: connection-proxy
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-connection-proxy-default

  # Direct RDP per-pod Services carry the standard three-field selector PLUS the
  # StatefulSet-assigned statefulset.kubernetes.io/pod-name label so each Service targets
  # exactly one pod ordinal.
  - it: direct RDP service selector matches the standard selector plus the pod-name label
    template: templates/connection-proxy-services.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/components-all.yaml
    set:
      directRdpService:
        enabled: true
        type: LoadBalancer
        perServiceSettings:
          - rdpAccessURL: rdp0.example.com
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: connection-proxy
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: RELEASE-NAME-connection-proxy-default
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: RELEASE-NAME-connection-proxy-default-0
