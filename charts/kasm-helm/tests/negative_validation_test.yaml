suite: negative path / explicit fail messages

templates:
  - templates/validation.yaml
  - templates/connection-proxy-services.yaml
  - templates/upstream-auth-ingress.yaml

tests:
  - it: ingress + route both enabled fails with a clear message
    template: templates/validation.yaml
    set:
      ingress:
        enabled: true
      route:
        enabled: true
      proxyService:
        type: ClusterIP
    asserts:
      - failedTemplate:
          errorMessage: "The ingress.enabled and route.enabled cannot both be set. Either configure an Ingress or an OpenShift Route, not both."

  - it: LoadBalancer + ingress fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: LoadBalancer
      ingress:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "The service.type must not be LoadBalancer when using an ingress or a route - any load balancer or Route should be provisioned using the Ingress/Route settings. Set service.type=ClusterIP or mark ingress.enabled or route.enabled to disabled."

  - it: LoadBalancer + multi-zone fails
    template: templates/validation.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    set:
      proxyService:
        type: LoadBalancer
    asserts:
      - failedTemplate:
          errorMessage: "The service.type must not be LoadBalancer when using a Multi-Zone Kasm deployment - any load balancer or Route should be provisioned using the Ingress/Route settings. Set service.type=ClusterIP or remove your kasmZones settings."

  # The old `components.rdpGateway.replicas must be 1` fail is gone entirely: connection-proxy
  # now scales 1/2/3 like every other component, and each replica gets its own direct RDP
  # Service/access URL instead of being capped at a single instance.

  - it: directRdpService.enabled=true with fewer perServiceSettings entries than the connection-proxy replica count fails
    template: templates/connection-proxy-services.yaml
    set:
      directRdpService:
        enabled: true
        perServiceSettings: []
        rdpAccessURL: ""
    asserts:
      - failedTemplate:
          errorPattern: 'directRdpService\.enabled is true but only 0 entr\(y/ies\) are configured in directRdpService\.perServiceSettings .* while components\.connectionProxy has 1 replica\(s\)'

  - it: directRdpService.enabled=true with the legacy singular rdpAccessURL used with more than 1 replica fails
    template: templates/connection-proxy-services.yaml
    set:
      deploymentSize: medium
      directRdpService:
        enabled: true
        rdpAccessURL: "rdp.example.com"
    asserts:
      - failedTemplate:
          errorPattern: 'directRdpService\.rdpAccessURL \(legacy singular\) is set but components\.connectionProxy has 2 replica\(s\)'

  - it: directRdpService.rdpAccessURL (legacy) set together with a non-empty perServiceSettings fails
    template: templates/connection-proxy-services.yaml
    set:
      directRdpService:
        enabled: true
        rdpAccessURL: "rdp.example.com"
        perServiceSettings:
          - rdpAccessURL: rdp0.example.com
    asserts:
      - failedTemplate:
          errorMessage: "directRdpService.rdpAccessURL (legacy singular) and directRdpService.perServiceSettings are both set. This is ambiguous: remove rdpAccessURL and configure every replica via perServiceSettings instead."

  # NOTE: directRdpService.type is constrained to an enum (NodePort, LoadBalancer), and each
  # directRdpService.perServiceSettings[] entry requires rdpAccessURL, both enforced in
  # values.schema.json. So `helm template`/helm-unittest reject an invalid type, or a
  # perServiceSettings entry missing rdpAccessURL, at schema-validation time, before
  # templates/connection-proxy-services.yaml's own `fail` guards for those two cases ever run.
  # Those template fails are unreachable through this harness (they would only fire with
  # --skip-schema-validation or if the schema and template guards ever drift out of sync) so
  # there is no meaningful helm-unittest case for either of them here.

  - it: a perServiceSettings entry with an empty rdpAccessURL fails, even though the key is present
    template: templates/connection-proxy-services.yaml
    set:
      directRdpService:
        enabled: true
        perServiceSettings:
          - rdpAccessURL: ""
    asserts:
      - failedTemplate:
          errorMessage: "directRdpService.perServiceSettings[0].rdpAccessURL is empty. Each connection-proxy replica needs its own non-empty externally reachable RDP address."

  # ---------------------------------------------------------------------------
  # Multi-zone directRdpService: a flat list without a zone per entry can't express distinct
  # addresses per zone, so these are rejected outright rather than silently reused across zones.
  # ---------------------------------------------------------------------------

  - it: multi-zone directRdpService with the legacy singular rdpAccessURL fails
    template: templates/connection-proxy-services.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: us-east
      directRdpService:
        enabled: true
        rdpAccessURL: rdp.example.com
    asserts:
      - failedTemplate:
          errorMessage: "directRdpService.rdpAccessURL (legacy singular) cannot be used with more than one primary-region zone (2 configured): set a zone field on every directRdpService.perServiceSettings entry instead."

  - it: multi-zone directRdpService with a perServiceSettings entry missing zone fails
    template: templates/connection-proxy-services.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: us-east
      directRdpService:
        enabled: true
        perServiceSettings:
          - rdpAccessURL: rdp0.example.com
    asserts:
      - failedTemplate:
          errorMessage: "directRdpService.perServiceSettings[0] has no zone set, but 2 primary-region zones are configured. Every entry needs a zone field naming which zone it belongs to."

  - it: multi-zone directRdpService with a perServiceSettings entry naming an unconfigured zone fails
    template: templates/connection-proxy-services.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: us-east
      directRdpService:
        enabled: true
        perServiceSettings:
          - zone: zonea
            rdpAccessURL: rdp0.zonea.example.com
          - zone: zone-typo
            rdpAccessURL: rdp0.zoneb.example.com
    asserts:
      - failedTemplate:
          errorMessage: 'directRdpService.perServiceSettings[1].zone "zone-typo" does not match any configured primary-region zone.'

  - it: multi-zone directRdpService with fewer entries for one zone than the replica count fails
    template: templates/connection-proxy-services.yaml
    set:
      deploymentSize: medium
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxyAddress: zonea.example.com
          primary: true
          region_name: us-east
        - name: zoneb
          proxyAddress: zoneb.example.com
          region_name: us-east
      directRdpService:
        enabled: true
        perServiceSettings:
          - zone: zonea
            rdpAccessURL: rdp0.zonea.example.com
          - zone: zoneb
            rdpAccessURL: rdp0.zoneb.example.com
          - zone: zoneb
            rdpAccessURL: rdp1.zoneb.example.com
    asserts:
      - failedTemplate:
          errorMessage: "directRdpService.enabled is true but only 1 entr(y/ies) are configured for zone \"zonea\" while components.connectionProxy has 2 replica(s). Each connection-proxy replica needs its own externally reachable RDP address: add more directRdpService.perServiceSettings entries with zone: zonea."


  - it: two proxy exposure methods fails, naming both
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      ingress:
        enabled: true
      httpRoute:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "Only one proxy exposure method may be enabled, but ingress.enabled and httpRoute.enabled are set. The Ingress, the OpenShift Route, the Gateway API HTTPRoute and the Gateway API TLSRoute all publish the same Kasm proxy Service, so enabling more than one gives the same hostname two owners."

  - it: LoadBalancer proxyService + httpRoute fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: LoadBalancer
      httpRoute:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "The proxyService.type must not be LoadBalancer when the proxy is published through the Gateway API - the Gateway owns the external address. Set proxyService.type=ClusterIP, or disable httpRoute.enabled / tlsRoute.enabled."

  - it: httpRoute with no parentRefs fails rather than rendering an unattached route
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      httpRoute:
        enabled: true
        parentRefs: []
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.enabled is set but httpRoute.parentRefs is empty - the route would attach to no Gateway, and the proxy would stay unreachable from outside the cluster."

  - it: tlsRoute with no parentRefs fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      tlsRoute:
        enabled: true
        parentRefs: []
    asserts:
      - failedTemplate:
          errorMessage: "tlsRoute.enabled is set but tlsRoute.parentRefs is empty - the route would attach to no Gateway, and the proxy would stay unreachable from outside the cluster."

  - it: tcpRoute and directRdpService both publishing the RDP Gateway fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      directRdpService:
        enabled: true
        rdpAccessURL: rdp.kasm.example.com
      tcpRoute:
        enabled: true
        rdpAccessURL: rdp.kasm.example.com
        parentRefs:
          - name: kasm-gateway
    asserts:
      - failedTemplate:
          errorMessage: "tcpRoute.enabled and directRdpService.enabled both publish the RDP Gateway externally. Set directRdpService.enabled=false: the per-replica RDP Service stays ClusterIP and the Gateway fronts it through the TCPRoute."

  - it: tcpRoute without rdpAccessURL fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      tcpRoute:
        enabled: true
        rdpAccessURL: ""
        parentRefs:
          - name: kasm-gateway
    asserts:
      - failedTemplate:
          errorMessage: "tcpRoute.rdpAccessURL must be set if tcpRoute.enabled is true - it is the hostname Kasm advertises to RDP clients, and the RDP Gateway has no way to infer it from the Gateway."

  - it: tcpRoute with two primary-region zones and no per-zone refs fails, naming the zones
    template: templates/validation.yaml
    values:
      - ../../../tests/values/multizone-same-region.yaml
    set:
      tcpRoute:
        enabled: true
        rdpAccessURL: rdp.kasm.example.com
        parentRefs:
          - name: kasm-gateway
    asserts:
      - failedTemplate:
          errorMessage: "tcpRoute.zones has no entry for zone(s) zonea, zoneb. A TCPRoute matches on neither hostname nor SNI, so the zones cannot share one Gateway listener: give every zone its own entry, using parentRefs[].sectionName to select that zone's listener."

  - it: tcpRoute with rdpGateway disabled fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      components:
        connectionProxy:
          rdpGateway:
            enabled: false
      tcpRoute:
        enabled: true
        rdpAccessURL: rdp.kasm.example.com
        parentRefs:
          - name: kasm-gateway
    asserts:
      - failedTemplate:
          errorMessage: "tcpRoute.enabled publishes the RDP Gateway, but components.connectionProxy.enabled or components.connectionProxy.rdpGateway.enabled is false. Enable the component, or disable tcpRoute."

  # Every rdp-gateway replica must advertise its own external address, and a TCPRoute matches on
  # neither hostname nor SNI, so it can only ever front one replica per zone.
  - it: tcpRoute with more than one connection-proxy replica fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      deploymentSize: medium
      tcpRoute:
        enabled: true
        rdpAccessURL: rdp.kasm.example.com
        parentRefs:
          - name: kasm-gateway
    asserts:
      - failedTemplate:
          errorMessage: "tcpRoute.enabled advertises a single RDP hostname, but components.connectionProxy resolves to 2 replicas - every replica would register the same address. Set components.connectionProxy.replicas=1, or publish per-replica addresses with directRdpService.perServiceSettings instead of the TCPRoute."

  - it: seedOnly zone sharing a region_name with a deployed zone fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      kasmZones:
        - name: ashburn
          proxy_hostname: ashburn.example.com
          primary: true
          region_name: us-east
        - name: ashburn-2
          proxy_hostname: ashburn2.example.com
          seedOnly: true
          region_name: us-east
    asserts:
      - failedTemplate:
          errorMessage: 'kasmZones[ashburn-2] is marked ''seedOnly: true'' but shares region_name "us-east" with deployed zone "ashburn". Zones in one region deploy to one cluster: remove ''seedOnly: true'' from ashburn-2, or give it a different region_name.'

  - it: two upstream auth publishers fails with a clear message
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      upstreamAuth:
        hostname: mgmt.example.com
        service:
          enabled: true
        ingress:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "Only one upstream auth exposure method may be enabled, but upstreamAuth.service.enabled and upstreamAuth.ingress.enabled are set. The Service, the Ingress, the OpenShift Route, the Gateway API HTTPRoute and the Gateway API TLSRoute all publish the same upstream auth endpoint, so enabling more than one gives the same hostname two owners."

  - it: upstream auth httpRoute without parentRefs or zones fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      upstreamAuth:
        hostname: mgmt.example.com
        httpRoute:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "upstreamAuth.httpRoute.enabled is set but neither upstreamAuth.httpRoute.parentRefs nor upstreamAuth.httpRoute.zones is populated - the routes would attach to no Gateway, and the upstream auth endpoint would stay unreachable from outside the cluster."

  - it: upstream auth publisher without any hostname source fails
    template: templates/upstream-auth-ingress.yaml
    set:
      proxyService:
        type: ClusterIP
      upstreamAuth:
        ingress:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "kasmZones[default]: 'upstream_auth_address' (or 'upstreamAuth.hostname' for the primary zone) must be set to generate an upstream-auth ingress/route hostname for this zone"

  - it: upstream auth address carrying a port fails on a host-bearing publisher
    template: templates/upstream-auth-ingress.yaml
    set:
      proxyService:
        type: ClusterIP
      upstreamAuth:
        hostname: mgmt.example.com:8443
        ingress:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: 'kasmZones[default]: upstream_auth_address "mgmt.example.com:8443" carries a port, but ingress/route/gateway host fields cannot. Use a bare hostname here; a non-443 listener port belongs only in the preseed value agents are given.'

  - it: pinned upstream auth nodePort with two deployed zones fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      ingress:
        enabled: true
      kasmZones:
        - name: zonea
          proxy_hostname: zonea.kasm.example.com
          primary: true
        - name: zoneb
          proxy_hostname: zoneb.kasm.example.com
      upstreamAuth:
        service:
          enabled: true
          type: NodePort
          nodePort: 30443
    asserts:
      - failedTemplate:
          errorMessage: "upstreamAuth.service.nodePort is pinned but 2 zones deploy in this cluster, and every zone's upstream auth Service would claim the same node port. Remove the pin, or deploy a single zone per cluster."

  - it: two zones resolving to the same upstream auth address fails
    template: templates/validation.yaml
    set:
      proxyService:
        type: ClusterIP
      ingress:
        enabled: true
      kasmZones:
        - name: zonea
          proxy_hostname: zonea.kasm.example.com
          primary: true
          upstream_auth_address: same.example.com
        - name: zoneb
          proxy_hostname: zoneb.kasm.example.com
          upstream_auth_address: same.example.com
      upstreamAuth:
        service:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: 'kasmZones[zonea] and kasmZones[zoneb] both resolve their upstream auth address to "same.example.com". Every deployed zone needs its own address, since each routes to its own proxy Service.'
