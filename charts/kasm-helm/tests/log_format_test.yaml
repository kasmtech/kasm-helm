suite: logFormat rendering

templates:
  - templates/api-app-configmap.yaml
  - templates/manager-app-configmap.yaml
  - templates/connection-proxy-configmaps.yaml
  - templates/nginx-shared-configmap.yaml
  - templates/db-configmap.yaml

tests:

  # ---------- api-app-configmap ----------
  - it: api-app-configmap is not rendered when logFormat is log (default)
    template: templates/api-app-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: api-app-configmap is rendered when logFormat is json
    template: templates/api-app-configmap.yaml
    set:
      logFormat: json
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: api-app-configmap stream handler uses pythonjsonlogger formatter
    template: templates/api-app-configmap.yaml
    set:
      logFormat: json
    asserts:
      - matchRegex:
          path: data["api.app.config.yaml"]
          pattern: "formatter: pythonjsonlogger"

  # ---------- manager-app-configmap ----------
  - it: manager-app-configmap is not rendered when logFormat is log (default)
    template: templates/manager-app-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: manager-app-configmap is rendered when logFormat is json
    template: templates/manager-app-configmap.yaml
    set:
      logFormat: json
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: manager-app-configmap stream handler uses pythonjsonlogger formatter
    template: templates/manager-app-configmap.yaml
    set:
      logFormat: json
    asserts:
      - matchRegex:
          path: data["api.app.config.yaml"]
          pattern: "formatter: pythonjsonlogger"

  # ---------- connection-proxy-configmaps: rdp-gateway app-config (documentIndex 2) ----------
  # The configmap always contains both formatter *definitions* (pythonjsonlogger
  # and standard). Only the stream handler's formatter: assignment is controlled
  # by logFormat. Tests verify which value the stream handler uses.
  - it: connection-proxy rdp-gateway app-config stream handler uses standard formatter by default
    template: templates/connection-proxy-configmaps.yaml
    documentIndex: 2
    asserts:
      - matchRegex:
          path: data["passthrough.app.config.yaml"]
          pattern: "formatter: standard"

  - it: connection-proxy rdp-gateway app-config stream handler uses pythonjsonlogger formatter when logFormat is json
    template: templates/connection-proxy-configmaps.yaml
    documentIndex: 2
    set:
      logFormat: json
    asserts:
      - matchRegex:
          path: data["passthrough.app.config.yaml"]
          pattern: "formatter: pythonjsonlogger"

  # ---------- connection-proxy-configmaps: rdp-https-gateway app-config ----------
  # This ConfigMap only renders when logFormat is "json" (unchanged behavior).
  - it: connection-proxy rdp-https-gateway app-config is not rendered when logFormat is log (default)
    template: templates/connection-proxy-configmaps.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: connection-proxy rdp-https-gateway app-config is rendered when logFormat is json
    template: templates/connection-proxy-configmaps.yaml
    set:
      logFormat: json
    documentIndex: 3
    asserts:
      - isKind:
          of: ConfigMap
      - exists:
          path: data["rdp_https_gateway.app.config.yaml"]

  # ---------- nginx-shared-configmap ----------
  # The access_log switching lives in data["logging.conf"], not data["nginx.conf"].
  - it: nginx shared configmap uses main access log format by default
    template: templates/nginx-shared-configmap.yaml
    asserts:
      - matchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout main"
      - notMatchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout json_combined"

  - it: nginx shared configmap uses json_combined access log format when logFormat is json
    template: templates/nginx-shared-configmap.yaml
    set:
      logFormat: json
    asserts:
      - matchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout json_combined"
      - notMatchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout main"

  # ---------- db-configmap ----------
  - it: db configmap uses syslog log_destination by default
    template: templates/db-configmap.yaml
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "log_destination = 'stderr,syslog'"

  - it: db configmap uses jsonlog log_destination when logFormat is json
    template: templates/db-configmap.yaml
    set:
      logFormat: json
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "log_destination = 'stderr,jsonlog'"
