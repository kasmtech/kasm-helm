suite: logFormat rendering

# api-app-configmap.yaml and manager-app-configmap.yaml were deleted in H2 (dead config: the API
# and Manager services no longer call logging.config.dictConfig, so logFormat never affected their
# structured logs; their console output is always human-readable text now, and their structured
# logs are exported over OpenTelemetry instead). logFormat's remaining scope is nginx's access log
# format and the Postgres JSON log symlink, both covered below.
templates:
  - templates/connection-proxy-configmaps.yaml
  - templates/nginx-shared-configmap.yaml
  - templates/db-configmap.yaml
  - templates/db-statefulset.yaml

tests:

  # ---------- connection-proxy-configmaps: rdp-gateway app-config (documentIndex 2) ----------
  # The configmap always contains both formatter *definitions* (pythonjsonlogger
  # and standard). Only the stream handler's formatter: assignment is controlled
  # by logFormat. Tests verify which value the stream handler uses.
  - it: connection-proxy rdp-gateway app-config stream handler uses standard formatter by default
    template: templates/connection-proxy-configmaps.yaml
    documentIndex: 2
    asserts:
      - matchRegex:
          path: data["passthrough.app.config.yaml"]
          pattern: "formatter: standard"

  - it: connection-proxy rdp-gateway app-config stream handler uses pythonjsonlogger formatter when logFormat is json
    template: templates/connection-proxy-configmaps.yaml
    documentIndex: 2
    set:
      logFormat: json
    asserts:
      - matchRegex:
          path: data["passthrough.app.config.yaml"]
          pattern: "formatter: pythonjsonlogger"

  # ---------- connection-proxy-configmaps: rdp-https-gateway app-config ----------
  # This ConfigMap only renders when logFormat is "json" (unchanged behavior).
  - it: connection-proxy rdp-https-gateway app-config is not rendered when logFormat is log (default)
    template: templates/connection-proxy-configmaps.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: connection-proxy rdp-https-gateway app-config is rendered when logFormat is json
    template: templates/connection-proxy-configmaps.yaml
    set:
      logFormat: json
    documentIndex: 3
    asserts:
      - isKind:
          of: ConfigMap
      - exists:
          path: data["rdp_https_gateway.app.config.yaml"]

  # ---------- nginx-shared-configmap ----------
  # The access_log switching lives in data["logging.conf"], not data["nginx.conf"]. H5 makes
  # observability.enabled force json_combined regardless of logFormat (the hostLogs DaemonSet
  # parses stdout as JSON), so logFormat's own effect is only observable with observability off.
  - it: nginx shared configmap uses main access log format by default when observability is disabled
    template: templates/nginx-shared-configmap.yaml
    set:
      observability.enabled: false
    asserts:
      - matchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout main"
      - notMatchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout json_combined"

  - it: nginx shared configmap uses json_combined access log format when logFormat is json and observability is disabled
    template: templates/nginx-shared-configmap.yaml
    set:
      observability.enabled: false
      logFormat: json
    asserts:
      - matchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout json_combined"
      - notMatchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout main"

  - it: nginx shared configmap forces json_combined access log format when observability is enabled, regardless of logFormat
    template: templates/nginx-shared-configmap.yaml
    set:
      logFormat: log
    asserts:
      - matchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout json_combined"
      - notMatchRegex:
          path: data["logging.conf"]
          pattern: "access_log /dev/stdout main"

  # ---------- db-configmap ----------
  - it: db configmap uses syslog log_destination by default
    template: templates/db-configmap.yaml
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "log_destination = 'stderr,syslog'"

  - it: db configmap uses jsonlog log_destination when logFormat is json
    template: templates/db-configmap.yaml
    set:
      logFormat: json
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "log_destination = 'stderr,jsonlog'"

  # ---------- db-statefulset ----------
  # logFormat: json symlinks postgres's JSON log file to stdout via a custom command/args; the
  # default (log) uses the image's own entrypoint with no override.
  - it: db statefulset uses the default entrypoint (no command override) when logFormat is log
    template: templates/db-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: db statefulset symlinks the postgres JSON log to stdout when logFormat is json
    template: templates/db-statefulset.yaml
    documentIndex: 0
    set:
      logFormat: json
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/bin/bash", "-c"]
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "ln -sf /dev/stdout /tmp/postgres/postgresql.json"
