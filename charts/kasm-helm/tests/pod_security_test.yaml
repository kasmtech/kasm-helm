suite: pod security standards compatibility
templates:
  - templates/api-deployment.yaml
  - templates/db-backup-cron.yaml
  - templates/db-init-job.yaml
  - templates/db-statefulset.yaml
  - templates/db-upgrade-backup-job.yaml
  - templates/db-upgrade-job.yaml
  - templates/connection-proxy-statefulset.yaml
  - templates/manager-deployment.yaml
  - templates/proxy-deployment.yaml

tests:
  - it: hardens core workload pod templates and main containers when security is enabled
    templates:
      - templates/api-deployment.yaml
      - templates/db-init-job.yaml
      - templates/db-statefulset.yaml
      - templates/manager-deployment.yaml
      - templates/proxy-deployment.yaml
    set:
      ingress:
        enabled: false
      dbManagement:
        initialize: true
        backupCron:
          enabled: false
        upgrade:
          enable: false
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kasm.com/security"]
          value: "true"
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: hardens built in init containers on core workloads
    templates:
      - templates/api-deployment.yaml
      - templates/db-init-job.yaml
      - templates/manager-deployment.yaml
      - templates/proxy-deployment.yaml
    set:
      ingress:
        enabled: false
      dbManagement:
        initialize: true
        backupCron:
          enabled: false
        upgrade:
          enable: false
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  # guac, rdp-gateway, and rdp-https-gateway used to be three separate single-container
  # (plus an nginx sidecar) workloads, each asserted separately at containers[0]/[1].
  # They are now four containers (nginx, guac, rdp-gateway, rdp-https-gateway, in that
  # order) inside one connection-proxy pod. Assert hardening across all four container
  # indices plus the pod's first init container in one consolidated test.
  - it: hardens all four connection-proxy containers and the pod's first init container
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      ingress:
        enabled: false
      dbManagement:
        initialize: false
        backupCron:
          enabled: false
        upgrade:
          enable: false
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kasm.com/security"]
          value: "true"
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[1].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[2].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[2].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[2].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[2].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[2].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[3].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[3].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[3].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[3].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[3].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: hardens backup cronjob pod templates
    template: templates/db-backup-cron.yaml
    values:
      - ../../../tests/values/db-backup-cron.yaml
    set:
      ingress:
        enabled: false
      dbManagement:
        initialize: false
        upgrade:
          enable: false
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["kasm.com/security"]
          value: "true"
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: hardens the trusted ca init container for api workloads
    template: templates/api-deployment.yaml
    values:
      - ../../../tests/values/trustedca-enabled.yaml
    set:
      ingress:
        enabled: false
      dbManagement:
        initialize: false
        backupCron:
          enabled: false
        upgrade:
          enable: false
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: trusted-ca-init
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: hardens the trusted ca init container for the postgres workload uid
    template: templates/db-statefulset.yaml
    values:
      - ../../../tests/values/trustedca-enabled.yaml
    set:
      ingress:
        enabled: false
      dbManagement:
        initialize: false
        backupCron:
          enabled: false
        upgrade:
          enable: false
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: trusted-ca-init
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 70
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsGroup
          value: 70
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: keeps the db upgrade job restricted-compatible while preserving required writable mounts
    template: templates/db-upgrade-job.yaml
    set:
      ingress:
        enabled: false
      dbManagement:
        initialize: false
        upgrade:
          enable: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kasm.com/security"]
          value: "true"
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name=="tmp-data" && @.mountPath=="/tmp")]
      - exists:
          path: spec.template.spec.volumes[?(@.name=="tmp-data")]
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true

  - it: hardens the pre upgrade backup job pod and init container
    template: templates/db-upgrade-backup-job.yaml
    documentIndex: 1
    set:
      ingress:
        enabled: false
      dbManagement:
        initialize: false
        upgrade:
          enable: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kasm.com/security"]
          value: "true"
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  # The old per-service "nginx sidecar" concept no longer exists: there is a single
  # nginx container (index 0) fronting all three service containers in the consolidated
  # pod. Its hardening is already asserted (containers[0]) in
  # "hardens all four connection-proxy containers and the pod's first init container"
  # above; a standalone test would be a pure duplicate.
