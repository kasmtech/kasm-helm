suite: db preseed cross-reference failure cases
templates:
  - templates/db-preseed-secret.yaml

tests:

  - it: image pool_name not found in server_pools fails render
    set:
      publicAddr: kasm.example.com
      kasmConfig.generatePreseed: true
      kasmConfig.defaultUsers: false
      kasmZones:
        - name: default
          proxyAddress: kasm.example.com
          primary: true
      certificate.secretName: kasm-tls
      dbManagement.initialize: true
      kasmConfig.config.images:
        - name: "kasmweb/ubuntu-focal-desktop"
          pool_name: "nonexistent-pool"
    asserts:
      - failedTemplate:
          errorMessage: "No matching server pool found for config 'kasmweb/ubuntu-focal-desktop': pool_name='nonexistent-pool'"

  - it: image zone_name not found in kasmZones fails render
    set:
      publicAddr: kasm.example.com
