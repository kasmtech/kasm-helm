suite: kasm.otelEnv — per-workload OTel/logging env vars

templates:
  - templates/api-deployment.yaml
  - templates/api-worker-deployment.yaml
  - templates/connection-proxy-statefulset.yaml
  - templates/db-init-job.yaml
  - templates/otel-gateway-configmap.yaml
  - templates/otel-gateway-deployment.yaml
  - templates/otel-gateway-service.yaml
  - templates/otel-forward-snippet-configmap.yaml

tests:
  # ---------- forward-snippet ConfigMap (bd rse): renders with the gateway ----------
  - it: forward-snippet ConfigMap renders with the resolved endpoint and bearertokenauth extension
    template: templates/otel-forward-snippet-configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-otel-forward-snippet
      - matchRegex:
          path: data["forward-snippet.yaml"]
          pattern: 'endpoint: "http://RELEASE-NAME-otel-gateway\.NAMESPACE\.svc\.cluster\.local:4318"'
      - matchRegex:
          path: data["forward-snippet.yaml"]
          pattern: 'bearertokenauth/kasm_gateway:\s*\n\s*scheme: "Bearer"'
      # Positive assertion first: the notMatchRegex below passes vacuously if the
      # token field is dropped entirely, and a snippet with no token gets 401 at the gateway.
      - matchRegex:
          path: data["forward-snippet.yaml"]
          pattern: 'token: "\$\{env:KASM_OTEL_GATEWAY_TOKEN\}"'
      - notMatchRegex:
          path: data["forward-snippet.yaml"]
          pattern: 'token: "\$\{env:OTEL_FORWARD_TOKEN\}"'

  # An empty clusterDomain must not reach the endpoint as "%!s(<nil>)": helm exits 0 and
  # every static gate passes, but the published endpoint never resolves.
  - it: forward-snippet endpoint falls back to cluster.local when clusterDomain is empty
    template: templates/otel-forward-snippet-configmap.yaml
    set:
      clusterDomain: null
    asserts:
      - matchRegex:
          path: data["forward-snippet.yaml"]
          pattern: 'endpoint: "http://RELEASE-NAME-otel-gateway\.NAMESPACE\.svc\.cluster\.local:4318"'

  - it: forward-snippet ConfigMap does not render when the gateway does not render
    template: templates/otel-forward-snippet-configmap.yaml
    set:
      observability.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  # ---------- gateway: both receivers, both ports, same auth (D5) ----------
  - it: gateway renders an authenticated gRPC receiver on 4317 and HTTP receiver on 4318
    template: templates/otel-gateway-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'grpc:\s*\n\s*endpoint: "0\.0\.0\.0:4317"\s*\n\s*auth:\s*\n\s*authenticator: bearertokenauth/server'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'http:\s*\n\s*endpoint: "0\.0\.0\.0:4318"\s*\n\s*auth:\s*\n\s*authenticator: bearertokenauth/server'

  - it: gateway Deployment exposes both otlp-grpc and otlp-http container ports
    template: templates/otel-gateway-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].ports[?(@.name=="otlp-grpc" && @.containerPort==4317)]
      - exists:
          path: spec.template.spec.containers[0].ports[?(@.name=="otlp-http" && @.containerPort==4318)]

  - it: gateway Service exposes both otlp-grpc and otlp-http ports
    template: templates/otel-gateway-service.yaml
    asserts:
      - exists:
          path: spec.ports[?(@.name=="otlp-grpc" && @.port==4317)]
      - exists:
          path: spec.ports[?(@.name=="otlp-http" && @.port==4318)]

  # ---------- gateway render gating (D7): renders iff it has a destination ----------
  - it: gateway renders with clickhouse only (default)
    asserts:
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-configmap.yaml
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-deployment.yaml
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-service.yaml

  - it: gateway renders with forward.endpoint only, no clickhouse
    set:
      observability.clickhouse.enabled: false
      observability.collector.gateway.forward.endpoint: "https://otlp-gateway.example.com/otlp"
    asserts:
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-configmap.yaml
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-deployment.yaml
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-service.yaml

  - it: gateway renders with both clickhouse and forward.endpoint
    set:
      observability.collector.gateway.forward.endpoint: "https://otlp-gateway.example.com/otlp"
    asserts:
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-configmap.yaml
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-deployment.yaml
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-service.yaml

  - it: gateway fails to render with neither clickhouse nor forward.endpoint
    template: templates/otel-gateway-configmap.yaml
    set:
      observability.clickhouse.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "observability.enabled is true but the gateway has nowhere to send telemetry: set observability.clickhouse.enabled (or observability.clickhouse.standalone) to true, or set observability.collector.gateway.forward.endpoint to an external OTLP/HTTP endpoint."

  - it: existingConfigMap still short-circuits the gateway ConfigMap even with no destination
    set:
      observability.clickhouse.enabled: false
      observability.collector.gateway.existingConfigMap: my-gateway-collector-config
    asserts:
      - hasDocuments:
          count: 0
        template: templates/otel-gateway-configmap.yaml
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-deployment.yaml
      - hasDocuments:
          count: 1
        template: templates/otel-gateway-service.yaml

  # ---------- OTEL_SERVICE_NAME per workload ----------
  - it: api container gets OTEL_SERVICE_NAME=kasm-api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-api")]

  - it: guac application container gets OTEL_SERVICE_NAME=kasm-guac
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-guac")]

  - it: rdp-gateway application container gets OTEL_SERVICE_NAME=kasm-rdp-gateway
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-rdp-gateway")]

  - it: rdp-https-gateway application container gets OTEL_SERVICE_NAME=kasm-rdp-https-gateway
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-rdp-https-gateway")]

  # ---------- endpoint: gateway Service for pods without a sidecar, loopback for pods with one ----------
  - it: api exports straight to the gateway Service over HTTP, authenticated
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://RELEASE-NAME-otel-gateway:4318")]
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_PROTOCOL" && @.value=="http/protobuf")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_BEARER_TOKEN")].valueFrom.secretKeyRef.key
          value: otel-bearer-token
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_HEADERS" && @.value=="Authorization=Bearer $(OTEL_BEARER_TOKEN)")]

  # Zones no longer select an endpoint; there is one gateway and zone identity travels as a
  # resource attribute on the telemetry instead.
  - it: api endpoint is identical in a multi-zone install
    template: templates/api-deployment.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://RELEASE-NAME-otel-gateway:4318")]
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_RESOURCE_ATTRIBUTES")].value
          pattern: "kasm\\.zone=zonea"

  - it: connection-proxy app containers carry kasm.zone in a multi-zone install
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
      - ../../../tests/values/components-all.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_RESOURCE_ATTRIBUTES")].value
          pattern: "kasm\\.zone=zonea"
      - matchRegex:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_RESOURCE_ATTRIBUTES")].value
          pattern: "kasm\\.zone=zonea"
      - matchRegex:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_RESOURCE_ATTRIBUTES")].value
          pattern: "kasm\\.zone=zonea"

  # Containers co-located with a sidecar export to it over loopback; the sidecar is the pod's
  # single egress point.
  - it: guac, rdp-gateway and rdp-https-gateway export to the pod-local sidecar
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]
      - exists:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]
      - exists:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]

  # ---------- OTEL_PYTHON_EXCLUDED_URLS only on api ----------
  - it: OTEL_PYTHON_EXCLUDED_URLS present on api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  - it: OTEL_PYTHON_EXCLUDED_URLS absent on guac
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  - it: OTEL_PYTHON_EXCLUDED_URLS absent on rdp-gateway
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  - it: OTEL_PYTHON_EXCLUDED_URLS absent on rdp-https-gateway
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  # ---------- KASM_LOG_FILE_ENABLED default false ----------
  - it: KASM_LOG_FILE_ENABLED=false by default on api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED" && @.value=="false")]

  # ---------- regression: KASM_LOG_FILE_ENABLED still emitted when observability.enabled=false ----------
  # This is the H2 amendment regression test: KASM_LOG_FILE_ENABLED is not an OTel setting.
  # kasm_telemetry defaults file logging to true and init_logging() mkdir/opens the log path, so
  # omitting this env var when observability is disabled would crash every workload at startup
  # under readOnlyRootFilesystem. Only OTEL_SDK_DISABLED should be gated on observability.enabled.
  - it: KASM_LOG_FILE_ENABLED=false is still emitted when observability.enabled=false (api)
    template: templates/api-deployment.yaml
    set:
      observability.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED" && @.value=="false")]
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_SDK_DISABLED" && @.value=="true")]

  - it: KASM_LOG_FILE_ENABLED=false is still emitted when observability.enabled=false (guac)
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    set:
      observability.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.containers[1].env[?(@.name=="KASM_LOG_FILE_ENABLED" && @.value=="false")]

  - it: only OTEL_SDK_DISABLED is emitted for the OTel-specific vars when observability is disabled
    template: templates/api-deployment.yaml
    set:
      observability.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_SERVICE_NAME")]

  # ---------- file logging is always off ----------
  # Kasm services export logs over OTLP. A file-shaped copy inside the pod would store every line
  # twice, so KASM_LOG_FILE_ENABLED is false everywhere and KASM_LOG_FILE_PATH is never emitted.
  - it: KASM_LOG_FILE_PATH is never set on api
    template: templates/api-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_PATH")]

  - it: KASM_LOG_FILE_PATH is never set on guac
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name=="KASM_LOG_FILE_PATH")]

  # ---------- KASM_CLICKHOUSE_* on api only ----------
  - it: KASM_CLICKHOUSE_ENDPOINT present on api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_ENDPOINT")]

  - it: KASM_CLICKHOUSE_ENDPOINT absent on guac (no clickhouse env wired there)
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name=="KASM_CLICKHOUSE_ENDPOINT")]

  - it: KASM_CLICKHOUSE_ENDPOINT absent when there is no store (clickhouse disabled, not standalone)
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.enabled: false
      observability.collector.gateway.forward.endpoint: "https://otlp-gateway.example.com/otlp"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_ENDPOINT")]

  # ---------- KASM_CLICKHOUSE_USER: RO fallback/switch (bd kasm-helm-hvx) ----------
  - it: api KASM_CLICKHOUSE_USER defaults to kasm_otel_ro when the chart manages ClickHouse (D4)
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_USER" && @.value=="kasm_otel_ro")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: clickhouse-ro-password

  - it: api KASM_CLICKHOUSE_USER falls back to the writer username on a standalone external ClickHouse
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.standalone: true
      observability.clickhouse.nativeEndpoint: "tcp://ch.example.com:9440"
      observability.clickhouse.httpEndpoint: "https://ch.example.com:8443"
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_USER" && @.value=="kasm_otel")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: clickhouse-password

  - it: api switches to a custom RO user and RO secret key when readUsername is set
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_custom_ro
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_USER" && @.value=="kasm_otel_custom_ro")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: clickhouse-ro-password

  # ---------- KASM_CLICKHOUSE_PASSWORD key wiring: existingSecret + readUsername + readKey ----------
  - it: api uses the writer key for RO password when existingSecret is set and readKey is unset
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_ro
      observability.clickhouse.existingSecret.name: my-ch-secret
      observability.clickhouse.existingSecret.key: ch-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-ch-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: ch-pass

  - it: api uses readKey for RO password when existingSecret and readKey are both set
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_ro
      observability.clickhouse.existingSecret.name: my-ch-secret
      observability.clickhouse.existingSecret.key: ch-pass
      observability.clickhouse.existingSecret.readKey: ch-ro-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: ch-ro-pass

  # ---------- KASM_LOG_CONSOLE_COLOR ----------
  - it: KASM_LOG_CONSOLE_COLOR=false on api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_CONSOLE_COLOR" && @.value=="false")]

  - it: KASM_LOG_CONSOLE_COLOR=false on api even when observability is disabled
    template: templates/api-deployment.yaml
    set:
      observability.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_CONSOLE_COLOR" && @.value=="false")]

  - it: db Jobs running the api image disable file logging
    set:
      dbManagement.initialize: true
    templates:
      - templates/db-init-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED")].value
          value: "false"

  - it: db Jobs still disable file logging when observability is off
    set:
      dbManagement.initialize: true
      observability.enabled: false
    templates:
      - templates/db-init-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED")].value
          value: "false"

  # ---------- observability.collector.upstream override (kasm-helm-xc8 part 2) ----------
  # Redirects the non-sidecar senders (api, api-worker) at an external collector instead of the
  # local gateway. Default (empty) leaves them byte-identical to the pre-existing behaviour
  # already asserted above ("api exports straight to the gateway Service over HTTP, authenticated").
  - it: upstream.endpoint with a literal token redirects the api exporter's endpoint and bearer token
    template: templates/api-deployment.yaml
    set:
      observability.collector.upstream.endpoint: "http://otel-router.otel-router.svc.cluster.local:4318"
      observability.collector.upstream.token: "router-literal-token"
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://otel-router.otel-router.svc.cluster.local:4318")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://RELEASE-NAME-otel-gateway:4318")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_BEARER_TOKEN")].value
          value: "router-literal-token"
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_BEARER_TOKEN")].valueFrom
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_HEADERS" && @.value=="Authorization=Bearer $(OTEL_BEARER_TOKEN)")]

  - it: upstream.existingSecret redirects the api exporter's bearer token to that Secret, not a literal
    template: templates/api-deployment.yaml
    set:
      observability.collector.upstream.endpoint: "http://otel-router.otel-router.svc.cluster.local:4318"
      observability.collector.upstream.existingSecret.name: my-router-token
      observability.collector.upstream.existingSecret.key: token
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_BEARER_TOKEN")].valueFrom.secretKeyRef.name
          value: my-router-token
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_BEARER_TOKEN")].valueFrom.secretKeyRef.key
          value: token
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_BEARER_TOKEN")].value

  - it: upstream override also redirects the api-worker exporter (split mode)
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      observability.collector.upstream.endpoint: "http://otel-router.otel-router.svc.cluster.local:4318"
      observability.collector.upstream.token: "router-literal-token"
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://otel-router.otel-router.svc.cluster.local:4318")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_BEARER_TOKEN")].value
          value: "router-literal-token"

  - it: upstream override leaves the connection-proxy sidecar senders on the local gateway (unaffected)
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    set:
      observability.collector.upstream.endpoint: "http://otel-router.otel-router.svc.cluster.local:4318"
      observability.collector.upstream.token: "router-literal-token"
    asserts:
      - exists:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]
      - exists:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]
      - exists:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]

  - it: upstream.existingSecret requires both name and key
    template: templates/otel-gateway-deployment.yaml
    set:
      observability.collector.upstream.existingSecret.name: my-router-token
    asserts:
      - failedTemplate:
          errorMessage: "observability.collector.upstream.existingSecret requires both 'name' and 'key' to be set."
