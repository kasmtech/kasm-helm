suite: kasm.otelEnv — per-workload OTel/logging env vars

templates:
  - templates/api-deployment.yaml
  - templates/manager-deployment.yaml
  - templates/connection-proxy-statefulset.yaml
  - templates/db-init-job.yaml

tests:
  # ---------- OTEL_SERVICE_NAME per workload ----------
  - it: api container gets OTEL_SERVICE_NAME=kasm-api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-api")]

  - it: manager container gets OTEL_SERVICE_NAME=kasm-manager
    template: templates/manager-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-manager")]

  - it: guac application container gets OTEL_SERVICE_NAME=kasm-guac
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-guac")]

  - it: rdp-gateway application container gets OTEL_SERVICE_NAME=kasm-rdp-gateway
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-rdp-gateway")]

  - it: rdp-https-gateway application container gets OTEL_SERVICE_NAME=kasm-rdp-https-gateway
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_SERVICE_NAME" && @.value=="kasm-rdp-https-gateway")]

  # ---------- endpoint: forwarder Service for pods without a sidecar, loopback for pods with one ----------
  - it: api exports to the cluster-wide forwarder Service
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://RELEASE-NAME-otel-forwarder:4318")]

  # Zones no longer select an endpoint; there is one forwarder and zone identity travels as a
  # resource attribute on the telemetry instead.
  - it: api endpoint is identical in a multi-zone install
    template: templates/api-deployment.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    documentIndex: 0
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://RELEASE-NAME-otel-forwarder:4318")]
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_RESOURCE_ATTRIBUTES")].value
          pattern: "kasm\\.zone=zonea"

  - it: connection-proxy app containers carry kasm.zone in a multi-zone install
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
      - ../../../tests/values/components-all.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_RESOURCE_ATTRIBUTES")].value
          pattern: "kasm\\.zone=zonea"
      - matchRegex:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_RESOURCE_ATTRIBUTES")].value
          pattern: "kasm\\.zone=zonea"
      - matchRegex:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_RESOURCE_ATTRIBUTES")].value
          pattern: "kasm\\.zone=zonea"

  - it: api endpoint follows forwarder.externalEndpoint when set
    template: templates/api-deployment.yaml
    set:
      observability.collector.forwarder.externalEndpoint: http://alloy.observability:4318
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://alloy.observability:4318")]

  # Containers co-located with a sidecar export to it over loopback; the sidecar is the pod's
  # single egress point.
  - it: guac, rdp-gateway and rdp-https-gateway export to the pod-local sidecar
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]
      - exists:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]
      - exists:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT" && @.value=="http://localhost:4318")]

  # ---------- OTEL_PYTHON_EXCLUDED_URLS only on api+manager ----------
  - it: OTEL_PYTHON_EXCLUDED_URLS present on api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  - it: OTEL_PYTHON_EXCLUDED_URLS present on manager
    template: templates/manager-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  - it: OTEL_PYTHON_EXCLUDED_URLS absent on guac
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  - it: OTEL_PYTHON_EXCLUDED_URLS absent on rdp-gateway
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[2].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  - it: OTEL_PYTHON_EXCLUDED_URLS absent on rdp-https-gateway
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[3].env[?(@.name=="OTEL_PYTHON_EXCLUDED_URLS")]

  # ---------- KASM_LOG_FILE_ENABLED default false ----------
  - it: KASM_LOG_FILE_ENABLED=false by default on api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED" && @.value=="false")]

  # ---------- regression: KASM_LOG_FILE_ENABLED still emitted when observability.enabled=false ----------
  # This is the H2 amendment regression test: KASM_LOG_FILE_ENABLED is not an OTel setting.
  # kasm_telemetry defaults file logging to true and init_logging() mkdir/opens the log path, so
  # omitting this env var when observability is disabled would crash every workload at startup
  # under readOnlyRootFilesystem. Only OTEL_SDK_DISABLED should be gated on observability.enabled.
  - it: KASM_LOG_FILE_ENABLED=false is still emitted when observability.enabled=false (api)
    template: templates/api-deployment.yaml
    set:
      observability.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED" && @.value=="false")]
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_SDK_DISABLED" && @.value=="true")]

  - it: KASM_LOG_FILE_ENABLED=false is still emitted when observability.enabled=false (manager)
    template: templates/manager-deployment.yaml
    set:
      observability.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED" && @.value=="false")]

  - it: KASM_LOG_FILE_ENABLED=false is still emitted when observability.enabled=false (guac)
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    set:
      observability.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.containers[1].env[?(@.name=="KASM_LOG_FILE_ENABLED" && @.value=="false")]

  - it: only OTEL_SDK_DISABLED is emitted for the OTel-specific vars when observability is disabled
    template: templates/api-deployment.yaml
    set:
      observability.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_ENDPOINT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_SERVICE_NAME")]

  # ---------- file logging is always off ----------
  # Kasm services export logs over OTLP. A file-shaped copy inside the pod would store every line
  # twice, so KASM_LOG_FILE_ENABLED is false everywhere and KASM_LOG_FILE_PATH is never emitted.
  - it: KASM_LOG_FILE_PATH is never set on api
    template: templates/api-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_PATH")]

  - it: KASM_LOG_FILE_PATH is never set on guac
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name=="KASM_LOG_FILE_PATH")]

  # ---------- KASM_CLICKHOUSE_* on api+manager only ----------
  - it: KASM_CLICKHOUSE_ENDPOINT present on api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_ENDPOINT")]

  - it: KASM_CLICKHOUSE_ENDPOINT present on manager
    template: templates/manager-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_ENDPOINT")]

  - it: KASM_CLICKHOUSE_ENDPOINT absent on guac (no clickhouse env wired there)
    template: templates/connection-proxy-statefulset.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name=="KASM_CLICKHOUSE_ENDPOINT")]

  - it: KASM_CLICKHOUSE_ENDPOINT absent when there is no store (clickhouse disabled, not standalone)
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_ENDPOINT")]

  # ---------- KASM_CLICKHOUSE_USER: RO fallback/switch (bd kasm-helm-hvx) ----------
  - it: api KASM_CLICKHOUSE_USER defaults to kasm_otel_ro when the chart manages ClickHouse (D4)
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_USER" && @.value=="kasm_otel_ro")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: clickhouse-ro-password

  - it: manager KASM_CLICKHOUSE_USER defaults to kasm_otel_ro when the chart manages ClickHouse (D4)
    template: templates/manager-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_USER" && @.value=="kasm_otel_ro")]

  - it: api KASM_CLICKHOUSE_USER falls back to the writer username on a standalone external ClickHouse
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.standalone: true
      observability.clickhouse.nativeEndpoint: "tcp://ch.example.com:9440"
      observability.clickhouse.httpEndpoint: "https://ch.example.com:8443"
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_USER" && @.value=="kasm_otel")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: clickhouse-password

  - it: api switches to a custom RO user and RO secret key when readUsername is set
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_custom_ro
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_USER" && @.value=="kasm_otel_custom_ro")]
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: clickhouse-ro-password

  - it: manager switches to a custom RO user when readUsername is set
    template: templates/manager-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_custom_ro
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_USER" && @.value=="kasm_otel_custom_ro")]

  # ---------- KASM_CLICKHOUSE_PASSWORD key wiring: existingSecret + readUsername + readKey ----------
  - it: api uses the writer key for RO password when existingSecret is set and readKey is unset
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_ro
      observability.clickhouse.existingSecret.name: my-ch-secret
      observability.clickhouse.existingSecret.key: ch-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-ch-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: ch-pass

  - it: api uses readKey for RO password when existingSecret and readKey are both set
    template: templates/api-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_ro
      observability.clickhouse.existingSecret.name: my-ch-secret
      observability.clickhouse.existingSecret.key: ch-pass
      observability.clickhouse.existingSecret.readKey: ch-ro-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: ch-ro-pass

  - it: manager uses the writer key for RO password when existingSecret is set and readKey is unset
    template: templates/manager-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_ro
      observability.clickhouse.existingSecret.name: my-ch-secret
      observability.clickhouse.existingSecret.key: ch-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-ch-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: ch-pass

  - it: manager uses readKey for RO password when existingSecret and readKey are both set
    template: templates/manager-deployment.yaml
    set:
      observability.clickhouse.readUsername: kasm_otel_ro
      observability.clickhouse.existingSecret.name: my-ch-secret
      observability.clickhouse.existingSecret.key: ch-pass
      observability.clickhouse.existingSecret.readKey: ch-ro-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_CLICKHOUSE_PASSWORD")].valueFrom.secretKeyRef.key
          value: ch-ro-pass


  # ---------- KASM_LOG_CONSOLE_COLOR ----------
  - it: KASM_LOG_CONSOLE_COLOR=false on api
    template: templates/api-deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_CONSOLE_COLOR" && @.value=="false")]

  - it: KASM_LOG_CONSOLE_COLOR=false on api even when observability is disabled
    template: templates/api-deployment.yaml
    set:
      observability.enabled: false
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_CONSOLE_COLOR" && @.value=="false")]

  - it: db Jobs running the api image disable file logging
    set:
      dbManagement.initialize: true
    templates:
      - templates/db-init-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED")].value
          value: "false"

  - it: db Jobs still disable file logging when observability is off
    set:
      dbManagement.initialize: true
      observability.enabled: false
    templates:
      - templates/db-init-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_LOG_FILE_ENABLED")].value
          value: "false"
