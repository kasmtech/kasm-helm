suite: apiWorkerMode + api-worker pools (kasm-helm-37c)
# combined (default): every API replica keeps consuming BullMQ queues (KASM_PROCESS=TRUE),
# no separate worker Deployment. split: API replicas stop consuming (KASM_PROCESS=FALSE) and
# templates/api-worker-deployment.yaml renders one Deployment per pool per zone instead.

templates:
  - templates/api-deployment.yaml
  - templates/api-worker-deployment.yaml

tests:
  # ---------- combined (default) ----------
  - it: combined mode sets KASM_PROCESS=TRUE on the api container
    template: templates/api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_PROCESS
            value: "TRUE"

  - it: combined mode renders no api-worker deployments
    template: templates/api-worker-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ---------- D018: terminationGracePeriodSeconds follows KASM_PROCESS ----------
  - it: combined mode api deployment sets terminationGracePeriodSeconds 80 (consumes queues)
    template: templates/api-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 80

  - it: split mode api deployment has no terminationGracePeriodSeconds override (publish-only, keeps k8s default)
    template: templates/api-deployment.yaml
    set:
      apiWorkerMode: split
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds

  # ---------- split ----------
  - it: split mode sets KASM_PROCESS=FALSE on the api container
    template: templates/api-deployment.yaml
    set:
      apiWorkerMode: split
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_PROCESS
            value: "FALSE"

  - it: split mode renders one worker deployment for the default pool, named with the pool slug
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: "^.*-api-worker-default-default$"

  - it: split mode worker container sets KASM_PROCESS=TRUE, KASM_WORKER_QUEUES, and shutdown timeout
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      components:
        apiWorker:
          pools:
            - name: media
              queues: "media,thumbnails"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_PROCESS
            value: "TRUE"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_WORKER_QUEUES
            value: "media,thumbnails"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_WORKER_SHUTDOWN_TIMEOUT
            value: "60"

  - it: split mode worker renders KASM_WORKER_QUEUE_CONCURRENCY as JSON when set
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      components:
        apiWorker:
          pools:
            - name: default
              queueConcurrency:
                sessions: 5
                thumbnails: 2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KASM_WORKER_QUEUE_CONCURRENCY
            value: '{"sessions":5,"thumbnails":2}'

  - it: split mode worker omits KASM_WORKER_QUEUE_CONCURRENCY when not set
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="KASM_WORKER_QUEUE_CONCURRENCY")]

  - it: split mode worker sets terminationGracePeriodSeconds 80
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 80

  # ---------- probes ----------
  - it: api liveness probe uses /livez on the new liveness port; readiness stays on the api port
    template: templates/api-deployment.yaml
    set:
      applyHealthChecks: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: "/livez"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: api-live-pt
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: "/api/__healthcheck"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: api-pt

  - it: worker liveness probe uses /livez; readiness uses /api/__healthcheck (workers run the full API)
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      applyHealthChecks: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: "/livez"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: api-live-pt
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: "/api/__healthcheck"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: api-pt

  # ---------- replicas / resources ----------
  - it: pool.replicas 0 falls back to the deploymentSize (api) preset
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      deploymentSize: large
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: pool.replicas explicit value overrides the preset
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      components:
        apiWorker:
          pools:
            - name: default
              replicas: 7
    asserts:
      - equal:
          path: spec.replicas
          value: 7

  - it: pool.resources overrides components.apiWorker.resources and the api preset
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      components:
        apiWorker:
          resources:
            requests:
              cpu: "111m"
          pools:
            - name: default
              resources:
                requests:
                  cpu: "999m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "999m"

  - it: components.apiWorker.resources overrides the api preset when no pool override is set
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      components:
        apiWorker:
          resources:
            requests:
              cpu: "111m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "111m"

  # ---------- multi-zone x multi-pool fan-out ----------
  - it: two pools x two zones renders four worker deployments, one per (pool, zone) pair
    template: templates/api-worker-deployment.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    set:
      apiWorkerMode: split
      proxyService:
        type: ClusterIP
      ingress:
        enabled: true
      components:
        apiWorker:
          pools:
            - name: sessions
              replicas: 1
            - name: media
              replicas: 1
    asserts:
      - hasDocuments:
          count: 4

  # Selector/pod-label agreement is load-bearing (D013): a Deployment whose selector doesn't
  # match its own pods' labels never becomes ready, and if two pool-zone Deployments share a
  # selector each adopts the other's pods. documentIndex order follows the template's range
  # nesting: pools (sessions, media) outer, zones (zonea, zoneb) inner, per multizone-config.yaml.
  # One `it:` per document is required: helm-unittest's documentIndex scopes an entire test to
  # one rendered document, not individual asserts within it.
  - it: worker deployment 0 (sessions/zonea) selector matches its own pod labels, distinct name
    template: templates/api-worker-deployment.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/multizone-config.yaml
    set:
      apiWorkerMode: split
      proxyService:
        type: ClusterIP
      ingress:
        enabled: true
      components:
        apiWorker:
          pools:
            - name: sessions
              replicas: 1
            - name: media
              replicas: 1
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-worker-sessions-zonea
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-worker-sessions-zonea
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: api-worker
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: api-worker

  - it: worker deployment 1 (sessions/zoneb) selector matches its own pod labels, distinct name
    template: templates/api-worker-deployment.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/multizone-config.yaml
    set:
      apiWorkerMode: split
      proxyService:
        type: ClusterIP
      ingress:
        enabled: true
      components:
        apiWorker:
          pools:
            - name: sessions
              replicas: 1
            - name: media
              replicas: 1
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-worker-sessions-zoneb
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-worker-sessions-zoneb

  - it: worker deployment 2 (media/zonea) selector matches its own pod labels, distinct name
    template: templates/api-worker-deployment.yaml
    documentIndex: 2
    values:
      - ../../../tests/values/multizone-config.yaml
    set:
      apiWorkerMode: split
      proxyService:
        type: ClusterIP
      ingress:
        enabled: true
      components:
        apiWorker:
          pools:
            - name: sessions
              replicas: 1
            - name: media
              replicas: 1
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-worker-media-zonea
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-worker-media-zonea

  - it: worker deployment 3 (media/zoneb) selector matches its own pod labels, distinct name
    template: templates/api-worker-deployment.yaml
    documentIndex: 3
    values:
      - ../../../tests/values/multizone-config.yaml
    set:
      apiWorkerMode: split
      proxyService:
        type: ClusterIP
      ingress:
        enabled: true
      components:
        apiWorker:
          pools:
            - name: sessions
              replicas: 1
            - name: media
              replicas: 1
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-worker-media-zoneb
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-api-worker-media-zoneb

  # ---------- extras merge reaches the worker ----------
  - it: components.apiWorker.extraEnv lands on the worker container
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      components:
        apiWorker:
          extraEnv:
            - name: WORKER_ONLY
              value: "worker"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKER_ONLY
            value: "worker"

  # ---------- schema negatives ----------
  - it: schema rejects an apiWorkerMode outside combined/split
    template: templates/api-deployment.yaml
    set:
      apiWorkerMode: bogus
    asserts:
      - failedTemplate:
          errorPattern: "apiWorkerMode.*value must be one of 'combined', 'split'"

  - it: split with an explicitly empty pools list fails render with a clear message
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      # A flattened dotted key is required here: helm-unittest's nested-dict `set` merges via
      # mergo, which does not let an empty list override the non-empty values.yaml default.
      components.apiWorker.pools: []
    asserts:
      - failedTemplate:
          errorPattern: "apiWorkerMode: split requires at least one entry in components\\.apiWorker\\.pools"

  - it: duplicate normalized pool names fail render with a clear message
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      components:
        apiWorker:
          pools:
            - name: sessions
            - name: "Sessions"
    asserts:
      - failedTemplate:
          errorPattern: 'components\.apiWorker\.pools has duplicate normalized name "sessions" \(pool "Sessions" collides with an earlier pool\)'

  - it: schema rejects a pool missing name
    template: templates/api-worker-deployment.yaml
    set:
      apiWorkerMode: split
      components:
        apiWorker:
          pools:
            - queues: "all"
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'name'"
