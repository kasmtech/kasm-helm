suite: guac recording storage

templates:
  - templates/guac-statefulset.yaml

tests:
  - it: recording storage is a volumeClaimTemplate named tmp-data
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: tmp-data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  - it: pvcSize override is reflected in the volumeClaimTemplate
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        guac:
          recordingData:
            pvcSize: 25
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 25Gi

  - it: storageClassName override is reflected in the volumeClaimTemplate
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        guac:
          recordingData:
            storageClassName: fast-ssd
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: fast-ssd

  - it: guac container mounts the tmp-data claim at /tmp
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp-data
            mountPath: /tmp
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="tmp-data")]
