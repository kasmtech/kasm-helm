suite: guac recording storage
# Retargeted to the consolidated connection-proxy StatefulSet's volumeClaimTemplates.
# guac's tmp-data PVC is the reason connection-proxy is a StatefulSet even ignoring the
# per-pod-identity requirement shared with rdp-https-gateway.

templates:
  - templates/connection-proxy-statefulset.yaml

tests:
  - it: recording storage is a volumeClaimTemplate named tmp-data
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: tmp-data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  - it: pvcSize override is reflected in the volumeClaimTemplate
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        connectionProxy:
          guac:
            recordingData:
              pvcSize: 25
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 25Gi

  - it: storageClassName override is reflected in the volumeClaimTemplate
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        connectionProxy:
          guac:
            recordingData:
              storageClassName: fast-ssd
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: fast-ssd

  - it: guac container mounts the tmp-data claim at /tmp, and it is not also declared as a pod volume
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: tmp-data
            mountPath: /tmp
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="tmp-data")]

  - it: volumeClaimTemplates is absent entirely when guac is disabled, even if other services remain enabled
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
