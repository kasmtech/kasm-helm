suite: optional components
templates:
  - templates/guac-service.yaml
  - templates/rdp-gateway-service.yaml
  - templates/rdp-https-gateway-service.yaml
  - templates/guac-statefulset.yaml
  - templates/rdp-gateway-deployment.yaml
  - templates/rdp-https-gateway-statefulset.yaml

tests:
  - it: does not render optional services or statefulsets when disabled
    set:
      components:
        guac:
          enabled: false
        rdpGateway:
          enabled: false
        rdpHttpsGateway:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders guac service as headless when enabled
    template: templates/guac-service.yaml
    set:
      components:
        guac:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None

  - it: renders guac statefulset when enabled
    template: templates/guac-statefulset.yaml
    set:
      components:
        guac:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet

  - it: renders rdp gateway service when enabled
    template: templates/rdp-gateway-service.yaml
    set:
      components:
        rdpGateway:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service

  - it: renders rdp gateway deployment when enabled
    template: templates/rdp-gateway-deployment.yaml
    set:
      components:
        rdpGateway:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: renders rdp HTTPS gateway service when enabled
    template: templates/rdp-https-gateway-service.yaml
    set:
      components:
        rdpHttpsGateway:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service

  - it: renders rdp HTTPS gateway statefulset when enabled
    template: templates/rdp-https-gateway-statefulset.yaml
    set:
      components:
        rdpHttpsGateway:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet
