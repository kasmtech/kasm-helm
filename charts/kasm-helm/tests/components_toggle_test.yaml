suite: connection-proxy component toggles
# guac/rdp-gateway/rdp-https-gateway used to be three independent workloads, each with its own
# Service + Deployment/StatefulSet. They are now three optional containers inside one
# connection-proxy StatefulSet, fronted by one headless Service and backed by one set of
# ConfigMaps. Disabling any single service no longer zeroes out the whole workload — only
# disabling all three (or connectionProxy itself) does. Deeper per-service toggle behavior
# (container/volume/nginx-location removal) is covered in connection_proxy_test.yaml.

templates:
  - templates/connection-proxy-statefulset.yaml
  - templates/connection-proxy-services.yaml
  - templates/connection-proxy-configmaps.yaml

tests:
  - it: does not render the StatefulSet, Services, or ConfigMaps when all three services are disabled
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
          rdpGateway:
            enabled: false
          rdpHttpsGateway:
            enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render the StatefulSet, Services, or ConfigMaps when connectionProxy.enabled is false
    set:
      components:
        connectionProxy:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the StatefulSet when only guac is enabled
    template: templates/connection-proxy-statefulset.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: true
          rdpGateway:
            enabled: false
          rdpHttpsGateway:
            enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet

  - it: renders the headless Service when only guac is enabled
    template: templates/connection-proxy-services.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: true
          rdpGateway:
            enabled: false
          rdpHttpsGateway:
            enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service

  - it: renders ConfigMaps when only guac is enabled
    template: templates/connection-proxy-configmaps.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: true
          rdpGateway:
            enabled: false
          rdpHttpsGateway:
            enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: renders the StatefulSet when only rdpGateway is enabled
    template: templates/connection-proxy-statefulset.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
          rdpGateway:
            enabled: true
          rdpHttpsGateway:
            enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet

  - it: renders the headless Service when only rdpGateway is enabled
    template: templates/connection-proxy-services.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
          rdpGateway:
            enabled: true
          rdpHttpsGateway:
            enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service

  - it: renders ConfigMaps when only rdpGateway is enabled
    template: templates/connection-proxy-configmaps.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
          rdpGateway:
            enabled: true
          rdpHttpsGateway:
            enabled: false
    asserts:
      - hasDocuments:
          count: 3

  - it: renders the StatefulSet when only rdpHttpsGateway is enabled
    template: templates/connection-proxy-statefulset.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
          rdpGateway:
            enabled: false
          rdpHttpsGateway:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet

  - it: renders the headless Service when only rdpHttpsGateway is enabled
    template: templates/connection-proxy-services.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
          rdpGateway:
            enabled: false
          rdpHttpsGateway:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service

  - it: renders ConfigMaps when only rdpHttpsGateway is enabled
    template: templates/connection-proxy-configmaps.yaml
    set:
      components:
        connectionProxy:
          guac:
            enabled: false
          rdpGateway:
            enabled: false
          rdpHttpsGateway:
            enabled: true
    asserts:
      - hasDocuments:
          count: 2
