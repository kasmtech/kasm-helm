suite: guac nginx configmaps

templates:
  - templates/guac-nginx-configmap.yaml
  - templates/nginx-shared-configmap.yaml

tests:
  - it: renders two ConfigMaps when guac is enabled
    template: templates/guac-nginx-configmap.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: first document is guac-settings ConfigMap
    template: templates/guac-nginx-configmap.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-guac-nginx-settings

  - it: guac-settings has orchestrator.conf listening on 9000
    template: templates/guac-nginx-configmap.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - matchRegex:
          path: data["orchestrator.conf"]
          pattern: "listen 9000"

  - it: guac-settings has upstream_kasm_guac.conf with localhost servers
    template: templates/guac-nginx-configmap.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - matchRegex:
          path: data["upstream_kasm_guac.conf"]
          pattern: "server 127\\.0\\.0\\.1:3000"
      - matchRegex:
          path: data["upstream_kasm_guac.conf"]
          pattern: "server 127\\.0\\.0\\.1:3004"

  - it: second document is guac-services ConfigMap
    template: templates/guac-nginx-configmap.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-guac-services

  - it: guac-services has kasmguac.conf referencing kasm_guac upstream
    template: templates/guac-nginx-configmap.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - matchRegex:
          path: data["kasmguac.conf"]
          pattern: "kasm_guac"

  - it: kasmguac.conf does not reference the guac service name directly
    template: templates/guac-nginx-configmap.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - notMatchRegex:
          path: data["kasmguac.conf"]
          pattern: "RELEASE-NAME-guac"

  - it: does not render when guac is disabled
    template: templates/guac-nginx-configmap.yaml
    set:
      components:
        guac:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: nginx-shared ConfigMap is always rendered
    template: templates/nginx-shared-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-shared

  - it: nginx-shared has compress.conf
    template: templates/nginx-shared-configmap.yaml
    asserts:
      - exists:
          path: data["compress.conf"]

  - it: nginx-shared has logging.conf
    template: templates/nginx-shared-configmap.yaml
    asserts:
      - exists:
          path: data["logging.conf"]

  - it: nginx-shared has shared map blocks in orchestrator.conf
    template: templates/nginx-shared-configmap.yaml
    asserts:
      - matchRegex:
          path: data["orchestrator.conf"]
          pattern: "x_forwarded_proto"
      - matchRegex:
          path: data["orchestrator.conf"]
          pattern: "real_request_port"

  - it: guac-settings does not contain compress.conf or logging.conf
    template: templates/guac-nginx-configmap.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - notExists:
          path: data["compress.conf"]
      - notExists:
          path: data["logging.conf"]
