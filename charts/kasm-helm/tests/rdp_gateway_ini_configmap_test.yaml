suite: connection-proxy rdp-gateway custom rdpproxy.ini mount
# Retargeted: the rdp-gateway container (containers[2] with all three services enabled, per
# components-all.yaml) now lives inside the connection-proxy StatefulSet.

templates:
  - templates/connection-proxy-statefulset.yaml

tests:
  - it: does not mount rdpproxy.ini when iniConfigMapName is unset
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[2].volumeMounts
          any: true
          content:
            name: kasm-connection-proxy-rdp-gateway-ini
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: kasm-connection-proxy-rdp-gateway-ini

  - it: mounts rdpproxy.ini from the named ConfigMap when iniConfigMapName is set
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        connectionProxy:
          rdpGateway:
            iniConfigMapName: my-rdpproxy-ini
    asserts:
      - contains:
          path: spec.template.spec.containers[2].volumeMounts
          content:
            name: kasm-connection-proxy-rdp-gateway-ini
            mountPath: /usr/local/etc/rdpproxy/conf/rdpproxy.ini
            subPath: rdpproxy.ini
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kasm-connection-proxy-rdp-gateway-ini
            configMap:
              name: my-rdpproxy-ini
              items:
                - key: rdpproxy.ini
                  path: rdpproxy.ini

  - it: existing passthrough config volume is not affected when iniConfigMapName is set
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        connectionProxy:
          rdpGateway:
            iniConfigMapName: my-rdpproxy-ini
    asserts:
      - contains:
          path: spec.template.spec.containers[2].volumeMounts
          content:
            name: kasm-connection-proxy-rdp-gateway-config
            mountPath: /usr/local/etc/rdpproxy/conf/passthrough.app.config.yaml
            subPath: passthrough.app.config.yaml

  - it: passthrough config volume references the connection-proxy rdp-gateway-app-config ConfigMap
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kasm-connection-proxy-rdp-gateway-config
            configMap:
              name: RELEASE-NAME-cpx-rdp-gw-app-config
