suite: serviceAccount (components.api / components.manager)

templates:
  - templates/serviceaccount.yaml
  - templates/api-deployment.yaml
  - templates/manager-deployment.yaml

tests:
  - it: default renders no ServiceAccount
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: default sets no serviceAccountName on api/manager pods
    templates:
      - templates/api-deployment.yaml
      - templates/manager-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.serviceAccountName

  - it: name-only reference renders no ServiceAccount object
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        name: existing-sa
    asserts:
      - hasDocuments:
          count: 0

  - it: name-only reference sets serviceAccountName on api/manager pods
    templates:
      - templates/api-deployment.yaml
      - templates/manager-deployment.yaml
    set:
      serviceAccount:
        name: existing-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa

  - it: global create=true renders exactly one ServiceAccount shared by both components
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: kasm-app

  - it: global create=true wires the shared name into both api and manager pods
    templates:
      - templates/api-deployment.yaml
      - templates/manager-deployment.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kasm-app

  - it: per-component override renders two ServiceAccounts
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
      components:
        api:
          serviceAccount:
            name: api-sa
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/kasm-api
    asserts:
      - hasDocuments:
          count: 2

  - it: per-component override's ServiceAccount has its own name and annotations
    template: templates/serviceaccount.yaml
    documentIndex: 0
    set:
      serviceAccount:
        create: true
        name: kasm-app
      components:
        api:
          serviceAccount:
            name: api-sa
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/kasm-api
    asserts:
      - equal:
          path: metadata.name
          value: api-sa
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/kasm-api

  - it: the shared global name still gets its own ServiceAccount alongside the override
    template: templates/serviceaccount.yaml
    documentIndex: 1
    set:
      serviceAccount:
        create: true
        name: kasm-app
      components:
        api:
          serviceAccount:
            name: api-sa
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/kasm-api
    asserts:
      - equal:
          path: metadata.name
          value: kasm-app

  - it: per-component override wires api to its own name
    template: templates/api-deployment.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
      components:
        api:
          serviceAccount:
            name: api-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: api-sa

  - it: per-component override leaves manager on the global name
    template: templates/manager-deployment.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
      components:
        api:
          serviceAccount:
            name: api-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kasm-app

  - it: api and manager resolving to the same name dedupe to a single ServiceAccount
    template: templates/serviceaccount.yaml
    set:
      components:
        api:
          serviceAccount:
            create: true
            name: shared-sa
        manager:
          serviceAccount:
            create: true
            name: shared-sa
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: shared-sa
          # documentIndex omitted: hasDocuments already proved there is exactly one document

  - it: component annotation beats a colliding global annotation
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/global
      components:
        api:
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/api-specific
        manager:
          serviceAccount:
            create: false
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/api-specific

  - it: dedupe merges non-colliding annotations from both components onto the shared ServiceAccount
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
      components:
        manager:
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/manager
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/manager

  - it: dedupe fails the render when api and manager disagree on the same annotation key
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
      components:
        api:
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/api
        manager:
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/manager
    asserts:
      - failedTemplate:
          errorMessage: 'serviceAccount "kasm-app": components.manager.serviceAccount.annotations sets annotation "eks.amazonaws.com/role-arn" to "arn:aws:iam::123456789012:role/manager", but components.api.serviceAccount.annotations already set it to "arn:aws:iam::123456789012:role/api"'

  - it: conflict message attributes an inherited value to the global block, not the component that merely inherited it
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/global
      components:
        manager:
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/manager-specific
    asserts:
      - failedTemplate:
          errorMessage: 'serviceAccount "kasm-app": components.manager.serviceAccount.annotations sets annotation "eks.amazonaws.com/role-arn" to "arn:aws:iam::123456789012:role/manager-specific", but serviceAccount.annotations already set it to "arn:aws:iam::123456789012:role/global"'

  - it: create=true with no resolvable name fails the render instead of silently rendering nothing
    template: templates/serviceaccount.yaml
    set:
      components:
        api:
          serviceAccount:
            create: true
    asserts:
      - failedTemplate:
          errorMessage: "components.api.serviceAccount.create is true but no name resolved (set serviceAccount.name or components.api.serviceAccount.name)"

  - it: extraAnnotations.serviceAccount and extraLabels.serviceAccount apply to the rendered ServiceAccount
    template: templates/serviceaccount.yaml
    set:
      serviceAccount:
        create: true
        name: kasm-app
      extraAnnotations:
        serviceAccount:
          example.com/extra: "true"
      extraLabels:
        serviceAccount:
          example.com/team: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/extra"]
          value: "true"
      - equal:
          path: metadata.labels["example.com/team"]
          value: platform
