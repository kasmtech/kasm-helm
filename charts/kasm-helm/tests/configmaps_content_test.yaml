suite: configmap content rendering

templates:
  - templates/db-configmap.yaml
  - templates/rdp-gateway-configmap.yaml
  - templates/rdp-gateway-nginx-configmap.yaml
  - templates/rdp-https-gateway-nginx-configmap.yaml
  - templates/proxy-configmaps.yaml
  - templates/proxy-deployment.yaml

tests:
  # ---------- db-configmap ----------
  - it: db configmap is not rendered when database.standalone=true
    template: templates/db-configmap.yaml
    values:
      - ../../../tests/values/external-db.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: db configmap renders pg_hba.conf and postgresql.conf keys
    template: templates/db-configmap.yaml
    asserts:
      - exists:
          path: data["pg_hba.conf"]
      - exists:
          path: data["postgresql.conf"]
      - exists:
          path: data["data.sql"]

  - it: db configmap sets max_connections=200 for small deployments
    template: templates/db-configmap.yaml
    set:
      deploymentSize: small
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "max_connections = 200"

  - it: db configmap scales max_connections by zone count for medium
    template: templates/db-configmap.yaml
    set:
      deploymentSize: medium
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "max_connections = 400"

  - it: db configmap enables ssl
    template: templates/db-configmap.yaml
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "ssl = on"

  # ---------- rdp gateway configmap ----------
  - it: rdp gateway configmap is not rendered when rdpGateway disabled
    template: templates/rdp-gateway-configmap.yaml
    set:
      components:
        rdpGateway:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rdp gateway configmap renders passthrough config key
    template: templates/rdp-gateway-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - exists:
          path: data["passthrough.app.config.yaml"]
      - matchRegex:
          path: data["passthrough.app.config.yaml"]
          pattern: "rdp-gateway:"

  # ---------- rdp-gateway-nginx-configmap (settings + services) ----------
  - it: rdp gateway nginx settings configmap defines a local upstream for rdp_gateway
    template: templates/rdp-gateway-nginx-configmap.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["upstream_kasm_rdp_gateway.conf"]
          pattern: 'upstream rdp_gateway \{'
      - matchRegex:
          path: data["upstream_kasm_rdp_gateway.conf"]
          pattern: 'server 127\.0\.0\.1:'

  - it: rdp gateway nginx services configmap proxies rdp-gateway locations to rdp_gateway upstream
    template: templates/rdp-gateway-nginx-configmap.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["rdp_gateway.conf"]
          pattern: 'location /rdp-gateway/'
      - matchRegex:
          path: data["rdp_gateway.conf"]
          pattern: 'proxy_pass\s+http://rdp_gateway/'

  # KASM-8502: the Kasm api unconditionally POSTs /guac/vm_disconnect to whichever
  # connection_proxy owns the kasm. For the rdp-gateway that path used to be
  # cross-proxied to guac (which raised KeyError: 'Content-Type'); it now short-
  # circuits to 200. Lock that in so the cross-pod proxy_pass workaround can't creep back.
  - it: rdp gateway nginx services configmap short-circuits /guac/vm_disconnect to 200
    template: templates/rdp-gateway-nginx-configmap.yaml
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data["rdp_gateway.conf"]
          pattern: 'location /guac/vm_disconnect \{\s*return 200;'
      - notMatchRegex:
          path: data["rdp_gateway.conf"]
          pattern: 'proxy_pass\s+http://kasm_guac'

  # The proxy pod's wait-for-rdp-gateway init container probes
  # http://<rdp-gateway-svc>:<nginxPort>/__healthcheck — so the sidecar MUST
  # expose that location and route it to the rdp_gateway upstream (the
  # app on 127.0.0.1:5555). Without this, proxy stays in Init forever and the
  # 5555 app port has to be put back on the Service, which is what we're
  # trying to avoid.
  - it: rdp gateway nginx services configmap exposes /__healthcheck proxying to the rdp_gateway upstream
    template: templates/rdp-gateway-nginx-configmap.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["rdp_gateway.conf"]
          pattern: 'location = /__healthcheck'
      - matchRegex:
          path: data["rdp_gateway.conf"]
          pattern: 'proxy_pass\s+http://rdp_gateway/__healthcheck;'

  # ---------- rdp-https-gateway-nginx-configmap (settings + services) ----------
  - it: rdp https gateway settings configmap defines a local upstream for kasm_rdp_https_gateway
    template: templates/rdp-https-gateway-nginx-configmap.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["upstream_kasm_rdp_https_gateway.conf"]
          pattern: 'upstream kasm_rdp_https_gateway \{'
      - matchRegex:
          path: data["upstream_kasm_rdp_https_gateway.conf"]
          pattern: 'server 127\.0\.0\.1:'

  - it: rdp https gateway services configmap proxies rdp-https-gateway and remoteDesktopGateway locations
    template: templates/rdp-https-gateway-nginx-configmap.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["rdp_https_gateway.conf"]
          pattern: 'location /rdp-https-gateway/'
      - matchRegex:
          path: data["rdp_https_gateway.conf"]
          pattern: 'proxy_pass\s+https://127\.0\.0\.1:9443;'

  # KASM-8502 (same rationale as rdp-gateway): the rdp-https-gateway must answer
  # /guac/vm_disconnect with 200 rather than cross-proxying to guac.
  - it: rdp https gateway services configmap short-circuits /guac/vm_disconnect to 200
    template: templates/rdp-https-gateway-nginx-configmap.yaml
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data["rdp_https_gateway.conf"]
          pattern: 'location /guac/vm_disconnect \{\s*return 200;'
      - notMatchRegex:
          path: data["rdp_https_gateway.conf"]
          pattern: 'proxy_pass\s+http://kasm_guac'

  # ---------- proxy configmaps ----------
  - it: proxy configmaps render at least one ConfigMap document
    template: templates/proxy-configmaps.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: proxy configmaps all have kind ConfigMap
    template: templates/proxy-configmaps.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap

  - it: proxy configmap fans out per zone in multizone deployments
    template: templates/proxy-configmaps.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 3
