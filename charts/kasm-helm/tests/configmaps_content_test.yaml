suite: configmap content rendering

templates:
  - templates/db-configmap.yaml
  - templates/connection-proxy-configmaps.yaml
  - templates/proxy-configmaps.yaml
  - templates/proxy-deployment.yaml

tests:
  # ---------- db-configmap ----------
  - it: db configmap is not rendered when database.standalone=true
    template: templates/db-configmap.yaml
    values:
      - ../../../tests/values/external-db.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: db configmap renders pg_hba.conf and postgresql.conf keys
    template: templates/db-configmap.yaml
    asserts:
      - exists:
          path: data["pg_hba.conf"]
      - exists:
          path: data["postgresql.conf"]
      - exists:
          path: data["data.sql"]

  - it: db configmap sets max_connections=200 for small deployments
    template: templates/db-configmap.yaml
    set:
      deploymentSize: small
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "max_connections = 200"

  - it: db configmap scales max_connections by zone count for medium
    template: templates/db-configmap.yaml
    set:
      deploymentSize: medium
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "max_connections = 400"

  - it: db configmap enables ssl
    template: templates/db-configmap.yaml
    asserts:
      - matchRegex:
          path: data["postgresql.conf"]
          pattern: "ssl = on"

  # ---------- connection-proxy-configmaps: rdp-gateway app-config ----------
  - it: rdp gateway app-config configmap is not rendered when connectionProxy.rdpGateway disabled
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      components:
        connectionProxy:
          rdpGateway:
            enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: rdp gateway app-config configmap renders passthrough config key
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: ConfigMap
      - exists:
          path: data["passthrough.app.config.yaml"]
      - matchRegex:
          path: data["passthrough.app.config.yaml"]
          pattern: "rdp-gateway:"

  # ---------- connection-proxy-nginx-settings (documentIndex 0) ----------
  - it: connection-proxy nginx settings configmap defines a local upstream for rdp_gateway
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["upstreams.conf"]
          pattern: 'upstream rdp_gateway \{'
      - matchRegex:
          path: data["upstreams.conf"]
          pattern: 'server 127\.0\.0\.1:'

  - it: connection-proxy nginx settings configmap defines a local upstream for kasm_rdp_https_gateway
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["upstreams.conf"]
          pattern: 'upstream kasm_rdp_https_gateway \{'
      - matchRegex:
          path: data["upstreams.conf"]
          pattern: 'server 127\.0\.0\.1:'

  # ---------- connection-proxy-services (documentIndex 1) ----------
  - it: connection-proxy services configmap proxies rdp-gateway locations to rdp_gateway upstream
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'location /rdp-gateway/'
      - matchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'proxy_pass\s+http://rdp_gateway/'

  - it: connection-proxy services configmap proxies rdp-https-gateway and remoteDesktopGateway locations to the kasm_rdp_https_gateway upstream
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'location /rdp-https-gateway/'
      - matchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'proxy_pass\s+https://kasm_rdp_https_gateway;'

  # KASM-8502: the Kasm api unconditionally POSTs /guac/vm_disconnect to whichever
  # connection_proxy owns the kasm. For the rdp-gateway/rdp-https-gateway containers
  # that path used to be cross-proxied to guac (which raised KeyError: 'Content-Type');
  # it now short-circuits to 200. Lock that in so the cross-pod proxy_pass workaround
  # can't creep back.
  - it: connection-proxy services configmap short-circuits /guac/vm_disconnect to 200
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'location /guac/vm_disconnect \{\s*return 200;'
      - notMatchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'proxy_pass\s+http://kasm_guac.*vm_disconnect'

  # The nginx container's own pod-readiness endpoint now answers /__healthcheck
  # directly (this replaces the old cross-proxy to the rdp-gateway app on :5555).
  # The in-cluster health probe for the rdp-gateway app specifically lives at
  # /rdp-gateway/__healthcheck instead, routed to the rdp_gateway upstream.
  - it: connection-proxy services configmap answers its own /__healthcheck directly
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'location = /__healthcheck \{\s*access_log off;\s*return 200 "OK\\n";'

  - it: connection-proxy services configmap exposes /rdp-gateway/__healthcheck proxying to the rdp_gateway upstream
    template: templates/connection-proxy-configmaps.yaml
    values:
      - ../../../tests/values/components-all.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'location = /rdp-gateway/__healthcheck'
      - matchRegex:
          path: data["connection_proxy.conf"]
          pattern: 'proxy_pass\s+http://rdp_gateway/__healthcheck;'

  # ---------- proxy configmaps (unrelated component, unchanged) ----------
  - it: proxy configmaps render at least one ConfigMap document
    template: templates/proxy-configmaps.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: proxy configmaps all have kind ConfigMap
    template: templates/proxy-configmaps.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap

  - it: proxy configmap fans out per zone in multizone deployments
    template: templates/proxy-configmaps.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 3
