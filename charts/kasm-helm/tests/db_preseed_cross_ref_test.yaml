suite: db preseed cross-reference resolution
templates:
  - templates/db-preseed-secret.yaml

tests:

  - it: images zone_name resolves zone_id from kasmZones
    set:
      publicAddr: kasm.example.com
      kasmConfig.generatePreseed: true
      kasmConfig.defaultUsers: false
      kasmZones:
        - name: my-zone
          proxyAddress: kasm.example.com
          primary: true
      certificate.secretName: kasm-tls
      dbManagement.initialize: true
      kasmConfig.config.images:
        - name: "kasmweb/ubuntu-focal-desktop"
          zone_name: "my-zone"
    asserts:
      - documentIndex: 1
        matchRegex:
          path: stringData["custom_properties.yaml"]
          pattern: "zone_id: \\$\\{uuid:zone_id:1\\}"

  - it: autoscale pool_name resolves server_pool_id from server_pools
    set:
      publicAddr: kasm.example.com
      kasmConfig.generatePreseed: true
      kasmConfig.defaultUsers: false
      kasmZones:
        - name: default
          proxyAddress: kasm.example.com
          primary: true
      certificate.secretName: kasm-tls
      dbManagement.initialize: true
      kasmConfig.config.server_pools:
        - name: "my-pool"
          server_pool_id: "pool-uuid-002"
      kasmConfig.config.autoscale:
        - autoscale_config_name: "Test AS"
          pool_name: "my-pool"
    asserts:
      - documentIndex: 1
        matchRegex:
          path: stringData["custom_properties.yaml"]
          pattern: "server_pool_id: pool-uuid-002"

