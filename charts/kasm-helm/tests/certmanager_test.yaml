suite: cert-manager certificate rendering
templates:
  - templates/cert-manager-certificate.yaml
tests:
  - it: does not render certificate when certManager disabled
    set:
      certificate:
        certManager:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders certificate with expected secretName and DNS names
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      certificate:
        certManager:
          addWildCard: false
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.secretName
          value: kasm-tls
      - contains:
          path: spec.dnsNames
          content: kasm.example.com
      - equal:
          path: spec.issuerRef.name
          value: letsencrypt-prod
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer

  - it: includes wildcard DNS when addWildCard=true
    values:
      - ../../../tests/values/certmanager.yaml
    asserts:
      - contains:
          path: spec.dnsNames
          content: "*.kasm.example.com"

  - it: falls back to the deprecated proxyAddress alias when proxy_hostname is unset
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      certificate:
        certManager:
          addWildCard: false
      kasmZones:
        - name: zonea
          primary: true
          proxyAddress: legacy-a.example.com
        - name: zoneb
          proxy_hostname: preferred-b.example.com
    asserts:
      - contains:
          path: spec.dnsNames
          content: legacy-a.example.com
      - contains:
          path: spec.dnsNames
          content: preferred-b.example.com

  - it: prefers proxy_hostname when both proxyAddress and proxy_hostname are set on the same zone
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      certificate:
        certManager:
          addWildCard: false
      kasmZones:
        - name: zonea
          primary: true
          proxyAddress: legacy-a.example.com
          proxy_hostname: preferred-a.example.com
    asserts:
      - contains:
          path: spec.dnsNames
          content: preferred-a.example.com
      - notContains:
          path: spec.dnsNames
          content: legacy-a.example.com

  - it: excludes upstream auth addresses from the SANs (private DNS zone)
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      certificate:
        certManager:
          addWildCard: false
      kasmZones:
        - name: zonea
          proxy_hostname: zonea.kasm.example.com
          primary: true
        - name: zoneb
          proxy_hostname: zoneb.kasm.example.com
          upstream_auth_address: mgmt-b.example.com
      upstreamAuth:
        hostname: mgmt-a.example.com
    asserts:
      - contains:
          path: spec.dnsNames
          content: zonea.kasm.example.com
      - contains:
          path: spec.dnsNames
          content: zoneb.kasm.example.com
      - notContains:
          path: spec.dnsNames
          content: mgmt-a.example.com
      - notContains:
          path: spec.dnsNames
          content: mgmt-b.example.com

  - it: addWildCard=true emits only publicAddr and its wildcard
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      kasmZones:
        - name: zonea
          proxy_hostname: zonea.other-domain.example.net
          primary: true
      upstreamAuth:
        hostname: mgmt.other-domain.example.net
    asserts:
      - equal:
          path: spec.dnsNames
          value:
            - kasm.example.com
            - "*.kasm.example.com"

  - it: skips a zone with no proxy_hostname instead of failing
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      certificate:
        certManager:
          addWildCard: false
      kasmZones:
        - name: zonea
          proxy_hostname: zonea.kasm.example.com
          primary: true
        - name: zoneb
    asserts:
      - equal:
          path: spec.dnsNames
          value:
            - kasm.example.com
            - zonea.kasm.example.com
