suite: cert-manager certificate rendering
templates:
  - templates/cert-manager-certificate.yaml
tests:
  - it: does not render certificate when certManager disabled
    set:
      certificate:
        certManager:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders certificate with expected secretName and DNS names
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      certificate:
        certManager:
          addWildCard: false
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.secretName
          value: kasm-tls
      - contains:
          path: spec.dnsNames
          content: kasm.example.com
      - equal:
          path: spec.issuerRef.name
          value: letsencrypt-prod
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer

  - it: includes wildcard DNS when addWildCard=true
    values:
      - ../../../tests/values/certmanager.yaml
    asserts:
      - contains:
          path: spec.dnsNames
          content: "*.kasm.example.com"

  - it: falls back to the deprecated proxyAddress alias when proxy_hostname is unset
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      certificate:
        certManager:
          addWildCard: false
      kasmZones:
        - name: zonea
          primary: true
          proxyAddress: legacy-a.example.com
        - name: zoneb
          proxy_hostname: preferred-b.example.com
    asserts:
      - contains:
          path: spec.dnsNames
          content: legacy-a.example.com
      - contains:
          path: spec.dnsNames
          content: preferred-b.example.com

  - it: prefers proxy_hostname when both proxyAddress and proxy_hostname are set on the same zone
    values:
      - ../../../tests/values/certmanager.yaml
    set:
      certificate:
        certManager:
          addWildCard: false
      kasmZones:
        - name: zonea
          primary: true
          proxyAddress: legacy-a.example.com
          proxy_hostname: preferred-a.example.com
    asserts:
      - contains:
          path: spec.dnsNames
          content: preferred-a.example.com
      - notContains:
          path: spec.dnsNames
          content: legacy-a.example.com
