suite: Trusted CA volume mounts
templates:
  - templates/api-deployment.yaml
  - templates/manager-deployment.yaml
  - templates/connection-proxy-statefulset.yaml
  - templates/db-statefulset.yaml

tests:
  - it: creates trusted CA volumes and mounts when enabled
    set:
      trustedCaBundle:
        enabled: true
        configMapName: kasm-trusted-ca-test
    asserts:
      - exists:
          path: spec.template.spec.volumes[?(@.name=="usr-local-share")]
      - equal:
          path: spec.template.spec.volumes[?(@.name=="usr-local-share")].configMap.name
          value: kasm-trusted-ca-test
      - exists:
          path: spec.template.spec.volumes[?(@.name=="ca-init-script")]
      - matchRegex:
          path: spec.template.spec.volumes[?(@.name=="ca-init-script")].configMap.name
          pattern: ca-bundle-script$
      - exists:
          path: spec.template.spec.volumes[?(@.name=="etc-ssl-certs")]
      - exists:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")]
      - exists:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].volumeMounts[?(@.name=="ca-init-script")]
      - exists:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].volumeMounts[?(@.name=="usr-local-share")]
      - exists:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].volumeMounts[?(@.name=="etc-ssl-certs")]

  # tests/kyverno/resources.required.enforce.yaml requires cpu+memory requests AND limits on every
  # container and initContainer. trusted-ca-init is injected into every Kasm workload, so it had to
  # carry them; pinned here so it cannot lose them again.
  - it: gives trusted-ca-init cpu and memory requests and limits by default
    set:
      trustedCaBundle:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].resources.requests.cpu
          value: 500m
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].resources.limits.memory
          value: 1Gi

  - it: lets trustedCaBundle.resources override the trusted-ca-init preset
    set:
      trustedCaBundle:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 20m
            memory: 64Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")].resources.limits.memory
          value: 64Mi

  - it: does not create trusted CA volumes when disabled
    set:
      trustedCaBundle:
        enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="usr-local-share")]
      - notExists:
          path: spec.template.spec.volumes[?(@.name=="ca-init-script")]
      - notExists:
          path: spec.template.spec.initContainers[?(@.name=="trusted-ca-init")]

  - it: mounts trusted CA ConfigMap with dynamic name when enabled and no name provided
    values: 
      - ../../../tests/values/trustedca-dynamic-name.yaml
    asserts:
      - exists:
          path: spec.template.spec.volumes[?(@.name=="usr-local-share")]
      - equal:
          path: spec.template.spec.volumes[?(@.name=="usr-local-share")].configMap.name
          value: RELEASE-NAME-ca-bundle-cert
