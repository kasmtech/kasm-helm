suite: service names from kasm.constants
templates:
  - templates/api-deployment.yaml
  - templates/api-service.yaml
  - templates/db-init-job.yaml
  - templates/db-service.yaml
  - templates/manager-service.yaml
  - templates/proxy-service.yaml
  - templates/connection-proxy-services.yaml

tests:
  - it: api service uses constants svc name
    template: templates/api-service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-api-default

  - it: db service uses constants svc name derived from values
    template: templates/db-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-db

  - it: api deployment uses constants db svc for POSTGRES_HOST
    template: templates/api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            value: RELEASE-NAME-db

  - it: db init job uses constants db svc for POSTGRES_HOST
    template: templates/db-init-job.yaml
    set:
      dbManagement:
        initialize: true
        upgrade:
          enable: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            value: RELEASE-NAME-db

  # guac, rdp-gateway, and rdp-https-gateway were separate Services in three separate
  # workloads; they now share one headless Service backing the consolidated
  # connection-proxy StatefulSet.
  - it: connection-proxy headless service uses the consolidated svc name
    template: templates/connection-proxy-services.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-connection-proxy-default

  - it: manager service uses constants svc name
    template: templates/manager-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-manager-default

  - it: proxy service uses constants svc name
    template: templates/proxy-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-proxy-default

  # Per-ordinal direct RDP Services get a distinct, ordinal-suffixed name.
  - it: direct RDP service uses the consolidated svc name with an ordinal suffix
    template: templates/connection-proxy-services.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/components-all.yaml
    set:
      directRdpService:
        enabled: true
        type: LoadBalancer
        perServiceSettings:
          - rdpAccessURL: rdp0.example.com
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-connection-proxy-default-rdp-0
