suite: image pull secrets
templates:
  - templates/image-pull-secret.yaml
  - templates/api-deployment.yaml
  - templates/db-statefulset.yaml
  - templates/proxy-deployment.yaml
  - templates/db-init-job.yaml
  - templates/db-backup-cron.yaml
  - templates/db-upgrade-job.yaml

tests:
  - it: does not create image pull secret when disabled
    template: templates/image-pull-secret.yaml
    set:
      imagePullSecrets:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates dockerconfigjson secret when enabled with credentials
    values:
      - ../../../tests/values/imagepullsecret.yaml
    template: templates/image-pull-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kasm-regcred
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson

  - it: deployment references pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/api-deployment.yaml
      - templates/db-statefulset.yaml
      - templates/proxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred

  - it: init job references pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/db-init-job.yaml
    set:
      dbManagement:
        initialize: true
        upgrade:
          enable: false
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred

  - it: backup cron references pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/db-backup-cron.yaml
    set:
      dbManagement:
        backupCron:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred

  - it: upgrade job references pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/db-upgrade-job.yaml
    set:
      dbManagement:
        initialize: false
        upgrade:
          enable: true
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred
