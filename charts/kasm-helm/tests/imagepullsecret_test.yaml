suite: image pull secrets
templates:
  - templates/image-pull-secret.yaml
  - templates/api-deployment.yaml
  - templates/db-statefulset.yaml
  - templates/proxy-deployment.yaml
  - templates/manager-deployment.yaml
  - templates/guac-deployment.yaml
  - templates/rdp-gateway-deployment.yaml
  - templates/rdp-https-gateway-deployment.yaml
  - templates/db-init-job.yaml
  - templates/db-backup-cron.yaml
  - templates/db-upgrade-job.yaml

tests:
  - it: does not create image pull secret when disabled
    template: templates/image-pull-secret.yaml
    set:
      imagePullSecrets:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates dockerconfigjson secret when enabled with credentials
    values:
      - ../../../tests/values/imagepullsecret.yaml
    template: templates/image-pull-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kasm-regcred
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson

  - it: deployment references pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/api-deployment.yaml
      - templates/db-statefulset.yaml
      - templates/proxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred

  - it: init job references pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/db-init-job.yaml
    set:
      dbManagement:
        initialize: true
        upgrade:
          enable: false
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred

  - it: backup cron references pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/db-backup-cron.yaml
    set:
      dbManagement:
        backupCron:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred

  - it: upgrade job references pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/db-upgrade-job.yaml
    set:
      dbManagement:
        initialize: false
        upgrade:
          enable: true
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred

  - it: optional component deployments reference pull secret when enabled
    values:
      - ../../../tests/values/imagepullsecret.yaml
    templates:
      - templates/manager-deployment.yaml
      - templates/guac-deployment.yaml
      - templates/rdp-gateway-deployment.yaml
      - templates/rdp-https-gateway-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-regcred

  - it: chart-managed mode defaults secret name to <release>-image-pull-secret when name is empty
    template: templates/image-pull-secret.yaml
    release:
      name: kasm
    set:
      imagePullSecrets:
        enabled: true
        name: ""
        registry: ghcr.io
        username: dummy
        password: dummy
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kasm-image-pull-secret

  - it: chart-managed mode encodes auths.<registry> with correct base64 auth
    values:
      - ../../../tests/values/imagepullsecret.yaml
    template: templates/image-pull-secret.yaml
    asserts:
      - equal:
          # base64(dummy:dummy) = ZHVtbXk6ZHVtbXk=, wrapped into the dockerconfigjson and
          # base64'd again as the Secret data value.
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6eyJnaGNyLmlvIjp7ImF1dGgiOiJaSFZ0YlhrNlpIVnRiWGs9IiwiZW1haWwiOiIiLCJwYXNzd29yZCI6ImR1bW15IiwidXNlcm5hbWUiOiJkdW1teSJ9fX0=

  - it: BYO mode renders no secret when credentials are empty and name is set
    template: templates/image-pull-secret.yaml
    set:
      imagePullSecrets:
        enabled: true
        name: existing-pull-secret
        username: ""
        password: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: BYO mode wires the named secret into pod specs without creating one
    templates:
      - templates/api-deployment.yaml
      - templates/proxy-deployment.yaml
      - templates/manager-deployment.yaml
      - templates/rdp-gateway-deployment.yaml
    set:
      imagePullSecrets:
        enabled: true
        name: existing-pull-secret
        username: ""
        password: ""
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: existing-pull-secret

  - it: broken state - enabled with empty name and empty credentials falls back to default name and renders no secret
    template: templates/image-pull-secret.yaml
    set:
      imagePullSecrets:
        enabled: true
        name: ""
        username: ""
        password: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: broken state - deployments still reference the default secret name even though no secret is rendered
    template: templates/api-deployment.yaml
    release:
      name: kasm
    set:
      imagePullSecrets:
        enabled: true
        name: ""
        username: ""
        password: ""
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-image-pull-secret

  - it: disabled - deployments have no imagePullSecrets block even when name is populated
    template: templates/api-deployment.yaml
    set:
      imagePullSecrets:
        enabled: false
        name: existing-pull-secret
        username: leftover
        password: leftover
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets
