    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: kasm-release-name-forty-characters-longg-api-worker-sessions-be
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kasm-release-name-forty-characters-longg-api-worker-sessions-be

  - it: doc 2 (media/alpha) truncates to <=63 chars, selector matches pod labels
    documentIndex: 2
    release:
