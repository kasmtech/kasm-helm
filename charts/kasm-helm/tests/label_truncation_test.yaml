      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: kasm-release-name-forty-characters-longg-api-worker-media-alpha

  - it: doc 3 (media/beta) fits in 63 chars untouched, selector matches pod labels
    documentIndex: 3
    release:
      name: kasm-release-name-forty-characters-longg
