suite: deployment size presets

templates:
  - templates/api-deployment.yaml
  - templates/db-statefulset.yaml
  - templates/proxy-deployment.yaml
  - templates/connection-proxy-statefulset.yaml

tests:
  - it: sets all replicas to 1 for small
    set:
      deploymentSize: small
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  # connection-proxy (nginx + guac + rdp-gateway + rdp-https-gateway consolidated into one
  # StatefulSet) now shares a single replicas.preset node ("connection-proxy") and scales
  # 1/2/3 with deploymentSize like every other zone-scoped workload. The old single-replica
  # `fail` pinning rdp-gateway to 1 replica was removed (maintainer decision 2026-08-11); each
  # replica gets its own direct-RDP identity via directRdpService, tested separately.
  - it: sets all deployment replicas to 2 for medium
    templates:
      - templates/api-deployment.yaml
      - templates/proxy-deployment.yaml
      - templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      deploymentSize: medium
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: sets all deployment replicas to 3 for large
    templates:
      - templates/api-deployment.yaml
      - templates/proxy-deployment.yaml
      - templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      deploymentSize: large
    asserts:
      - equal:
          path: spec.replicas
          value: 3
