suite: deployment size presets

templates:
  - templates/api-deployment.yaml
  - templates/db-statefulset.yaml
  - templates/proxy-deployment.yaml
  - templates/guac-statefulset.yaml
  - templates/rdp-gateway-deployment.yaml
  - templates/rdp-https-gateway-statefulset.yaml

tests:
  - it: sets all replicas to 1 for small
    set:
      deploymentSize: small
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  # rdp-gateway is intentionally excluded from the medium/large size cases —
  # it's pinned at 1 across all sizes (see "rdp-gateway is held at 1 regardless
  # of deploymentSize" below and the long-form comment in
  # rdp-gateway-deployment.yaml).
  - it: sets all deployment replicas to 2 for medium
    templates:
      - templates/api-deployment.yaml
      - templates/proxy-deployment.yaml
      - templates/guac-statefulset.yaml
      - templates/rdp-https-gateway-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      deploymentSize: medium
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: sets all deployment replicas to 3 for large
    templates:
      - templates/api-deployment.yaml
      - templates/proxy-deployment.yaml
      - templates/guac-statefulset.yaml
      - templates/rdp-https-gateway-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      deploymentSize: large
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: scales guac and rdp-https-gateway to 2 replicas for medium
    templates:
      - templates/guac-statefulset.yaml
      - templates/rdp-https-gateway-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      deploymentSize: medium
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: scales guac and rdp-https-gateway to 3 replicas for large
    templates:
      - templates/guac-statefulset.yaml
      - templates/rdp-https-gateway-statefulset.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      deploymentSize: large
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: rdp-gateway is held at 1 regardless of deploymentSize
    templates:
      - templates/rdp-gateway-deployment.yaml
    values:
      - ../../../tests/values/components-all.yaml
    set:
      deploymentSize: large
    asserts:
      - equal:
          path: spec.replicas
          value: 1
