suite: kasm zones logic tests
templates:
  - templates/connection-proxy-statefulset.yaml
  - templates/proxy-deployment.yaml
  - templates/proxy-configmaps.yaml

tests:
  - it: injects primary zone into connection-proxy guac container
    template: templates/connection-proxy-statefulset.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
      - ../../../tests/values/components-all.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[*].env[?(@.name=="ZONE" && @.value=="zonea")]

  - it: preverify renders 2 proxy configmaps by default
    template: templates/proxy-configmaps.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap

  - it: renders 1 additional proxy settings configmap per zone and includes zone slug in name
    template: templates/proxy-configmaps.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 3
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ".*zoneb.*"
        documentIndex: 1

  - it: renders a proxy deployment per zone and includes zone slug in name
    template: templates/proxy-deployment.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ".*zoneb.*"
        documentIndex: 1

  - it: normalizes non-alphanumeric zone names in proxy upstream hostnames
    template: templates/proxy-configmaps.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: My_Zone 1
          proxyAddress: zone1.example.com
          primary: true
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: data["upstream_api.conf"]
          pattern: 'server RELEASE-NAME-api-my-zone-1:'
        documentIndex: 0
      - notMatchRegex:
          path: data["upstream_api.conf"]
          pattern: '(My_Zone|my_zone)'
        documentIndex: 0