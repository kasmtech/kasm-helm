suite: kasm zones logic tests
templates:
  - templates/guac-deployment.yaml
  - templates/proxy-deployment.yaml
  - templates/proxy-configmaps.yaml
  - templates/manager-deployment.yaml

tests:
  - it: injects primary zone into guac deployment
    template: templates/guac-deployment.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[*].env[?(@.name=="ZONE" && @.value=="zonea")]

  - it: preverify renders 3 proxy configmaps by default
    template: templates/proxy-configmaps.yaml
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: ConfigMap

  - it: renders 1 additional proxy settings configmap per zone and includes zone slug in name
    template: templates/proxy-configmaps.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 4
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"
        documentIndex: 1
      - matchRegex:
          path: metadata.name
          pattern: ".*zoneb.*"
        documentIndex: 2

  - it: renders a proxy deployment per zone and includes zone slug in name
    template: templates/proxy-deployment.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: metadata.name
          pattern: ".*zonea.*"
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ".*zoneb.*"
        documentIndex: 1

  - it: normalizes non-alphanumeric zone names in proxy upstream hostnames
    template: templates/proxy-configmaps.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: My_Zone 1
          proxyAddress: zone1.example.com
    asserts:
      - hasDocuments:
          count: 3
      - matchRegex:
          path: data["upstream_api.conf"]
          pattern: 'server RELEASE-NAME-api-my-zone-1:'
        documentIndex: 1
      - matchRegex:
          path: data["upstream_manager.conf"]
          pattern: 'server RELEASE-NAME-manager-my-zone-1:'
        documentIndex: 1
      - notMatchRegex:
          path: data["upstream_api.conf"]
          pattern: '(My_Zone|my_zone)'
        documentIndex: 1
      - notMatchRegex:
          path: data["upstream_manager.conf"]
          pattern: '(My_Zone|my_zone)'
        documentIndex: 1

  - it: normalizes non-alphanumeric zone names in manager api-is-ready init container
    template: templates/manager-deployment.yaml
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: My_Zone 1
          proxyAddress: zone1.example.com
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: 'http://RELEASE-NAME-api-my-zone-1:'
      - notMatchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: '(My_Zone|my_zone)'