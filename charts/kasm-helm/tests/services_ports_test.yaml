suite: service ports, types, and zone fan-out

templates:
  - templates/api-service.yaml
  - templates/manager-service.yaml
  - templates/guac-service.yaml
  - templates/db-service.yaml
  - templates/proxy-service.yaml
  - templates/proxy-service-external.yaml
  - templates/rdp-gateway-service.yaml
  - templates/rdp-https-gateway-service.yaml

tests:
  - it: api Service exposes port 8080/TCP
    template: templates/api-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  - it: manager Service exposes port 8181/TCP
    template: templates/manager-service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8181
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  - it: db Service is headless and exposes port 5432
    template: templates/db-service.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 5432

  - it: db Service is not rendered when database.standalone=true
    template: templates/db-service.yaml
    values:
      - ../../../tests/values/external-db.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: proxy Service is ClusterIP with both http and https ports
    template: templates/proxy-service.yaml
    set:
      proxyService:
        type: ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[1].port
          value: 8443

  - it: external proxy Service exposes 443 and targets https port name
    template: templates/proxy-service-external.yaml
    set:
      ingress:
        enabled: false
      route:
        enabled: false
      proxyService:
        type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 443
      - equal:
          path: spec.ports[0].targetPort
          value: proxy-pt-https

  - it: guac Service is headless and exposes only the nginx sidecar port 9000
    template: templates/guac-service.yaml
    asserts:
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 9000
      - notExists:
          path: spec.ports[1]

  - it: rdp gateway Service is rendered when component enabled (default)
    template: templates/rdp-gateway-service.yaml
    asserts:
      - isKind:
          of: Service

  - it: rdp gateway Service is ClusterIP by default and exposes nginx :9001 + RDP :3389 (5555 stays intra-pod)
    template: templates/rdp-gateway-service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 9001
      - equal:
          path: spec.ports[0].targetPort
          value: 9001
      - equal:
          path: spec.ports[1].port
          value: 3389
      - equal:
          path: spec.ports[1].targetPort
          value: 3389
      # The app port (5555) must NOT appear on the Service. Cross-pod
      # consumers (notably the proxy wait-for-rdp-gateway init container) talk
      # to the nginx sidecar on 9001 which proxies /__healthcheck through to
      # the app on localhost. Putting 5555 on the Service publishes the app
      # port to any LoadBalancer/NodePort exposure (directRdpService=true) and
      # bypasses the sidecar contract — both regressions we don't want.
      - notExists:
          path: spec.ports[2]

  - it: rdp gateway Service becomes LoadBalancer when directRdpService.enabled=true
    template: templates/rdp-gateway-service.yaml
    set:
      directRdpService:
        enabled: true
        rdpAccessURL: rdp.example.com
        type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: rdp gateway Service becomes NodePort when directRdpService.type=NodePort
    template: templates/rdp-gateway-service.yaml
    set:
      directRdpService:
        enabled: true
        rdpAccessURL: rdp.example.com
        type: NodePort
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: rdp gateway Service public RDP port is configurable via directRdpService.loadBalancerPort
    template: templates/rdp-gateway-service.yaml
    set:
      directRdpService:
        enabled: true
        rdpAccessURL: rdp.example.com
        type: LoadBalancer
        loadBalancerPort: 443
    asserts:
      - equal:
          path: spec.ports[1].port
          value: 443
      - equal:
          path: spec.ports[1].targetPort
          value: 3389

  - it: rdp https gateway Service is rendered when component enabled (default)
    template: templates/rdp-https-gateway-service.yaml
    asserts:
      - isKind:
          of: Service

  - it: api Service fans out one Service per kasmZone
    template: templates/api-service.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-api-zonea
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-api-zoneb

  - it: manager Service fans out one Service per kasmZone
    template: templates/manager-service.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-manager-zonea
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-manager-zoneb

  - it: proxy Service fans out one Service per kasmZone
    template: templates/proxy-service.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-proxy-zonea
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-proxy-zoneb

  - it: guac Service uses the primary zone name in multizone deployments
    template: templates/guac-service.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-guac-zonea
