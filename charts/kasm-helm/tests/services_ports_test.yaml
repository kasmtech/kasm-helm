suite: service ports, types, and zone fan-out

templates:
  - templates/api-service.yaml
  - templates/manager-service.yaml
  - templates/db-service.yaml
  - templates/proxy-service.yaml
  - templates/proxy-service-external.yaml
  - templates/connection-proxy-services.yaml

tests:
  - it: api Service exposes port 8080/TCP
    template: templates/api-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  - it: manager Service exposes port 8181/TCP
    template: templates/manager-service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8181
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  - it: db Service is headless and exposes port 5432
    template: templates/db-service.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 5432

  - it: db Service is not rendered when database.standalone=true
    template: templates/db-service.yaml
    values:
      - ../../../tests/values/external-db.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: proxy Service is ClusterIP with both http and https ports
    template: templates/proxy-service.yaml
    set:
      proxyService:
        type: ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[1].port
          value: 8443

  - it: external proxy Service exposes 443 and targets https port name
    template: templates/proxy-service-external.yaml
    set:
      ingress:
        enabled: false
      route:
        enabled: false
      proxyService:
        type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 443
      - equal:
          path: spec.ports[0].targetPort
          value: proxy-pt-https

  # guac, rdp-gateway, and rdp-https-gateway previously exposed separate Services on
  # separate nginx sidecar ports (9000/9001/9002). They now share one consolidated
  # nginx container on port 8443, fronted by a single headless Service. The three
  # app ports (3000/5555/9443) never appear on this Service — they're localhost-only
  # inside the pod and are reached exclusively through the 8443 nginx listener.
  - it: connection-proxy headless Service is headless and exposes only the consolidated nginx port 8443
    template: templates/connection-proxy-services.yaml
    documentIndex: 0
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 8443
      - notExists:
          path: spec.ports[1]

  - it: direct RDP Service is not rendered when directRdpService.enabled=false (default)
    template: templates/connection-proxy-services.yaml
    values:
      - ../../../tests/values/components-all.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: direct RDP Service renders per replica ordinal and is LoadBalancer by default type, targeting 3389
    template: templates/connection-proxy-services.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/components-all.yaml
    set:
      directRdpService:
        enabled: true
        type: LoadBalancer
        perServiceSettings:
          - rdpAccessURL: rdp0.example.com
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-connection-proxy-default-rdp-0
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 3389
      - equal:
          path: spec.ports[0].targetPort
          value: 3389

  - it: direct RDP Service becomes NodePort when directRdpService.type=NodePort
    template: templates/connection-proxy-services.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/components-all.yaml
    set:
      directRdpService:
        enabled: true
        type: NodePort
        perServiceSettings:
          - rdpAccessURL: rdp0.example.com
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: direct RDP Service public port is configurable via directRdpService.loadBalancerPort
    template: templates/connection-proxy-services.yaml
    documentIndex: 1
    values:
      - ../../../tests/values/components-all.yaml
    set:
      directRdpService:
        enabled: true
        type: LoadBalancer
        loadBalancerPort: 443
        perServiceSettings:
          - rdpAccessURL: rdp0.example.com
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 443
      - equal:
          path: spec.ports[0].targetPort
          value: 3389

  - it: api Service fans out one Service per kasmZone
    template: templates/api-service.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-api-zonea
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-api-zoneb

  - it: manager Service fans out one Service per kasmZone
    template: templates/manager-service.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-manager-zonea
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-manager-zoneb

  - it: proxy Service fans out one Service per kasmZone
    template: templates/proxy-service.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-proxy-zonea
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-proxy-zoneb

  # connection-proxy (like the old guac/rdp-gateway/rdp-https-gateway) only deploys in
  # primary-region zones, so it renders one document for the primary zone even when
  # more than one kasmZone is configured.
  - it: connection-proxy headless Service uses the primary zone name in multizone deployments
    template: templates/connection-proxy-services.yaml
    values:
      - ../../../tests/values/multizone-config.yaml
      - ../../../tests/values/components-all.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-connection-proxy-zonea
