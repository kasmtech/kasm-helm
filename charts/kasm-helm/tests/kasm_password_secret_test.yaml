suite: kasm password secret generation and naming
templates:
  - templates/kasm-password-secret.yaml
  - templates/api-deployment.yaml
  - templates/manager-deployment.yaml
  - templates/db-statefulset.yaml
  - templates/db-init-job.yaml
  - templates/db-upgrade-job.yaml
  - templates/db-upgrade-backup-job.yaml
  - templates/db-backup-cron.yaml
  - templates/guac-statefulset.yaml
  - templates/rdp-gateway-deployment.yaml
  - templates/rdp-https-gateway-statefulset.yaml
tests:
  - it: renders an Opaque secret named <release>-secrets by default
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets

  - it: contains all five generated credential keys by default
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
    asserts:
      - exists:
          path: data["manager-token"]
      - exists:
          path: data["service-token"]
      - exists:
          path: data["db-password"]
      - exists:
          path: data["admin-password"]
      - exists:
          path: data["user-password"]

  - it: each generated credential is non-empty base64
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
    asserts:
      - matchRegex:
          path: data["manager-token"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["service-token"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["db-password"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["admin-password"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["user-password"]
          pattern: '^[A-Za-z0-9+/]+=*$'

  - it: omits db-password when a user-supplied database.kasmDbSecret is configured
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - notExists:
          path: data["db-password"]
      - exists:
          path: data["manager-token"]
      - exists:
          path: data["service-token"]
      - exists:
          path: data["admin-password"]
      - exists:
          path: data["user-password"]

  - it: defaults secret name to <release>-secrets during upgrade when oldDbSecretsName is empty
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      dbManagement:
        initialize: false
        upgrade:
          enable: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets

  - it: still names the secret <release>-secrets even when oldDbSecretsName is set for lookup
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      dbManagement:
        initialize: false
        upgrade:
          enable: true
          oldDbSecretsName: legacy-kasm-creds
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets

  - it: main containers source POSTGRES_PASSWORD from kasmDbSecret when configured (Deployments / StatefulSet / Jobs)
    set:
      dbManagement:
        initialize: true
        upgrade:
          enable: false
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    templates:
      - templates/api-deployment.yaml
      - templates/manager-deployment.yaml
      - templates/db-statefulset.yaml
      - templates/db-init-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password

  - it: db upgrade job main container sources POSTGRES_PASSWORD from kasmDbSecret when configured
    template: templates/db-upgrade-job.yaml
    set:
      dbManagement:
        initialize: false
        upgrade:
          enable: true
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password

  - it: db upgrade backup job main container sources POSTGRES_PASSWORD from kasmDbSecret when configured
    template: templates/db-upgrade-backup-job.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      dbManagement:
        initialize: false
        upgrade:
          enable: true
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password

  - it: db backup cronjob main container sources PGPASSWORD from kasmDbSecret when configured
    template: templates/db-backup-cron.yaml
    set:
      dbManagement:
        backupCron:
          enabled: true
          schedule: "0 2 * * *"
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password

  # ---------- kasmSecrets: custom name / create toggle / password overrides ----------

  - it: uses a custom secret name when kasmSecrets.name is set
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      kasmSecrets:
        name: my-custom-kasm-secret
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-kasm-secret

  - it: does not render the password secret when kasmSecrets.create is false
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      kasmSecrets:
        create: false
        name: existing-kasm-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when kasmSecrets.create is false and kasmSecrets.name is empty
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      kasmSecrets:
        create: false
    asserts:
      - failedTemplate:
          errorMessage: "kasmSecrets.name is required when kasmSecrets.create is false. Provide the name of the existing Kasm Password secret in your deployment namespace."

  - it: an explicit kasmSecrets.passwords value overrides random generation for a known key
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      kasmSecrets:
        passwords:
          admin-password: "password"
    asserts:
      - equal:
          path: data["admin-password"]
          value: "cGFzc3dvcmQ="

  - it: overriding one key still randomly generates the other four as valid base64
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      kasmSecrets:
        passwords:
          admin-password: "password"
    asserts:
      - matchRegex:
          path: data["manager-token"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["service-token"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["db-password"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["user-password"]
          pattern: '^[A-Za-z0-9+/]+=*$'

  - it: an extra custom key in kasmSecrets.passwords is rendered as a literal base64 value
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      kasmSecrets:
        passwords:
          my-custom-secret: "foobar"
    asserts:
      - equal:
          path: data["my-custom-secret"]
          value: "Zm9vYmFy"
      - exists:
          path: data["manager-token"]

  - it: applies kasmSecrets.annotations and kasmSecrets.labels to the secret metadata
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      kasmSecrets:
        annotations:
          my-annotation: my-value
        labels:
          my-label: my-value
    asserts:
      - equal:
          path: metadata.annotations["my-annotation"]
          value: my-value
      - equal:
          path: metadata.labels["my-label"]
          value: my-value

  - it: db-password is still omitted when kasmDbSecret is configured alongside a custom kasmSecrets.name
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      kasmSecrets:
        name: my-custom-kasm-secret
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - notExists:
          path: data["db-password"]
      - exists:
          path: data["admin-password"]

  - it: main containers reference the custom kasmSecrets.name for db-password (Deployments / StatefulSet / Job)
    set:
      kasmSecrets:
        name: my-custom-kasm-secret
      dbManagement:
        initialize: true
        upgrade:
          enable: false
    templates:
      - templates/api-deployment.yaml
      - templates/manager-deployment.yaml
      - templates/db-statefulset.yaml
      - templates/db-init-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-kasm-secret
                key: "db-password"

  - it: db upgrade job references the custom kasmSecrets.name for db-password
    template: templates/db-upgrade-job.yaml
    set:
      kasmSecrets:
        name: my-custom-kasm-secret
      dbManagement:
        initialize: false
        upgrade:
          enable: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-kasm-secret
                key: "db-password"

  - it: db backup cronjob references the custom kasmSecrets.name for db-password
    template: templates/db-backup-cron.yaml
    set:
      kasmSecrets:
        name: my-custom-kasm-secret
      dbManagement:
        backupCron:
          enabled: true
          schedule: "0 2 * * *"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-kasm-secret
                key: "db-password"

  - it: guac/rdp-gateway/rdp-https-gateway reference the custom kasmSecrets.name for service-token
    values:
      - ../../../tests/values/components-all.yaml
    set:
      kasmSecrets:
        name: my-custom-kasm-secret
    templates:
      - templates/guac-statefulset.yaml
      - templates/rdp-gateway-deployment.yaml
      - templates/rdp-https-gateway-statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: my-custom-kasm-secret
                key: service-token
