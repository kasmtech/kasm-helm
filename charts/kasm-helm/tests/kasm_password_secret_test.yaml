suite: kasm password secret generation and naming
templates:
  - templates/kasm-password-secret.yaml
  - templates/api-deployment.yaml
  - templates/manager-deployment.yaml
  - templates/db-statefulset.yaml
  - templates/db-init-job.yaml
  - templates/db-upgrade-job.yaml
  - templates/db-upgrade-backup-job.yaml
  - templates/db-backup-cron.yaml
tests:
  - it: renders an Opaque secret named <release>-secrets by default
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets

  - it: contains all five generated credential keys by default
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
    asserts:
      - exists:
          path: data["manager-token"]
      - exists:
          path: data["service-token"]
      - exists:
          path: data["db-password"]
      - exists:
          path: data["admin-password"]
      - exists:
          path: data["user-password"]

  - it: each generated credential is non-empty base64
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
    asserts:
      - matchRegex:
          path: data["manager-token"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["service-token"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["db-password"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["admin-password"]
          pattern: '^[A-Za-z0-9+/]+=*$'
      - matchRegex:
          path: data["user-password"]
          pattern: '^[A-Za-z0-9+/]+=*$'

  - it: omits db-password when a user-supplied database.kasmDbSecret is configured
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - notExists:
          path: data["db-password"]
      - exists:
          path: data["manager-token"]
      - exists:
          path: data["service-token"]
      - exists:
          path: data["admin-password"]
      - exists:
          path: data["user-password"]

  - it: defaults secret name to <release>-secrets during upgrade when oldDbSecretsName is empty
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      dbManagement:
        initialize: false
        upgrade:
          enable: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets

  - it: still names the secret <release>-secrets even when oldDbSecretsName is set for lookup
    template: templates/kasm-password-secret.yaml
    set:
      kasmConfig:
        generatePreseed: false
      dbManagement:
        initialize: false
        upgrade:
          enable: true
          oldDbSecretsName: legacy-kasm-creds
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets

  - it: main containers source POSTGRES_PASSWORD from kasmDbSecret when configured (Deployments / StatefulSet / Jobs)
    set:
      dbManagement:
        initialize: true
        upgrade:
          enable: false
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    templates:
      - templates/api-deployment.yaml
      - templates/manager-deployment.yaml
      - templates/db-statefulset.yaml
      - templates/db-init-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password

  - it: db upgrade job main container sources POSTGRES_PASSWORD from kasmDbSecret when configured
    template: templates/db-upgrade-job.yaml
    set:
      dbManagement:
        initialize: false
        upgrade:
          enable: true
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password

  - it: db upgrade backup job main container sources POSTGRES_PASSWORD from kasmDbSecret when configured
    template: templates/db-upgrade-backup-job.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      dbManagement:
        initialize: false
        upgrade:
          enable: true
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password

  - it: db backup cronjob main container sources PGPASSWORD from kasmDbSecret when configured
    template: templates/db-backup-cron.yaml
    set:
      dbManagement:
        backupCron:
          enabled: true
          schedule: "0 2 * * *"
      database:
        kasmDbSecret:
          name: my-db-secret
          key: password
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: password
