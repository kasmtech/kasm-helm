suite: Ingress wiring
templates:
  - templates/ingress.yaml
tests:
  - it: does not render an Ingress when ingress.enabled is false
    set:
      ingress:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an Ingress with TLS and wildcard host when enabled
    values:
      - ../../../tests/values/ingress.yaml
    set:
      ingress:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: kasm.example.com
      - equal:
          path: spec.tls[0].secretName
          value: kasm-tls
      - contains:
          path: spec.tls[0].hosts
          content: kasm.example.com
      - contains:
          path: spec.tls[0].hosts
          content: "*.kasm.example.com"

  - it: publishes only publicAddr when kasmZones are defined
    values:
      - ../../../tests/values/multizone-config.yaml
    set:
      ingress:
        enabled: true
      certificate:
        secretName: kasm-tls
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].host
          value: kasm.example.com
      - lengthEqual:
          path: spec.rules
          count: 1
      - notContains:
          path: spec.tls[0].hosts
          content: zonea.kasm.example.com
      - notContains:
          path: spec.tls[0].hosts
          content: zoneb.kasm.example.com

  - it: routes publicAddr to the primary zone's proxy Service in multizone
    set:
      proxyService.type: ClusterIP
      ingress.enabled: true
      kasmZones:
        - name: zonea
          proxy_hostname: zonea.example.com
        - name: zoneb
          primary: true
          proxy_hostname: zoneb.example.com
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-proxy-zoneb