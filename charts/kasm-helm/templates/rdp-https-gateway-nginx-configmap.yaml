{{/*
Nginx configuration ConfigMaps for the RDP HTTPS Gateway StatefulSet nginx sidecar.

rdp-gateway-settings  — mounted at /etc/nginx/conf.d/ — contains:
  compress.conf, logging.conf, upstream_kasm_rdp_https_gateway.conf, orchestrator.conf

rdp-gateway-services  — mounted at /etc/nginx/conf.d/services.d/ — contains:
  rdp_https_gateway.conf with all guac location blocks routing to rdp_https_gateway upstream
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $serviceKeepalive := 16 -}}
{{- if .Values.components.rdpHttpsGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "rdp-https-gateway-nginx-settings" "resource" "configMap" "include" "all") | indent 2 }}
data:
  resolver.conf: |
    resolver 127.0.0.11 valid=10s ipv6=off;

  upstream_kasm_rdp_https_gateway.conf: |
    upstream kasm_rdp_https_gateway {
      keepalive {{ $serviceKeepalive }};
      server 127.0.0.1:{{ $constants.rdpHttpsGateway.port }};
    }

  orchestrator.conf: |
    server {
      listen {{ $constants.rdpHttpsGateway.nginxPort }} ssl;
      server_name ubuntu-base;

      ssl_certificate     /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers   off;
      ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
      include /etc/nginx/conf.d/services.d/*.conf;

      client_max_body_size 1G;
      server_tokens off;

      proxy_intercept_errors on;
      error_page 500 = @internal_error;
      location @internal_error {
        default_type "text/html";
        return 500 "<H1>Internal Error</H1>";
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "rdp-https-gateway-nginx-services" "resource" "configMap" "include" "all") | indent 2 }}
data:
  rdp_https_gateway.conf: |
    location /rdp-https-gateway/ {
      proxy_http_version      1.1;
      proxy_set_header        Host $host;
      proxy_set_header        Upgrade $http_upgrade;
      proxy_set_header        Connection "upgrade";
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;

      proxy_pass          https://127.0.0.1:{{ $constants.rdpHttpsGateway.port }};
      proxy_ssl_verify    off;
    }

    location /remoteDesktopGateway {
      proxy_http_version 1.1;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_pass          https://127.0.0.1:{{ $constants.rdpHttpsGateway.port }};
      proxy_ssl_verify    off;
    }

    # Route for MS RDP Gateway
    location /rpc {
      proxy_buffers 4 256k;
      proxy_buffer_size 128k;
      proxy_busy_buffers_size 256k;

      proxy_pass          https://127.0.0.1:{{ $constants.rdpHttpsGateway.port }};
      proxy_ssl_verify    off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Timeout settings
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    
    location /guac/vm_disconnect {
      return 200;
    }

    location = /__healthcheck {
      access_log off;
      proxy_pass https://127.0.0.1:{{ $constants.rdpHttpsGateway.port }}/__healthcheck;
      proxy_ssl_verify off;
    }
{{- end }}
