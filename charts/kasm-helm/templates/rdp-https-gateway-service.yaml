{{/*
Headless Service for RDP HTTPS Gateway StatefulSet.
clusterIP: None provides per-pod DNS records for stable SERVER_HOSTNAME values.
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- if .Values.components.rdpHttpsGateway.enabled }}
{{- range $zone := (include "kasm.primaryRegionZones" $ | fromYamlArray) }}
---
{{ $rdpHttpsGwSvc := printf "%s-rdp-https-gateway-%s" $.Release.Name (include "kasm.zoneName" $zone.name) -}}
apiVersion: v1
kind: Service
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "rdpHttpsGateway" "resource" "service" "zone" $zone.name "include" "all") | nindent 2 }}
spec:
  clusterIP: None
  selector:
    {{- include "kasm.metadata" (dict "context" $ "component" "rdpHttpsGateway" "resource" "service" "zone" $zone.name "include" "match") | nindent 4 }}
  ports:
    - name: {{ printf "%s-svc-%s" $rdpHttpsGwSvc ($constants.rdpHttpsGateway.nginxPort | toString) }}
      protocol: TCP
      port: {{ $constants.rdpHttpsGateway.nginxPort }}
{{- end }}
{{- end }}
