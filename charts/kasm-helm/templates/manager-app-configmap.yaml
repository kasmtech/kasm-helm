{{/*
Kasm DB configMaps containing pg_hba.conf and postgresql.conf files
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- if eq .Values.logFormat "json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "manager-app-config" "resource" "configMap" "include" "all") | indent 2 }}
data:
  api.app.config.yaml: |
    database:
      name: kasm
      username: kasmapp
      password: changeme
      host: db
      port: 5432
      type: postgres
      ssl: true
      pool_size: 10
      max_overflow: 20
      pool_timeout: 10
    logging:
      agent:
        formatters:
          pythonjsonlogger:
            (): pythonjsonlogger.jsonlogger.JsonFormatter
            fmt: '%(asctime) %(name) %(processName) %(filename)  %(funcName) %(levelname) %(lineno) %(module) %(threadName) %(message)'
            timestamp: true
          standard:
            format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
        handlers:
          file_handler:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/agent.log
            formatter: standard
            level: DEBUG
            maxBytes: 10485760
          file_handler_json:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/agent_json.log
            formatter: pythonjsonlogger
            level: DEBUG
            maxBytes: 10485760
          stream:
            class: logging.StreamHandler
            formatter: standard
            level: INFO
          syslog:
            class: logging.handlers.SysLogHandler
            formatter: pythonjsonlogger
            level: DEBUG
        loggers:
          ? ''
          : handlers:
            - stream
            - syslog
            - file_handler
            - file_handler_json
            level: DEBUG
            propagate: true
        version: 1
      manager_api_server:
        filters:
          internal_log_filter:
            (): log.handlers.InternalLogFilter
          web_filter_log_filter:
            (): log.handlers.ExternalLogFilter
            application: 'kasm_squid_adapter'
        formatters:
          pythonjsonlogger:
            (): pythonjsonlogger.jsonlogger.JsonFormatter
            fmt: '%(asctime) %(name) %(processName) %(filename)  %(funcName) %(levelname) %(lineno) %(module) %(threadName) %(message)'
            timestamp: true
          standard:
            format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
        handlers:
          file_handler:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/manager_api_server.log
            formatter: standard
            level: DEBUG
            maxBytes: 10485760
            filters: [ internal_log_filter ]
          file_handler_json:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/manager_api_server_json.log
            formatter: pythonjsonlogger
            level: DEBUG
            maxBytes: 10485760
            filters: [ internal_log_filter ]
          web_filter_file_handler:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/web_filter_access_json.log
            level: DEBUG
            maxBytes: 10485760
            filters: [ web_filter_log_filter ]
          stream:
            class: logging.StreamHandler
            formatter: pythonjsonlogger
            level: INFO
            filters: [ internal_log_filter ]
          syslog:
            class: logging.handlers.SysLogHandler
            formatter: pythonjsonlogger
            level: DEBUG
            filters: [ internal_log_filter ]
        loggers:
          ? ''
          : handlers:
            - stream
            - syslog
            - file_handler
            - file_handler_json
            - web_filter_file_handler
            level: DEBUG
            propagate: true
          manager_api_server:
            level: DEBUG
          googleapiclient.discovery_cache:
            level: ERROR
          provider_manager:
            level: DEBUG
          provider:
            level: DEBUG
          tornado.access:
            level: INFO
          tornado.application:
            level: INFO
          tornado.general:
            level: INFO
          sqlalchemy.pool:
            level: WARNING
          sqlalchemy.pool.status:
            level: WARNING
          sqlalchemy.engine:
            level: WARNING
          sqlalchemy.dialects:
            level: WARNING
          sqlalchemy.orm:
            level: WARNING
          botocore:
            level: WARNING
          azure:
            level: WARNING
          database_models:
            level: INFO
          keystoneauth.session:
            level: WARNING
          novaclient.v2.client:
            level: WARNING
        version: 1
      api_server:
        filters:
          internal_log_filter:
            (): log.handlers.InternalLogFilter
          request_context_filter:
            (): utils.RequestContextFilter
        formatters:
          pythonjsonlogger:
            (): pythonjsonlogger.jsonlogger.JsonFormatter
            fmt: '%(asctime) %(name) %(processName) %(filename)  %(funcName) %(levelname) %(lineno) %(module) %(threadName) %(message)'
            timestamp: true
          standard:
            format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
        handlers:
          file_handler:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/api_server.log
            formatter: standard
            level: DEBUG
            maxBytes: 10485760
            filters: [ internal_log_filter ]
          file_handler_json:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/api_server_json.log
            formatter: pythonjsonlogger
            level: DEBUG
            maxBytes: 10485760
            filters: [request_context_filter, internal_log_filter]
          subscription_file_handler:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/subscription_api_server.log
            formatter: standard
            level: DEBUG
            maxBytes: 10485760
          admin_file_handler:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/admin_api_server.log
            formatter: standard
            level: DEBUG
            maxBytes: 10485760
          client_file_handler:
            backupCount: 20
            class: logging.handlers.RotatingFileHandler
            encoding: utf8
            filename: /opt/kasm/current/log/client_api_server.log
            formatter: standard
            level: DEBUG
            maxBytes: 10485760
            filters: [ internal_log_filter ]
          stream:
            class: logging.StreamHandler
            formatter: standard
            level: DEBUG
            filters: [ internal_log_filter ]
          syslog:
            class: logging.handlers.SysLogHandler
            formatter: pythonjsonlogger
            level: DEBUG
            filters: [ internal_log_filter ]
        loggers:
          ? ''
          : handlers:
            - stream
            - syslog
            - file_handler
            - file_handler_json
            level: DEBUG
            propagate: true
          client_api_server:
            handlers:
              - client_file_handler
          admin_api_server:
            handlers:
              - admin_file_handler
          subscription_api_server:
            handlers:
              - subscription_file_handler
          cherrypy.error:
            level: INFO
          cherrypy.access:
            level: INFO
          sqlalchemy.pool:
            level: WARNING
          sqlalchemy.pool.status:
            level: WARNING
          sqlalchemy.engine:
            level: WARNING
          sqlalchemy.dialects:
            level: WARNING
          sqlalchemy.orm:
            level: WARNING
          requests_oauthlib:
            level: INFO
          database_models:
            level: INFO
          googleapiclient.discovery_cache:
            level: ERROR
          keystoneauth.session:
            level: WARNING
          novaclient.v2.client:
            level: WARNING
          botocore:
            level: WARNING
          azure:
            level: WARNING
        version: 1
    manager:
      manager_id: null
      update_timer: 86400
      support_bundle_timer: 60
    server:
      server_id: null
      server_hostname: null
      zone_name: default
      sanitize_errors: true
      internal_schema: https
    share:
      share_id: null
{{- end }}