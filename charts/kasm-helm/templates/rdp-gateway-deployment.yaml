{{/*
Deploy the RDP Gateway if .Values.components.rdpGateway.enabled set to true
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $rdpGatewayReplicas := ternary .Values.components.rdpGateway.replicas (include "replicas.preset" (dict "node" $constants.rdpGateway.component "size" .Values.deploymentSize)) (gt (int .Values.components.rdpGateway.replicas) 0) -}}
{{/*
  Multi-replica rdp-gateway is not supported in this release.
*/}}
{{- if gt (int $rdpGatewayReplicas) 1 -}}
  {{- fail "components.rdpGateway.replicas must be 1. Multi-replica rdp-gateway is not supported in this release." -}}
{{- end -}}
{{- $merged := fromYaml (include "kasm.mergedValues" (dict "root" . "componentName" "rdpGateway")) -}}
{{- if .Values.components.rdpGateway.enabled }}
{{- range $zone := (include "kasm.primaryRegionZones" $ | fromYamlArray) }}
---
{{ $rdpGwSvc := printf "%s-rdp-gateway-%s" $.Release.Name (include "kasm.zoneName" $zone.name) -}}
{{- $serverName := $rdpGwSvc -}}
{{- if and $.Values.directRdpService.enabled $.Values.directRdpService.rdpAccessURL }}
  {{- $serverName = $.Values.directRdpService.rdpAccessURL -}}
{{- else if $.Values.directRdpService.enabled }}
  {{- fail "directRdpService.rdpAccessURL must be set if directRdpService.enabled is true." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "rdpGateway" "resource" "deployment" "zone" $zone.name "include" "all") | indent 2 }}
spec:
  replicas: {{ $rdpGatewayReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: {{ add1 $rdpGatewayReplicas }}
  selector:
    matchLabels:
      {{- include "kasm.metadata" (dict "context" $ "component" "rdpGateway" "resource" "deployment" "zone" $zone.name "include" "match") | indent 6 }}
  template:
    metadata:
      {{- include "kasm.metadata" (dict "context" $ "component" "rdpGateway" "resource" "pod" "zone" $zone.name "include" "la") | indent 6 }}
    spec:
      restartPolicy: {{ $.Values.restartPolicy }}
      {{- if $.Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecrets.name | default (printf "%s-image-pull-secret" $.Release.Name) }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- include "kasm.securityContext" (list $ 1000 "pod") | nindent 6 }}
      initContainers:
        {{- include "kasm.trustedCaInit" (list $ "rpdgw") | nindent 8 }}
        {{- include "kasm.initContainer" (dict "context" $ "serviceName" (printf "%s-%s" $constants.api.svc (include "kasm.zoneName" $zone.name)) "servicePort" $constants.api.port "path" "/api/__healthcheck" "schema" "http" "image" $constants.api.image "component" "api") | nindent 8 }}
        {{- with $merged.extraInitContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ include "kasm.name" (list $ "rdpGateway" "container") }}
          image: {{ $constants.rdpGateway.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: SERVER_ZONE_NAME
              value: {{ $zone.name | quote }}
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: service-token
            - name: SERVER_HOSTNAME
              value: {{ $serverName }}
            - name: KASM_EPHEMERAL
              value: "true"
            - name: API_SCHEMA
              value: "http"
            {{/*
              Connection proxies must reach the manager's /manager_api/ endpoint
              (support-bundle uploads) as well as /api/ (registration/heartbeat).
              Only the kasm-proxy nginx service serves both on one port, so point
              the API endpoint at it rather than the api (CherryPy) service.
            */}}
            - name: API_HOSTNAME
              value: {{ printf "%s-%s" $constants.api.svc (include "kasm.zoneName" $zone.name) | quote }}
            - name: API_PORT
              value: {{ $constants.proxy.http | quote }}
            - name: API_REFRESH_INTERVAL
              value: "30"
            - name: SERVER_ID
              value: "auto"
            - name: PROXY_PORT
              value: "3389"
            - name: SERVER_PORT
              value: {{ $constants.rdpGateway.nginxPort | quote }}
            - name: SERVER_THREADS
              value: "10"
            - name: SESSION_WATCH_INTERVAL
              value: "60"
            - name: KEEPALIVE_LOOP_INTERVAL
              value: "30"
            - name: FORWARD_LOGS
              value: "true"
          ports:
            - name: {{ $constants.rdpGateway.portName }}
              containerPort: 5555
              protocol: TCP
          {{- if $.Values.applyHealthChecks }}
          livenessProbe:
            {{- include "health.probe" (dict "root" $ "component" "rdpGateway" "probeType" "livenessProbe" "type" "tcp" "portName" $constants.rdpGateway.portName) | nindent 12 }}
          readinessProbe:
            {{- include "health.probe" (dict "root" $ "component" "rdpGateway" "probeType" "readinessProbe" "type" "http" "path" "/__healthcheck" "portName" $constants.rdpGateway.portName) | nindent 12 }}
          {{- end }}
          {{- if $.Values.components.rdpGateway.resources }}
          resources: {{- toYaml $.Values.components.rdpGateway.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" $constants.rdpGateway.component "size" $.Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- include "kasm.securityContext" (list $ 1000 "container") | nindent 10 }}
          volumeMounts:
            - name: kasm-rdp-gateway-cert
              mountPath: /usr/local/etc/rdpproxy/rdpproxy.crt
              subPath: tls.crt
            - name: kasm-rdp-gateway-cert
              mountPath: /usr/local/etc/rdpproxy/rdpproxy.key
              subPath: tls.key
            - name: kasm-rdp-gateway-data
              mountPath: /usr/local/etc/rdpproxy/var
            - name: kasm-rdp-gateway-data
              mountPath: /opt/kasm/current/log
            - name: kasm-rdp-gateway-data
              mountPath: /tmp
            - name: kasm-rdp-gateway-config
              mountPath: /usr/local/etc/rdpproxy/conf/passthrough.app.config.yaml
              subPath: passthrough.app.config.yaml
            {{- if $.Values.components.rdpGateway.iniConfigMapName }}
            - name: kasm-rdp-gateway-ini
              mountPath: /usr/local/etc/rdpproxy/conf/rdpproxy.ini
              subPath: rdpproxy.ini
            {{- end }}
          {{- with $merged.containerMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "kasm.trustedCaVolumeMounts" $ | nindent 12 }}
        - name: {{ printf "%s-rdp-gateway-nginx" $.Release.Name }}
          image: {{ $constants.proxy.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: rdp-gw-nginx-pt
              containerPort: {{ $constants.rdpGateway.nginxPort }}
              protocol: TCP
          volumeMounts:
            - name: kasm-rdp-gateway-nginx-shared
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: kasm-rdp-gateway-nginx-shared
              mountPath: /etc/nginx/compress.conf
              subPath: compress.conf
            - name: kasm-rdp-gateway-nginx-shared
              mountPath: /etc/nginx/logging.conf
              subPath: logging.conf
            - name: kasm-rdp-gateway-nginx-shared
              mountPath: /etc/nginx/orchestrator.conf
              subPath: orchestrator.conf
            - name: kasm-rdp-gateway-nginx-settings
              mountPath: /etc/nginx/conf.d
            - name: kasm-rdp-gateway-nginx-services
              mountPath: /etc/nginx/conf.d/services.d
            - name: kasm-rdp-gateway-nginx-data
              mountPath: /var/cache/nginx
            - name: kasm-rdp-gateway-nginx-data
              mountPath: /run
            - name: kasm-rdp-gateway-nginx-log-tmp
              mountPath: /var/log/nginx
            - name: kasm-rdp-gateway-cert
              mountPath: /etc/nginx/ssl/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: kasm-rdp-gateway-cert
              mountPath: /etc/nginx/ssl/tls.key
              subPath: tls.key
              readOnly: true
            {{- include "kasm.trustedCaVolumeMounts" $ | nindent 12 }}
          {{- if $.Values.applyHealthChecks }}
          livenessProbe:
            {{- include "health.probe" (dict "root" $ "component" "rdpGateway" "timingScope" "nginxSidecar" "probeType" "livenessProbe" "type" "tcp" "portName" "rdp-gw-nginx-pt") | nindent 12 }}
          readinessProbe:
            {{- include "health.probe" (dict "root" $ "component" "rdpGateway" "timingScope" "nginxSidecar" "probeType" "readinessProbe" "type" "https" "path" "/__healthcheck" "portName" "rdp-gw-nginx-pt") | nindent 12 }}
          {{- end }}
          {{- if $.Values.components.rdpGateway.nginxSidecar.resources }}
          resources: {{- toYaml $.Values.components.rdpGateway.nginxSidecar.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" "nginx-sidecar" "size" $.Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- include "kasm.securityContext" (list $ 1000 "container") | nindent 10 }}
        {{- with $merged.extraContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: kasm-rdp-gateway-cert
          secret:
            secretName: {{ $.Values.certificate.secretName | default (include "kasm.name" (list $ "cert-manager" "secret")) }}
        - name: kasm-rdp-gateway-data
          emptyDir:
            sizeLimit: 1Gi
        - name: kasm-rdp-gateway-config
          configMap:
            name: {{ include "kasm.name" (list $ "rdpGateway-app-config") }}
        {{- if $.Values.components.rdpGateway.iniConfigMapName }}
        - name: kasm-rdp-gateway-ini
          configMap:
            name: {{ $.Values.components.rdpGateway.iniConfigMapName }}
            items:
              - key: rdpproxy.ini
                path: rdpproxy.ini
        {{- end }}
        - name: kasm-rdp-gateway-nginx-shared
          configMap:
            name: {{ include "kasm.name" (list $ "nginx-shared") }}
        - name: kasm-rdp-gateway-nginx-settings
          configMap:
            name: {{ include "kasm.name" (list $ "rdp-gateway-nginx-settings") }}
        - name: kasm-rdp-gateway-nginx-services
          configMap:
            name: {{ include "kasm.name" (list $ "rdp-gateway-nginx-services") }}
        - name: kasm-rdp-gateway-nginx-data
          emptyDir:
            sizeLimit: 100Mi
        - name: kasm-rdp-gateway-nginx-log-tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- with $merged.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "kasm.trustedCaVolumes" $ | nindent 8 }}
{{- end }}
{{- end }}