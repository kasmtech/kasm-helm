{{/*
Deploy Kasm Proxy Service .Values.components.api service definition
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $serviceKeepalive := 16 -}}
{{- range $idx, $zone := (.Values.kasmZones | default (list (dict "name" "default"))) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "proxy-settings" "resource" "configMap" "zone" $zone.name "include" "all") | indent 2 }}
data:
  resolver.conf: |
    resolver {{ include "kasm.nginxResolver" $ }} valid=10s ipv6=off;

  listener.conf: |
    server {
      listen {{ $constants.proxy.https }} ssl;
      server_name ubuntu-base;

      ssl_certificate /etc/ssl/certs/kasm_nginx.crt;
      ssl_certificate_key /etc/ssl/private/kasm_nginx.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers   off;
      ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
      ssl_stapling on;
      ssl_stapling_verify on;

      include /etc/nginx/conf.d/services.d/*.conf;
      include /etc/nginx/conf.d/containers.d/*.conf;

      client_max_body_size 1G;
      server_tokens off;

      # Hide error messages from upstream servers
      proxy_intercept_errors on;
      error_page 500 = @internal_error;
      location @internal_error {
        default_type "text/html";
        return 500 "<H1>Internal Error</H1>";
      }
    }

  listener_http.conf: |
    server {
      listen {{ $constants.proxy.http }};
      server_name ubuntu-base;

      include /etc/nginx/conf.d/services.d/*.conf;
      include /etc/nginx/conf.d/containers.d/*.conf;

      client_max_body_size 1G;
      server_tokens off;

      # Hide error messages from upstream servers
      proxy_intercept_errors on;
      error_page 500 = @internal_error;
      location @internal_error {
          default_type "text/html";
          return 500 "<H1>Internal Error</H1>";
      }
    }
  
  upstream_api.conf: |
    upstream {{ $constants.api.svc }} {
      server {{ printf "%s:%s" (printf "%s-%s" $constants.api.svc (include "kasm.zoneName" $zone.name)) ($constants.api.port | toString) }};
      keepalive {{ $serviceKeepalive }};
      keepalive_timeout 30s;
    }

  {{- if $.Values.observability.enabled }}
  otel.conf: |
    # http-context OTel tracing. Exports to the Collector sidecar in this pod over loopback:
    # ngx_otel_module is gRPC-only and cannot present a bearer token, so it needs an
    # unauthenticated receiver, and a loopback one is unreachable from anywhere else.
    otel_exporter {
      endpoint 127.0.0.1:{{ $constants.otel.otlpNginx }};
    }

    otel_service_name  kasm-proxy;
    otel_trace          on;
    otel_trace_context  propagate;

  stub_status.conf: |
    server {
      listen 127.0.0.1:{{ $constants.proxyStubStatus }};
      location = /stub_status {
        otel_trace off;
        stub_status;
        # loopback-only: the only consumer is the Collector sidecar, which shares this pod's
        # network namespace. Anything else must be explicitly allowed by the operator.
        allow 127.0.0.1;
        deny  all;
      }
    }
  {{- end }}

{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "proxy-services" "resource" "configMap" "include" "all") | indent 2 }}
data:
  health.conf: |
    location = /health {
      {{- if $.Values.observability.enabled }}
      otel_trace off;
      {{- end }}
      default_type application/json;
      # Zone-health flag: separate from the agent drain (internal_agents.conf) so an
      # operator can shed agent traffic without pulling this node out of the
      # LB/zone-health pool mid in-flight-request.
      if (-f /opt/kasm/current/tmp/api/kasm_api_draining) {
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"status": "disabled"}';
      }
      return 200 '{"status": "ok"}';
    }

  closest.conf: |
    location /checkvalid {
      {{- if $.Values.observability.enabled }}
      otel_trace off;
      {{- end }}
      return 200 'ok';
      add_header Access-Control-Allow-Origin *;
      add_header Content-Type text/plain;
    }

  admin_api.conf: |
    location /api/admin/ {
      {{- if $.Values.observability.enabled }}
      otel_span_name "$request_method /api/admin/";
      otel_span_attr http.method $request_method;
      otel_span_attr http.target $request_uri;
      otel_span_attr http.status $status;
      {{- end }}
      proxy_http_version	    1.1;
      proxy_set_header	      Host $host;
      proxy_set_header	      Upgrade $http_upgrade;
      proxy_set_header	      Connection $connection_upgrade;
      proxy_set_header	      X-Real-IP $remote_addr;
      proxy_set_header	      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header	      X-Forwarded-Proto $x_forwarded_proto;
      proxy_set_header	      X-Forwarded-Port $x_forwarded_port;
      add_header              Strict-Transport-Security "max-age=63072000" always;
      proxy_pass	            {{ printf "http://%s" $constants.api.svc }};
    }

  client_api.conf: |
    location /api/ {
      {{- if $.Values.observability.enabled }}
      otel_span_name "$request_method /api/";
      otel_span_attr http.method $request_method;
      otel_span_attr http.target $request_uri;
      otel_span_attr http.status $status;
      {{- end }}
      proxy_http_version	    1.1;
      proxy_set_header	      Host $host;
      proxy_set_header	      Upgrade $http_upgrade;
      proxy_set_header	      Connection $connection_upgrade;
      proxy_set_header	      X-Real-IP $remote_addr;
      proxy_set_header	      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header	      X-Forwarded-Proto $x_forwarded_proto;
      proxy_set_header	      X-Forwarded-Port $x_forwarded_port;
      add_header              Strict-Transport-Security "max-age=63072000" always;
      proxy_pass	            {{ printf "http://%s" $constants.api.svc }};
    }

  internal_agents.conf: |
    # The agents' Internal prefixes. Everything else under /api/internal/ is served
    # by the generic /api/ location; these two carry the agent drain, which lets a
    # node being replaced shed its agents to a peer (they fail over across the API
    # endpoints they were given) while it keeps serving users.
    {{- range $prefix := list "/api/internal/agent-vm/" "/api/internal/agent-k8s/" }}
    location {{ $prefix }} {
      {{- if $.Values.observability.enabled }}
      otel_span_name "$request_method {{ $prefix }}";
      otel_span_attr http.method $request_method;
      otel_span_attr http.target $request_uri;
      otel_span_attr http.status $status;
      {{- end }}

      # Agent drain, withdrawn before /health: a node being replaced sheds
      # agent traffic to a peer while its in-flight user requests finish.
      if (-f /opt/kasm/current/tmp/api/kasm_agent_draining) {
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        return 503;
      }

      proxy_http_version	    1.1;
      proxy_set_header	      Host $host;
      proxy_set_header	      Upgrade $http_upgrade;
      proxy_set_header	      Connection $connection_upgrade;
      proxy_set_header	      X-Real-IP $remote_addr;
      proxy_set_header	      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header	      X-Forwarded-Proto $x_forwarded_proto;
      proxy_set_header	      X-Forwarded-Port $x_forwarded_port;
      proxy_pass	            {{ printf "http://%s" $constants.api.svc }};
    }
    {{- end }}

  subscription_api.conf: |
    location /api/subscriptions/ {
      add_header              'Access-Control-Allow-Origin' 'https://www.kasmweb.com' always;
      add_header              'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header              'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
      add_header              'Access-Control-Allow-Credentials' 'true';

      if ($request_method = 'OPTIONS') {
          return 204;
      }

      proxy_http_version	    1.1;
      proxy_set_header	      Host $host;
      proxy_set_header	      Upgrade $http_upgrade;
      proxy_set_header	      Connection $connection_upgrade;
      proxy_set_header	      X-Real-IP $remote_addr;
      proxy_set_header	      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header	      X-Forwarded-Proto $scheme;
      add_header              Strict-Transport-Security "max-age=63072000" always;
      proxy_pass	            {{ printf "http://%s" $constants.api.svc }};
    }

  upstream_proxy.conf: |
    location /kasm_connect {
      {{- if $.Values.observability.enabled }}
      # auth_request gotcha: exclude this internal subrequest so the OTel module
      # doesn't inject a stale traceparent into the auth call instead of the real
      # upstream. Matches the backend's commented state pending validation.
      # otel_trace          off;
      {{- end }}
      internal;
      proxy_pass              {{ printf "http://%s/api/kasm_connect/" $constants.api.svc }};
      proxy_pass_request_body off;
      proxy_set_header        Content-Length '';
      proxy_set_header        X-Original-URI $request_uri;
      proxy_set_header        Cookie "username=$cookie_username; session_token=$cookie_session_token; kasm_client_key=$cookie_kasm_client_key";
      proxy_http_version      1.1;
      proxy_set_header        Connection "";
    }

    location /desktop/ {
      {{- if $.Values.observability.enabled }}
      # long-lived WebSocket tunnel — traces stay open for the entire session
      # duration (potentially hours), so tracing is excluded here.
      otel_trace  off;
      {{- end }}
      if ($request_method = OPTIONS) {
        rewrite .* /_options_response last;
      }

      auth_request            /kasm_connect;
      auth_request_set        $connect_hostname     $upstream_http_connect_hostname;
      auth_request_set        $connect_port         $upstream_http_connect_port;
      auth_request_set        $connect_path         $upstream_http_connect_path;
      auth_request_set        $connect_auth         $upstream_http_connect_auth;
      auth_request_set        $connect_kasm_id      $upstream_http_connect_kasm_id;
      auth_request_set        $connect_schema       $upstream_http_connect_schema;
      proxy_http_version      1.1;
      proxy_set_header        Host $host;
      proxy_set_header        Upgrade $http_upgrade;
      proxy_set_header        Connection "upgrade";
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;
      proxy_set_header        Authorization "${connect_auth}";
      proxy_set_header        X-Kasm-ID "${connect_kasm_id}";
      proxy_set_header        Cookie "username=$cookie_username; session_token=$cookie_session_token; kasm_client_key=$cookie_kasm_client_key";
      {{- if $.Values.observability.enabled }}
      otel_span_attr          kasm.kasm_id            "$connect_kasm_id";
      otel_span_attr          kasm.kasm_user_name     "$cookie_username";
      {{- end }}
      rewrite                 ^/desktop/(.*) /$1 break;
      proxy_pass              $connect_schema://$connect_hostname:$connect_port/$connect_path;
      proxy_read_timeout      1800s;
      proxy_send_timeout      1800s;
      proxy_connect_timeout   1800s;
      proxy_buffering         off;
      client_max_body_size    1G;
      expires                 4h;
      add_header              Cache-Control "private";
      proxy_hide_header       'Access-Control-Allow-Credentials';
      proxy_hide_header       'Access-Control-Allow-Origin';
      proxy_hide_header       'Access-Control-Allow-Methods';
      proxy_hide_header       'Access-Control-Allow-Headers';
      proxy_hide_header       'Strict-Transport-Security';
      proxy_hide_header       'X-Content-Type-Options';
      add_header              'Access-Control-Allow-Origin' $http_origin 'always';
      add_header              'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' 'always';
      add_header              'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' 'always';
      add_header              'Access-Control-Allow-Credentials' 'true' 'always';
      add_header              'Strict-Transport-Security' "max-age=63072000" always;
      add_header              'X-Content-Type-Options' 'nosniff';

    }

    location /_options_response {
      add_header          'Access-Control-Allow-Origin' $http_origin 'always';
      add_header          'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' 'always';
      add_header          'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' 'always';
      add_header          'Access-Control-Allow-Credentials' 'true' 'always';
      add_header          'Strict-Transport-Security' "max-age=63072000" always;
      add_header          'X-Content-Type-Options' 'nosniff';
      add_header          Content-Type text/plain;
      add_header          Content-Length 0;
      return 204;
    }

  otel_browser.conf: |
    {{- if and $.Values.observability.enabled $.Values.observability.browser.enabled }}
    location = /otel-config.js {
        otel_trace     off;
        default_type   application/javascript;
        add_header     Cache-Control "no-store";
        return 200     'window.__OTEL__={"enabled":true,"endpoint":"/api/telemetry","serviceName":"kasm-web"};';
    }

    # /otel-time — NTP-style time probe for browser clock-skew correction.
    # $msec is request-arrival time in *seconds* with millisecond resolution;
    # the browser parses it as float seconds and multiplies by 1000.
    location = /otel-time {
        otel_trace off;
        default_type   application/json;
        add_header     Cache-Control "no-store";
        return 200     '{"server_time_ms":$msec}';
    }
    {{- else if $.Values.observability.enabled }}
    location = /otel-config.js {
        otel_trace     off;
        default_type   application/javascript;
        add_header     Cache-Control "no-store";
        return 200     'window.__OTEL__={"enabled":false};';
    }
    {{- else }}
    location = /otel-config.js {
        default_type   application/javascript;
        add_header     Cache-Control "no-store";
        return 200     'window.__OTEL__={"enabled":false};';
    }
    {{- end }}

  website.conf: |
    location / {
        rewrite               ^/workspace/(.+)/(.+)/(.+)/(.+)/(.+)/(.+)$ /$2/$3/$4/$5/$6 last; # dynamic manifest
        rewrite               ^/workspace/(.+)/(.+)/(.+)/(.+)$ /$2/$3/$4 last; # admin api /
        rewrite               ^/workspace/(.+)/(.+)/(.+)$ /$2/$3 last; # client api / images
        rewrite               ^/workspace/(.+)/(.*)$ /$2 break; # UI
        expires               4h;
        add_header            Cache-Control "private";
        add_header            X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";
        add_header            'Access-Control-Allow-Origin' $http_origin always;
        add_header            'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header            'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header            'Access-Control-Allow-Credentials' 'true';
        add_header            'Strict-Transport-Security' "max-age=63072000" always;
        add_header            'X-Content-Type-Options' 'nosniff';
        # Optional, non-default, security headers
        #add_header           'Cross-Origin-Embedder-Policy' 'require-corp';
        #add_header           'Content-Security-Policy' "default-src 'unsafe-inline' 'unsafe-eval' 'self' blob: data:;";

        root /srv/www;
    }
