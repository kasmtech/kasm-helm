{{/*
Initialize the DB
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- if .Values.dbManagement.initialize }}
{{- $passwordSecretName := $constants.secrets.name }}
{{- $preseedSecretName := printf "%s-db-preseed" .Release.Name }}
{{- $existingDefaultPropertiesSecret := dig "existingDefaultPropertiesSecret" "name" "" .Values.kasmConfig }}
{{- $existingDefaultPropertiesKey := dig "existingDefaultPropertiesSecret" "key" "default_properties.yaml" .Values.kasmConfig }}
{{- $adminUsername := dig "adminUsername" "admin@kasm.local" .Values.kasmConfig }}
{{- $authDomain := dig "authDomain" "" .Values.kasmConfig }}
{{- $generatePreseed := and .Values.kasmConfig .Values.kasmConfig.generatePreseed }}
{{/* The prepare-db-preseed initContainer rewrites the seed file the db-init container reads. Any
     one of the three inputs is reason enough to render it: a chart-generated custom_properties to
     merge, a customer-supplied default_properties to swap in, or an auth domain to stamp. */}}
{{- $preparePreseed := or $generatePreseed $existingDefaultPropertiesSecret $authDomain }}
{{/* admin@kasm.local only stops being the seeded admin account when preseed's defaultUsers
     replaces it with a renamed, non-built-in admin account. Otherwise (preseed disabled, or
     defaultUsers disabled) the app's baked-in default seed still creates admin@kasm.local. */}}
{{- $builtInAdminExists := or (not .Values.kasmConfig.generatePreseed) (not (dig "defaultUsers" false .Values.kasmConfig)) (eq $adminUsername "admin@kasm.local") }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "db-init" "resource" "job" "include" "all") | indent 2 }}
spec:
  ttlSecondsAfterFinished: {{ .Values.dbManagement.initJobTTLSecondsAfterFinished | default 300 }}
  template:
    metadata:
      {{- include "kasm.metadata" (dict "context" . "component" "db-init" "resource" "pod" "include" "la") | indent 6 }}
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name | default (printf "%s-image-pull-secret" .Release.Name) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      {{- include "kasm.securityContext" (list . 1000 "pod") | nindent 6 }}
      initContainers:
        {{- include "kasm.trustedCaInit" (list . "api") | nindent 8 }}
        {{- if $preparePreseed }}
        - name: prepare-db-preseed
          image: {{ $constants.api.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if $authDomain }}
          env:
            # Passed through the environment rather than interpolated into the yq program below, so
            # the domain can never break out of the single-quoted expression.
            - name: KASM_AUTH_DOMAIN
              value: {{ $authDomain | quote }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail

              SOURCE_SEED_DIR="/opt/kasm/current/conf/database/seed_data"
              WRITABLE_SEED_DIR="/seed_data"
              DEFAULT_PROPERTIES="${WRITABLE_SEED_DIR}/default_properties.yaml"
              EXISTING_DEFAULT_PROPERTIES="/existing-preseed/default_properties.yaml"
              CUSTOM_PROPERTIES="/custom-preseed/custom_properties.yaml"
              MERGED_PROPERTIES="${WRITABLE_SEED_DIR}/combined_properties.yaml"
              YQ_BIN="/usr/bin/yq_$(uname -m)"
              if [[ ! -x "${YQ_BIN}" ]]; then
                echo "yq binary not found or not executable at ${YQ_BIN}" >&2
                exit 1
              fi

              if [[ ! -f "${SOURCE_SEED_DIR}/default_properties.yaml" ]]; then
                echo "Default seed file was not found: ${SOURCE_SEED_DIR}/default_properties.yaml" >&2
                exit 1
              fi

              mkdir -p "${WRITABLE_SEED_DIR}"

              # Preserve any other seed_data files that may exist in the image.
              cp -r "${SOURCE_SEED_DIR}/." "${WRITABLE_SEED_DIR}/"

              {{- if $existingDefaultPropertiesSecret }}
              if [[ ! -f "${EXISTING_DEFAULT_PROPERTIES}" ]]; then
                echo "Customer-provided seed file was not found: ${EXISTING_DEFAULT_PROPERTIES}" >&2
                exit 1
              fi

              # Replace the image's baked-in default seed file wholesale with the customer-provided one.
              cp "${EXISTING_DEFAULT_PROPERTIES}" "${DEFAULT_PROPERTIES}"
              echo "Applied customer-provided default_properties.yaml from Secret."
              {{- end }}

              {{- if $generatePreseed }}
              if [[ ! -f "${CUSTOM_PROPERTIES}" ]]; then
                echo "Custom preseed file was not found: ${CUSTOM_PROPERTIES}" >&2
                exit 1
              fi

              # .settings is an UPSERT keyed on (name, category) — the pair Kasm looks a setting up
              # by — not a list concatenation. Appending instead would leave two rows for any
              # setting that already exists in the default seed (kasm_auth_domain, and 86 others),
              # and every /api/authenticate would then fail with a 500 (sqlalchemy
              # MultipleResultsFound) until one row was deleted by hand.
              "${YQ_BIN}" -n '
                load("'"${DEFAULT_PROPERTIES}"'") as $default |
                load("'"${CUSTOM_PROPERTIES}"'") as $custom |
                ($default.settings // []) as $defaultSettings |
                ($custom.settings // []) as $customSettings |
                (
                  $default * (
                    $custom
                    | with_entries(
                        select(
                          (.value | tag) != "!!seq" or (.value | length) > 0
                        )
                      )
                  )
                ) |
                .group_settings = (
                  (($default.group_settings // []) | map(select(.group_id == null))) +
                  ($custom.group_settings // [])
                ) |
                .settings = (
                  (
                    $defaultSettings
                    | map(
                        . as $d |
                        (
                          $customSettings
                          | map(select(.name == $d.name and .category == $d.category))
                          | select(length > 0)
                          | .[-1]
                        ) // $d
                      )
                  )
                  +
                  (
                    $customSettings
                    | map(
                        . as $c |
                        select(
                          (
                            $defaultSettings
                            | map(select(.name == $c.name and .category == $c.category))
                            | length
                          ) == 0
                        )
                      )
                  )
                )
              ' > "${MERGED_PROPERTIES}"

              # startup.sh copies this exact file path from the seed_data dir to /tmp.
              mv "${MERGED_PROPERTIES}" "${DEFAULT_PROPERTIES}"

              echo "Merged custom preseed into ${DEFAULT_PROPERTIES}."
              {{- end }}

              {{- if $authDomain }}
              # Applied last, against the finished file, so it wins over both the customer-supplied
              # seed and the custom merge above regardless of what either of them set.
              "${YQ_BIN}" -i '
                strenv(KASM_AUTH_DOMAIN) as $domain |
                (.settings // []) as $settings |
                ($settings | map(select(.name == "kasm_auth_domain")) | length) as $existing |
                .settings = (
                  ($settings | (.[] | select(.name == "kasm_auth_domain") | .value) = $domain)
                  +
                  (
                    [
                      {
                        "category": "auth",
                        "description": "Override the domain used in the Kasm session cookie.",
                        "name": "kasm_auth_domain",
                        "sanitize": false,
                        "services_restart": null,
                        "title": "Kasm Authorization Domain",
                        "value": $domain,
                        "value_type": "string"
                      }
                    ]
                    | map(select($existing == 0))
                  )
                )
              ' "${DEFAULT_PROPERTIES}"

              echo "Set kasm_auth_domain to ${KASM_AUTH_DOMAIN} in ${DEFAULT_PROPERTIES}."
              {{- end }}
          volumeMounts:
            - name: db-preseed-data
              mountPath: /seed_data
            {{- if $generatePreseed }}
            - name: custom-db-preseed
              mountPath: /custom-preseed/custom_properties.yaml
              subPath: custom_properties.yaml
              readOnly: true
            {{- end }}
            {{- if $existingDefaultPropertiesSecret }}
            - name: existing-db-preseed
              mountPath: /existing-preseed/default_properties.yaml
              subPath: {{ $existingDefaultPropertiesKey }}
              readOnly: true
            {{- end }}
            - name: tmp-data
              mountPath: /tmp
        {{- end }}
        {{- include "kasm.dbIsReady" (dict "context" . "function" "init") | nindent 8 }}
      containers:
        - name: {{ include "kasm.name" (list . "dbInit" "container") }}
          image: {{ $constants.api.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: SERVER_HOSTNAME
              value: {{ $constants.api.svc }}
            - name: POST_DB_INIT_EXIT
              value: "true"
            - name: DB_AUTO_INITIALIZE
              value: {{ .Values.dbManagement.initialize | quote }}
            - name: POSTGRES_HOST
              value: {{ $constants.db.svc | quote }}
            - name: POSTGRES_PORT
              value: {{ $constants.db.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.kasmDbName }}
            - name: POSTGRES_USER
              value: {{ .Values.database.kasmDbUser }}
            {{- include "kasm.trustedCaEnv" $ | indent 12 }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                {{- if .Values.database.kasmDbSecret -}}
                {{ .Values.database.kasmDbSecret | toYaml | nindent 18 }}
                {{- else }}
                  name: {{ $passwordSecretName }}
                  key: "db-password"
                {{- end }}
            {{- if $builtInAdminExists }}
            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $passwordSecretName }}
                  key: admin-password
            {{- end }}
            - name: DEFAULT_MANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $passwordSecretName }}
                  key: manager-token
            - name: DEFAULT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $passwordSecretName }}
                  key: service-token
            - name: DEFAULT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $passwordSecretName }}
                  key: user-password
            {{- if and .Values.database.standalone .Values.database.postgresMasterUser }}
            - name: DATABASE_MASTER_USER
              value: {{ .Values.database.postgresMasterUser.username }}
            - name: DATABASE_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.postgresMasterUser.secret.name }}
                  key: {{ .Values.database.postgresMasterUser.secret.key }}
            {{- end }}
          resources: {{- include "resources.preset" (dict "node" "api" "size" "small") | nindent 12 }}
          command:
            - "/bin/bash"
            - "-c"
          args:
            - |
              if [[ "$DB_AUTO_INITIALIZE" == "true" ]]; then
                cp /src/api_server/data/migration/alembic.ini /tmp/alembic.ini
                sed -i 's|script_location = %(here)s/alembic|script_location = /src/api_server/data/migration/alembic|g' /tmp/alembic.ini
                sed -i 's/# sourceless = false/sourceless = true/g' /tmp/alembic.ini

                for attempt in $(seq 1 12); do
                  zone_count=$(
                    PGCONNECT_TIMEOUT={{ .Values.dbManagement.dbConnectionTimeout }} PGPASSWORD="${POSTGRES_PASSWORD}" \
                      psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -p "${POSTGRES_PORT}" -h "${POSTGRES_HOST}" \
                      -t -c "select zone_id from zones" 2>/dev/null | wc -l
                  )
                  if [[ "${zone_count}" -ge 2 ]] && \
                    alembic -c /tmp/alembic.ini \
                      -x kasm_config=/opt/kasm/current/conf/app/api/api.app.config.yaml current \
                      | grep -q "(head)"; then
                    echo "Database initialization verified."
                    exit 0
                  fi

                  echo "Database initialization verification failed after startup attempt ${attempt}/12. Retrying..."
                  sleep 5
              
                  /usr/bin/startup.sh || true
                done

                echo "Database initialization did not reach the expected ready state." >&2
                exit 1
              else
                echo "DB already initialized."
              fi
          {{- include "kasm.securityContext" (list . 1000 "container") | nindent 10 }}
          volumeMounts:
            - name: tmp-data
              mountPath: /tmp
            {{- if $preparePreseed }}
            - name: db-preseed-data
              mountPath: /opt/kasm/current/conf/database/seed_data
              readOnly: true
            {{- end }}
            {{- include "kasm.trustedCaVolumeMounts" . | nindent 12 }}
      volumes:
        - name: tmp-data
          emptyDir:
            sizeLimit: 256Mi
        {{- if $preparePreseed }}
        - name: db-preseed-data
          emptyDir:
            sizeLimit: 16Mi
        {{- end }}
        {{- if $generatePreseed }}
        - name: custom-db-preseed
          secret:
            secretName: {{ $preseedSecretName }}
            items:
              - key: custom_properties.yaml
                path: custom_properties.yaml
        {{- end }}
        {{- if $existingDefaultPropertiesSecret }}
        - name: existing-db-preseed
          secret:
            secretName: {{ $existingDefaultPropertiesSecret }}
            items:
              - key: {{ $existingDefaultPropertiesKey }}
                path: {{ $existingDefaultPropertiesKey }}
        {{- end }}
        {{- include "kasm.trustedCaVolumes" . | nindent 8 }}
{{- end }}
