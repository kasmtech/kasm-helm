{{/*
Initialize the DB
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- if .Values.dbManagement.initialize }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "db-init" "resource" "job" "include" "all") | indent 2 }}
spec:
  ttlSecondsAfterFinished: {{ .Values.dbManagement.initJobTTLSecondsAfterFinished | default 300 }}
  template:
    metadata:
      {{- include "kasm.metadata" (dict "context" . "component" "db-init" "resource" "pod" "include" "la") | indent 6 }}
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name | default (printf "%s-image-pull-secret" .Release.Name) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      {{- include "kasm.securityContext" (list . 1000 "pod") | nindent 6 }}
      initContainers:
        {{- include "kasm.trustedCaInit" (list . "api") | nindent 8 }}
        {{- include "kasm.dbIsReady" (dict "context" . "function" "init") | nindent 8 }}
      containers:
        - name: {{ include "kasm.name" (list . "dbInit" "container") }}
          image: {{ $constants.api.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: SERVER_HOSTNAME
              value: {{ $constants.api.svc }}
            - name: POST_DB_INIT_EXIT
              value: "true"
            - name: DB_AUTO_INITIALIZE
              value: {{ .Values.dbManagement.initialize | quote }}
            - name: POSTGRES_HOST
              value: {{ $constants.db.svc | quote }}
            - name: POSTGRES_PORT
              value: {{ $constants.db.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.kasmDbName }}
            - name: POSTGRES_USER
              value: {{ .Values.database.kasmDbUser }}
            {{- include "kasm.trustedCaEnv" $ | indent 12 }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                {{- if .Values.database.kasmDbSecret -}}
                {{ .Values.database.kasmDbSecret | toYaml | nindent 18 }}
                {{- else }}
                  name: {{ .Release.Name }}-secrets
                  key: "db-password"
                {{- end }}
            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: admin-password
            - name: DEFAULT_MANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: manager-token
            - name: DEFAULT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: service-token
            - name: DEFAULT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: user-password
            {{- if and .Values.database.standalone .Values.database.postgresMasterUser }}
            - name: DATABASE_MASTER_USER
              value: {{ .Values.database.postgresMasterUser.username }}
            - name: DATABASE_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.postgresMasterUser.secret.name }}
                  key: {{ .Values.database.postgresMasterUser.secret.key }}
            {{- end }}
          resources: {{- include "resources.preset" (dict "node" "api" "size" "small") | nindent 12 }}
          command:
            - "/bin/bash"
            - "-c"
          args:
            - |
              if [[ "$DB_AUTO_INITIALIZE" == "true" ]]; then
                cp /src/api_server/data/migration/alembic.ini /tmp/alembic.ini
                sed -i 's|script_location = %(here)s/alembic|script_location = /src/api_server/data/migration/alembic|g' /tmp/alembic.ini
                sed -i 's/# sourceless = false/sourceless = true/g' /tmp/alembic.ini

                for attempt in $(seq 1 12); do
                  zone_count=$(
                    PGCONNECT_TIMEOUT={{ .Values.dbManagement.dbConnectionTimeout }} PGPASSWORD="${POSTGRES_PASSWORD}" \
                      psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -p "${POSTGRES_PORT}" -h "${POSTGRES_HOST}" \
                      -t -c "select zone_id from zones" 2>/dev/null | wc -l
                  )
                  if [[ "${zone_count}" -ge 2 ]] && \
                    alembic -c /tmp/alembic.ini \
                      -x kasm_config=/opt/kasm/current/conf/app/api/api.app.config.yaml current \
                      | grep -q "(head)"; then
                    echo "Database initialization verified."
                    exit 0
                  fi

                  echo "Database initialization verification failed after startup attempt ${attempt}/12. Retrying..."
                  sleep 5
              
                  /usr/bin/startup.sh || true
                done

                echo "Database initialization did not reach the expected ready state." >&2
                exit 1
              else
                echo "DB already initialized."
              fi
          {{- include "kasm.securityContext" (list . 1000 "container") | nindent 10 }}
          volumeMounts:
            - name: tmp-data
              mountPath: /tmp
            {{- include "kasm.trustedCaVolumeMounts" . | nindent 12 }}
      volumes:
        - name: tmp-data
          emptyDir:
            sizeLimit: 256Mi
        {{- include "kasm.trustedCaVolumes" . | nindent 8 }}
{{- end }}
