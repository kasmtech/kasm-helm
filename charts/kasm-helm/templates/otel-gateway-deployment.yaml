{{/*
Kasm OTel Collector gateway Deployment — cluster-wide, not zone-scoped.

Owns tail_sampling and is the only writer to ClickHouse. tail_sampling needs to see every span of
a trace in one process, which is why traffic reaches this tier only through the forwarder's
loadbalancing exporter, resolving <release>-otel-gateway-headless and hashing on trace ID. Scaling
this Deployment is therefore safe, but ONLY through that path: pointing anything directly at the
gateway's ClusterIP Service with more than one replica splits traces across independent samplers
and produces traces with missing spans, silently.

The rollout uses maxSurge: 0 so the pod set changes one at a time. Traces spanning a rollout can
still split, bounded by tail_sampling's decision_wait; that is the accepted cost of being able to
scale and update at all.

Renders whenever observability is enabled, including when
observability.collector.forwarder.externalEndpoint replaces the chart's forwarder: that value
replaces the forwarder tier only, and the operator's own Collector is then expected to forward here
on 4317 with the bearer token. Without that, ClickHouse simply stays empty.
*/}}
{{- $obs := .Values.observability -}}
{{- if $obs.enabled }}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $ch := $obs.clickhouse -}}
{{- $useClickhouse := or $ch.enabled $ch.standalone -}}
{{- $forwardEnabled := ne $obs.collector.gateway.forward.endpoint "" -}}
{{/*
  replicas.preset "otel-gateway" stays 1 at every deploymentSize: the gateway only does sampling
  and ClickHouse writes, so it needs far less headroom than the forwarder. Raise
  components.otelGateway.replicas to scale it; the loadbalancing exporter in front keeps sampling
  correct. See the header comment for the one thing that is not safe.
*/}}
{{- $gatewayReplicas := ternary .Values.components.otelGateway.replicas (include "replicas.preset" (dict "node" "otel-gateway" "size" .Values.deploymentSize)) (gt (int .Values.components.otelGateway.replicas) 0) -}}
{{- $resourcesObj := .Values.components.otelGateway.resources -}}
{{- if not (gt (len $resourcesObj) 0) -}}
  {{- $resourcesObj = (include "resources.preset" (dict "node" "otel-gateway" "size" .Values.deploymentSize) | fromYaml) -}}
{{- end -}}
{{- $memLimit := dig "limits" "memory" "512Mi" $resourcesObj -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "otel-gateway" "resource" "deployment" "include" "all") | indent 2 }}
spec:
  replicas: {{ $gatewayReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "kasm.metadata" (dict "context" $ "component" "otel-gateway" "resource" "deployment" "include" "match") | indent 6 }}
  template:
    metadata:
      {{- $checksumAnn := dict -}}
      {{- if not $obs.collector.gateway.existingConfigMap -}}
        {{- $checksumAnn = dict "checksum/config" (include (print $.Template.BasePath "/otel-gateway-configmap.yaml") $ | sha256sum) -}}
      {{- end -}}
      {{- include "kasm.metadata" (dict "context" $ "component" "otel-gateway" "resource" "pod" "include" "la" "extraAnnotations" $checksumAnn) | indent 6 }}
    spec:
      restartPolicy: {{ $.Values.restartPolicy }}
      {{- if $.Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecrets.name | default (printf "%s-image-pull-secret" $.Release.Name) }}
      {{- end }}
      {{- include "kasm.securityContext" (list $ 10001 "pod") | nindent 6 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The ClickHouse exporter runs CREATE DATABASE at startup and the Collector exits if it
             fails, so wait rather than crash-loop. /ping is unauthenticated. */}}
      {{- if or $obs.clickhouse.enabled $obs.clickhouse.standalone }}
      initContainers:
        - name: {{ include "kasm.name" (list $ "otel-gateway-wait-clickhouse" "container") }}
          image: {{ $constants.clickhouse.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- include "kasm.securityContext" (list $ 101 "container") | nindent 10 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              url="{{ include "kasm.clickhouseHttpEndpoint" (dict "context" $) }}/ping"
              i=0
              until wget -q -O- --no-check-certificate --timeout=5 "${url}" 2>/dev/null | grep -q "Ok."; do
                i=$((i+1))
                if [ "${i}" -ge 120 ]; then
                  echo "ClickHouse did not answer ${url} after $((i*5))s" >&2
                  exit 1
                fi
                sleep 5
              done
          resources:
            {{- toYaml (include "resources.preset" (dict "node" "otel-sidecar" "size" $.Values.deploymentSize) | fromYaml) | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ include "kasm.name" (list $ "otel-gateway" "container") }}
          image: {{ $constants.otel.gatewayImage }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: OTEL_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $constants.secrets.name }}
                  key: otel-bearer-token
            {{- if $useClickhouse }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default $constants.secrets.name $ch.existingSecret.name }}
                  key: {{ default "clickhouse-password" $ch.existingSecret.key }}
            {{- end }}
            {{- if $forwardEnabled }}
            - name: OTEL_FORWARD_TOKEN
            {{- if $obs.collector.gateway.forward.existingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $obs.collector.gateway.forward.existingSecret.name }}
                  key: {{ $obs.collector.gateway.forward.existingSecret.key }}
            {{- else }}
              value: {{ $obs.collector.gateway.forward.token | quote }}
            {{- end }}
            {{- end }}
            # ~80% of the resolved memory limit, so the Go runtime cooperates with memory_limiter
            # instead of waiting for it to intervene.
            - name: GOMEMLIMIT
              value: {{ include "kasm.gomemlimit" $memLimit | quote }}
          ports:
            - name: otlp-grpc
              containerPort: {{ $constants.otel.otlpGrpc }}
              protocol: TCP
            - name: health
              containerPort: {{ $constants.otel.health }}
              protocol: TCP
            - name: self-metrics
              containerPort: {{ $constants.otel.selfMetrics }}
              protocol: TCP
          volumeMounts:
            # NOTE: a customer-provided existingConfigMap must use the key `config.yaml`.
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
            - name: tmp
              mountPath: /tmp
          {{- if $.Values.applyHealthChecks }}
          livenessProbe:
            {{- include "health.probe" (dict "root" $ "component" "otel-gateway" "probeType" "livenessProbe" "type" "http" "path" "/" "port" 13133) | nindent 12 }}
          readinessProbe:
            {{- include "health.probe" (dict "root" $ "component" "otel-gateway" "probeType" "readinessProbe" "type" "http" "path" "/" "port" 13133) | nindent 12 }}
          {{- end }}
          {{- if .Values.components.otelGateway.resources }}
          resources: {{- toYaml .Values.components.otelGateway.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" "otel-gateway" "size" $.Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- include "kasm.securityContext" (list $ 10001 "container") | nindent 10 }}
      volumes:
        - name: config
          configMap:
            name: {{ default (include "kasm.name" (list $ "otel-gateway" "configmap")) $obs.collector.gateway.existingConfigMap }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
