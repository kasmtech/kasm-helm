{{/*
Generate Kasm passwords and upload as secrets. IF a secret currently exists in the namespace with the same name,
this will prefer that and not create new ones, unless a value is explicitly set in `kasmSecrets.passwords`, which
always wins over both the existing secret and random generation. If you want/need new Kasm passwords, delete the
current secret from Kubernetes to create a new one.

Set `kasmSecrets.create: false` to use an existing, pre-created secret instead of having the chart manage one; no
Secret resource is rendered by this template in that case.
*/}}
{{- if not .Values.kasmConfig.generatePreseed }}
{{- if not .Values.kasmSecrets.create }}
{{- if not .Values.kasmSecrets.name }}
{{- fail "kasmSecrets.name is required when kasmSecrets.create is false. Provide the name of the existing Kasm Password secret in your deployment namespace." }}
{{- end }}
{{- else }}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $namespace := .Release.Namespace }}
{{- $secretName := $constants.secrets.name -}}
{{- $lookupName := default $secretName .Values.dbManagement.upgrade.oldDbSecretsName -}}
{{- $secretsObj := (lookup "v1" "Secret" $namespace $lookupName) | default dict }}
{{- $secretsData := (get $secretsObj "data") | default dict }}
{{- $knownKeys := list "manager-token" "service-token" "db-password" "admin-password" "user-password" }}
{{- $customPasswords := .Values.kasmSecrets.passwords | default dict }}
apiVersion: v1
kind: Secret
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "secrets" "resource" "secret" "name" $secretName "include" "all") | indent 2 }}
type: Opaque
data:
{{- range $idx, $key := $knownKeys }}
  {{- $customValue := get $customPasswords $key }}
  {{- $constantsecret := (get $secretsData $key) | default (randAlphaNum 26 | b64enc) }}
  {{- if $customValue }}
    {{- $constantsecret = ($customValue | b64enc) }}
  {{- end }}
  {{- if or (and (eq "db-password" $key) $.Values.database.kasmDbSecret) }}
    {{- else }}
  {{ $key }}: {{ $constantsecret | quote }}
    {{- end }}
{{- end }}
{{- range $key, $value := $customPasswords }}
  {{- if not (has $key $knownKeys) }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}