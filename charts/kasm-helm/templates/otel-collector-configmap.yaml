{{/*
Kasm OTel Collector forwarder ConfigMap — one per release, mounted by every zone's forwarder
Deployment. Nothing in this config varies per zone (only the gateway endpoint, which is itself
cluster-wide), so a single rendered ConfigMap is shared across zones.

Ported from kasm_backend/install/conf/otel/otel-collector-remote.yaml. No tail_sampling and no
ClickHouse exporters here — those live only in otel-gateway-configmap.yaml. See
docs/otel-execution/H4-collector.md for the full rationale.
*/}}
{{- include "kasm.observabilityValidate" . }}
{{- $obs := .Values.observability -}}
{{- if and $obs.enabled (not $obs.collector.forwarder.existingConfigMap) (not $obs.collector.externalEndpoint) }}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "otel-collector" "resource" "configMap" "include" "all") | indent 2 }}
data:
  config.yaml: |
    extensions:
      bearertokenauth/server:
        token: "${env:OTEL_BEARER_TOKEN}"

      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      # Local Kasm services send OTLP over HTTP (no auth required, pod-local network only).
      otlp/local:
        protocols:
          http:
            endpoint: "0.0.0.0:4318"

      # Out-of-cluster senders (e.g. proxy log sidecars, external Kasm Agents) forward OTLP over
      # gRPC with bearer token auth.
      otlp/remote:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            auth:
              authenticator: bearertokenauth/server

      # nginx sends OTLP/gRPC without auth (in-cluster only). The ngx_otel_module is gRPC-only
      # and cannot present a bearer token, so it gets its own unauthenticated receiver.
      otlp/nginx:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4316"

    processors:
      batch:
        send_batch_size: 5000
        timeout: 10s

      memory_limiter:
        check_interval: 5s
        limit_mib: 256
        spike_limit_mib: 64

    exporters:
      # Forward everything to the cluster-wide gateway, which makes the sampling decision and
      # writes to ClickHouse. This tier neither samples nor stores anything, so it holds no
      # cross-request state and scales freely.
      otlp:
        endpoint: "{{ $constants.otel.gatewaySvc }}:{{ $constants.otel.otlpGrpc }}"
        headers:
          Authorization: "Bearer ${env:OTEL_BEARER_TOKEN}"
        # In-cluster traffic; not attempting mTLS between tiers.
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

    service:
      extensions: [bearertokenauth/server, health_check]

      pipelines:
        logs:
          receivers: [otlp/local, otlp/remote, otlp/nginx]
          processors: [memory_limiter, batch]
          exporters: [otlp]

        traces:
          receivers: [otlp/local, otlp/remote, otlp/nginx]
          processors: [memory_limiter, batch]
          exporters: [otlp]

        metrics:
          receivers: [otlp/local, otlp/remote, otlp/nginx]
          processors: [memory_limiter, batch]
          exporters: [otlp]

      telemetry:
        logs:
          level: info
        # Collector self-metrics. The flat `address:` form was removed in
        # collector v0.123+; this is the replacement syntax.
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
{{- end }}
