{{/*
  The externally-typed Kasm proxy Service.

  Rendered for both LoadBalancer and NodePort. The in-cluster Service
  (proxy-service.yaml) is always ClusterIP; this is the one that publishes the
  proxy outside the cluster, so with proxyService.type=ClusterIP neither this
  template nor any external address exists - publish through an Ingress, an
  OpenShift Route or the Gateway API instead.

  NodePort assigns a port from the cluster's service-node-port-range (30000-32767
  by default) unless proxyService.nodePort pins one. Note that Kasm builds session
  URLs from the zone's proxy_port, so a NodePort deployment reached on a
  non-standard port needs kasmZones[].proxy_port set to match, or the browser is
  sent somewhere nothing is listening.
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- if or (eq (include "kasm.proxyServiceType" .) "LoadBalancer") (eq (include "kasm.proxyServiceType" .) "NodePort") -}}
apiVersion: v1
kind: Service
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "proxy-ext" "resource" "service" "zone" "default" "include" "all") | indent 2 }}
spec:
  type: {{ (include "kasm.proxyServiceType" .) }}
  selector:
    {{- include "kasm.metadata" (dict "context" $ "component" "proxy" "resource" "service" "zone" "default" "include" "match") | indent 4 }}
  ports:
    - name: {{ printf "%s-ext-svc-%s" $constants.proxy.svc ($constants.proxy.extHttps | toString) }}
      protocol: TCP
      port: {{ $constants.proxy.extHttps }}
      targetPort: {{ $constants.proxy.portName }}-https
      {{- if and (eq (include "kasm.proxyServiceType" .) "NodePort") .Values.proxyService.nodePort }}
      nodePort: {{ .Values.proxyService.nodePort }}
      {{- end }}
{{- end }}
