{{/*
  Gateway API HTTPRoute publishing the Kasm proxy, when httpRoute.enabled.

  One HTTPRoute per hostname rather than one route with several rules: an
  HTTPRoute's hostnames are a property of the object, while its rules match on
  path, header and method only. Zones therefore fan out exactly as they do for
  the OpenShift Route - a route apiece, plus one for publicAddr pointing at the
  primary zone's proxy Service.

  TLS is deliberately absent. Unlike an Ingress, a Gateway API route carries no
  certificate: the Gateway's listener does. The Secret this chart mints
  (certificate.secretName, or the cert-manager Certificate) has to be referenced
  from that listener's certificateRefs, and needs a ReferenceGrant when the
  Gateway lives in another namespace.
*/}}
{{- if .Values.httpRoute.enabled }}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $primaryZone := (include "kasm.primaryZone" . | fromYaml) -}}
{{- $backendPort := ternary $constants.proxy.https $constants.proxy.http (eq .Values.httpRoute.backendProtocol "https") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "proxy" "resource" "httpRoute" "include" "all") | indent 2 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.publicAddr | quote }}
  rules:
    - backendRefs:
        - name: {{ printf "%s-%s" $constants.proxy.svc (include "kasm.zoneName" $primaryZone.name) }}
          port: {{ $backendPort }}
{{- range $idx, $zone := .Values.kasmZones }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "proxy" "resource" "httpRoute" "zone" $zone.name "include" "all") | indent 2 }}
spec:
  parentRefs:
    {{- toYaml $.Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ include "kasm.zoneProxyHostnameRequired" $zone | quote }}
  rules:
    - backendRefs:
        - name: {{ printf "%s-%s" $constants.proxy.svc (include "kasm.zoneName" $zone.name) }}
          port: {{ $backendPort }}
{{- end }}
{{- end }}
