{{/*
Headless Service for Guac StatefulSet. clusterIP: None provides per-pod DNS records.
The service exposes only port 9000 (the nginx sidecar). Ports 3000-3004 are
internal to the pod and accessed via the kasm_guac upstream.
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- if .Values.components.guac.enabled }}
{{- range $zone := (include "kasm.primaryRegionZones" $ | fromYamlArray) }}
---
{{ $guacSvc := printf "%s-guac-%s" $.Release.Name (include "kasm.zoneName" $zone.name) -}}
apiVersion: v1
kind: Service
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "guac" "resource" "service" "zone" $zone.name "include" "all") | indent 2 }}
spec:
  clusterIP: None
  selector:
    {{- include "kasm.metadata" (dict "context" $ "component" "guac" "resource" "service" "zone" $zone.name "include" "match") | indent 4 }}
  ports:
    - name: {{ printf "%s-svc-%s" $guacSvc ($constants.guac.nginxPort | toString) }}
      protocol: TCP
      port: {{ $constants.guac.nginxPort }}
{{- end }}
{{- end }}
