{{/*
    Generate custom Kasm password/salt Secrets and a custom DB Preseed when kasmConfig is loaded.
    Password and salt values are generated once per render scope and reused for both the Secrets and preseed hashes.
    Existing password/salt Secrets are reused by lookup so Helm reapply does not rotate credentials.
*/}}
{{- if and .Values.kasmConfig .Values.kasmConfig.generatePreseed }}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $kasmConfig := .Values.kasmConfig.config | default dict }}
{{- $namespace := .Release.Namespace }}
{{- $passwordSecretName := $constants.secrets.name }}
{{- $saltSecretName := printf "%s-password-salts" .Release.Name }}
{{- $preseedSecretName := printf "%s-db-preseed" .Release.Name }}
{{- if not .Values.kasmSecrets.create }}
{{- if not .Values.kasmSecrets.name }}
{{- fail "kasmSecrets.name is required when kasmSecrets.create is false. Provide the name of the existing Kasm Password secret in your deployment namespace." }}
{{- end }}
{{- end }}
{{- $lookupPasswordName := default $passwordSecretName .Values.dbManagement.upgrade.oldDbSecretsName }}
{{- $passwordsObj := (lookup "v1" "Secret" $namespace $lookupPasswordName) | default dict }}
{{- $passwordsData := (get $passwordsObj "data") | default dict }}
{{- $saltsObj := (lookup "v1" "Secret" $namespace $saltSecretName) | default dict }}
{{- $saltsData := (get $saltsObj "data") | default dict }}

{{- $groups := include "kasm.mergedGroups" . | fromYamlArray | default list }}
{{- $users := include "kasm.mergedUsers" . | fromYamlArray | default list }}
{{- $apiConfigs := include "kasm.mergedApiConfigs" . | fromYamlArray | default list }}
{{- $settings := get $kasmConfig "settings" | default list }}
{{- $zones := include "kasm.zones" . | fromYamlArray }}
{{- $serverPools := get $kasmConfig "server_pools" | default list }}
{{- $awsConfigs := get $kasmConfig "aws_vm_configs" | default (get $kasmConfig "aws_configs") | default list }}
{{- $azureConfigs := get $kasmConfig "azure_vm_configs" | default (get $kasmConfig "azure_configs") | default list }}
{{- $digitalOceanVmConfigs := get $kasmConfig "digital_ocean_vm_configs" | default list }}
{{- $gcpVmConfigs := get $kasmConfig "gcp_vm_configs" | default list }}
{{- $harvesterVmConfigs := get $kasmConfig "harvester_vm_configs" | default list }}
{{- $kubevirtVmConfigs := get $kasmConfig "kubevirt_vm_configs" | default list }}
{{- $nutanixVmConfigs := get $kasmConfig "nutanix_vm_configs" | default list }}
{{- $ociVmConfigs := get $kasmConfig "oci_vm_configs" | default list }}
{{- $openstackVmConfigs := get $kasmConfig "openstack_vm_configs" | default list }}
{{- $proxmoxVmConfigs := get $kasmConfig "proxmox_vm_configs" | default list }}
{{- $vsphereVmConfigs := get $kasmConfig "vsphere_vm_configs" | default list }}
{{- $vmCollections := dict
  "aws" $awsConfigs
  "azure" $azureConfigs
  "digitalOcean" $digitalOceanVmConfigs
  "gcp" $gcpVmConfigs
  "harvester" $harvesterVmConfigs
  "kubevirt" $kubevirtVmConfigs
  "nutanix" $nutanixVmConfigs
  "oci" $ociVmConfigs
  "openstack" $openstackVmConfigs
  "proxmox" $proxmoxVmConfigs
  "vsphere" $vsphereVmConfigs
-}}

{{- include "kasm.validateAutoscaleRefs" (dict
  "kasmConfig" $kasmConfig
  "zones" $zones
  "serverPools" $serverPools
  "awsVmConfigs" $awsConfigs
  "azureVmConfigs" $azureConfigs
  "digitalOceanVmConfigs" $digitalOceanVmConfigs
  "gcpVmConfigs" $gcpVmConfigs
  "harvesterVmConfigs" $harvesterVmConfigs
  "kubevirtVmConfigs" $kubevirtVmConfigs
  "nutanixVmConfigs" $nutanixVmConfigs
  "ociVmConfigs" $ociVmConfigs
  "openstackVmConfigs" $openstackVmConfigs
  "proxmoxVmConfigs" $proxmoxVmConfigs
  "vsphereVmConfigs" $vsphereVmConfigs
) }}

{{- $passwordValues := dict }}
{{- $saltValues := dict }}

{{/* admin-password is only meaningful while admin@kasm.local is actually seeded as the admin
     account. When defaultUsers replaces it with a renamed, non-built-in admin account, that
     account gets its own generated password key below instead (see kasm.identitySecretKey). */}}
{{- $builtInAdminExists := or (not (dig "defaultUsers" false $.Values.kasmConfig)) (eq (dig "adminUsername" "admin@kasm.local" $.Values.kasmConfig) "admin@kasm.local") }}
{{- $knownPasswordKeys := list "manager-token" "service-token" "db-password" "admin-password" "user-password" }}
{{- $customPasswords := .Values.kasmSecrets.passwords | default dict }}
{{- if .Values.kasmSecrets.create }}
{{- range $key := $knownPasswordKeys }}
  {{- if or (ne $key "admin-password") $builtInAdminExists }}
    {{- $customValue := get $customPasswords $key }}
    {{- if $customValue }}
      {{- $_ := set $passwordValues $key ($customValue | b64enc) }}
    {{- else }}
      {{- $_ := set $passwordValues $key ((get $passwordsData $key) | default (randAlphaNum 26 | b64enc)) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}

{{- range $user := $users }}
  {{- $isBuiltInUser := or (eq $user.username "admin@kasm.local") (eq $user.username "user@kasm.local") }}
  {{- if not $isBuiltInUser }}
    {{- $userSecretKey := include "kasm.identitySecretKey" (dict "item" $user "prefix" "user") }}
    {{- $passwordKey := printf "%s-password" $userSecretKey }}
    {{- $saltKey := printf "%s-salt" $userSecretKey }}
    {{- $_ := set $passwordValues $passwordKey ((get $passwordsData $passwordKey) | default (randAlphaNum 26 | b64enc)) }}
    {{- $_ := set $saltValues $saltKey ((get $saltsData $saltKey) | default (uuidv4 | b64enc)) }}
  {{- end }}
{{- end }}

{{- range $apiConfig := $apiConfigs }}
  {{- $apiSecretKey := include "kasm.identitySecretKey" (dict "item" $apiConfig "prefix" "api") }}
  {{- $passwordKey := printf "%s-password" $apiSecretKey }}
  {{- $saltKey := printf "%s-salt" $apiSecretKey }}
  {{- $_ := set $passwordValues $passwordKey ((get $passwordsData $passwordKey) | default (randAlphaNum 26 | b64enc)) }}
  {{- $_ := set $saltValues $saltKey ((get $saltsData $saltKey) | default (uuidv4 | b64enc)) }}
{{- end }}

{{- if .Values.kasmSecrets.create }}
apiVersion: v1
kind: Secret
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "secrets" "resource" "secret" "name" $passwordSecretName "include" "all") | indent 2 }}
type: Opaque
data:
{{- range $key, $value := $passwordValues }}
  {{- if not (and (eq "db-password" $key) $.Values.database.kasmDbSecret) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- range $key, $value := $customPasswords }}
  {{- if not (has $key $knownPasswordKeys) }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if $saltValues }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "salts" "resource" "secret" "name" $saltSecretName "include" "all") | indent 2 }}
type: Opaque
data:
{{- range $key, $value := $saltValues }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "db-preseed" "resource" "secret" "name" $preseedSecretName "include" "all") | indent 2 }}
stringData:
  custom_properties.yaml: |
    groups: {{ if $groups }}
    {{- range $groupIndex, $group := $groups }}
    - description: {{ if $group.description }}{{ $group.description | quote }}{{ else }}null{{ end }}
      group_id: {{ default (printf "${uuid:group_id:%s}" ((add $groupIndex 1) | toString)) $group.group_id | quote }}
      group_metadata: {{ if $group.group_metadata }}{{ $group.group_metadata | toJson }}{{ else }}null{{ end }}
      is_system: {{ dig "is_system" false $group }}
      name: {{ required "kasmConfig.groups[].group_name or kasmConfig.groups[].name is required" (default $group.name $group.group_name) | quote }}
      priority: {{ default 1000 $group.priority }}
      program_data: {{ if $group.program_data }}{{ $group.program_data | toJson }}{{ else }}null{{ end }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    users: {{ if $users }}
    {{- range $userIndex, $user := $users }}
    {{- $userId := default (printf "${uuid:user_id:%s}" ((add $userIndex 1) | toString)) $user.user_id }}
    {{- $cryptIndex := ((add $userIndex 1) | toString) }}
    {{- if hasKey $user "index" }}
      {{- $cryptIndex = ($user.index | toString) }}
    {{- end }}
    {{- $isAdminUser := eq $user.username "admin@kasm.local" }}
    {{- $isDefaultUser := eq $user.username "user@kasm.local" }}
    {{- $isBuiltInUser := or $isAdminUser $isDefaultUser }}
    {{- $builtInUserIndex := ternary "1" "2" $isAdminUser }}
    {{- $userSecretKey := include "kasm.identitySecretKey" (dict "item" $user "prefix" "user") }}
    {{- $passwordKey := printf "%s-password" $userSecretKey }}
    {{- $saltKey := printf "%s-salt" $userSecretKey }}
    {{- $generatedPassword := "" }}
    {{- $generatedSalt := "" }}
    {{- if not $isBuiltInUser }}
      {{- $generatedPassword = (index $passwordValues $passwordKey | b64dec) }}
      {{- $generatedSalt = (index $saltValues $saltKey | b64dec) }}
    {{- end }}
    {{- $password := default $generatedPassword $user.password }}
    {{- $salt := ternary (printf "${uuid:user_salt:%s}" $builtInUserIndex) (default $generatedSalt $user.salt) $isBuiltInUser }}
    {{- $passwordHash := "" }}
    {{- if $isBuiltInUser }}
      {{- $passwordHash = default (ternary "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" "ef812e6cd523e95742921d31bd61856c62a14d76b03d422bc528f0fe37c8187d" $isAdminUser) $user.pw_hash }}
      {{- $salt = default $salt $user.salt }}
    {{- else }}
      {{- $passwordHash = default (include "kasm.passwordHash" (dict "password" $password "salt" $salt)) $user.pw_hash }}
    {{- end }}
    - anonymous: {{ dig "anonymous" false $user }}
      city: {{ default "null" $user.city }}
      company_id: {{ default "null" $user.company_id }}
      country: {{ default "null" $user.country }}
      created: {{ default "${datetime:utcnow}" $user.created | quote }}
      crypt_password: {{ default (printf "${crypt:password:%s}" $cryptIndex) $user.crypt_password | quote }}
      crypt_salt: {{ default (printf "${crypt:salt:%s}" $cryptIndex) $user.crypt_salt | quote }}
      custom_attribute_1: {{ default "null" $user.custom_attribute_1 }}
      custom_attribute_2: {{ default "null" $user.custom_attribute_2 }}
      custom_attribute_3: {{ default "null" $user.custom_attribute_3 }}
      disabled: {{ dig "disabled" false $user }}
      email: {{ default $user.username $user.email | quote }}
      email_confirm_token: {{ default "null" $user.email_confirm_token }}
      email_pw_reset_request_date: {{ default "null" $user.email_pw_reset_request_date }}
      failed_pw_attempts: {{ default "null" $user.failed_pw_attempts }}
      first_name: {{ default "null" $user.first_name }}
      last_name: {{ default "null" $user.last_name }}
      locked: {{ dig "locked" false $user }}
      notes: {{ default "null" $user.notes }}
      oidc_id: {{ default "null" $user.oidc_id }}
      organization: {{ default "null" $user.organization }}
      password_set_date: {{ default "${datetime:utcnow}" $user.password_set_date | quote }}
      phone: {{ default "null" $user.phone }}
      plan_end_date: {{ default "null" $user.plan_end_date }}
      plan_id: {{ default "null" $user.plan_id }}
      plan_start_date: {{ default "null" $user.plan_start_date }}
      program_id: {{ default "null" $user.program_id }}
      pw_hash: {{ $passwordHash | quote }}
      realm: {{ default "local" $user.realm | quote }}
      salt: {{ $salt | quote }}
      saml_id: {{ default "null" $user.saml_id }}
      secret: {{ default "null" $user.secret }}
      set_two_factor: {{ dig "set_two_factor" false $user }}
      sso_ep: {{ default "null" $user.sso_ep }}
      state: {{ default "null" $user.state }}
      stripe_id: {{ default "null" $user.stripe_id }}
      subscription_id: {{ default "null" $user.subscription_id }}
      user_id: {{ $userId | quote }}
      username: {{ required "kasmConfig.users[].username is required" $user.username | quote }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    user_groups: {{ if $users }}
    {{- range $userIndex, $user := $users }}
    {{- $userId := default (printf "${uuid:user_id:%s}" ((add $userIndex 1) | toString)) $user.user_id }}
    {{- range $groupName := default list $user.groups }}
    - group_id: {{ include "kasm.groupId" (dict "groupName" $groupName "groups" $groups) | quote }}
      user_id: {{ $userId | quote }}
    {{- end }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    api_configs: {{ if $apiConfigs }}
    {{- range $apiIndex, $apiConfig := $apiConfigs }}
    {{- $apiId := default (printf "${uuid:api_id:%s}" ((add $apiIndex 1) | toString)) $apiConfig.api_id }}
    {{- $apiSecretKey := include "kasm.identitySecretKey" (dict "item" $apiConfig "prefix" "api") }}
    {{- $passwordKey := printf "%s-password" $apiSecretKey }}
    {{- $saltKey := printf "%s-salt" $apiSecretKey }}
    {{- $password := index $passwordValues $passwordKey | b64dec }}
    {{- $apiSalt := default (index $saltValues $saltKey | b64dec) $apiConfig.salt }}
    {{- $apiKeySecretHash := default (include "kasm.passwordHash" (dict "password" $password "salt" $apiSalt)) $apiConfig.api_key_secret_hash }}
    - api_id: {{ $apiId | quote }}
      api_key: {{ required "kasmConfig.apiConfigs[].api_key is required" $apiConfig.api_key | quote }}
      api_key_secret_hash: {{ $apiKeySecretHash | quote }}
      created: {{ default "${datetime:utcnow}" $apiConfig.created | quote }}
      enabled: {{ dig "enabled" true $apiConfig }}
      expires: {{ default "null" $apiConfig.expires }}
      name: {{ required "kasmConfig.apiConfigs[].name is required" $apiConfig.name | quote }}
      read_only: {{ dig "read_only" true $apiConfig }}
      salt: {{ $apiSalt | quote }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    group_permissions: {{ if or $apiConfigs $groups }}
    {{- $groupPermissionIndex := 1000 }}
    {{- range $apiIndex, $apiConfig := $apiConfigs }}
    {{- $apiId := default (printf "${uuid:api_id:%s}" ((add $apiIndex 1) | toString)) $apiConfig.api_id }}
    {{- range $permissionIndex, $permissionName := default list $apiConfig.permissions }}
    - api_id: {{ $apiId | quote }}
      group_id: null
      group_permission_id: {{ printf "${uuid:group_permission_id:%04d}" $groupPermissionIndex | quote }}
      permission_id: {{ include "kasm.permissionId" $permissionName }}
    {{- $groupPermissionIndex = add $groupPermissionIndex 1 }}
    {{- end }}
    {{- end }}

    {{- range $groupIndex, $group := $groups }}
    {{- $groupKey := default $group.name $group.key }}
    {{- $groupId := default (printf "${uuid:group_id:%s}" ((add $groupIndex 1) | toString)) $group.group_id }}
    {{- range $permissionIndex, $permissionName := default list $group.permissions }}
    - api_id: null
      group_id: {{ $groupId | quote }}
      group_permission_id: {{ printf "${uuid:group_permission_id:%04d}" $groupPermissionIndex | quote }}
      permission_id: {{ include "kasm.permissionId" $permissionName }}
    {{- $groupPermissionIndex = add $groupPermissionIndex 1 }}
    {{- end }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    settings: {{ if $settings }}
    {{- range $settingIndex, $setting := $settings }}
    - category: {{ required "kasmConfig.settings[].category is required" $setting.category | quote }}
      description: {{ default "" $setting.description | quote }}
      name: {{ required "kasmConfig.settings[].name is required" $setting.name | quote }}
      sanitize: {{ dig "sanitize" false $setting }}
      services_restart: {{ default "null" $setting.services_restart }}
      setting_id: {{ default (printf "${uuid:setting_id:%s}" ((add $settingIndex 1) | toString)) $setting.setting_id | quote }}
      title: {{ required "kasmConfig.settings[].title is required" $setting.title | quote }}
      value: {{ if kindIs "map" $setting.value }}{{ $setting.value | toJson | quote }}{{ else if kindIs "slice" $setting.value }}{{ $setting.value | toJson | quote }}{{ else }}{{ default "" $setting.value | quote }}{{ end }}
      value_type: {{ required "kasmConfig.settings[].value_type is required" $setting.value_type | quote }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    {{- $groupSettings := get $kasmConfig "groupSettings" | default list }}
    group_settings: {{ if or $groupSettings $groups }}
    {{- $groupSettingIndexCounter := 3000 }}
    {{- range $groupSettingIndex, $groupSetting := $groupSettings }}
    - description: {{ default "" $groupSetting.description | quote }}
      group_id: {{ if $groupSetting.group_name }}{{ include "kasm.groupId" (dict "groupName" $groupSetting.group_name "groups" $groups) | quote }}{{ else if $groupSetting.group_id }}{{ $groupSetting.group_id | quote }}{{ else }}null{{ end }}
      group_setting_id: {{ default (printf "${uuid:group_setting_id:%04d}" $groupSettingIndexCounter) $groupSetting.group_setting_id | quote }}
      name: {{ required "kasmConfig.groupSettings[].name is required" $groupSetting.name | quote }}
      value: {{ default "" $groupSetting.value | quote }}
      value_type: {{ required "kasmConfig.groupSettings[].value_type is required" $groupSetting.value_type | quote }}
    {{- $groupSettingIndexCounter = add $groupSettingIndexCounter 1 }}
    {{- end }}

    {{- range $groupIndex, $group := $groups }}
    {{- $groupName := default $group.key $group.name }}
    {{- $groupId := default (printf "${uuid:group_id:%s}" ((add $groupIndex 1) | toString)) $group.group_id }}
    {{- range $settingName, $setting := default dict $group.settings }}
    - description: {{ default "" $setting.description | quote }}
      group_id: {{ $groupId | quote }}
      group_setting_id: {{ printf "${uuid:group_setting_id:%04d}" $groupSettingIndexCounter | quote }}
      name: {{ $settingName | quote }}
      value: {{ default "" $setting.value | quote }}
      value_type: {{ required (printf "kasmConfig.groups[%s].settings[%s].value_type is required" $groupName $settingName) $setting.value_type | quote }}
    {{- $groupSettingIndexCounter = add $groupSettingIndexCounter 1 }}
    {{- end }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    images: {{ if hasKey $kasmConfig "images" }}
    {{- range $imageIndex, $image := $kasmConfig.images }}
    - allow_network_selection: {{ dig "allow_network_selection" false $image }}
      available: {{ dig "available" true $image }}
      categories: {{ default (list) $image.categories | toJson }}
      cores: {{ default "null" $image.cores }}
      cpu_allocation_method: {{ default "null" $image.cpu_allocation_method }}
      description: {{ default "null" $image.description }}
      docker_registry: {{ default "null" $image.docker_registry }}
      docker_token: {{ default "null" $image.docker_token }}
      docker_user: {{ default "null" $image.docker_user }}
      enabled: {{ dig "enabled" true $image }}
      enforce_workspace_persistence: {{ dig "enforce_workspace_persistence" false $image }}
      exec_config: {{ default (dict) $image.exec_config | toJson }}
      filter_policy_force_disabled: {{ dig "filter_policy_force_disabled" false $image }}
      filter_policy_id: {{ default "null" $image.filter_policy_id }}
      friendly_name: {{ default $image.name $image.friendly_name | default "null" }}
      gpu_count: {{ default "null" $image.gpu_count }}
      hash: {{ default "null" $image.hash }}
      hidden: {{ dig "hidden" false $image }}
      image_id: {{ default (printf "${uuid:image_id:%s}" ((add $imageIndex 1) | toString)) $image.image_id }}
      image_src: {{ default "null" $image.image_src }}
      image_type: {{ default "Container" $image.image_type | quote }}
      is_remote_app: {{ dig "is_remote_app" false $image }}
      launch_config: {{ default (dict) $image.launch_config | toJson }}
      link_url: {{ default "null" $image.link_url }}
      memory_bytes: {{ if $image.memory_bytes }}{{ $image.memory_bytes | int64 }}{{ else }}null{{ end }}
      name: {{ default "null" $image.name }}
      notes: {{ default "null" $image.notes }}
      override_egress_gateways: {{ dig "override_egress_gateways" false $image }}
      persistent_profile_path: {{ default "null" $image.persistent_profile_path }}
      rdp_client_type: {{ default "null" $image.rdp_client_type }}
      remote_app_args: {{ default "null" $image.remote_app_args }}
      remote_app_icon: {{ default "null" $image.remote_app_icon }}
      remote_app_name: {{ default "null" $image.remote_app_name }}
      remote_app_program: {{ default "null" $image.remote_app_program }}
      require_gpu: {{ dig "require_gpu" false $image }}
      restrict_network_names: {{ default (list) $image.restrict_network_names | toJson }}
      restrict_to_network: {{ dig "restrict_to_network" false $image }}
      restrict_to_server: {{ dig "restrict_to_server" false $image }}
      restrict_to_zone: {{ dig "restrict_to_zone" false $image }}
      run_config: {{ default (dict) $image.run_config | toJson }}
      server_id: {{ default "null" $image.server_id }}
      server_pool_id: {{ if $image.server_pool_id }}{{ $image.server_pool_id }}{{ else if $image.pool_name }}{{ include "kasm.configId" (dict "config" $image "collection" $serverPools "idKey" "server_pool_id" "nameKey" "pool_name" "matchKey" "name" "uuidKey" "server_pool_id" "resourceType" "server pool") }}{{ else }}null{{ end }}
      session_banner_force_disabled: {{ dig "session_banner_force_disabled" false $image }}
      session_banner_id: {{ default "null" $image.session_banner_id }}
      session_time_limit: {{ default "null" $image.session_time_limit }}
      uncompressed_size_bytes: {{ if $image.uncompressed_size_bytes }}{{ $image.uncompressed_size_bytes | int64 }}{{ else }}null{{ end }}
      volume_mappings: {{ default (dict) $image.volume_mappings | toJson }}
      x_res: {{ default "null" $image.x_res }}
      y_res: {{ default "null" $image.y_res }}
      zone_id: {{ if $image.zone_id }}{{ $image.zone_id }}{{ else if $image.zone_name }}{{ include "kasm.configId" (dict "config" $image "collection" $zones "idKey" "zone_id" "nameKey" "zone_name" "matchKey" "name" "uuidKey" "zone_id" "resourceType" "zone") }}{{ else }}null{{ end }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    registries: {{ if hasKey $kasmConfig "registries" }}
    {{- range $registryIndex, $registry := $kasmConfig.registries }}
    - channel: {{ default "null" $registry.channel }}
      config: {{ default (dict) $registry.config | toJson }}
      do_auto_update: {{ dig "do_auto_update" false $registry }}
      kasm_version: {{ default "null" $registry.kasm_version }}
      registry_id: {{ default (printf "${uuid:registry_id:%s}" ((add $registryIndex 1) | toString)) $registry.registry_id }}
      registry_url: {{ default "null" $registry.registry_url }}
      schema_version: {{ default "null" $registry.schema_version }}
    {{- end }}
    {{- else -}}
    []
    {{- end }}
    zones:
    {{- range $zoneIndex, $zone := $zones }}
    - allow_origin_domain: {{ default "$request_host$" $zone.allow_origin_domain | quote }}
      enable_rdp_direct_login: {{ dig "enable_rdp_direct_login" false $zone }}
      enable_rdp_https_gw: {{ dig "enable_rdp_https_gw" true $zone }}
      enable_rdp_https_gw_dlp: {{ dig "enable_rdp_https_gw_dlp" false $zone }}
      load_strategy: {{ default "most_sessions" $zone.load_strategy | quote }}
      primary_manager_id: null
      prioritize_static_agents: {{ dig "prioritize_static_agents" true $zone }}
      proxy_connections: {{ dig "proxy_connections" true $zone }}
      proxy_rdp_client_connections: {{ dig "proxy_rdp_client_connections" true $zone }}
      proxy_hostname: {{ default "$request_host$" (include "kasm.zoneProxyHostname" $zone) | quote }}
      proxy_path: {{ default "desktop" $zone.proxy_path | quote }}
      proxy_port: {{ default 443 $zone.proxy_port }}
