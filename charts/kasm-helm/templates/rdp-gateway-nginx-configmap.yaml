{{/*
Nginx configuration ConfigMaps for the RDP Gateway Deployment nginx sidecar.

rdp-gateway-settings  — mounted at /etc/nginx/conf.d/ — contains:
  compress.conf, logging.conf, upstream_kasm_rdp_gateway.conf, orchestrator.conf

rdp-gateway-services  — mounted at /etc/nginx/conf.d/services.d/ — contains:
  rdp_gateway.conf with all guac location blocks routing to rdp_gateway upstream
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $serviceKeepalive := 16 -}}
{{- if .Values.components.rdpGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "rdp-gateway-nginx-settings" "resource" "configMap" "include" "all") | indent 2 }}
data:
  resolver.conf: |
    resolver 127.0.0.11 valid=10s ipv6=off;

  upstream_kasm_rdp_gateway.conf: |
    upstream rdp_gateway {
      keepalive {{ $serviceKeepalive }};
      server 127.0.0.1:{{ $constants.rdpGateway.port }};
    }

  orchestrator.conf: |
    server {
      listen {{ $constants.rdpGateway.nginxPort }};
      server_name ubuntu-base;

      include /etc/nginx/conf.d/services.d/*.conf;

      client_max_body_size 1G;
      server_tokens off;

      proxy_intercept_errors on;
      error_page 500 = @internal_error;
      location @internal_error {
        default_type "text/html";
        return 500 "<H1>Internal Error</H1>";
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "rdp-gateway-nginx-services" "resource" "configMap" "include" "all") | indent 2 }}
data:
  rdp_gateway.conf: |
    # In-cluster readiness probe entry point. The proxy pod's wait-for-rdp-gateway
    # init container curls http://<rdp-gateway-svc>:<nginxPort>/__healthcheck so it
    # reaches the gateway through the sidecar (consistent with how all other
    # cross-pod traffic to this component flows). The app's own
    # /__healthcheck on :5555 is reached via the rdp_gateway upstream defined in
    # the settings configmap — keeping :5555 strictly intra-pod.
    location = /__healthcheck {
      access_log off;
      proxy_pass http://rdp_gateway/__healthcheck;
    }

    location /guac/vm_disconnect {
      return 200;
    }

    location /rdp-gateway/ {
      proxy_http_version      1.1;
      proxy_set_header        Host $host;
      proxy_set_header        Upgrade $http_upgrade;
      proxy_set_header        Connection "upgrade";
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;

      proxy_pass      http://rdp_gateway/;
    }

{{- end }}
