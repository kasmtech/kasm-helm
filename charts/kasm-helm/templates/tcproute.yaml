{{/*
  Gateway API TCPRoute publishing the RDP Gateway, when tcpRoute.enabled.

  The RDP Gateway speaks raw RDP, so this is the only route kind that can carry
  it - and a TCPRoute matches on neither hostname nor SNI. Where the proxy's
  HTTPRoute multiplexes every zone onto one listener by hostname, each zone's
  RDP Gateway needs a Gateway listener of its own, selected with
  parentRefs[].sectionName. tcpRoute.zones carries those per-zone refs;
  tcpRoute.parentRefs is the single-zone shorthand.

  TCPRoute has been standard-channel `v1` since Gateway API 1.6, and being in
  the bundle is not the same as the data plane implementing it - check the
  implementation's conformance before choosing this over a LoadBalancer.

  The backend is the per-pod direct RDP Service that connection-proxy-services.yaml
  renders when tcpRoute is enabled: ClusterIP, ordinal 0. A TCPRoute advertises one
  hostname, so kasm.validateRdpExposure pins connection-proxy to a single replica in
  this mode - per-replica fan-out belongs to directRdpService.perServiceSettings.
*/}}
{{- if .Values.tcpRoute.enabled }}
{{- $api := .Values.tcpRoute.apiVersion | default "gateway.networking.k8s.io/v1" -}}
{{- $backendPort := .Values.directRdpService.loadBalancerPort | default 3389 -}}
{{- $zoneRefs := dict -}}
{{- range $z := .Values.tcpRoute.zones -}}
  {{- $zoneRefs = set $zoneRefs $z.name $z.parentRefs -}}
{{- end -}}
{{- range $zone := (include "kasm.primaryRegionZones" $ | fromYamlArray) }}
{{- $refs := (get $zoneRefs $zone.name) | default $.Values.tcpRoute.parentRefs }}
---
apiVersion: {{ $api }}
kind: TCPRoute
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "connectionProxy" "resource" "tcpRoute" "zone" $zone.name "include" "all") | indent 2 }}
spec:
  parentRefs:
    {{- toYaml $refs | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ printf "%s-connection-proxy-%s-rdp-0" $.Release.Name (include "kasm.zoneName" $zone.name) }}
          port: {{ $backendPort }}
{{- end }}
{{- end }}
