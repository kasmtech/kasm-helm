{{/*
Deploy the Guacamole Web RDP StatefulSet if .Values.components.guac.enabled is true.
Each pod runs a guac container (ports 3000-3004, local only) and an nginx sidecar
(port 9000) that owns all external guac routing.
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $guacReplicas := ternary .Values.components.guac.replicas (include "replicas.preset" (dict "node" ($constants.guac.component) "size" .Values.deploymentSize)) (gt (int .Values.components.guac.replicas) 0) -}}
{{- $merged := fromYaml (include "kasm.mergedValues" (dict "root" . "componentName" "guac")) -}}
{{- if .Values.components.guac.enabled }}
{{- range $zone := (include "kasm.primaryRegionZones" $ | fromYamlArray) }}
---
{{ $guacSvc := printf "%s-guac-%s" $.Release.Name (include "kasm.zoneName" $zone.name) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "guac" "resource" "statefulSet" "zone" $zone.name "include" "all") | indent 2 }}
spec:
  replicas: {{ $guacReplicas }}
  serviceName: {{ $guacSvc }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "kasm.metadata" (dict "context" $ "component" "guac" "resource" "deployment" "zone" $zone.name "include" "match") | indent 6 }}
  template:
    metadata:
      {{- include "kasm.metadata" (dict "context" $ "component" "guac" "resource" "deployment" "zone" $zone.name "include" "la") | indent 6 }}
    spec:
      restartPolicy: {{ $.Values.restartPolicy }}
      {{- if $.Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecrets.name | default (printf "%s-image-pull-secret" $.Release.Name) }}
      {{- end }}
      {{- include "kasm.securityContext" (list $ 1000 "pod") | nindent 6 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "kasm.trustedCaInit" (list $ "guac") | nindent 8 }}
        {{- include "kasm.initContainer" (dict "context" $ "serviceName" (printf "%s-%s" $constants.api.svc (include "kasm.zoneName" $zone.name)) "servicePort" ($constants.api.port) "path" "/api/__healthcheck" "schema" "http" "image" ($constants.api.image) "component" "api") | nindent 8 }}
        {{- with $merged.extraInitContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ include "kasm.name" (list $ "guac" "container") }}
          image: {{ $constants.guac.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: CLUSTER_SIZE
              value: "4"
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: service-token
            - name: ZONE
              value: {{ $zone.name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVER_ADDRESS
              value: "$(HOSTNAME).{{ $guacSvc }}.$(POD_NAMESPACE).svc.cluster.local"
            - name: SERVER_PORT
              value: {{ $constants.guac.nginxPort | quote }}
            - name: API_SCHEMA
              value: "http"
            {{/*
              Connection proxies must reach the manager's /manager_api/ endpoint
              (support-bundle uploads) as well as /api/ (registration/heartbeat).
              Only the kasm-proxy nginx service serves both on one port, so point
              the API endpoint at it rather than the api (CherryPy) service.
            */}}
            - name: API_HOSTNAME
              value: {{ printf "%s-%s" $constants.api.svc (include "kasm.zoneName" $zone.name) | quote }}
            - name: API_PORT
              value: {{ $constants.proxy.http | quote }}
            - name: KASM_EPHEMERAL
              value: "true"
          ports:
            - name: {{ $constants.guac.portName }}
              containerPort: {{ $constants.guac.port }}
              protocol: TCP
          volumeMounts:
            - name: tmp-data
              mountPath: /tmp
            - name: kasm-guac-log-data
              mountPath: /opt/kasm/current/log
              readOnly: true
            - name: kasm-guac-data
              mountPath: /opt/kasm/current/tmp/guac
            {{- include "kasm.trustedCaVolumeMounts" $ | nindent 12 }}
            {{- with $merged.containerMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $.Values.applyHealthChecks }}
          livenessProbe:
            {{- include "health.probe" (dict "root" $ "component" "guac" "probeType" "livenessProbe" "type" "tcp" "portName" $constants.guac.portName) | nindent 12 }}
          readinessProbe:
            {{- include "health.probe" (dict "root" $ "component" "guac" "probeType" "readinessProbe" "type" "http" "path" "/__healthcheck" "portName" $constants.guac.portName) | nindent 12 }}
          {{- end }}
          {{- if $.Values.components.guac.resources }}
          resources: {{- toYaml $.Values.components.guac.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" ($constants.guac.component) "size" $.Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- include "kasm.securityContext" (list $ 1000 "container") | nindent 10 }}
        - name: {{ printf "%s-guac-nginx" $.Release.Name }}
          image: {{ $constants.proxy.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: guac-nginx-pt
              containerPort: {{ $constants.guac.nginxPort }}
              protocol: TCP
          volumeMounts:
            - name: kasm-guac-nginx-shared
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: kasm-guac-nginx-shared
              mountPath: /etc/nginx/compress.conf
              subPath: compress.conf
            - name: kasm-guac-nginx-shared
              mountPath: /etc/nginx/logging.conf
              subPath: logging.conf
            - name: kasm-guac-nginx-shared
              mountPath: /etc/nginx/orchestrator.conf
              subPath: orchestrator.conf
            - name: kasm-guac-nginx-settings
              mountPath: /etc/nginx/conf.d
            - name: kasm-guac-services-config
              mountPath: /etc/nginx/conf.d/services.d
            - name: kasm-guac-nginx-data
              mountPath: /var/cache/nginx
            - name: kasm-guac-nginx-data
              mountPath: /run
            - name: kasm-guac-nginx-log-tmp
              mountPath: /var/log/nginx
            - name: kasm-guac-cert
              mountPath: /etc/nginx/ssl/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: kasm-guac-cert
              mountPath: /etc/nginx/ssl/tls.key
              subPath: tls.key
              readOnly: true
            {{- include "kasm.trustedCaVolumeMounts" $ | nindent 12 }}
          {{- if $.Values.applyHealthChecks }}
          livenessProbe:
            {{- include "health.probe" (dict "root" $ "component" "guac" "timingScope" "nginxSidecar" "probeType" "livenessProbe" "type" "tcp" "portName" "guac-nginx-pt") | nindent 12 }}
          readinessProbe:
            {{- include "health.probe" (dict "root" $ "component" "guac" "timingScope" "nginxSidecar" "probeType" "readinessProbe" "type" "https" "path" "/guac/__healthcheck" "portName" "guac-nginx-pt") | nindent 12 }}
          {{- end }}
          {{- if $.Values.components.guac.nginxSidecar.resources }}
          resources: {{- toYaml $.Values.components.guac.nginxSidecar.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" "nginx-sidecar" "size" $.Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- include "kasm.securityContext" (list $ 1000 "container") | nindent 10 }}
        {{- with $merged.extraContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: kasm-guac-cert
          secret:
            secretName: {{ $.Values.certificate.secretName | default (include "kasm.name" (list $ "cert-manager" "secret")) }}
        - name: kasm-guac-log-data
          emptyDir:
            sizeLimit: 1Mi
        - name: kasm-guac-data
          emptyDir:
            sizeLimit: 256Mi
        - name: kasm-guac-nginx-shared
          configMap:
            name: {{ include "kasm.name" (list $ "nginx-shared") }}
        - name: kasm-guac-nginx-settings
          configMap:
            name: {{ include "kasm.name" (list $ "guac-nginx-settings") }}
        - name: kasm-guac-services-config
          configMap:
            name: {{ include "kasm.name" (list $ "guac-services") }}
        - name: kasm-guac-nginx-data
          emptyDir:
            sizeLimit: 100Mi
        - name: kasm-guac-nginx-log-tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- with $merged.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "kasm.trustedCaVolumes" $ | nindent 8 }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: tmp-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with $.Values.components.guac.recordingData.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ printf "%sGi" (($.Values.components.guac.recordingData.pvcSize | default 10) | toString) }}
{{- end }}
{{- end }}
