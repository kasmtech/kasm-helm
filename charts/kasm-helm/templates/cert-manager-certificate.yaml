{{/*
Deploy the Certificates with certManager
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- if .Values.certificate.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "cert-manager" "resource" "certificate" "include" "all") | indent 2 }}
spec:
  secretTemplate:
    {{- include "kasm.metadata" (dict "context" . "component" "cert-manager" "resource" "secret" "include" "la") | indent 4 }}
  secretName: {{ .Values.certificate.secretName | default (include "kasm.name" (list . "cert-manager" "secret")) }}
  commonName: {{ .Values.publicAddr | quote }}
  {{- $dnsNames := list .Values.publicAddr -}}
  {{- if .Values.certificate.certManager.addWildCard -}}
    {{- $dnsNames = append $dnsNames (printf "*.%s" .Values.publicAddr) -}}
  {{- else -}}
    {{- range $idx, $zone := (include "kasm.deployedConfiguredZones" . | fromYamlArray) -}}
      {{- with (include "kasm.zoneProxyHostname" $zone) -}}
        {{- $dnsNames = append $dnsNames . -}}
      {{- end -}}
    {{- end -}}
  {{- end }}
  {{- /* Upstream auth (management) addresses are deliberately NOT added: they
         typically live in a private DNS zone the public issuer cannot validate. */}}
  dnsNames:
    {{- range $dnsNames | uniq }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ .Values.certificate.certManager.issuerName }}
    kind: {{ .Values.certificate.certManager.issuerKind | default "Issuer" }}
    group: {{ .Values.certificate.certManager.issuerGroup | default "cert-manager.io" }}
{{- end }}