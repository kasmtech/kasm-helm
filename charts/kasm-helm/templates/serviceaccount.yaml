{{/*
ServiceAccounts for components.api / components.manager. Renders one ServiceAccount per
distinct resolved name whose effective serviceAccount.create is true (deduped, so if api and
manager resolve to the same name only one object is created). When both components resolve
to the same name, their annotations are merged; a differing value for the same annotation
key across components fails the render rather than silently dropping one side.
*/}}
{{- $globalAnnotations := $.Values.serviceAccount.annotations | default dict -}}
{{- $order := list -}}
{{- $annotationsByName := dict -}}
{{- $sourceByName := dict -}}
{{- range $component := (list "api" "manager") }}
{{- $sa := fromYaml (include "kasm.serviceAccount" (dict "context" $ "component" $component)) }}
{{- if and $sa.create (not $sa.name) }}
{{- fail (printf "components.%s.serviceAccount.create is true but no name resolved (set serviceAccount.name or components.%s.serviceAccount.name)" $component $component) }}
{{- end }}
{{- if and $sa.create $sa.name }}
{{- if not (hasKey $annotationsByName $sa.name) }}
{{- $order = append $order $sa.name }}
{{- $_ := set $annotationsByName $sa.name dict }}
{{- $_ := set $sourceByName $sa.name dict }}
{{- end }}
{{- $existing := get $annotationsByName $sa.name }}
{{- $existingSources := get $sourceByName $sa.name }}
{{- range $k, $v := $sa.annotations }}
{{/* Attribute this value to "serviceAccount.annotations" (global) if it merely inherited the
     global value unchanged, otherwise to the component that actually set/overrode it. */}}
{{- $source := printf "components.%s.serviceAccount.annotations" $component }}
{{- if and (hasKey $globalAnnotations $k) (eq (get $globalAnnotations $k) $v) }}
{{- $source = "serviceAccount.annotations" }}
{{- end }}
{{- if hasKey $existing $k }}
{{- if ne (get $existing $k) $v }}
{{- fail (printf "serviceAccount %q: %s sets annotation %q to %q, but %s already set it to %q" $sa.name $source $k $v (get $existingSources $k) (get $existing $k)) }}
{{- end }}
{{- else }}
{{- $_ := set $existing $k $v }}
{{- $_ := set $existingSources $k $source }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $name := $order }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "kasm.metadata" (dict "context" $ "component" "service-account" "resource" "serviceAccount" "name" $name "include" "all" "extraAnnotations" (get $annotationsByName $name)) | indent 2 }}
{{- end }}
