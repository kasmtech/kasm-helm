{{/*
Deploy the RDP HTTPS Gateway StatefulSet if .Values.components.rdpHttpsGateway.enabled is true.
Each pod receives a stable per-pod DNS name via the headless service.
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- $rdpHttpsGatewayReplicas := ternary .Values.components.rdpHttpsGateway.replicas (include "replicas.preset" (dict "node" $constants.rdpHttpsGateway.component "size" .Values.deploymentSize)) (gt (int .Values.components.rdpHttpsGateway.replicas) 0) -}}
{{- $merged := fromYaml (include "kasm.mergedValues" (dict "root" . "componentName" "rdpHttpsGateway")) -}}
{{- $zoneName := "default" -}}
{{- if .Values.kasmZones }}
  {{- $zoneName = (index .Values.kasmZones 0).name -}}
{{- end }}
{{- if .Values.components.rdpHttpsGateway.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "rdpHttpsGateway" "resource" "statefulSet" "zone" $zoneName "include" "all") | indent 2 }}
spec:
  replicas: {{ $rdpHttpsGatewayReplicas }}
  serviceName: {{ $constants.rdpHttpsGateway.svc }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "kasm.metadata" (dict "context" . "component" "rdpHttpsGateway" "resource" "deployment" "zone" $zoneName "include" "match") | indent 6 }}
  template:
    metadata:
      {{- include "kasm.metadata" (dict "context" . "component" "rdpHttpsGateway" "resource" "pod" "zone" $zoneName "include" "la") | indent 6 }}
    spec:
      restartPolicy: {{ $.Values.restartPolicy }}
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name | default (printf "%s-image-pull-secret" .Release.Name) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- include "kasm.securityContext" (list . 1000 "pod") | nindent 6 }}
      initContainers:
        {{- include "kasm.trustedCaInit" (list . "rdpHttpsGw") | nindent 8 }}
        {{- include "kasm.initContainer" (dict "context" $ "serviceName" (printf "%s-%s" $constants.api.svc (include "kasm.zoneName" $zoneName)) "servicePort" $constants.api.port "path" "/api/__healthcheck" "schema" "http" "image" $constants.api.image "component" "api") | nindent 8 }}
        {{- with $merged.extraInitContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ include "kasm.name" (list . "rdpHttpsGateway" "container") }}
          image: {{ $constants.rdpHttpsGateway.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: SERVER_ZONE_NAME
            {{- if .Values.kasmZones }}
              {{- with index .Values.kasmZones 0 }}
              value: {{ .name }}
              {{- end }}
            {{- else }}
              value: "default"
            {{- end }}
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: service-token
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVER_HOSTNAME
              value: "$(HOSTNAME).{{ $constants.rdpHttpsGateway.svc }}.$(POD_NAMESPACE).svc.cluster.local"
            - name: KASM_EPHEMERAL
              value: "true"
            - name: API_SCHEMA
              value: http
            {{/*
              Connection proxies must reach the manager's /manager_api/ endpoint
              (support-bundle uploads) as well as /api/ (registration/heartbeat).
              Only the kasm-proxy nginx service serves both on one port, so point
              the API endpoint at it rather than the api (CherryPy) service.
            */}}
            - name: API_HOSTNAME
            {{- if .Values.kasmZones }}
              {{- with index .Values.kasmZones 0 }}
              value: {{ printf "%s-%s" $constants.proxy.svc (include "kasm.zoneName" .name) | quote }}
              {{- end }}
            {{- else }}
              value: {{ printf "%s-%s" $constants.proxy.svc "default" | quote }}
            {{- end }}
            - name: API_PORT
              value: {{ $constants.proxy.http | quote }}
            - name: API_REFRESH_INTERVAL
              value: "30"
            - name: SERVER_ID
              value: "auto"
            - name: PROXY_PORT
              value: "3389"
            - name: SERVER_PORT
              value: {{ $constants.rdpHttpsGateway.nginxPort | quote }}
            - name: SERVER_THREADS
              value: "10"
            - name: SESSION_WATCH_INTERVAL
              value: "60"
            - name: KEEPALIVE_LOOP_INTERVAL
              value: "30"
            - name: FORWARD_LOGS
              value: "true"
          {{- if $.Values.applyHealthChecks }}
          livenessProbe:
            {{- include "health.probe" (dict "root" $ "component" "rdpHttpsGateway" "probeType" "livenessProbe" "type" "tcp" "port" $constants.rdpHttpsGateway.port) | nindent 12 }}
          readinessProbe:
            {{- include "health.probe" (dict "root" $ "component" "rdpHttpsGateway" "probeType" "readinessProbe" "type" "tcp" "port" $constants.rdpHttpsGateway.port) | nindent 12 }}
          {{- end }}
          {{- if $.Values.components.rdpHttpsGateway.resources }}
          resources: {{- toYaml $.Values.components.rdpHttpsGateway.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" $constants.rdpHttpsGateway.component "size" $.Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- include "kasm.securityContext" (list . 1000 "container") | nindent 10 }}
          volumeMounts:
            - name: kasm-rdp-https-gateway-cert
              mountPath: /opt/rdpgw/server.pem
              subPath: tls.crt
            - name: kasm-rdp-https-gateway-cert
              mountPath: /opt/rdpgw/key.pem
              subPath: tls.key
            - name: kasm-rdp-https-gateway-data
              mountPath: /opt/kasm/current/log
            - name: kasm-rdp-https-gateway-data
              mountPath: /tmp
            {{- with $merged.containerMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- include "kasm.trustedCaVolumeMounts" . | nindent 12 }}
        - name: {{ printf "%s-rdp-https-gateway-nginx" .Release.Name }}
          image: {{ $constants.proxy.image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: rdp-tls-ngnx-pt
              containerPort: {{ $constants.rdpHttpsGateway.nginxPort }}
              protocol: TCP
          volumeMounts:
            - name: kasm-rdp-https-gateway-nginx-shared
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: kasm-rdp-https-gateway-nginx-shared
              mountPath: /etc/nginx/compress.conf
              subPath: compress.conf
            - name: kasm-rdp-https-gateway-nginx-shared
              mountPath: /etc/nginx/logging.conf
              subPath: logging.conf
            - name: kasm-rdp-https-gateway-nginx-shared
              mountPath: /etc/nginx/orchestrator.conf
              subPath: orchestrator.conf
            - name: kasm-rdp-https-gateway-nginx-settings
              mountPath: /etc/nginx/conf.d
            - name: kasm-rdp-https-gateway-nginx-services
              mountPath: /etc/nginx/conf.d/services.d
            - name: kasm-rdp-https-gateway-nginx-data
              mountPath: /var/cache/nginx
            - name: kasm-rdp-https-gateway-nginx-log-tmp
              mountPath: /var/log/nginx
            - name: kasm-rdp-https-gateway-nginx-data
              mountPath: /run
            - name: kasm-rdp-https-gateway-cert
              mountPath: /etc/nginx/ssl/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: kasm-rdp-https-gateway-cert
              mountPath: /etc/nginx/ssl/tls.key
              subPath: tls.key
              readOnly: true
            {{- include "kasm.trustedCaVolumeMounts" . | nindent 12 }}
          {{- if $.Values.applyHealthChecks }}
          livenessProbe:
            {{- include "health.probe" (dict "root" $ "component" "rdpHttpsGateway" "timingScope" "nginxSidecar" "probeType" "livenessProbe" "type" "tcp" "portName" "rdp-tls-ngnx-pt") | nindent 12 }}
          readinessProbe:
            {{- include "health.probe" (dict "root" $ "component" "rdpHttpsGateway" "timingScope" "nginxSidecar" "probeType" "readinessProbe" "type" "tcp" "portName" "rdp-tls-ngnx-pt") | nindent 12 }}
          {{- end }}
          {{- if $.Values.components.rdpHttpsGateway.nginxSidecar.resources }}
          resources: {{- toYaml $.Values.components.rdpHttpsGateway.nginxSidecar.resources | nindent 12 }}
          {{- else }}
          resources: {{- include "resources.preset" (dict "node" "nginx-sidecar" "size" $.Values.deploymentSize) | nindent 12 }}
          {{- end }}
          {{- include "kasm.securityContext" (list . 1000 "container") | nindent 10 }}
        {{- with $merged.extraContainers }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: kasm-rdp-https-gateway-cert
          secret:
            secretName: {{ .Values.certificate.secretName | default (include "kasm.name" (list . "cert-manager" "secret")) }}
        - name: kasm-rdp-https-gateway-data
          emptyDir:
            sizeLimit: 150Mi
        - name: kasm-rdp-https-gateway-nginx-shared
          configMap:
            name: {{ include "kasm.name" (list $ "nginx-shared") }}
        - name: kasm-rdp-https-gateway-nginx-settings
          configMap:
            name: {{ include "kasm.name" (list $ "rdp-https-gateway-nginx-settings") }}
        - name: kasm-rdp-https-gateway-nginx-services
          configMap:
            name: {{ include "kasm.name" (list . "rdp-https-gateway-nginx-services") }}
        - name: kasm-rdp-https-gateway-nginx-data
          emptyDir:
            sizeLimit: 100Mi
        - name: kasm-rdp-https-gateway-nginx-log-tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- with $merged.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "kasm.trustedCaVolumes" . | nindent 8 }}
{{- end }}
