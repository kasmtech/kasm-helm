{{/*
Kasm OTel Collector forwarder Services — one cluster-wide ClusterIP, plus an optional external
Service for out-of-cluster senders (Kasm Agents, external Collectors).

The unauthenticated OTLP/gRPC port (4316) that nginx used to speak to is deliberately absent: nginx
now exports to the Collector sidecar in its own pod over loopback, so the forwarder exposes no
unauthenticated ingest at all.
*/}}
{{- $obs := .Values.observability -}}
{{- if and $obs.enabled (not $obs.collector.forwarder.externalEndpoint) }}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
apiVersion: v1
kind: Service
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "otel-forwarder" "resource" "service" "include" "all") | indent 2 }}
spec:
  selector:
    {{- include "kasm.metadata" (dict "context" . "component" "otel-forwarder" "resource" "service" "include" "match") | indent 4 }}
  ports:
    - name: otlp-http
      protocol: TCP
      port: {{ $constants.otel.otlpHttp }}
    - name: otlp-grpc
      protocol: TCP
      port: {{ $constants.otel.otlpGrpc }}
    - name: health
      protocol: TCP
      port: {{ $constants.otel.health }}
    - name: self-metrics
      protocol: TCP
      port: {{ $constants.otel.selfMetrics }}
{{- if $obs.collector.forwarder.externalService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "kasm.metadata" (dict "context" . "component" "otel-forwarder-ext" "resource" "service" "name" (printf "%s-otel-forwarder-external" .Release.Name) "include" "all") | indent 2 }}
spec:
  type: {{ $obs.collector.forwarder.externalService.type }}
  selector:
    {{- include "kasm.metadata" (dict "context" . "component" "otel-forwarder" "resource" "service" "include" "match") | indent 4 }}
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: {{ $constants.otel.otlpGrpc }}
{{- end }}
{{- end }}
