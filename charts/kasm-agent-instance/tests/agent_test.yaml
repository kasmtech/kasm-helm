suite: agent custom resource
templates:
  - templates/agent.yaml
set:
  manager:
    hostname: zonea.example.com
    existingTokenSecret: kasm-manager-token
  publicHostname: agent.example.com
tests:
  - it: renders the Agent resource with the configured name
    asserts:
      - isKind:
          of: Agent
      - isAPIVersion:
          of: agent.kasm.com/v1alpha1
      - equal:
          path: metadata.name
          value: k8s-agent

  - it: honours a custom agent name
    set:
      name: zonea-agent
    asserts:
      - equal:
          path: metadata.name
          value: zonea-agent

  - it: joins the agent image and falls back to the chart appVersion
    asserts:
      - equal:
          path: spec.image
          value: docker.io/kasmweb/kasm-agent-api:develop

  - it: uses an explicit agent image tag when one is set
    set:
      image:
        registry: harbor.example.com
        repository: kasm/kasm-agent-api
        tag: 1.19.0
    asserts:
      - equal:
          path: spec.image
          value: harbor.example.com/kasm/kasm-agent-api:1.19.0

  - it: joins both session proxy images, with an appVersion fallback only on the sidecar
    asserts:
      - equal:
          path: spec.sessionProxy.image
          value: docker.io/kasmweb/nginx:1.25.3
      - equal:
          path: spec.sessionProxy.sidecarImage
          value: docker.io/kasmweb/kasm-nginx-sidecar:develop

  - it: fails when the session proxy nginx tag is emptied, since it has no fallback
    set:
      sessionProxy:
        image:
          tag: ""
    asserts:
      - failedTemplate:
          errorMessage: "agent.sessionProxy.image.tag is required: this image has no chart appVersion fallback."

  - it: renders the manager connection with its defaults
    asserts:
      - equal:
          path: spec.manager.hostname
          value: zonea.example.com
      - equal:
          path: spec.manager.port
          value: 443
      - equal:
          path: spec.manager.scheme
          value: https
      - equal:
          path: spec.manager.pathPrefix
          value: /manager_api

  - it: fails with a clear message when manager.hostname is empty
    set:
      manager:
        hostname: ""
    asserts:
      - failedTemplate:
          errorMessage: "agent.manager.hostname is required: set it to the hostname of the Kasm manager (or the proxy in front of it) this agent registers with. (With a kasm-helm control plane in this same release, agent.inClusterControlPlane=true derives it instead.)"

  - it: fails with a clear message when publicHostname is empty
    set:
      publicHostname: ""
    asserts:
      - failedTemplate:
          errorMessage: "agent.publicHostname is required: set it to the externally reachable address browsers use to connect to this agent's session proxy. (With a kasm-helm control plane in this same release, agent.inClusterControlPlane=true derives it instead.)"

  - it: fails when neither a token nor an existing token secret is configured
    set:
      manager:
        existingTokenSecret: ""
        token: ""
    asserts:
      - failedTemplate:
          errorMessage: "agent.manager: no manager token configured. Set agent.manager.existingTokenSecret to the name of a Secret already holding the token (preferred), or agent.manager.token to the token itself so this chart creates one. (With a kasm-helm control plane in this same release, agent.inClusterControlPlane=true reads the token the control plane generated.)"

  - it: references an existing token secret with its configured key
    set:
      manager:
        existingTokenSecret: my-manager-token
        tokenSecretKey: manager-token
    asserts:
      - equal:
          path: spec.manager.tokenSecretRef.name
          value: my-manager-token
      - equal:
          path: spec.manager.tokenSecretRef.key
          value: manager-token

  - it: references the chart-created secret when only an inline token is set
    set:
      manager:
        existingTokenSecret: ""
        token: placeholder-token
    asserts:
      - equal:
          path: spec.manager.tokenSecretRef.name
          value: RELEASE-NAME-kasm-agent-instance-manager-token
      - equal:
          path: spec.manager.tokenSecretRef.key
          value: token

  - it: prefers the existing token secret when both it and an inline token are set
    set:
      manager:
        existingTokenSecret: my-manager-token
        token: placeholder-token
    asserts:
      - equal:
          path: spec.manager.tokenSecretRef.name
          value: my-manager-token

  - it: renders the session proxy block with its defaults
    asserts:
      - equal:
          path: spec.sessionProxy.replicas
          value: 1
      - equal:
          path: spec.sessionProxy.probeTimeoutSeconds
          value: 120
      - equal:
          path: spec.sessionProxy.reconcileIntervalSeconds
          value: 30
      - equal:
          path: spec.sessionProxy.routing
          value: dynamic
      - equal:
          path: spec.sessionProxy.drainTimeoutSeconds
          value: 300
      - equal:
          path: spec.sessionProxy.certSecretName
          value: kasm-session-proxy-tls

  - it: switches the session proxy to static routing
    set:
      sessionProxy:
        routing: static
    asserts:
      - equal:
          path: spec.sessionProxy.routing
          value: static

  - it: omits the session proxy service and proxy protocol blocks while they hold only defaults
    asserts:
      - isNull:
          path: spec.sessionProxy.service
      - isNull:
          path: spec.sessionProxy.proxyProtocol

  - it: omits the optional session proxy scaling and placement blocks while they hold only defaults
    asserts:
      - isNull:
          path: spec.sessionProxy.nginx
      - isNull:
          path: spec.sessionProxy.resources
      - isNull:
          path: spec.sessionProxy.sidecarResources
      - isNull:
          path: spec.sessionProxy.nodeSelector
      - isNull:
          path: spec.sessionProxy.tolerations
      - isNull:
          path: spec.sessionProxy.affinity
      - isNull:
          path: spec.sessionProxy.topologySpreadConstraints
      - isNull:
          path: spec.sessionProxy.podDisruptionBudget
      - isNull:
          path: spec.sessionProxy.autoscaling
      - isNull:
          path: spec.sessionProxy.externallyScaled

  - it: renders the session proxy scaling and placement knobs once they are set
    set:
      sessionProxy:
        drainTimeoutSeconds: 600
        nginx:
          workerProcesses: 4
          workerConnections: 2048
        resources:
          requests:
            cpu: 250m
        sidecarResources:
          requests:
            cpu: 50m
        nodeSelector:
          role: proxy
        podDisruptionBudget:
          minAvailable: 1
        autoscaling:
          enabled: true
          sessionsPerReplica: 25
          minReplicas: 2
          maxReplicas: 8
          scaleDownStabilizationSeconds: 900
    asserts:
      - equal:
          path: spec.sessionProxy.drainTimeoutSeconds
          value: 600
      - equal:
          path: spec.sessionProxy.nginx.workerProcesses
          value: 4
      - equal:
          path: spec.sessionProxy.nginx.workerConnections
          value: 2048
      - equal:
          path: spec.sessionProxy.resources.requests.cpu
          value: 250m
      - equal:
          path: spec.sessionProxy.sidecarResources.requests.cpu
          value: 50m
      - equal:
          path: spec.sessionProxy.nodeSelector.role
          value: proxy
      - equal:
          path: spec.sessionProxy.podDisruptionBudget.minAvailable
          value: 1
      - equal:
          path: spec.sessionProxy.autoscaling.sessionsPerReplica
          value: 25
      - equal:
          path: spec.sessionProxy.autoscaling.minReplicas
          value: 2
      - equal:
          path: spec.sessionProxy.autoscaling.maxReplicas
          value: 8
      - equal:
          path: spec.sessionProxy.autoscaling.scaleDownStabilizationSeconds
          value: 900
      - notExists:
          path: spec.sessionProxy.externallyScaled

  - it: hands the proxy replica count to an external scaler
    set:
      sessionProxy:
        externallyScaled: true
    asserts:
      - equal:
          path: spec.sessionProxy.externallyScaled
          value: true
      - isNull:
          path: spec.sessionProxy.autoscaling

  - it: fails when session proxy autoscaling is enabled without its required sizes
    set:
      sessionProxy:
        autoscaling:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "sessionProxy.autoscaling: enabled requires sessionsPerReplica >= 1 and maxReplicas >= 1"

  - it: fails when session proxy autoscaling and external scaling are both on
    set:
      sessionProxy:
        externallyScaled: true
        autoscaling:
          enabled: true
          sessionsPerReplica: 10
          maxReplicas: 5
    asserts:
      - failedTemplate:
          errorMessage: "sessionProxy: set only one of autoscaling.enabled and externallyScaled"

  - it: fails when the session proxy PDB sets both bounds
    set:
      sessionProxy:
        podDisruptionBudget:
          minAvailable: 1
          maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "sessionProxy.podDisruptionBudget: set only one of minAvailable and maxUnavailable"

  - it: renders every session proxy service field once they are set
    set:
      sessionProxy:
        service:
          type: LoadBalancer
          externalTrafficPolicy: Local
          httpsNodePort: 30443
          httpNodePort: 30080
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: external
    asserts:
      - equal:
          path: spec.sessionProxy.service.type
          value: LoadBalancer
      - equal:
          path: spec.sessionProxy.service.externalTrafficPolicy
          value: Local
      - equal:
          path: spec.sessionProxy.service.httpsNodePort
          value: 30443
      - equal:
          path: spec.sessionProxy.service.httpNodePort
          value: 30080
      - equal:
          path: spec.sessionProxy.service.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: external

  - it: publishes the proxy on pinned node ports with client ips preserved
    set:
      sessionProxy:
        service:
          type: NodePort
          externalTrafficPolicy: Local
          httpsNodePort: 32443
          httpNodePort: 32080
    asserts:
      - equal:
          path: spec.sessionProxy.service.type
          value: NodePort
      - equal:
          path: spec.sessionProxy.service.externalTrafficPolicy
          value: Local
      - equal:
          path: spec.sessionProxy.service.httpsNodePort
          value: 32443
      - equal:
          path: spec.sessionProxy.service.httpNodePort
          value: 32080
      - isNull:
          path: spec.sessionProxy.service.annotations
      - equal:
          path: spec.publicPort
          value: 32443              # follows the pinned node port: the control plane dials it for its Hello

  - it: keeps an explicit publicPort over the pinned node port
    set:
      publicPort: 443
      sessionProxy:
        service:
          type: NodePort
          httpsNodePort: 32443
    asserts:
      - equal:
          path: spec.publicPort
          value: 443

  - it: accepts an unpinned NodePort proxy once publicPort names the port in front of it
    set:
      publicPort: 443
      sessionProxy:
        service:
          type: NodePort
    asserts:
      - equal:
          path: spec.publicPort
          value: 443

  - it: renders the service block for an otherwise default ClusterIP carrying annotations
    set:
      sessionProxy:
        service:
          annotations:
            metallb.universe.tf/address-pool: kasm
    asserts:
      - equal:
          path: spec.sessionProxy.service.type
          value: ClusterIP
      - equal:
          path: spec.sessionProxy.service.annotations["metallb.universe.tf/address-pool"]
          value: kasm
      - isNull:
          path: spec.sessionProxy.service.externalTrafficPolicy
      - isNull:
          path: spec.sessionProxy.service.httpsNodePort
      - isNull:
          path: spec.sessionProxy.service.httpNodePort

  - it: keeps numeric-looking service annotations as strings
    set:
      sessionProxy:
        service:
          type: LoadBalancer
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: 3600
    asserts:
      - equal:
          path: spec.sessionProxy.service.annotations["service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout"]
          value: "3600"

  - it: enables proxy protocol with its trusted source ranges
    set:
      sessionProxy:
        proxyProtocol:
          enabled: true
          trustedCIDRs:
            - 10.0.0.0/16
            - 192.168.1.0/24
    asserts:
      - equal:
          path: spec.sessionProxy.proxyProtocol.enabled
          value: true
      - equal:
          path: spec.sessionProxy.proxyProtocol.trustedCIDRs
          value:
            - 10.0.0.0/16
            - 192.168.1.0/24

  - it: renders the proxy protocol block when only trusted cidrs are set
    set:
      sessionProxy:
        proxyProtocol:
          trustedCIDRs:
            - 10.0.0.0/8
    asserts:
      - equal:
          path: spec.sessionProxy.proxyProtocol.enabled
          value: false
      - contains:
          path: spec.sessionProxy.proxyProtocol.trustedCIDRs
          content: 10.0.0.0/8

  - it: omits empty trusted cidrs when proxy protocol is merely enabled
    set:
      sessionProxy:
        proxyProtocol:
          enabled: true
    asserts:
      - equal:
          path: spec.sessionProxy.proxyProtocol.enabled
          value: true
      - isNull:
          path: spec.sessionProxy.proxyProtocol.trustedCIDRs

  - it: omits the operator-managed gateway route by default
    asserts:
      - isNull:
          path: spec.gatewayRoute

  - it: renders the operator-managed gateway route with only the required parent ref
    set:
      gatewayRoute:
        enabled: true
        parentRef:
          name: traefik-gateway
    asserts:
      - equal:
          path: spec.gatewayRoute.enabled
          value: true
      - equal:
          path: spec.gatewayRoute.parentRef.name
          value: traefik-gateway
      - isNull:
          path: spec.gatewayRoute.parentRef.namespace
      - isNull:
          path: spec.gatewayRoute.parentRef.sectionName

  - it: carries the gateway namespace, listener section and explicit hostnames
    set:
      gatewayRoute:
        enabled: true
        parentRef:
          name: traefik-gateway
          namespace: kube-system
          sectionName: tls-passthrough
        hostnames:
          - agent.example.com
          - alt.example.com
    asserts:
      - equal:
          path: spec.gatewayRoute.parentRef.namespace
          value: kube-system
      - equal:
          path: spec.gatewayRoute.parentRef.sectionName
          value: tls-passthrough
      - equal:
          path: spec.gatewayRoute.hostnames
          value:
            - agent.example.com
            - alt.example.com

  - it: leaves gateway route hostnames off so the operator defaults them to the public hostname
    set:
      gatewayRoute:
        enabled: true
        parentRef:
          name: traefik-gateway
    asserts:
      - isNull:
          path: spec.gatewayRoute.hostnames

  - it: fails when the gateway route is enabled without a parent ref name
    set:
      gatewayRoute:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "agent.gatewayRoute.parentRef.name is required when agent.gatewayRoute.enabled is true: set it to the name of the Gateway the operator should attach the TLSRoute to."

  - it: ignores a configured gateway parent ref while the gateway route is disabled
    set:
      gatewayRoute:
        parentRef:
          name: traefik-gateway
          sectionName: tls-passthrough
        hostnames:
          - agent.example.com
    asserts:
      - isNull:
          path: spec.gatewayRoute

  - it: renders the interval, policy and zone defaults
    asserts:
      - equal:
          path: spec.heartbeatIntervalSeconds
          value: 5
      - equal:
          path: spec.imageAvailabilityPolicy
          value: pulled
      - equal:
          path: spec.workspaceCPURequestPercent
          value: 100
      - equal:
          path: spec.imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.logLevel
          value: INFO
      - equal:
          path: spec.publicPort
          value: 443
      - equal:
          path: spec.zone
          value: default

  - it: shrinks the workspace CPU request so sessions bin-pack more per node
    set:
      workspaceCPURequestPercent: 25
    asserts:
      - equal:
          path: spec.workspaceCPURequestPercent
          value: 25

  - it: pre-pulls by default with no scheduled refresh
    asserts:
      - equal:
          path: spec.imagePuller.enabled
          value: true
      - equal:
          path: spec.imagePuller.refreshIntervalSeconds
          value: 0
      - isNull:
          path: spec.imagePuller.extraImages
      - isNull:
          path: spec.imagePuller.resources

  - it: wires the image puller controls (disable, refresh, pre-seed, resources)
    set:
      imagePuller:
        enabled: false
        refreshIntervalSeconds: 3600
        extraImages:
          - image: registry.example.com/team/custom:1.0
            registry: https://registry.example.com
            imagePullSecrets:
              - name: example-registry
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
    asserts:
      - equal:
          path: spec.imagePuller.enabled
          value: false
      - equal:
          path: spec.imagePuller.refreshIntervalSeconds
          value: 3600
      - contains:
          path: spec.imagePuller.extraImages
          content:
            image: registry.example.com/team/custom:1.0
            registry: https://registry.example.com
            imagePullSecrets:
              - name: example-registry
      - equal:
          path: spec.imagePuller.resources.requests.memory
          value: 32Mi

  - it: renders no seccomp block by default
    asserts:
      - isNull:
          path: spec.seccomp

  - it: renders the installer backend when enabled
    set:
      seccomp:
        enabled: true
        installer:
          image:
            registry: registry.example.com
            repository: kasmweb/kasm-seccomp-installer
            tag: "1.2.3"
          imagePullPolicy: Always
          kubeletSeccompDir: /var/lib/rancher/k3s/agent/kubelet/seccomp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
    asserts:
      - equal:
          path: spec.seccomp.backend
          value: installer
      - equal:
          path: spec.seccomp.installer.image
          value: registry.example.com/kasmweb/kasm-seccomp-installer:1.2.3
      - equal:
          path: spec.seccomp.installer.imagePullPolicy
          value: Always
      - equal:
          path: spec.seccomp.installer.kubeletSeccompDir
          value: /var/lib/rancher/k3s/agent/kubelet/seccomp
      - equal:
          path: spec.seccomp.installer.resources.requests.memory
          value: 32Mi
      # the CRD forbids an enabled field; make sure the old one is gone
      - isNull:
          path: spec.seccomp.installer.enabled

  - it: falls the installer image tag back to the chart appVersion
    set:
      seccomp:
        enabled: true
    asserts:
      - matchRegex:
          path: spec.seccomp.installer.image
          pattern: ^docker\.io/kasmweb/kasm-seccomp-installer:.+

  - it: renders the spo backend with no installer block
    set:
      seccomp:
        enabled: true
        backend: spo
    asserts:
      - equal:
          path: spec.seccomp.backend
          value: spo
      - isNull:
          path: spec.seccomp.installer

  - it: omits every optional field that is left empty
    asserts:
      - isNull:
          path: spec.serverID
      - isNull:
          path: spec.apiServerURL
      - isNull:
          path: spec.storageMappings
      - isNull:
          path: spec.imagePullSecrets
      - isNull:
          path: spec.nodeSelector
      - isNull:
          path: spec.workspacesNodeSelector
      - isNull:
          path: spec.resources

  - it: renders the optional fields once they are set
    set:
      serverID: 11111111-2222-3333-4444-555555555555
      apiServerURL: https://kasm-proxy.kasm.svc.cluster.local
      imagePullSecrets:
        - name: kasm-registry
      nodeSelector:
        kubernetes.io/os: linux
      workspacesNodeSelector:
        kasm.com/workspaces: "true"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    asserts:
      - equal:
          path: spec.serverID
          value: 11111111-2222-3333-4444-555555555555
      - equal:
          path: spec.apiServerURL
          value: https://kasm-proxy.kasm.svc.cluster.local
      - contains:
          path: spec.imagePullSecrets
          content:
            name: kasm-registry
      - equal:
          path: spec.nodeSelector["kubernetes.io/os"]
          value: linux
      - equal:
          path: spec.workspacesNodeSelector["kasm.com/workspaces"]
          value: "true"
      - equal:
          path: spec.resources.limits.cpu
          value: 500m


  - it: passes workspacesTolerations through to the Agent
    set:
      workspacesTolerations:
        - key: kasm.com/workspaces
          operator: Exists
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.workspacesTolerations[0].key
          value: kasm.com/workspaces
      - equal:
          path: spec.workspacesTolerations[0].effect
          value: NoSchedule

  - it: omits workspacesTolerations when empty
    asserts:
      - isNull:
          path: spec.workspacesTolerations
  - it: omits storageMappings when it is disabled and no installation id is set
    set:
      storageMappings:
        enabled: false
        installationID: ""
    asserts:
      - isNull:
          path: spec.storageMappings

  - it: renders storageMappings when it is enabled
    set:
      storageMappings:
        enabled: true
    asserts:
      - equal:
          path: spec.storageMappings.enabled
          value: true
      - isNull:
          path: spec.storageMappings.installationID

  - it: renders storageMappings when only an installation id is set
    set:
      storageMappings:
        installationID: kasm-prod
    asserts:
      - equal:
          path: spec.storageMappings.enabled
          value: false
      - equal:
          path: spec.storageMappings.installationID
          value: kasm-prod

  - it: defaults the otel endpoint to the collector service for this release
    asserts:
      - contains:
          path: spec.env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://RELEASE-NAME-kasm-otel-collector:4318
      - contains:
          path: spec.env
          content:
            name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
            value: cumulative

  - it: honours an explicit otel endpoint
    set:
      otel:
        endpoint: http://otel-gateway.observability.svc.cluster.local:4318
    asserts:
      - contains:
          path: spec.env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-gateway.observability.svc.cluster.local:4318

  - it: drops the otel env entirely when otel is disabled
    set:
      otel:
        enabled: false
    asserts:
      - isNull:
          path: spec.env

  - it: adds the gpu operator flag only when gpu is enabled
    set:
      gpu:
        enabled: true
    asserts:
      - contains:
          path: spec.env
          content:
            name: KASM_GPU_OPERATOR_ENABLED
            value: "true"

  - it: omits the gpu operator flag by default
    asserts:
      - notContains:
          path: spec.env
          content:
            name: KASM_GPU_OPERATOR_ENABLED
            value: "true"

  - it: appends user env entries after the generated ones so the operator merge favours them
    set:
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://custom-collector:4318
        - name: KASM_EXTRA
          value: extra-value
    asserts:
      - equal:
          path: spec.env[0].name
          value: OTEL_EXPORTER_OTLP_ENDPOINT
      - equal:
          path: spec.env[2].value
          value: http://custom-collector:4318
      - contains:
          path: spec.env
          content:
            name: KASM_EXTRA
            value: extra-value

  - it: renders user env even when otel and gpu are both off
    set:
      otel:
        enabled: false
      env:
        - name: KASM_EXTRA
          value: extra-value
    asserts:
      - equal:
          path: spec.env
          value:
            - name: KASM_EXTRA
              value: extra-value

  # ---------- workspacesAutoscaling ----------
  - it: omits workspacesAutoscaling and standby by default
    asserts:
      - isNull:
          path: spec.workspacesAutoscaling
      - isNull:
          path: spec.workspacesAutoscaling.standby

  - it: renders workspacesAutoscaling when enabled, omitting an unset maxNodes
    set:
      workspacesAutoscaling:
        enabled: true
    asserts:
      - equal:
          path: spec.workspacesAutoscaling.enabled
          value: true
      - equal:
          path: spec.workspacesAutoscaling.schedulingTimeoutSeconds
          value: 600
      - isNull:
          path: spec.workspacesAutoscaling.maxNodes

  - it: carries a maxNodes cap and a custom scheduling timeout
    set:
      workspacesAutoscaling:
        enabled: true
        maxNodes: 5
        schedulingTimeoutSeconds: 120
    asserts:
      - equal:
          path: spec.workspacesAutoscaling.maxNodes
          value: 5
      - equal:
          path: spec.workspacesAutoscaling.schedulingTimeoutSeconds
          value: 120

  # ---------- standby (nests under workspacesAutoscaling) ----------
  - it: renders standby under workspacesAutoscaling, without enabling the wait-for-node path
    set:
      workspacesAutoscaling:
        standby:
          enabled: true
          priorityClassName: kasm-standby
          replicas: 3
    asserts:
      - equal:
          path: spec.workspacesAutoscaling.standby.enabled
          value: true
      - isNull:
          path: spec.workspacesAutoscaling.enabled
      - equal:
          path: spec.workspacesAutoscaling.standby.priorityClassName
          value: kasm-standby
      - equal:
          path: spec.workspacesAutoscaling.standby.replicas
          value: 3
      - equal:
          path: spec.workspacesAutoscaling.standby.externallyScaled
          value: false
      - equal:
          path: spec.workspacesAutoscaling.standby.image
          value: registry.k8s.io/pause:3.10
      - isNull:
          path: spec.workspacesAutoscaling.standby.resources

  - it: passes standby resources (a bare resource map) and the externallyScaled flag through
    set:
      workspacesAutoscaling:
        standby:
          enabled: true
          priorityClassName: kasm-standby
          externallyScaled: true
          resources:
            cpu: "2"
            memory: 2Gi
    asserts:
      - equal:
          path: spec.workspacesAutoscaling.standby.externallyScaled
          value: true
      - equal:
          path: spec.workspacesAutoscaling.standby.resources.cpu
          value: "2"
      - equal:
          path: spec.workspacesAutoscaling.standby.resources.memory
          value: 2Gi
      - isNull:
          path: spec.workspacesAutoscaling.standby.resources.requests

  - it: derives the standby priorityClassName from the agent name when none is set
    set:
      workspacesAutoscaling:
        standby:
          enabled: true
    asserts:
      - equal:
          path: spec.workspacesAutoscaling.standby.priorityClassName
          value: k8s-agent-standby

  - it: derives the standby priorityClassName from a custom agent name
    set:
      name: zone-b-agent
      workspacesAutoscaling:
        standby:
          enabled: true
    asserts:
      - equal:
          path: spec.workspacesAutoscaling.standby.priorityClassName
          value: zone-b-agent-standby

  - it: carries the wait-for-node settings and standby together in one block
    set:
      workspacesAutoscaling:
        enabled: true
        maxNodes: 4
        standby:
          enabled: true
          replicas: 2
    asserts:
      - equal:
          path: spec.workspacesAutoscaling.enabled
          value: true
      - equal:
          path: spec.workspacesAutoscaling.maxNodes
          value: 4
      - equal:
          path: spec.workspacesAutoscaling.standby.enabled
          value: true
      - equal:
          path: spec.workspacesAutoscaling.standby.replicas
          value: 2
