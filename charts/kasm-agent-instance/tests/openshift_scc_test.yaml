suite: OpenShift SecurityContextConstraints for the agent's sessions

templates:
  - templates/openshift-scc.yaml

values:
  - ../../../tests/values-agent/agent-only.yaml

tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the uid-1000 SCC, the host-root SCC, their ClusterRole and the grant by default
    set:
      openshift.scc.enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        isKind:
          of: SecurityContextConstraints
      - documentIndex: 0
        equal:
          path: metadata.name
          value: kasm-NAMESPACE-k8s-agent-workspace
      - documentIndex: 0
        equal:
          path: runAsUser.type
          value: MustRunAsNonRoot
      - documentIndex: 0
        equal:
          path: allowPrivilegeEscalation
          value: false
      - documentIndex: 0
        equal:
          path: allowPrivilegedContainer
          value: false
      - documentIndex: 0
        equal:
          path: allowHostDirVolumePlugin
          value: false
      - documentIndex: 0
        equal:
          path: allowedCapabilities
          value: [SYS_CHROOT, NET_BIND_SERVICE]
      - documentIndex: 0
        equal:
          path: requiredDropCapabilities
          value: [ALL]
      - documentIndex: 0
        notExists:
          path: userNamespaceLevel
      - documentIndex: 0
        equal:
          path: fsGroup.type
          value: RunAsAny
      - documentIndex: 0
        equal:
          path: seLinuxContext.type
          value: MustRunAs
      - documentIndex: 0
        equal:
          path: seccompProfiles
          value: [runtime/default, localhost/*, unconfined]
      - documentIndex: 0
        notContains:
          path: volumes
          content: hostPath
      - documentIndex: 1
        isKind:
          of: SecurityContextConstraints
      - documentIndex: 1
        equal:
          path: metadata.name
          value: kasm-NAMESPACE-k8s-agent-workspace-root
      - documentIndex: 1
        equal:
          path: runAsUser.type
          value: RunAsAny
      - documentIndex: 1
        notExists:
          path: userNamespaceLevel
      - documentIndex: 1
        equal:
          path: allowPrivilegeEscalation
          value: true
      - documentIndex: 1
        equal:
          path: allowedCapabilities
          value: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SYS_CHROOT]
      - documentIndex: 1
        equal:
          path: requiredDropCapabilities
          value: []
      - documentIndex: 2
        isKind:
          of: ClusterRole
      - documentIndex: 2
        equal:
          path: rules[0]
          value:
            apiGroups: ["security.openshift.io"]
            resources: ["securitycontextconstraints"]
            resourceNames: ["kasm-NAMESPACE-k8s-agent-workspace", "kasm-NAMESPACE-k8s-agent-workspace-root"]
            verbs: ["use"]
      - documentIndex: 3
        isKind:
          of: RoleBinding
      - documentIndex: 3
        equal:
          path: metadata.name
          value: k8s-agent-workspace-scc
      - documentIndex: 3
        equal:
          path: roleRef.name
          value: kasm-NAMESPACE-k8s-agent-workspace
      - documentIndex: 3
        equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: k8s-agent-workspace
            namespace: NAMESPACE

  - it: requires a pod user namespace on the root SCC for an explicit rootMode userns
    set:
      openshift.scc.enabled: true
      workspaceSecurity.rootMode: userns
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        notExists:
          path: userNamespaceLevel
      - documentIndex: 1
        equal:
          path: userNamespaceLevel
          value: RequirePodLevel

  - it: admits host uid 0 on the root SCC for rootMode host, with no user-namespace requirement
    set:
      openshift.scc.enabled: true
      workspaceSecurity.rootMode: host
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 1
        equal:
          path: metadata.name
          value: kasm-NAMESPACE-k8s-agent-workspace-root
      - documentIndex: 1
        equal:
          path: runAsUser.type
          value: RunAsAny
      - documentIndex: 1
        equal:
          path: allowPrivilegeEscalation
          value: true
      - documentIndex: 1
        equal:
          path: allowedCapabilities
          value: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SYS_CHROOT]
      - documentIndex: 1
        notExists:
          path: userNamespaceLevel
      - documentIndex: 0
        notExists:
          path: userNamespaceLevel

  - it: renders only the uid-1000 SCC for rootMode forbid, with the baseline capabilities
    set:
      openshift.scc.enabled: true
      workspaceSecurity.rootMode: forbid
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        equal:
          path: runAsUser.type
          value: MustRunAsNonRoot
      - documentIndex: 0
        equal:
          path: allowPrivilegeEscalation
          value: false
      - documentIndex: 0
        equal:
          path: allowedCapabilities
          value: [SYS_CHROOT, NET_BIND_SERVICE]
      - documentIndex: 0
        notExists:
          path: userNamespaceLevel
      - documentIndex: 1
        isKind:
          of: ClusterRole
      - documentIndex: 1
        equal:
          path: rules[0].resourceNames
          value: [kasm-NAMESPACE-k8s-agent-workspace]

  - it: admits only NET_BIND_SERVICE for rootMode forbid with profile restricted
    set:
      openshift.scc.enabled: true
      workspaceSecurity.rootMode: forbid
      workspaceSecurity.profile: restricted
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        equal:
          path: allowedCapabilities
          value: [NET_BIND_SERVICE]
      - documentIndex: 0
        equal:
          path: allowPrivilegeEscalation
          value: false

  - it: adds SETUID and SETGID and allows privilege escalation on the uid-1000 SCC with sudo
    set:
      openshift.scc.enabled: true
      workspaceSecurity.rootMode: forbid
      workspaceSecurity.sudo: true
    asserts:
      - documentIndex: 0
        equal:
          path: allowedCapabilities
          value: [SETUID, SETGID, SYS_CHROOT, NET_BIND_SERVICE]
      - documentIndex: 0
        equal:
          path: allowPrivilegeEscalation
          value: true
      - documentIndex: 0
        equal:
          path: runAsUser.type
          value: MustRunAsNonRoot

  - it: requires a pod user namespace on both SCCs with userNamespaces always
    set:
      openshift.scc.enabled: true
      workspaceSecurity.rootMode: userns
      workspaceSecurity.userNamespaces: always
    asserts:
      - documentIndex: 0
        equal:
          path: userNamespaceLevel
          value: RequirePodLevel
      - documentIndex: 1
        equal:
          path: userNamespaceLevel
          value: RequirePodLevel

  - it: admits only NET_BIND_SERVICE on the uid-1000 SCC for profile restricted, and host root on the root SCC by default
    set:
      openshift.scc.enabled: true
      workspaceSecurity.profile: restricted
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        equal:
          path: allowedCapabilities
          value: [NET_BIND_SERVICE]
      - documentIndex: 0
        equal:
          path: runAsUser.type
          value: MustRunAsNonRoot
      - documentIndex: 1
        equal:
          path: runAsUser.type
          value: RunAsAny
      - documentIndex: 1
        equal:
          path: allowedCapabilities
          value: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SYS_CHROOT]
      - documentIndex: 1
        notExists:
          path: userNamespaceLevel

  - it: requires a pod user namespace only on the uid-1000 SCC with userNamespaces always and the default host mode
    set:
      openshift.scc.enabled: true
      workspaceSecurity.userNamespaces: always
    asserts:
      - documentIndex: 0
        equal:
          path: userNamespaceLevel
          value: RequirePodLevel
      - documentIndex: 1
        notExists:
          path: userNamespaceLevel

  - it: lets an explicit capability list win over the derived sets on both SCCs
    set:
      openshift.scc.enabled: true
      workspaceSecurity.profile: restricted
      openshift.scc.workspace.capabilities: [NET_BIND_SERVICE, SYS_ADMIN]
    asserts:
      - documentIndex: 0
        equal:
          path: allowedCapabilities
          value: [NET_BIND_SERVICE, SYS_ADMIN]
      - documentIndex: 1
        equal:
          path: allowedCapabilities
          value: [NET_BIND_SERVICE, SYS_ADMIN]

  - it: adds hostPath, privileged and volume kinds when asked, under a custom name
    set:
      openshift.scc.enabled: true
      openshift.scc.workspace.name: sessions
      openshift.scc.workspace.allowHostPath: true
      openshift.scc.workspace.allowPrivileged: true
      openshift.scc.workspace.volumes: [emptyDir, image]
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.name
          value: sessions
      - documentIndex: 1
        equal:
          path: metadata.name
          value: sessions-root
      - documentIndex: 0
        equal:
          path: allowHostDirVolumePlugin
          value: true
      - documentIndex: 0
        equal:
          path: allowPrivilegedContainer
          value: true
      - documentIndex: 0
        equal:
          path: volumes
          value: [emptyDir, image, hostPath]
      - documentIndex: 1
        equal:
          path: volumes
          value: [emptyDir, image, hostPath]
      - documentIndex: 2
        equal:
          path: metadata.name
          value: sessions
      - documentIndex: 2
        equal:
          path: rules[0].resourceNames
          value: [sessions, sessions-root]

  - it: keeps the root SCC name within 63 characters when the base name is at the limit
    set:
      openshift.scc.enabled: true
      openshift.scc.workspace.name: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijk
    asserts:
      - documentIndex: 1
        equal:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdef-root

  - it: also grants the privileged SCC to the seccomp installer with the installer backend
    set:
      openshift.scc.enabled: true
      seccomp.enabled: true
      seccomp.backend: installer
    asserts:
      - hasDocuments:
          count: 6
      - documentIndex: 4
        isKind:
          of: ClusterRole
      - documentIndex: 4
        equal:
          path: metadata.name
          value: kasm-NAMESPACE-k8s-agent-seccomp-installer
      - documentIndex: 4
        equal:
          path: rules[0].resourceNames
          value: [privileged]
      - documentIndex: 5
        isKind:
          of: RoleBinding
      - documentIndex: 5
        equal:
          path: subjects[0].name
          value: k8s-agent-seccomp-installer

  - it: grants the seccomp installer nothing with the spo backend, which runs no node pods
    set:
      openshift.scc.enabled: true
      seccomp.enabled: true
      seccomp.backend: spo
    asserts:
      - hasDocuments:
          count: 4
