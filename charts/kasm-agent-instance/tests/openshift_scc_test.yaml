suite: OpenShift SecurityContextConstraint for the agent's sessions

templates:
  - templates/openshift-scc.yaml

values:
  - ../../../tests/values-agent/agent-only.yaml

tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the workspace SCC, its ClusterRole and the grant to the operator's workspace account
    set:
      openshift.scc.enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        isKind:
          of: SecurityContextConstraints
      - documentIndex: 0
        equal:
          path: metadata.name
          value: kasm-NAMESPACE-k8s-agent-workspace
      - documentIndex: 0
        equal:
          path: allowPrivilegeEscalation
          value: true
      - documentIndex: 0
        equal:
          path: allowPrivilegedContainer
          value: false
      - documentIndex: 0
        equal:
          path: allowHostDirVolumePlugin
          value: false
      - documentIndex: 0
        equal:
          path: allowedCapabilities
          value: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SYS_CHROOT]
      - documentIndex: 0
        equal:
          path: runAsUser.type
          value: RunAsAny
      - documentIndex: 0
        equal:
          path: fsGroup.type
          value: RunAsAny
      - documentIndex: 0
        equal:
          path: seLinuxContext.type
          value: MustRunAs
      - documentIndex: 0
        equal:
          path: seccompProfiles
          value: [runtime/default, localhost/*, unconfined]
      - documentIndex: 0
        notContains:
          path: volumes
          content: hostPath
      - documentIndex: 1
        isKind:
          of: ClusterRole
      - documentIndex: 1
        equal:
          path: rules[0]
          value:
            apiGroups: ["security.openshift.io"]
            resources: ["securitycontextconstraints"]
            resourceNames: ["kasm-NAMESPACE-k8s-agent-workspace"]
            verbs: ["use"]
      - documentIndex: 2
        isKind:
          of: RoleBinding
      - documentIndex: 2
        equal:
          path: metadata.name
          value: k8s-agent-workspace-scc
      - documentIndex: 2
        equal:
          path: roleRef.name
          value: kasm-NAMESPACE-k8s-agent-workspace
      - documentIndex: 2
        equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: k8s-agent-workspace
            namespace: NAMESPACE

  - it: adds hostPath, privileged, extra capabilities and volume kinds when asked
    set:
      openshift.scc.enabled: true
      openshift.scc.workspace.name: sessions
      openshift.scc.workspace.allowHostPath: true
      openshift.scc.workspace.allowPrivileged: true
      openshift.scc.workspace.capabilities: [SETUID, SYS_ADMIN]
      openshift.scc.workspace.volumes: [emptyDir, image]
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.name
          value: sessions
      - documentIndex: 0
        equal:
          path: allowHostDirVolumePlugin
          value: true
      - documentIndex: 0
        equal:
          path: allowPrivilegedContainer
          value: true
      - documentIndex: 0
        equal:
          path: allowedCapabilities
          value: [SETUID, SYS_ADMIN]
      - documentIndex: 0
        equal:
          path: volumes
          value: [emptyDir, image, hostPath]
      - documentIndex: 1
        equal:
          path: rules[0].resourceNames
          value: [sessions]

  - it: also grants the privileged SCC to the seccomp installer with the installer backend
    set:
      openshift.scc.enabled: true
      seccomp.enabled: true
      seccomp.backend: installer
    asserts:
      - hasDocuments:
          count: 5
      - documentIndex: 3
        isKind:
          of: ClusterRole
      - documentIndex: 3
        equal:
          path: metadata.name
          value: kasm-NAMESPACE-k8s-agent-seccomp-installer
      - documentIndex: 3
        equal:
          path: rules[0].resourceNames
          value: [privileged]
      - documentIndex: 4
        isKind:
          of: RoleBinding
      - documentIndex: 4
        equal:
          path: subjects[0].name
          value: k8s-agent-seccomp-installer

  - it: grants the seccomp installer nothing with the spo backend, which runs no node pods
    set:
      openshift.scc.enabled: true
      seccomp.enabled: true
      seccomp.backend: spo
    asserts:
      - hasDocuments:
          count: 3
