suite: inClusterControlPlane derivation

templates:
  - templates/agent.yaml
  - templates/self-signed-cert.yaml

tests:
  - it: derives manager, token and public hostname from the release's control plane
    template: templates/agent.yaml
    set:
      inClusterControlPlane: true
    asserts:
      - equal:
          path: spec.manager.hostname
          value: RELEASE-NAME-proxy-default.NAMESPACE.svc.cluster.local
      - equal:
          path: spec.manager.tokenSecretRef.name
          value: RELEASE-NAME-secrets
      - equal:
          path: spec.manager.tokenSecretRef.key
          value: manager-token          # not "token" - kasm-helm stores it under this key
      - equal:
          path: spec.publicHostname
          value: k8s-agent-session-proxy.NAMESPACE.svc.cluster.local
      - equal:
          path: spec.manager.port
          value: 8080                   # the in-cluster proxy Service, plain HTTP
      - equal:
          path: spec.manager.scheme
          value: http
      - equal:
          path: spec.publicPort
          value: 4444                   # the session proxy's own listener

  - it: derives the port and scheme only alongside a derived hostname
    template: templates/agent.yaml
    set:
      inClusterControlPlane: true
      manager:
        hostname: kasm.example.com
      publicHostname: sessions.example.com
    asserts:
      - equal:
          path: spec.manager.port
          value: 443
      - equal:
          path: spec.manager.scheme
          value: https
      - equal:
          path: spec.publicPort
          value: 443

  - it: explicit values still win over the derived ones
    template: templates/agent.yaml
    set:
      inClusterControlPlane: true
      manager:
        hostname: kasm.example.com
        existingTokenSecret: my-token
      publicHostname: sessions.example.com
    asserts:
      - equal:
          path: spec.manager.hostname
          value: kasm.example.com
      - equal:
          path: spec.manager.tokenSecretRef.name
          value: my-token
      - equal:
          path: spec.publicHostname
          value: sessions.example.com

  - it: generates a session-proxy certificate when cert-manager is not issuing one
    template: templates/self-signed-cert.yaml
    set:
      inClusterControlPlane: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: kasm-session-proxy-tls
      - equal:
          path: type
          value: kubernetes.io/tls

  - it: defers to cert-manager when that is enabled
    template: templates/self-signed-cert.yaml
    set:
      inClusterControlPlane: true
      sessionProxy:
        certificate:
          enabled: true
          issuerRef:
            name: letsencrypt-prod
    asserts:
      - hasDocuments:
          count: 0

  - it: follows global.kasm.inClusterControlPlane when the flag is left null (Rancher form nulls it)
    template: templates/agent.yaml
    set:
      global:
        kasm:
          inClusterControlPlane: true
    asserts:
      - equal:
          path: spec.manager.hostname
          value: RELEASE-NAME-proxy-default.NAMESPACE.svc.cluster.local
      - equal:
          path: spec.publicHostname
          value: k8s-agent-session-proxy.NAMESPACE.svc.cluster.local

  # An explicit `inClusterControlPlane: false` wins over the global and makes the three values
  # required again. helm-unittest cannot express it: its value merge drops a `false` set over the
  # chart's `null` default. Covered by
  #   helm template kasm charts/kasm-platform --set kasm-agent.agent.inClusterControlPlane=false
  # which fails on agent.manager.hostname.
