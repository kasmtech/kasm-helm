suite: standby placeholder PriorityClass
templates:
  - templates/standby-priorityclass.yaml
set:
  manager:
    hostname: zonea.example.com
    existingTokenSecret: kasm-manager-token
  publicHostname: agent.example.com
tests:
  - it: renders nothing while standby is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the PriorityClass by default with a name derived from the agent
    set:
      standby:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PriorityClass
      - equal:
          path: metadata.name
          value: k8s-agent-standby
      - equal:
          path: value
          value: -10
      - equal:
          path: preemptionPolicy
          value: Never
      - equal:
          path: globalDefault
          value: false

  - it: uses an explicit priorityClassName when set
    set:
      standby:
        enabled: true
        priorityClassName: kasm-standby
    asserts:
      - equal:
          path: metadata.name
          value: kasm-standby

  - it: renders nothing when opted out to reference an admin-managed PriorityClass
    set:
      standby:
        enabled: true
        priorityClassName: kasm-standby
        priorityClass:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: honours a custom negative value
    set:
      standby:
        enabled: true
        priorityClassName: kasm-standby
        priorityClass:
          value: -25
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: value
          value: -25

  - it: fails when asked to create a PriorityClass with a non-negative value
    set:
      standby:
        enabled: true
        priorityClassName: kasm-standby
        priorityClass:
          value: 0
    asserts:
      - failedTemplate:
          errorMessage: "standby.priorityClass.value must be negative so a session can preempt a standby placeholder; set it below zero"

  - it: renders nothing when standby itself is disabled even if create is on
    set:
      standby:
        priorityClass:
          create: true
    asserts:
      - hasDocuments:
          count: 0
