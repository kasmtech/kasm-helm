# nameOverride -- Override the chart name used to build the names of the satellite objects (token Secret,
# Certificate, KasmImagePuller, HTTPRoute) and the `app.kubernetes.io/name` label. The Agent custom resource
# itself is named by `name`, not by this.
#
nameOverride: ""

# fullnameOverride -- Fully override the generated name prefix for the satellite objects. When set, those names
# are derived from this instead of from the release name and the chart name.
#
fullnameOverride: ""

# global -- Values Helm shares with every chart in a release. Rancher fills in `global.cattle.*` on every
# install from its catalog; nothing here needs to be set by hand.
global:
  cattle:
    # global.cattle.systemDefaultRegistry -- The registry Rancher configured as the cluster's system default
    # registry (air-gapped and mirrored clusters). When set, it replaces the registry part of every image this
    # chart renders and `image.registry` is ignored, following Rancher's convention. Rancher sets it on install
    # from its catalog; leave it empty everywhere else.
    systemDefaultRegistry: ""

# commonLabels -- Custom labels to apply to every resource created by **this chart** (the Agent
# custom resource, its RBAC, the session-proxy TLS Secret). These do NOT reach the workloads the
# operator creates from the Agent CR -- use agentLabels and workspaceLabels for those.
#
commonLabels: {}

# agentLabels -- Extra Kubernetes labels the operator stamps onto every workload it creates for this
# agent: the agent Deployment, the session proxy, and their Services and RBAC. Added to each
# object's metadata.labels, never to the immutable pod selectors. Distinct from workspaceLabels
# (the session pods), so the agent's own workloads and its workspaces can be tracked separately.
#
agentLabels: {}

# workspaceLabels -- Extra Kubernetes labels the operator stamps onto every workspace (session) pod
# this agent launches, and its resources. A session's own labels layer on top, winning on
# conflicting keys. Distinct from agentLabels, which target the agent's own workloads.
#
workspaceLabels: {}

# commonAnnotations -- Custom annotations to apply to every resource created by this chart.
#
commonAnnotations: {}

# inClusterControlPlane -- Derive the control-plane connection from a `kasm-helm` release installed
# under the **same release name and namespace** - which is what the `kasm-platform` umbrella does.
#
# When true, three values that otherwise have no default and fail the render are derived instead:
#
# * `manager.hostname` becomes `<release>-proxy-default.<namespace>.svc.cluster.local`
# * the manager token is read from the `<release>-secrets` Secret the control plane generates,
#   under its `manager-token` key
# * `publicHostname` becomes `<name>-session-proxy.<namespace>.svc.cluster.local`
#
# Anything you set explicitly still wins. Unset (null, the default), the `kasm-platform` umbrella's
# `global.kasm.inClusterControlPlane` decides, and without that it is off. That fallback exists
# because Rancher's install form can submit an untouched toggle as null, which deletes an umbrella's
# per-subchart override; an explicit `false` here still wins over the global.
# The derived `manager.hostname` assumes the default zone;
# set it yourself when `kasm-helm.kasmZones` names something else.
#
# The derived `publicHostname` is an in-cluster address, so it only works while the control plane
# relays session traffic (`proxy_connections: true`, Kasm's default). Publishing sessions directly
# to browsers needs a real external hostname here - see the networking documentation.
#
# @default -- `null`: follow `global.kasm.inClusterControlPlane`, else `false`
inClusterControlPlane: null

# name -- Name of the Agent custom resource. The operator derives the names of the objects it creates from this,
# most visibly the session-proxy Service, which it names `<name>-session-proxy`.
#
name: "k8s-agent"

# image -- The Kasm agent API container image, deployed by the operator as `spec.image`.
#
image:
  # image.registry -- Registry that hosts the agent image.
  registry: docker.io
  # image.repository -- Repository of the agent image, without the registry or tag.
  repository: kasmweb/agent-api
  # image.tag -- Tag of the agent image. Pinned to the agent build this chart version ships;
  # empty falls back to the chart's `appVersion`.
  tag: "1.1190.8-agent.1"

# manager -- The Kasm control plane this agent registers and heartbeats with.
#
manager:
  # manager.hostname -- REQUIRED. Hostname of the Kasm manager (or the proxy in front of it) the agent
  # heartbeats to. Templating fails when this is empty - there is no sensible default.
  hostname: ""
  # manager.port -- Port the manager listens on.
  port: 443
  # manager.scheme -- URL scheme used to reach the manager - `https` or `http`.
  scheme: https
  # manager.pathPrefix -- Prefix prepended to manager API paths. When reaching the manager through its public
  # proxy this is `/manager_api`; set it empty only for direct manager-Service access.
  pathPrefix: /manager_api
  # manager.token -- The shared manager token, in plaintext. When set (and `manager.existingTokenSecret` is
  # not), this chart creates a Secret named `<fullname>-manager-token` holding it and points the Agent at that.
  # Prefer `manager.existingTokenSecret` for anything but a throwaway environment - a value set here lands in
  # the Helm release history.
  token: ""
  # manager.existingTokenSecret -- Name of an existing Secret holding the manager token. Takes precedence over
  # `manager.token`; when set, this chart creates no Secret of its own. One of the two must be set.
  existingTokenSecret: ""
  # manager.tokenSecretKey -- Key inside `manager.existingTokenSecret` that holds the token.
  tokenSecretKey: token

# publicHostname -- REQUIRED. This agent's externally reachable address, advertised to the manager as where
# browsers should connect. Templating fails when this is empty.
#
publicHostname: ""

# publicPort -- Port the session proxy is reachable on publicly: the port browsers connect to and the one the
# control plane dials (`https://<publicHostname>:<publicPort>/agent/api/v1/hello/`) before it hands this agent
# a session. Empty (the default) derives it: 4444 while the hostname is derived in-cluster, the pinned
# `sessionProxy.service.httpsNodePort` when the proxy Service is a `NodePort`, 443 otherwise. Set it
# explicitly when something in front of the proxy owns the port (an ingress or load balancer on 443, a
# firewall forwarding 443 to the node port). A `LoadBalancer` Service publishes the proxy's own port,
# 4444, unless the load balancer remaps it (an OCI load balancer does not), so set `publicPort: 4444`
# there. A wrong value fails silently at install time and loudly at the first launch: the Hello is
# refused and every session request answers "No Agent slots available".
#
publicPort: ""

# zone -- Deployment zone the agent reports to the manager. Must match a zone configured on the control plane.
#
zone: "default"

# sessionProxy -- The nginx session proxy the operator deploys alongside the agent. It terminates the browser
# connection and routes it to the workspace container for the session.
#
sessionProxy:
  # sessionProxy.image -- The nginx session-proxy container image.
  image:
    # sessionProxy.image.registry -- Registry that hosts the nginx image.
    registry: docker.io
    # sessionProxy.image.repository -- Repository of the nginx image, without the registry or tag.
    repository: kasmweb/nginx
    # sessionProxy.image.tag -- Tag of the nginx image. This one has no fallback: it tracks upstream nginx, not
    # the Kasm release, so templating fails if it is emptied.
    tag: "1.25.3"
  # sessionProxy.sidecarImage -- The kasm-nginx-sidecar image that materializes per-session nginx config and
  # reloads the proxy.
  sidecarImage:
    # sessionProxy.sidecarImage.registry -- Registry that hosts the sidecar image.
    registry: docker.io
    # sessionProxy.sidecarImage.repository -- Repository of the sidecar image, without the registry or tag.
    repository: kasmweb/nginx-sidecar
    # sessionProxy.sidecarImage.tag -- Tag of the sidecar image. Pinned to the agent build this chart
    # version ships; empty falls back to the chart's `appVersion`.
    tag: "1.1190.8-agent.1"
  # sessionProxy.replicas -- Replica count for the session-proxy Deployment the operator creates.
  replicas: 1
  # sessionProxy.probeTimeoutSeconds -- How long the sidecar waits for a session to become ready before giving up.
  probeTimeoutSeconds: 120
  # sessionProxy.reconcileIntervalSeconds -- The sidecar's session reconcile interval.
  reconcileIntervalSeconds: 30
  # sessionProxy.routing -- How the proxy finds a session's workspace, `static` or `dynamic`. `dynamic` (the
  # default) has nginx look the workspace up per request in a table the sidecar keeps current, with no reload;
  # it needs a session-proxy image carrying nginx's njs module (`kasmweb/nginx`, the default image, has it).
  # `static` has the sidecar write an nginx location per session and reload nginx whenever one comes or goes;
  # a reload replaces every worker, and the old ones live on for as long as the connections they hold, so under
  # heavy session churn worker generations pile up without bound. Changing this restarts the proxy.
  routing: dynamic
  # sessionProxy.drainTimeoutSeconds -- How long a proxy pod that is being stopped keeps serving the
  # connections it already holds. A stopping pod leaves the Service at once, so new connections go to other
  # pods, but the desktop streams already on it keep running and are cut only when this elapses. Session
  # streams can last hours, so set this to how long a rollout or a scale-in may take. Empty leaves the
  # operator's default of 300.
  drainTimeoutSeconds: 300
  # sessionProxy.nginx -- nginx worker sizing for one proxy pod, and so its connection capacity. A proxied
  # connection uses two of a worker's connections (client and upstream), and a session holds one per service
  # in its port map (vnc, audio, uploads, ...), so a pod carries roughly
  # `workerProcesses * workerConnections / (2 * services-per-session)` sessions. With the defaults (6 x 1024)
  # that is about 3,000 proxied connections; past it nginx refuses every new request, streams and HTTP alike.
  # Omitted from the Agent resource while both values are empty, leaving the operator's defaults in charge.
  nginx:
    # sessionProxy.nginx.workerProcesses -- nginx `worker_processes`. Empty follows the container's CPU limit
    # when one is set (rounded up), otherwise 6. So a CPU limit on the proxy also cuts its connection
    # capacity: a 1-CPU limit leaves one worker and about 500 proxied connections. Set this (or
    # `workerConnections`) whenever you set a CPU limit in `sessionProxy.resources`.
    workerProcesses: ""
    # sessionProxy.nginx.workerConnections -- nginx `worker_connections`, per worker; the worker's
    # file-descriptor limit is raised to match. Empty leaves the operator's default of 1024.
    workerConnections: ""
  # sessionProxy.resources -- Resource requests/limits for the nginx container, as a Kubernetes
  # `ResourceRequirements` map (`requests:`/`limits:`). Requests keep the proxy in the scheduler's and a node
  # autoscaler's arithmetic, so it is not packed onto a node that is then scaled away, taking its sessions
  # with it. nginx's CPU follows stream bandwidth: allow about 0.15 CPU and 25Mi per 100 active streams of
  # around 1.3 Mbps. The default request is small, to fit a small cluster; raise it with the sessions a pod
  # carries (`sessionsPerReplica`). There is deliberately no CPU limit, which would also cut `workerProcesses`
  # (above). Omitted from the Agent resource
  # when null (`resources: null`; an empty map keeps these defaults, since Helm merges it with them).
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 512Mi
  # sessionProxy.sidecarResources -- Resource requests/limits for the kasm-nginx-sidecar container, same shape
  # as `sessionProxy.resources`. Every replica's sidecar holds the whole route table (4 routes a session), so
  # its memory grows with the agent's session count: under 64Mi to 1,000 sessions, about 130Mi at 10,000. It
  # updates the table one session at a time, so launches cost it little CPU; the CPU limit covers its periodic
  # full resync. Omitted from the Agent resource when null.
  sidecarResources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # sessionProxy.nodeSelector -- Node selector for the proxy pods. Empty has them follow the agent's own
  # `nodeSelector`. Set it to keep the proxy off a node pool an autoscaler shrinks, since a proxy pod taken
  # away takes every stream it carries. Omitted from the Agent resource when empty.
  nodeSelector: {}
  # sessionProxy.tolerations -- Tolerations for the proxy pods. Omitted from the Agent resource when empty.
  tolerations: []
  # sessionProxy.affinity -- Affinity for the proxy pods, a Kubernetes `Affinity` map. Omitted from the Agent
  # resource when empty.
  affinity: {}
  # sessionProxy.topologySpreadConstraints -- Topology spread constraints for the proxy pods. With more than
  # one replica and none set, the operator spreads replicas across nodes where it can. Omitted from the Agent
  # resource when empty.
  topologySpreadConstraints: []
  # sessionProxy.podDisruptionBudget -- Bound how many proxy pods a voluntary disruption (a node drain, say)
  # may take at once. Set exactly one of `minAvailable` or `maxUnavailable`; leaving both empty omits the
  # block, and with more than one replica the operator then defaults to at most one pod disrupted. With a
  # single replica no budget is created (it could only block the drain).
  podDisruptionBudget:
    # sessionProxy.podDisruptionBudget.minAvailable -- Fewest proxy pods that must stay available, as a count
    # (`2`) or a quoted percentage (`"50%"`). Mutually exclusive with `maxUnavailable`.
    minAvailable: ""
    # sessionProxy.podDisruptionBudget.maxUnavailable -- Most proxy pods that may be unavailable, as a count
    # or a quoted percentage. Mutually exclusive with `minAvailable`.
    maxUnavailable: ""
  # sessionProxy.autoscaling -- Have the operator size the proxy Deployment by how many sessions the agent is
  # running - the load a proxy actually carries, since a websocket relay uses little CPU and a CPU-based
  # autoscaler would never fire before its connections ran out. Alternative to `externallyScaled`; the two
  # cannot both be on. While enabled, `sessionProxy.replicas` is ignored. Omitted from the Agent resource
  # unless enabled.
  autoscaling:
    # sessionProxy.autoscaling.enabled -- Turn on session-count autoscaling for the proxy.
    enabled: false
    # sessionProxy.autoscaling.sessionsPerReplica -- REQUIRED when enabled. Sessions one proxy pod is sized
    # for; the replica count is `ceil(sessions / sessionsPerReplica)`, clamped to the min/max below. Size it
    # from the `sessionProxy.nginx` capacity.
    sessionsPerReplica: 0
    # sessionProxy.autoscaling.minReplicas -- Fewest proxy pods, whatever the session count.
    minReplicas: 1
    # sessionProxy.autoscaling.maxReplicas -- REQUIRED when enabled. Most proxy pods, whatever the session
    # count; must be at least `minReplicas`.
    maxReplicas: 0
    # sessionProxy.autoscaling.scaleDownStabilizationSeconds -- How long a lower replica count must be called
    # for, without interruption, before a pod is removed - each removed pod then drains for
    # `drainTimeoutSeconds`. Empty leaves the operator's default of 1800.
    scaleDownStabilizationSeconds: 1800
  # sessionProxy.externallyScaled -- Leave the proxy Deployment's replica count to something else (KEDA, an
  # HPA) once that exists; `sessionProxy.replicas` applies only when the Deployment is first created. As with
  # `standby`, a KEDA `ScaledObject` with a kubernetes-workload trigger on the workspace pods (selector
  # `app.kubernetes.io/component=workspace`) keeps one proxy per so many sessions; its scale-in removes pods
  # at its own pace, each still draining for `drainTimeoutSeconds`. Alternative to `autoscaling`.
  externallyScaled: false
  # sessionProxy.networkPolicy -- Bound where the proxy pods may connect, with an egress NetworkPolicy the
  # operator creates. A session's route sends the user's authenticated request — cookies and the workspace
  # credential the control plane returned — to whatever address the route names, so anything that could write a
  # route could send those anywhere the proxy pod can reach. The policy limits egress to where the proxy has
  # business: its own namespace (workspaces, the agent), the control plane's namespace, DNS, the API server (the
  # sidecar's watches), plus `extraEgress`. Ingress is left open (browsers connect from anywhere). Needs a CNI
  # that enforces NetworkPolicy. Omitted from the Agent unless `enabled`.
  networkPolicy:
    # sessionProxy.networkPolicy.enabled -- Create the egress NetworkPolicy.
    enabled: false
    # sessionProxy.networkPolicy.extraEgress -- Extra egress rules allowed on top of the built-in set, in
    # NetworkPolicy's own `egress:` terms (a list of `{to, ports}` rules). Use it for a control plane reachable
    # only outside the cluster (an `ipBlock`) or an OTLP collector in another namespace. Applies only when
    # `enabled`.
    # Example:
    #   extraEgress:
    #     - to:
    #         - ipBlock:
    #             cidr: 203.0.113.0/24
    #       ports:
    #         - protocol: TCP
    #           port: 443
    extraEgress: []
  # sessionProxy.selfSigned -- Last-resort certificate for the session proxy, so that an install
  # with no certificate configured still starts instead of the proxy never coming up.
  #
  selfSigned:
    # sessionProxy.selfSigned.enabled -- Generate a self-signed certificate at `certSecretName`
    # when `sessionProxy.certificate.enabled` is false and no Secret of that name exists yet. A
    # Secret this release generated is reused across upgrades (and regenerated when
    # `publicHostname` changes); a Secret created by anyone else is left untouched and mounted
    # as-is, so pre-creating your own before the first install still works.
    #
    # On the default proxied topology this certificate is never shown to a browser. On the
    # direct-connect paths browsers do see it, and it **must** be replaced with a publicly trusted
    # one - set `sessionProxy.certificate.enabled`, or pre-create the Secret.
    #
    enabled: true
  # sessionProxy.certSecretName -- Name of the TLS Secret (keys `tls.crt`/`tls.key`) served on the proxy's HTTPS
  # listener. The proxy will not start without it, so either enable `sessionProxy.certificate` below or create
  # this Secret out of band.
  certSecretName: kasm-session-proxy-tls
  # sessionProxy.certificate -- Optionally have cert-manager issue the session proxy's TLS certificate into
  # `sessionProxy.certSecretName`.
  certificate:
    # sessionProxy.certificate.enabled -- Render a cert-manager Certificate for the session proxy. Requires
    # cert-manager and a usable issuer in the cluster.
    enabled: false
    # sessionProxy.certificate.commonName -- Certificate common name. Defaults to `publicHostname` when empty.
    commonName: ""
    # sessionProxy.certificate.dnsNames -- Subject alternative names on the certificate. Defaults to a
    # single-entry list holding `publicHostname` when empty. Add a wildcard entry here if sessions are served
    # from per-session subdomains.
    dnsNames: []
    # sessionProxy.certificate.issuerRef -- The cert-manager issuer that signs the certificate.
    issuerRef:
      # sessionProxy.certificate.issuerRef.name -- REQUIRED when `sessionProxy.certificate.enabled` is true.
      # Name of the Issuer or ClusterIssuer.
      name: ""
      # sessionProxy.certificate.issuerRef.kind -- Kind of the issuer - `ClusterIssuer` or `Issuer`.
      kind: ClusterIssuer
      # sessionProxy.certificate.issuerRef.group -- API group of the issuer.
      group: cert-manager.io
  # sessionProxy.service -- Overrides for the session-proxy Service the operator creates. Left alone, the
  # operator creates a plain `ClusterIP` Service and something in front of it - `httpRoute`, `ingress`,
  # `route` or `tlsRoute` - publishes it. Set these to publish the session proxy directly instead, with no
  # ingress layer at all. The whole block is omitted from the Agent resource while it holds nothing but
  # defaults, which leaves the operator's own defaults in charge.
  service:
    # sessionProxy.service.type -- Type of the session-proxy Service - `ClusterIP`, `NodePort` or
    # `LoadBalancer`. `ClusterIP`, the default, keeps the proxy in-cluster and expects one of the route or
    # ingress options to publish it. `NodePort` publishes it on a port of every node; `LoadBalancer`
    # additionally asks the cloud provider (or MetalLB) for an external address. Both of the latter need the
    # surrounding environment to actually route those ports to the nodes - VM or cloud firewalls that only
    # forward 443/80 will refuse the connection before Kubernetes ever sees it.
    type: ClusterIP
    # sessionProxy.service.annotations -- Annotations set on the session-proxy Service. This is where cloud
    # load-balancer attributes belong: NLB versus ALB, an internal-only scheme, a MetalLB address pool, or
    # PROXY protocol on the load balancer itself (which the listeners then have to be told to expect - see
    # `sessionProxy.proxyProtocol`). Omitted from the Agent resource when empty.
    # Example (AWS NLB, PROXY protocol v2 towards the pods):
    #   annotations:
    #     service.beta.kubernetes.io/aws-load-balancer-type: external
    #     service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    #     service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    annotations: {}
    # sessionProxy.service.externalTrafficPolicy -- How the Service treats the client source address -
    # `Cluster` or `Local`. `Cluster`, the Kubernetes default, SNATs it, so the session proxy sees the node's
    # address instead of the user's. `Local` preserves the real client IP, but only routes traffic through
    # nodes that are hosting a session-proxy pod: a node without one blackholes the connection. Pair it with
    # a load balancer that honours the Service's health check, or make sure every node it advertises runs a
    # proxy pod (raise `sessionProxy.replicas`, or pin the pods with `nodeSelector`). Omitted from the Agent
    # resource when empty, which leaves the operator and Kubernetes at `Cluster`.
    externalTrafficPolicy: ""
    # sessionProxy.service.httpsNodePort -- Pin the node port for the proxy's own HTTPS listener (4444)
    # instead of letting Kubernetes allocate one. Applies to the `NodePort` and `LoadBalancer` types only,
    # and must fall inside the cluster's node-port range - the CRD rejects anything outside 30000-32767.
    # Omitted from the Agent resource when empty. Leave it unset unless a firewall rule or an external load
    # balancer has to be pointed at a fixed port: the operator carries whatever port Kubernetes allocated
    # across reconciles, so an unpinned port is stable in practice anyway.
    httpsNodePort: ""
    # sessionProxy.service.httpNodePort -- Pin the node port for the proxy's plain-HTTP listener (4445), the
    # one to use when TLS is terminated by something in front. Same rules as `httpsNodePort`: `NodePort` and
    # `LoadBalancer` types only, inside 30000-32767, omitted from the Agent resource when empty, and stable
    # across reconciles even when left unpinned.
    httpNodePort: ""
    # sessionProxy.service.httpsPort -- Service-facing port for the HTTPS (4444) listener, for example `443` so a
    # `LoadBalancer` publishes the session proxy on 443 without touching the zone's port or `publicPort`. The
    # container keeps listening on 4444. Empty keeps 4444.
    httpsPort: ""
    # sessionProxy.service.httpPort -- Service-facing port for the HTTP (4445) listener, for example `80`. The
    # container keeps listening on 4445. Empty keeps 4445.
    httpPort: ""
  # sessionProxy.internalService -- Provision a SECOND Service in front of the same proxy pods, a front door
  # distinct from `sessionProxy.service` above — typically an internal `LoadBalancer` on a private subnet so a
  # control plane on a peered network or in another region can reach this agent without a public path (a
  # ClusterIP is not routable across clusters; an internal LB's private IP is). Kasm registers one hostname per
  # agent, so pair this with split-horizon DNS that resolves `publicHostname` to this Service from the control
  # plane's network and to the primary Service from browsers, both on `publicPort`. Same fields as
  # `sessionProxy.service`; omitted from the Agent while it holds only defaults, so only the primary Service
  # exists unless you set something here.
  internalService:
    # sessionProxy.internalService.type -- Type of the second Service — usually `LoadBalancer` with an
    # internal-scheme annotation below. Same options as `sessionProxy.service.type`.
    type: ClusterIP
    # sessionProxy.internalService.annotations -- Annotations on the second Service. This is where the cloud
    # "internal load balancer" attribute goes (an internal scheme, a private subnet). Omitted when empty.
    annotations: {}
    # sessionProxy.internalService.externalTrafficPolicy -- `Cluster` or `Local`, as `sessionProxy.service`.
    externalTrafficPolicy: ""
    # sessionProxy.internalService.httpsNodePort -- Pin the HTTPS node port (`NodePort`/`LoadBalancer` only).
    httpsNodePort: ""
    # sessionProxy.internalService.httpNodePort -- Pin the plain-HTTP node port (`NodePort`/`LoadBalancer` only).
    httpNodePort: ""
    # sessionProxy.internalService.httpsPort -- Service-facing port for the HTTPS (4444) listener.
    httpsPort: ""
    # sessionProxy.internalService.httpPort -- Service-facing port for the HTTP (4445) listener.
    httpPort: ""
  # sessionProxy.resolver -- DNS server nginx uses to resolve a downstream agent's hostname for the `/desktop`
  # relay, whose upstream comes from the control plane and so is an nginx variable — without a resolver nginx
  # fails those with "no resolver defined" and only a bare IP works. Empty (the default) uses the pod's own
  # cluster DNS (CoreDNS resolves in-cluster names and forwards the rest, so both relayed in-cluster sessions
  # and external VM agents resolve). Set an explicit resolver (e.g. `8.8.8.8` or a corporate DNS) for a cluster
  # whose DNS won't resolve the downstream's name. Omitted from the Agent when empty.
  resolver: ""
  # sessionProxy.proxyProtocol -- PROXY protocol on the session proxy's nginx listeners, so the real client
  # address survives an external L4 proxy that cannot set `X-Forwarded-For`. This is the layer-7 companion to
  # `sessionProxy.service.externalTrafficPolicy: Local`; use one or the other, whichever matches how traffic
  # actually reaches the proxy. The whole block is omitted from the Agent resource while it is disabled and
  # no trusted CIDRs are set.
  proxyProtocol:
    # sessionProxy.proxyProtocol.enabled -- Turn on `proxy_protocol` on both session-proxy listeners.
    # REQUIRES the load balancer or proxy in front to actually send a PROXY protocol header on every
    # connection: nginx expects the header and cannot fall back, so a plain client - a browser reaching the
    # NodePort directly, a health check, `curl` against the Service - fails on these listeners once this is
    # on. Enable it together with the matching setting on the fronting proxy, never on its own.
    enabled: false
    # sessionProxy.proxyProtocol.trustedCIDRs -- Source ranges nginx trusts to send an accurate PROXY
    # protocol header, normally the fronting load balancer's own address range (its node subnet, the cloud
    # LB's CIDR, the MetalLB pool). Omitted from the Agent resource when empty.
    # Example:
    #   trustedCIDRs:
    #     - 10.0.0.0/16
    #     - 192.168.1.0/24
    trustedCIDRs: []

# heartbeatIntervalSeconds -- How often the agent heartbeats the manager.
#
heartbeatIntervalSeconds: 5

# imageAvailabilityPolicy -- Which workspace images the agent reports to the manager as available, one of
# `pulled` or `all`. `pulled` (default) reports only images the puller has actually staged on a node, so the
# manager routes a workspace here only when it can start with no launch-time pull; `all` also reports catalog
# images not staged yet, for optimistic routing that pulls the image on demand at launch.
#
imageAvailabilityPolicy: "pulled"

# workspaceCPURequestPercent -- Share (1-100) of a workspace image's cores that each session pod reserves as
# its Kubernetes CPU *request*. The manager sizes cores as a soft hint the Docker agent only ever applied as a
# scheduling weight; as a Kubernetes request they are a hard reservation, so at the default `100` a mostly idle
# desktop still holds a whole core and nodes fill long before they are busy. Lower it to bin-pack more sessions
# per node: `25` lets four 1-core sessions share one core's worth of requests. A CPU *limit* (on "Quotas"
# images) is unaffected, so sessions can still burst to their full size. The agent scales the capacity it
# reports to the manager by the same factor, so session accounting keeps matching what the scheduler can place.
#
workspaceCPURequestPercent: 100

# imagePullPolicy -- Pull policy applied to the agent and session-proxy containers.
#
imagePullPolicy: IfNotPresent

# logLevel -- Log level for the agent container.
#
logLevel: INFO

# imagePullSecrets -- Pull secrets for the agent and session-proxy images, as a list of `{name: <secret>}`
# references. Omitted from the Agent resource entirely when empty.
#
imagePullSecrets: []

# Grant the Kasm agent operator the one permission it needs in THIS namespace but does not hold cluster-wide:
# reading, creating and updating the per-workspace storage-mapping Secrets. The operator's ClusterRole (from
# the `kasm-agent-operator` chart) carries no `secrets` rule at all, so every namespace that holds an Agent
# needs this Role, and this chart always renders it together with a RoleBinding to the operator's
# ServiceAccount, which may live in another namespace (the two-namespace layout).
#
operatorRBAC:
  serviceAccount:
    # operatorRBAC.serviceAccount.name -- Name of the operator's ServiceAccount, the `kasm-agent-operator`
    # chart's `serviceAccount.name`.
    #
    name: controller-manager
    # operatorRBAC.serviceAccount.namespace -- Namespace the operator runs in. Leave empty when the operator is
    # installed in this release's namespace (the `kasm-agent` umbrella with `operator.enabled=true`). Set it
    # whenever this agent lives in a different namespace from the operator; otherwise the RoleBinding points
    # at a ServiceAccount that does not exist and every session with a storage mapping fails with Forbidden.
    #
    namespace: ""

# nodeSelector -- Node selector pinning the agent and session-proxy pods. Omitted from the Agent resource
# entirely when empty.
#
nodeSelector: {}

# workspacesNodeSelector -- Node selector the agent applies to the workspace pods it launches. Distinct from
# `nodeSelector`, which places the agent itself. Omitted from the Agent resource entirely when empty.
#
workspacesNodeSelector: {}

# workspacesTolerations -- Tolerations every workspace pod the agent launches carries, with a workspace
# template's own tolerations appended per session. Set them when sessions are meant to run on tainted
# nodes, such as a dedicated pool tainted `kasm.com/workspaces=true:NoSchedule`. They also scope the
# agent's image puller and its capacity report: a node whose NoSchedule/NoExecute taints these do not
# tolerate is left out of the CPU and memory the agent advertises to the manager. Omitted when empty.
# Example:
#   workspacesTolerations:
#     - key: kasm.com/workspaces
#       operator: Exists
#       effect: NoSchedule
#
workspacesTolerations: []

# workspacesAutoscaling -- Grow workspace capacity on demand, in two independent ways. Off by default (nothing
# here changes behaviour while both halves are disabled), and the whole block is omitted from the Agent unless
# one is enabled. `enabled` lets a session wait for a node a cluster autoscaler (Cluster Autoscaler, Karpenter,
# a cloud node pool) can add, instead of the launch failing when the pool is full: the agent counts nodes the
# autoscaler could still add as capacity (so the manager still routes the launch), stops withholding an image
# that would fit a fresh node, and marks the pending workspace `WaitingForCapacity` until a node joins or the
# timeout passes (needs an autoscaler watching for unschedulable pods on the workspace nodes). `standby` below
# keeps room ready ahead of demand so nobody waits. The two work independently.
workspacesAutoscaling:
  # workspacesAutoscaling.enabled -- Turn autoscaling-aware waiting on.
  enabled: false
  # workspacesAutoscaling.maxNodes -- The most workspace nodes the autoscaler will run; capacity is counted up
  # to this many. `0` (the default) leaves it unset, so the pool is treated as able to grow by one node past
  # what is running and never looks full while it can still grow. Minimum 1 when set.
  maxNodes: 0
  # workspacesAutoscaling.schedulingTimeoutSeconds -- How long an unschedulable session waits for a node before
  # it fails with the scheduler's message. The clock restarts once the pod is scheduled (a fresh node has no
  # pre-pulled images). Minimum 60.
  schedulingTimeoutSeconds: 600
  # workspacesAutoscaling.standby -- Keep spare room for sessions ready ahead of demand: a Deployment of
  # low-priority pause-container placeholders, each requesting what a session does, on the same nodes workspaces
  # use (they follow `workspacesNodeSelector`/`workspacesTolerations`). A session that needs the room evicts a
  # placeholder and starts at once; the evicted placeholder then goes unschedulable, which is what makes a node
  # autoscaler add a node, so the headroom returns with nobody waiting. Works with or without
  # `workspacesAutoscaling.enabled` above: standby alone gives instant starts until a burst exhausts the
  # headroom (then launches are refused as on a fixed cluster unless `enabled` is also on to make them wait for
  # a node). Off by default; omitted from the Agent unless `enabled` below is true.
  standby:
    # workspacesAutoscaling.standby.enabled -- Create the placeholder Deployment.
    enabled: false
    # workspacesAutoscaling.standby.priorityClassName -- Names the PriorityClass the placeholders run under: one
    # with a *negative* value, so a real session (default priority) outranks it and the scheduler evicts a
    # placeholder to make room, and the agent knows the placeholders' room is free to give away. Leave empty (the
    # default) to derive it from the agent name as `<name>-standby`, so standby works with nothing else set. By
    # default the chart also creates it (see `priorityClass.create`); set `priorityClass.create: false` to
    # reference one a cluster admin manages out-of-band instead — set an explicit name here to match theirs.
    priorityClassName: ""
    # workspacesAutoscaling.standby.priorityClass -- Whether this chart creates the PriorityClass named above. A
    # PriorityClass is a *cluster-scoped* object, so more than one agent release with `create` on must use
    # distinct `priorityClassName`s to avoid an ownership clash; set `create: false` on the extras (or all of
    # them) to reference a shared, admin-managed class.
    priorityClass:
      # workspacesAutoscaling.standby.priorityClass.create -- Create the PriorityClass named by
      # `priorityClassName` with `value` below. Default true: standby works out of the box. Set false to
      # reference an existing PriorityClass instead. When true, `priorityClassName` must be set and `value`
      # negative.
      create: true
      # workspacesAutoscaling.standby.priorityClass.value -- The (negative) value for the created PriorityClass.
      # Only used when `create` is true; rendering fails if it is not below zero, since a session must be able to
      # preempt a placeholder.
      value: -10
    # workspacesAutoscaling.standby.replicas -- How many placeholders to keep. Applied when the Deployment is
    # created and kept in step afterwards, unless `externallyScaled`. Minimum 0.
    replicas: 1
    # workspacesAutoscaling.standby.externallyScaled -- Leave the replica count to a KEDA ScaledObject or an HPA
    # after creation; the operator then sets `replicas` only once, at creation. Use this to scale placeholders
    # with real demand. You supply the autoscaler yourself, targeting the placeholder Deployment
    # `<name>-workspace-standby` (scale on running session pods, `app.kubernetes.io/component=workspace`). See the
    # Capacity docs for a KEDA example.
    externallyScaled: false
    # workspacesAutoscaling.standby.image -- The placeholder container image. The default is a bare pause
    # container.
    image: registry.k8s.io/pause:3.10
    # workspacesAutoscaling.standby.resources -- What each placeholder reserves, as a bare resource map (e.g.
    # `{cpu: "2", memory: 2Gi}`) applied as both the request and the limit — NOT a pod-style `{requests, limits}`
    # block. Leave empty to size it to the largest workspace in the agent's catalog (the agent reports this as
    # status.workspaces.largestRequest), so one placeholder's room fits any image; until that is known, no
    # placeholders are created. Set the map to pin a size instead.
    resources: {}

# storageMappings -- rclone CSI storage mappings for workspace volumes. The whole block is omitted from the
# Agent resource when it is disabled and no installation ID is set.
#
storageMappings:
  # storageMappings.enabled -- Turn on rclone CSI storage mappings.
  enabled: false
  # storageMappings.installationID -- Scopes the derived StorageClass and Secret names. Defaults to the Agent
  # resource name when empty.
  installationID: ""

# persistentProfiles -- Cluster-wide defaults for the PVC behind every persistent profile. The manager sends
# only the profile path with a launch, never a StorageClass, access mode or size, so those come from here.
# Leave a field empty to keep the operator's default: the cluster's default StorageClass, `ReadWriteOnce`
# and `10Gi`. Set an RWX-capable class with `ReadWriteMany` so one user's profile can be mounted by
# concurrent sessions on different nodes.
persistentProfiles:
  # persistentProfiles.storageClass -- StorageClass for persistent-profile PVCs. Empty means the cluster default.
  storageClass: ""
  # persistentProfiles.accessModes -- Access modes for persistent-profile PVCs, for example `[ReadWriteMany]`.
  # Empty means `ReadWriteOnce`.
  accessModes: []
  # persistentProfiles.capacity -- Size of each persistent-profile PVC, for example `20Gi`. Empty means `10Gi`.
  capacity: ""

# serverID -- The stable UUID this agent registers under. Leave empty to have the operator generate one and
# record it in the Agent's status; set it to adopt an existing registration. Omitted from the Agent resource
# when empty.
#
serverID: ""

# apiServerURL -- Split-horizon override for the base URL the agent uses for manager ADMIN calls (for
# example file-mapping fetches). Defaults to `manager.scheme://manager.hostname:manager.port` when empty.
# Set it when agents should reach the manager on an internal address (an in-cluster Service, a private
# LB) while `manager.hostname` stays the public name — e.g. `https://kasm-proxy.kasm.svc.cluster.local`.
# Omitted from the Agent resource when empty.
#
apiServerURL: ""

# resources -- Compute resources for the agent container, passed through to `spec.resources` verbatim. The
# requests are small, to fit a small cluster; the limits leave room for about 1,000 concurrent sessions. The
# agent's memory grows with the session count (about 128Mi at 1,000, 400Mi at 10,000), and it can use most of
# a core while a launch burst is on. Omitted from the
# Agent resource when null (`resources: null`), which leaves the agent with no requests or limits at all.
#
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# otel -- OpenTelemetry export settings, rendered as environment variables on the Agent.
#
otel:
  # otel.enabled -- Point the agent at an OTLP endpoint. Enabled by default so the agent reports to the
  # collector deployed alongside it.
  enabled: true
  # otel.endpoint -- OTLP/HTTP endpoint the agent exports to. Defaults to the in-cluster kasm-otel-collector
  # Service for this release (`http://<release>-kasm-otel-collector:4318`) when empty.
  endpoint: ""

# gpu -- GPU workspace support.
#
gpu:
  # gpu.enabled -- Tell the agent that the NVIDIA GPU operator is installed, so it can schedule GPU workspaces.
  enabled: false

# env -- Additional environment variables appended to the Agent's `spec.env`, as a list of Kubernetes EnvVar
# objects. The operator merges environment variables by name, so an entry here with the same name as one this
# chart generates (for example `OTEL_EXPORTER_OTLP_ENDPOINT`) wins.
#
env: []

# imagePuller -- Pre-pull workspace images onto the session nodes, so the first session using an image on a
# node starts without a cold registry pull. The agent maintains one KasmImagePuller for this agent, from the
# manager's advertised catalog plus any `extraImages`; the operator reconciles it into a DaemonSet on the same
# nodes workspaces run on (`workspacesNodeSelector`/`workspacesTolerations`).
#
imagePuller:
  # imagePuller.enabled -- Pre-pull workspace images. Keep this on (the default): it is what makes session start
  # fast and pull-free, and the default `imageAvailabilityPolicy: pulled` depends on it (the manager only sends a
  # session to a node once the image is staged there, so with the puller off no node ever reports an image and
  # sessions stop scheduling). Turn it off only to run on demand — set `imageAvailabilityPolicy: all` alongside —
  # e.g. to relieve node disk pressure from a large catalog, or when images are already resident on the nodes
  # (a baked node image or a local registry mirror).
  enabled: true
  # imagePuller.refreshIntervalSeconds -- Re-pull the staged images on this cadence, so a mutable tag (`:develop`,
  # or a rebuilt `:1.2.3` whose digest changed but tag did not) is refreshed on the nodes. 0 (the default) never
  # re-pulls: an image is fetched only when it first enters the catalog. A refresh rolls the puller DaemonSet, so
  # keep it comfortably longer than a pull takes — 3600 (hourly) is a sensible start.
  refreshIntervalSeconds: 0
  # imagePuller.extraImages -- Images to stage in addition to the manager's advertised catalog, to pre-seed a
  # custom workspace image the manager has not listed yet. A list of `{image, registry, imagePullSecrets,
  # priority}` objects: `image` is the full reference and is authoritative for the pull; `registry` is
  # informational; `imagePullSecrets` is an optional per-image list of `{name: <secret>}` references; `priority`
  # (integer, default 0 = lowest) orders the pull on each node — higher pulls first, so pre-seeding a catalog
  # image with a high priority pulls it ahead of the rest. Whether they all staged is reported on the Agent's
  # `ExtraImagesStaged` condition.
  # Example:
  #   extraImages:
  #     - image: registry.example.com/team/custom-workspace:1.0
  #       registry: https://registry.example.com
  #       priority: 10
  #       imagePullSecrets:
  #         - name: example-registry
  extraImages: []
  # imagePuller.storage -- Per-node disk budget the puller pulls into. It never pulls an image it cannot fit: on
  # each node the budget is the ephemeral-storage capacity minus the kubelet eviction threshold, minus the
  # reserve kept for workspaces, minus what images and pods already use. Empty leaves the operator's defaults in
  # charge (omitted from the Agent while every field is empty).
  storage:
    # imagePuller.storage.reservedBytes -- Headroom kept free on every node for workspace pods' writable layers
    # and logs, in bytes. Takes precedence over `reservedPercent`. Empty uses `reservedPercent`.
    reservedBytes: ""
    # imagePuller.storage.reservedPercent -- The reserve as a percentage of the node's ephemeral-storage
    # capacity (0-90). Default 20 when neither this nor `reservedBytes` is set.
    reservedPercent: ""
    # imagePuller.storage.evictionPercent -- The kubelet's `imagefs.available` hard-eviction threshold as a
    # percentage of capacity (0-90); the budget keeps this much free on top of the reserve so a pull never
    # drives the node into DiskPressure. Default 15 (the kubelet's own default).
    evictionPercent: ""
    # imagePuller.storage.unpackFactor -- Estimates an image's unpacked on-disk size from its compressed layer
    # sizes, as a decimal string (`"2.5"`). Used until a node holds the image and reports its real size. Default
    # `"2.5"` (conservative for gzip; zstd:chunked layers unpack closer to `"1.5"`).
    unpackFactor: ""
    # imagePuller.storage.maxConcurrentPulls -- How many pull pods may run on one node at a time (minimum 1,
    # default 1). More than 1 only helps if the node's kubelet raises `maxParallelImagePulls` (it serializes
    # pulls by default).
    maxConcurrentPulls: ""
  # imagePuller.resources -- Compute resources for the puller's idle holder containers (kept tiny — they only
  # idle to hold the image resident). Omitted when empty.
  resources: {}

# workspaceSecurity -- How session containers run, rendered as the Agent's `spec.workspaceSecurity`. Stock Kasm
# images run as `kasm-user` (uid/gid 1000), and so does every session by default: `runAsNonRoot`,
# `allowPrivilegeEscalation: false`, every capability dropped except the few the profile below adds. An image
# that needs root - a run config with `user: root`, root `exec_configs` from the manager, or session recording -
# gets it the way `rootMode` says. Every field is optional: an empty one is omitted from the Agent and the
# CRD's default applies, and the whole block is omitted while every field is empty. Each session pod is labelled
# `kasm.com/run-mode` with `nonroot`, `userns-root` or `host-root`, for cluster policy to match on.
#
# The defaults make every image work on every cluster; each knob here only locks things down further.
# `profile`, `userNamespaces` and `sudo` shape uid-1000 sessions and `rootMode` shapes root sessions, and the
# two sides are independent: any `profile` pairs with any `rootMode`. Under Pod Security `restricted`
# enforcement only `profile: restricted` sessions are admitted and every root session is refused, whatever
# its `rootMode`; `rootMode: forbid` is the companion knob there, so root-needing images fail at launch rather
# than at admission, but it is not required.
#
workspaceSecurity:
  # workspaceSecurity.rootMode -- How a session that needs root gets it. `host` (the default) runs it as host
  # uid 0, the way every session ran before run modes: it works on any node, runtime and volume. Only images
  # that need root run this way; uid-1000 sessions (every stock image) are unaffected. A container escape from
  # a root session is root on the node, the namespace needs the `privileged` Pod Security level for such
  # sessions, and on OpenShift the workspace root SCC admits host uid 0. `userns` locks root down: uid 0 inside
  # a pod user namespace (`hostUsers: false`), root in the pod and an unprivileged uid on the node. It needs
  # Kubernetes 1.33+ (on by default; GA in 1.36; OpenShift 4.20), containerd 2.0+ or CRI-O 1.25+, and a 6.3+
  # kernel on the session nodes; a user-namespace pod cannot mount an NFS-backed volume (NFS or EFS persistent
  # profiles, NFS storage mappings; the container fails to create with an idmap `mount_setattr` error), and on
  # a runc node it cannot mount an OCI image volume (the nix images' `imageMounts`; runc idmaps bind mounts
  # only, and the container fails with `id-mapped mounts are only supported for bind-mounts`). S3-style
  # profiles and block storage are unaffected. `forbid` is the strictest: it refuses root outright, an image
  # whose run config asks for it fails to launch, and root-needing features follow `rootFeatures` as if set to
  # `downgrade`.
  rootMode: ""
  # workspaceSecurity.userNamespaces -- Which sessions get a pod user namespace: `rootOnly` (the default) gives
  # one only to root sessions under `rootMode: userns`; `always` gives every session one, uid 1000 included,
  # for the extra isolation, at the cost of every session inheriting the user-namespace limits (no NFS-backed
  # volumes or runc image volumes, device ownership unmapped). It does not touch root sessions, which follow
  # `rootMode`: with the default `host` they stay host root.
  userNamespaces: ""
  # workspaceSecurity.rootFeatures -- What happens when an image that would run as uid 1000 asks for something
  # only root can do (root `exec_configs` start or stop commands, or session recording): `promote` (the default)
  # runs that session in `rootMode` so the feature works; `downgrade` keeps it at uid 1000, runs the commands as
  # `kasm-user`, switches recording off and flags the KasmWorkspace; `reject` refuses the launch. `downgrade` is
  # also the way to keep such images working on NFS-backed profiles or image volumes under `rootMode: userns`.
  rootFeatures: ""
  # workspaceSecurity.profile -- The capability shape of uid-1000 sessions, named after the Pod Security
  # Standards level it satisfies. `baseline` (the default) adds `SYS_CHROOT` (Chromium's sandbox and bubblewrap
  # need it, and Docker grants it by default) plus whatever the image's run config `cap_add`s, and an inline
  # seccomp profile with no backend falls back to `Unconfined`. `restricted` adds nothing but `NET_BIND_SERVICE`
  # when asked for, drops other `cap_add`s with a warning, and falls back to `RuntimeDefault`; it cannot be
  # combined with `sudo`. It shapes uid-1000 sessions only: root sessions follow `rootMode`, whatever the profile.
  profile: ""
  # workspaceSecurity.sudo -- Keep privilege escalation on and add `SETUID`/`SETGID` to uid-1000 sessions, so an
  # image's baked-in sudoers entry works. Off by default: `sudo` inside a session is a path back to root in
  # the container. Not allowed with `profile: restricted`.
  sudo: false
  # workspaceSecurity.supplementalGroups -- Extra group ids added to every session pod, on top of the image's
  # run config `group_add`. The usual use is the node's `render` or `video` gid, so a uid-1000 session can open
  # `/dev/dri` or a webcam device. Omitted when empty.
  # Example:
  #   supplementalGroups: [44, 109]
  supplementalGroups: []
  # workspaceSecurity.fsGroupChangePolicy -- Applied to every session pod's volumes: `OnRootMismatch` (the
  # default) skips the recursive ownership pass when a volume's root already belongs to fsGroup 1000, `Always`
  # redoes it on every mount. Large persistent profiles start faster with the default.
  fsGroupChangePolicy: ""
  # workspaceSecurity.deviceAllowlist -- Which host devices an image's run config `devices` may pass through to
  # its session pod, as path globs (`*` does not cross a `/`) matched against the host path. A device that
  # matches none is dropped from the launch with a warning. Empty leaves the default, the DRI card and render
  # nodes (`/dev/dri/card*`, `/dev/dri/renderD*`) that hardware-accelerated rendering needs; `["none"]` passes
  # no device through. Omitted when empty.
  # Example:
  #   deviceAllowlist: ["/dev/dri/renderD*"]
  deviceAllowlist: []
  # workspaceSecurity.driResource -- The extended resource a DRI device plugin advertises GPU render nodes as,
  # e.g. `kasm.com/dri` from the `kasm-agent` umbrella's `driDevicePlugin`. When set, the agent reports the GPUs
  # the plugin publishes to the Kasm manager, and a launch whose graphics or video preference needs one (or whose
  # run config `devices` name an allowed `/dev/dri` node) requests one of this resource, with the GPU's groups;
  # the plugin hands the session the render node, its card node and `DRINODE`. Leave it empty with no DRI device plugin: the
  # devices are then mounted by hostPath, which Kubernetes lets only a privileged container open, so an
  # ordinary session sees `/dev/dri` but renders in software. Omitted when empty.
  driResource: ""

# Configure how sessions with a per-session VPN reach the node's egress daemon (`kasm-egress-installer`).
#
egress:
  # egress.networkAttachment -- The Multus NetworkAttachmentDefinition that runs kasm-egress-cni, when the egress
  # installer runs in `attachment` mode (OpenShift): `name` in the release namespace, or `namespace/name`. Every
  # session with egress is attached to it, and no other. Set it to the installer's `networkAttachment.name`
  # (`kasm-egress` by default). Leave empty in `chain` mode, where the shim sits in the primary network.
  #
  networkAttachment: ""

# seccomp -- Let a workspace run under its image's inline seccomp profile (`security_opt: seccomp=<json>`, as the
# Nix bubblewrap images carry) instead of `Unconfined`. Kubernetes can only reference a profile already on the
# node's disk, so the agent content-hashes each inline profile and a backend gets it onto the nodes. Off by
# default (`seccomp.enabled`); with it off an inline profile falls back to `Unconfined`.
#
seccomp:
  # seccomp.enabled -- Turn on seccomp-profile installation (renders `spec.seccomp` on the Agent).
  enabled: false
  # seccomp.backend -- How profiles reach the nodes, one of `installer` or `spo`.
  # `installer` (default) deploys the bundled `kasm-seccomp-installer` DaemonSet (configured under
  # `seccomp.installer`); it runs as root with a hostPath mount into the kubelet seccomp directory, so the agent
  # namespace must admit the `privileged` Pod Security level and the nodes must allow hostPath (rules out e.g. GKE
  # Autopilot), and it follows `workspacesNodeSelector`/`workspacesTolerations`.
  # `spo` instead has the agent create cluster-scoped `SeccompProfile` resources for the external
  # [Security Profiles Operator](https://github.com/kubernetes-sigs/security-profiles-operator) (1.0+) to install
  # — no hostPath or privileged namespace, but SPO must already be running in the cluster (this chart does not
  # install it) or the Agent reports Degraded. The `seccomp.installer` block is ignored for `spo`.
  backend: installer
  # seccomp.installer -- Configures the `installer` backend (ignored when `backend` is `spo`).
  installer:
    # seccomp.installer.image -- The kasm-seccomp-installer image.
    image:
      # seccomp.installer.image.registry -- Registry that hosts the installer image.
      registry: docker.io
      # seccomp.installer.image.repository -- Repository of the installer image, without the registry or tag.
      repository: kasmweb/seccomp-installer
      # seccomp.installer.image.tag -- Tag of the installer image. Pinned to the agent build this chart
      # version ships; empty falls back to the chart's `appVersion`.
      tag: "1.1190.8-agent.1"
    # seccomp.installer.imagePullPolicy -- Pull policy for the installer image.
    imagePullPolicy: IfNotPresent
    # seccomp.installer.kubeletSeccompDir -- The kubelet's seccomp root on the node, which the installer writes
    # profiles under (and mounts by hostPath). The default suits a stock kubelet; override it where the kubelet
    # root is relocated — k3s (`/var/lib/rancher/k3s/agent/kubelet/seccomp`), microk8s
    # (`/var/snap/microk8s/common/var/lib/kubelet/seccomp`).
    kubeletSeccompDir: /var/lib/kubelet/seccomp
    # seccomp.installer.resources -- Compute resources for the installer DaemonSet's container. Omitted when empty.
    resources: {}

# httpRoute -- Optionally expose the operator-created session-proxy Service through a Gateway API Gateway.
#
httpRoute:
  # httpRoute.enabled -- Render the HTTPRoute. Requires the Gateway API CRDs and a Gateway in the cluster.
  # `httpRoute`, `ingress`, `route`, `tlsRoute` and `gatewayRoute` are alternatives - enable at most one of
  # the five, since all of them point at the same operator-created session-proxy Service.
  enabled: false
  # httpRoute.parentRefs -- Gateways to attach the route to, as a list of `{name, namespace}` objects. The route
  # attaches to nothing - and the session proxy stays unreachable through the Gateway - if this is left empty.
  # Example:
  #   parentRefs:
  #     - name: traefik-gateway
  #       namespace: kube-system
  parentRefs: []
  # httpRoute.hostnames -- Hostnames the route matches. Defaults to a single-entry list holding
  # `publicHostname` when empty.
  hostnames: []
  # httpRoute.backendPort -- Port on the session-proxy Service to forward to. The default, 4445, is the proxy's
  # plain-HTTP listener; TLS for the public hostname is expected to terminate at the Gateway. Use 4444 to
  # forward to the proxy's own HTTPS listener instead.
  backendPort: 4445

# ingress -- Optionally expose the operator-created session-proxy Service through a classic
# `networking.k8s.io/v1` Ingress, for clusters without the Gateway API.
#
ingress:
  # ingress.enabled -- Render the Ingress. `httpRoute`, `ingress`, `route`, `tlsRoute` and `gatewayRoute` are
  # alternatives - enable at most one of the five, since all point at the same operator-created session-proxy Service. Kasm sessions
  # are long-lived VNC websockets, so whichever controller backs this ingress class must allow websocket
  # upgrades and use read and send timeouts of at least 3600s; see `ingress.annotations` below.
  enabled: false
  # ingress.className -- `ingressClassName` of the controller that should serve this Ingress. Omitted from the
  # resource when empty, which leaves the cluster's default IngressClass to claim it.
  className: ""
  # ingress.annotations -- Annotations for the Ingress, merged over `commonAnnotations`. This is where the
  # controller-specific websocket and timeout settings go - without them sessions are cut off at the
  # controller's default read timeout (60s on ingress-nginx).
  # Example (ingress-nginx):
  #   annotations:
  #     nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #     nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  annotations: {}
  # ingress.hosts -- Hostnames the Ingress serves, as a list of strings. Each gets one `/` `Prefix` rule to the
  # session-proxy Service. Defaults to a single-entry list holding `publicHostname` when empty.
  # Example:
  #   hosts:
  #     - agent.example.com
  hosts: []
  # ingress.tls -- TLS blocks for the Ingress, as a standard list of `{secretName, hosts}` objects, passed
  # through verbatim. Empty means the Ingress serves plain HTTP.
  # Example:
  #   tls:
  #     - secretName: kasm-agent-public-tls
  #       hosts:
  #         - agent.example.com
  tls: []
  # ingress.backendPort -- Port on the session-proxy Service to forward to. The default, 4445, is the proxy's
  # plain-HTTP listener; TLS for the public hostname is expected to terminate at the Ingress. Use 4444 to
  # forward to the proxy's own HTTPS listener instead, which on most controllers also needs a backend-protocol
  # annotation (`nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"` on ingress-nginx).
  backendPort: 4445

# route -- Optionally expose the operator-created session-proxy Service through an OpenShift Route, the
# native option on OpenShift clusters.
#
route:
  # route.enabled -- Render the Route. Requires OpenShift (the `route.openshift.io` API). `httpRoute`,
  # `ingress`, `route`, `tlsRoute` and `gatewayRoute` are alternatives - enable at most one of the five, since
  # all of them point at the same operator-created session-proxy Service. Kasm sessions are long-lived VNC websockets and the OpenShift
  # router's default connection timeout is 30s, so a timeout annotation is effectively mandatory; see
  # `route.annotations` below.
  enabled: false
  # route.host -- Hostname the Route serves. Defaults to `publicHostname` when empty. Under the default
  # passthrough termination this hostname is matched against the session proxy's own certificate, so that
  # certificate has to cover it.
  host: ""
  # route.annotations -- Annotations for the Route, merged over `commonAnnotations`. The router timeout belongs
  # here: without it OpenShift closes idle session websockets after 30 seconds.
  # Example:
  #   annotations:
  #     haproxy.router.openshift.io/timeout: "3600s"
  annotations: {}
  # route.backendPort -- Port on the session-proxy Service to route to. Leave empty to pick it from
  # `route.tls.termination`: 4444, the proxy's own HTTPS listener, for `passthrough` and `reencrypt`; 4445, its
  # plain-HTTP listener, for `edge`. Set it only to override that pairing.
  backendPort: ""
  # route.tls -- TLS settings for the Route.
  tls:
    # route.tls.termination -- Where TLS terminates - `passthrough`, `edge` or `reencrypt`. The default,
    # `passthrough`, gives end-to-end TLS: the router forwards the connection untouched and browsers see the
    # session proxy's own certificate from `sessionProxy.certSecretName`. Use `edge` to terminate at the router
    # instead, in which case supply `key`/`certificate` below or let the router serve its default certificate.
    # Example (terminate TLS at the OpenShift router instead of at the session proxy):
    #   route:
    #     enabled: true
    #     annotations:
    #       haproxy.router.openshift.io/timeout: "3600s"
    #     tls:
    #       termination: edge
    #       insecureEdgeTerminationPolicy: Redirect
    termination: "passthrough"
    # route.tls.insecureEdgeTerminationPolicy -- What the Route does with plain-HTTP requests - `Redirect`,
    # `Allow`, or `None`. Omitted from the Route when empty. `Redirect` is the usual choice for `edge`;
    # `passthrough` supports only `Redirect` and `None`.
    insecureEdgeTerminationPolicy: ""
    # route.tls.key -- PEM private key the router serves, for `edge` and `reencrypt`. Omitted when empty. This
    # lands in the Helm release history in plaintext - prefer letting the router use its own certificate, or
    # passthrough with a cert-manager-issued proxy certificate.
    key: ""
    # route.tls.certificate -- PEM certificate the router serves, for `edge` and `reencrypt`. Omitted when
    # empty.
    certificate: ""
    # route.tls.caCertificate -- PEM CA certificate that signed `certificate`. Omitted when empty.
    caCertificate: ""
    # route.tls.destinationCACertificate -- PEM CA certificate the router uses to validate the session proxy's
    # certificate on a `reencrypt` Route. Omitted when empty.
    destinationCACertificate: ""

# tlsRoute -- Optionally expose the operator-created session-proxy Service through a Gateway API TLSRoute:
# SNI-based TLS passthrough, giving end-to-end TLS to the session proxy's own certificate the way an
# OpenShift `passthrough` Route does, but on any cluster with the Gateway API rather than only on OpenShift.
#
tlsRoute:
  # tlsRoute.enabled -- Render the TLSRoute from this chart. Requires the TLSRoute CRD - standard channel
  # as `v1` since Gateway API 1.5 (Kubernetes 1.31+); older experimental-channel installs serve only
  # `v1alpha2`, which the chart falls back to (see `tlsRoute.apiVersion`) - and a Gateway that has a listener with
  # `protocol: TLS` and `tls.mode: Passthrough` whose `allowedRoutes` admits this namespace. `httpRoute`,
  # `ingress`, `route`, `tlsRoute` and `gatewayRoute` are alternatives - enable at most one of the five, since
  # all of them point at the same operator-created session-proxy Service. `gatewayRoute` below produces the
  # same passthrough route but has the operator create and reconcile it; prefer that when the operator
  # supports it, and reach for this chart-managed one otherwise. Nothing decrypts the connection on the way, so the Gateway sets
  # no timeouts and applies no HTTP rules: Kasm's long-lived session websockets are bounded only by the
  # layer-4 idle timeout of the Gateway's data plane and of anything in front of it.
  enabled: false
  # tlsRoute.parentRefs -- Gateways to attach the route to, as a list of `{name, namespace}` objects. The
  # route attaches to nothing - and the session proxy stays unreachable through the Gateway - if this is left
  # empty. Only the `parentRefs` cross namespaces; the backend stays in this one, so no `ReferenceGrant` is
  # needed.
  # Example:
  #   parentRefs:
  #     - name: traefik-gateway
  #       namespace: kube-system
  parentRefs: []
  # tlsRoute.hostnames -- SNI hostnames the route matches. Defaults to a single-entry list holding
  # `publicHostname` when empty. Because the connection is passed through untouched, the browser validates
  # the session proxy's own certificate (`sessionProxy.certSecretName`) against these names, so that
  # certificate has to cover them - enable `sessionProxy.certificate` or provision the Secret out of band.
  hostnames: []
  # tlsRoute.backendPort -- Port on the session-proxy Service to forward to. The default, 4444, is the
  # proxy's own HTTPS listener - the only port that makes sense under passthrough, since nothing terminates
  # TLS before the connection gets there.
  backendPort: 4444
  # tlsRoute.apiVersion -- API version to render the TLSRoute with. Empty (the default) picks
  # `gateway.networking.k8s.io/v1` when the cluster serves it (Gateway API 1.5+ standard channel), falls back
  # to `gateway.networking.k8s.io/v1alpha2` when only the older experimental-channel CRD is served, and uses
  # `v1` when rendering without a cluster (`helm template`). Set it to override that choice, for example when
  # rendering offline for a cluster that still serves only `v1alpha2`.
  apiVersion: ""

# gatewayRoute -- Optionally have the OPERATOR create the Gateway API TLSRoute, rather than rendering one
# from this chart. Same end result as `tlsRoute` - SNI-based TLS passthrough to the session proxy's own
# certificate - but the operator owns the route: it creates it, reconciles it, and keeps it aligned with the
# session-proxy Service it also owns, so the two cannot drift apart. `tlsRoute` is the chart-managed
# equivalent, for operator builds that predate this field or when the route has to live in the Helm release
# (owned by it, torn down with it, patched by other release tooling) rather than under the operator's
# ownership. Prefer this one whenever the operator supports it. The whole block is omitted from the Agent
# resource when disabled.
#
gatewayRoute:
  # gatewayRoute.enabled -- Have the operator create the TLSRoute. Same cluster-side prerequisites as
  # `tlsRoute`: the TLSRoute CRD (standard channel since Gateway API 1.5), and a Gateway with a `protocol: TLS` /
  # `tls.mode: Passthrough` listener whose `allowedRoutes` admits this namespace. `httpRoute`, `ingress`,
  # `route`, `tlsRoute` and `gatewayRoute` are alternatives - enable at most one of the five, since all of
  # them point at the same session-proxy Service. Between the two passthrough options, prefer `gatewayRoute`
  # when the operator supports it and fall back to `tlsRoute` when it does not.
  enabled: false
  # gatewayRoute.parentRef -- The single Gateway the operator attaches the TLSRoute to. Note the shape
  # differs from `tlsRoute.parentRefs`: the CRD takes one reference, not a list.
  parentRef:
    # gatewayRoute.parentRef.name -- REQUIRED when `gatewayRoute.enabled` is true. Name of the Gateway
    # resource. Templating fails when it is empty, since the CRD rejects the resource without it.
    name: ""
    # gatewayRoute.parentRef.namespace -- Namespace of the Gateway. Omitted from the Agent resource when
    # empty, which lets the operator default it to the Agent's own namespace.
    namespace: ""
    # gatewayRoute.parentRef.sectionName -- Selects one specific listener on the Gateway, by its `name`, in
    # place of every listener that would otherwise accept the route. Use it when the Gateway carries more
    # than one listener and only one of them is the `Passthrough` TLS listener. Omitted from the Agent
    # resource when empty.
    sectionName: ""
  # gatewayRoute.hostnames -- SNI hostnames the route matches. Unlike `tlsRoute.hostnames`, which this chart
  # defaults, these are defaulted by the *operator* to `[publicHostname]`, so leaving this empty is the
  # normal case - it is omitted from the Agent resource and the operator fills it in. The session proxy's own
  # certificate (`sessionProxy.certSecretName`) still has to cover whatever names end up in force, since the
  # connection reaches it undecrypted.
  # Example:
  #   hostnames:
  #     - agent.example.com
  #     - alt.example.com
  hostnames: []

# openshift -- OpenShift-only objects. Leave every switch here off on any other distribution: the
# kinds involved exist only on OpenShift and the release would fail to install.
#
# Sessions are ordinary pods, and on OpenShift ordinary pods are admitted by the `restricted-v2`
# SecurityContextConstraint, which refuses what a Kasm workspace needs even at uid 1000: a fixed uid and
# `fsGroup: 1000` outside the namespace's range, a capability or two on top of `drop: ALL` (`SYS_CHROOT` for
# the browser sandbox), and possibly a `Localhost` seccomp profile. A session that needs root adds uid 0 (in
# a pod user namespace or on the host, per `workspaceSecurity.rootMode`), a wider capability set and
# privilege escalation. The operator runs each session under a ServiceAccount of its own,
# `<name>-workspace`, so SCCs that admit exactly that can be granted to sessions alone and to nothing else in
# the namespace. This block ships those SCCs and the grant, shaped by `workspaceSecurity`.
#
openshift:
  scc:
    # openshift.scc.enabled -- Render the workspace SecurityContextConstraints, a ClusterRole holding `use` on
    # them, and the RoleBinding that grants it to the `<name>-workspace` ServiceAccount the operator creates for
    # this agent. One SCC admits uid-1000 sessions (`MustRunAsNonRoot`); unless `workspaceSecurity.rootMode` is
    # `forbid`, a second admits root sessions: uid 0 on the host for `host` (the default), uid 0 in a pod user
    # namespace only (`userNamespaceLevel: RequirePodLevel`, OpenShift 4.20+) for `userns`. With `seccomp.enabled` and the `installer` backend, also grant the built-in `privileged` SCC to the
    # `<name>-seccomp-installer` ServiceAccount (root with a hostPath mount of the kubelet's seccomp directory,
    # `spc_t`). Requires cluster-admin at install time, as any SCC or ClusterRole does. The agent Deployment,
    # the session proxy, the image puller and the standby placeholders set no UID and stay under
    # `restricted-v2`.
    #
    enabled: false
    workspace:
      # openshift.scc.workspace.name -- Name of the cluster-scoped uid-1000 SecurityContextConstraint and of the
      # ClusterRole that grants the SCCs. The root SCC, rendered unless `workspaceSecurity.rootMode` is `forbid`,
      # takes the same name with a `-root` suffix. Leave empty to derive one unique to this agent and namespace
      # (`kasm-<namespace>-<name>-workspace`).
      #
      name: ""
      # openshift.scc.workspace.capabilities -- Capabilities the SCCs let a session add. Leave empty (the default)
      # to derive them from `workspaceSecurity`: the uid-1000 SCC admits `SYS_CHROOT` and `NET_BIND_SERVICE` under
      # profile `baseline` (plus `SETUID`/`SETGID` with `sudo`) and only `NET_BIND_SERVICE` under `restricted`;
      # the root SCC (`rootMode` `userns` or `host`) admits the set the operator adds to every root container on
      # top of `drop: ALL` (`SETUID`, `SETGID`, `CHOWN`, `DAC_OVERRIDE`, `FOWNER`, `KILL`, `NET_BIND_SERVICE`,
      # `SYS_CHROOT`). A non-empty list replaces the derived set on every SCC the chart renders; set one when an
      # image `cap_add`s more (the manager passes the image's run config through), or the pod is refused.
      # Example:
      #   capabilities: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SYS_CHROOT, SYS_ADMIN]
      #
      capabilities: []
      # openshift.scc.workspace.allowPrivileged -- Admit sessions whose image run config asks for `privileged: true`.
      # Off by default: no stock Kasm image needs it.
      #
      allowPrivileged: false
      # openshift.scc.workspace.allowHostPath -- Admit hostPath volumes. The operator renders a workspace's `devices`
      # (`/dev/dri`, `/dev/video*` passed through by path) and its Docker-style `volumeMappings` (host bind mounts
      # from the manager's volume mappings) as hostPath volumes; without this they are refused. Webcam sessions
      # through `videoDevicePlugin` use a device-plugin resource instead and need no hostPath.
      #
      allowHostPath: false
      # openshift.scc.workspace.volumes -- Volume kinds the SCC admits. The default covers everything the operator
      # renders for a session: the startup-script ConfigMaps, the memory-backed `/dev/shm` and `/tmp`, persistent
      # profiles (PersistentVolumeClaim) and cloud storage mappings (CSI). `hostPath` is added by `allowHostPath`.
      # Add `image` for `imageMounts` (OCI image volumes, Kubernetes 1.35+), which this list leaves out because
      # an SCC naming a volume kind the API server does not know is refused outright.
      #
      volumes:
        - configMap
        - csi
        - downwardAPI
        - emptyDir
        - ephemeral
        - persistentVolumeClaim
        - projected
        - secret
      # openshift.scc.workspace.seccompProfiles -- seccomp profiles the SCC admits. `runtime/default` is what the
      # operator sets when an image carries no profile; `*` admits the `Localhost` profile the agent sets for an
      # image that ships an inline profile (`seccomp.enabled`, either backend) - OpenShift matches `localhost/`
      # entries literally, with no wildcard, and each such profile has its own content-derived name, so only `*`
      # covers them; `unconfined` is the fallback for such an image when `seccomp.enabled` is off. Narrowing this
      # to `[runtime/default]` refuses every image with an inline profile.
      #
      seccompProfiles:
        - runtime/default
        - "*"
        - unconfined
