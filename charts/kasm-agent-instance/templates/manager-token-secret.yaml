{{/*
  The manager token Secret.

  Only rendered when the token is supplied inline as agent.manager.token AND no
  existing Secret is named - agent.manager.existingTokenSecret always wins, and
  when it is set this chart creates nothing.

  Including the name helper here (rather than only in agent.yaml) means the
  "neither is set" failure fires even when this template is rendered alone.
*/}}
{{- $secretName := include "kasmAgentInstance.managerTokenSecretName" . -}}
{{- if and (not .Values.manager.existingTokenSecret) .Values.manager.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kasmAgentInstance.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  token: {{ .Values.manager.token | quote }}
{{- end }}
