{{/*
  The Agent custom resource.

  The operator reconciles this into the agent Deployment, the session-proxy
  Deployment, and the session-proxy Service (named "<.Values.name>-session-proxy").
  Nothing in this chart creates those directly.

  Optional fields are omitted entirely rather than rendered empty: the CRD
  distinguishes "unset" from "set to the zero value" for several of them, and an
  omitted field leaves the operator's own default in charge.
*/}}
{{- $env := include "kasmAgentInstance.env" . -}}
{{- /* The session-proxy Service overrides. The whole block stays off the resource
       while it holds nothing but defaults - ClusterIP with no annotations, no
       traffic policy and no pinned node ports is exactly what the operator does
       on its own - but any single non-default value pulls it in, annotations on
       an otherwise plain ClusterIP Service included. */}}
{{- $service := .Values.sessionProxy.service -}}
{{- $serviceSet := or (and $service.type (ne $service.type "ClusterIP")) $service.annotations $service.externalTrafficPolicy $service.httpsNodePort $service.httpNodePort -}}
{{- $proxyProtocol := .Values.sessionProxy.proxyProtocol -}}
apiVersion: agent.kasm.com/v1alpha1
kind: Agent
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kasmAgentInstance.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  image: {{ include "kasmAgentInstance.joinImage" (dict "image" .Values.image "defaultTag" .Chart.AppVersion "path" "agent.image" "globalRegistry" (include "kasmAgentInstance.systemDefaultRegistry" $)) | quote }}
  imageAvailabilityPolicy: {{ .Values.imageAvailabilityPolicy | quote }}
  workspaceCPURequestPercent: {{ .Values.workspaceCPURequestPercent }}
  imagePullPolicy: {{ .Values.imagePullPolicy }}
  logLevel: {{ .Values.logLevel | quote }}
  heartbeatIntervalSeconds: {{ .Values.heartbeatIntervalSeconds }}
  manager:
    hostname: {{ include "kasmAgentInstance.managerHostname" . | quote }}
    port: {{ include "kasmAgentInstance.managerPort" . }}
    scheme: {{ include "kasmAgentInstance.managerScheme" . }}
    pathPrefix: {{ .Values.manager.pathPrefix | quote }}
    {{- /* The token is always referenced, never inlined on the resource. */}}
    tokenSecretRef:
      name: {{ include "kasmAgentInstance.managerTokenSecretName" . }}
      key: {{ include "kasmAgentInstance.managerTokenSecretKey" . }}
  publicHostname: {{ include "kasmAgentInstance.publicHostname" . | quote }}
  publicPort: {{ include "kasmAgentInstance.publicPort" . }}
  zone: {{ .Values.zone | quote }}
  sessionProxy:
    image: {{ include "kasmAgentInstance.joinImage" (dict "image" .Values.sessionProxy.image "defaultTag" "" "path" "agent.sessionProxy.image" "globalRegistry" (include "kasmAgentInstance.systemDefaultRegistry" $)) | quote }}
    sidecarImage: {{ include "kasmAgentInstance.joinImage" (dict "image" .Values.sessionProxy.sidecarImage "defaultTag" .Chart.AppVersion "path" "agent.sessionProxy.sidecarImage" "globalRegistry" (include "kasmAgentInstance.systemDefaultRegistry" $)) | quote }}
    replicas: {{ .Values.sessionProxy.replicas }}
    probeTimeoutSeconds: {{ .Values.sessionProxy.probeTimeoutSeconds }}
    reconcileIntervalSeconds: {{ .Values.sessionProxy.reconcileIntervalSeconds }}
    routing: {{ .Values.sessionProxy.routing | quote }}
    certSecretName: {{ .Values.sessionProxy.certSecretName }}
    {{- if $serviceSet }}
    service:
      {{- with $service.type }}
      type: {{ . }}
      {{- end }}
      {{- with $service.externalTrafficPolicy }}
      externalTrafficPolicy: {{ . }}
      {{- end }}
      {{- with $service.httpsNodePort }}
      httpsNodePort: {{ . }}
      {{- end }}
      {{- with $service.httpNodePort }}
      httpNodePort: {{ . }}
      {{- end }}
      {{- with $service.httpsPort }}
      httpsPort: {{ . }}
      {{- end }}
      {{- with $service.httpPort }}
      httpPort: {{ . }}
      {{- end }}
      {{- /* Keys and values are quoted individually rather than passed through
             toYaml: load-balancer annotations are routinely numeric-looking
             (idle timeouts, ports), and both the CRD's map[string]string and the
             API server reject a non-string annotation value. */}}
      {{- with $service.annotations }}
      annotations:
        {{- range $key, $value := . }}
        {{ $key | quote }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if or $proxyProtocol.enabled $proxyProtocol.trustedCIDRs }}
    proxyProtocol:
      enabled: {{ $proxyProtocol.enabled }}
      {{- with $proxyProtocol.trustedCIDRs }}
      trustedCIDRs:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- /* The operator-managed TLS-passthrough route. The CRD marks both `enabled`
         and `parentRef` required whenever this block is present, so it is either
         omitted whole or rendered with both. hostnames is deliberately NOT
         defaulted here the way tlsRoute.yaml defaults its own: the operator
         defaults it to [spec.publicHostname], and passing an empty list would
         override that with "match nothing". */}}
  {{- if .Values.gatewayRoute.enabled }}
  gatewayRoute:
    enabled: true
    parentRef:
      name: {{ include "kasmAgentInstance.gatewayRouteParentRefName" . | quote }}
      {{- with .Values.gatewayRoute.parentRef.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .Values.gatewayRoute.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
    {{- with .Values.gatewayRoute.hostnames }}
    hostnames:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with .Values.serverID }}
  serverID: {{ . | quote }}
  {{- end }}
  {{- with .Values.apiServerURL }}
  apiServerURL: {{ . | quote }}
  {{- end }}
  {{- if or .Values.storageMappings.enabled .Values.storageMappings.installationID }}
  storageMappings:
    enabled: {{ .Values.storageMappings.enabled }}
    {{- with .Values.storageMappings.installationID }}
    installationID: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.persistentProfiles }}
  {{- if or .storageClass .accessModes .capacity }}
  persistentProfiles:
    {{- with .storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
    {{- with .accessModes }}
    accessModes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .capacity }}
    capacity: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- end }}
  imagePuller:
    enabled: {{ .Values.imagePuller.enabled }}
    refreshIntervalSeconds: {{ .Values.imagePuller.refreshIntervalSeconds }}
    {{- with .Values.imagePuller.extraImages }}
    extraImages:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.imagePuller.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- /* spec.seccomp is rendered only when enabled. The CRD requires the installer
         block (with a non-empty image) for backend "installer", and takes no block
         for backend "spo" - so render the installer sub-block only for installer. */}}
  {{- if .Values.seccomp.enabled }}
  seccomp:
    backend: {{ .Values.seccomp.backend }}
    {{- if eq .Values.seccomp.backend "installer" }}
    installer:
      image: {{ include "kasmAgentInstance.joinImage" (dict "image" .Values.seccomp.installer.image "defaultTag" .Chart.AppVersion "path" "seccomp.installer.image" "globalRegistry" (include "kasmAgentInstance.systemDefaultRegistry" $)) | quote }}
      imagePullPolicy: {{ .Values.seccomp.installer.imagePullPolicy }}
      kubeletSeccompDir: {{ .Values.seccomp.installer.kubeletSeccompDir | quote }}
      {{- with .Values.seccomp.installer.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.workspacesNodeSelector }}
  workspacesNodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.workspacesTolerations }}
  workspacesTolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* spec.workspacesAutoscaling and spec.standby render only when enabled, since the CRD
         requires enabled on each block (and standby requires a priorityClassName). maxNodes is
         omitted when unset (0): the CRD floor is 1, and an absent maxNodes lets the pool grow one
         node past what is running. */}}
  {{- if .Values.workspacesAutoscaling.enabled }}
  workspacesAutoscaling:
    enabled: true
    {{- if gt (int .Values.workspacesAutoscaling.maxNodes) 0 }}
    maxNodes: {{ .Values.workspacesAutoscaling.maxNodes }}
    {{- end }}
    schedulingTimeoutSeconds: {{ .Values.workspacesAutoscaling.schedulingTimeoutSeconds }}
  {{- end }}
  {{- if .Values.standby.enabled }}
  standby:
    enabled: true
    priorityClassName: {{ include "kasmAgentInstance.standbyPriorityClassName" . | quote }}
    replicas: {{ .Values.standby.replicas }}
    externallyScaled: {{ .Values.standby.externallyScaled }}
    image: {{ .Values.standby.image | quote }}
    {{- with .Values.standby.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with .Values.agentLabels }}
  agentLabels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.workspaceLabels }}
  workspaceLabels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $env }}
  env:
    {{- . | nindent 4 }}
  {{- end }}
