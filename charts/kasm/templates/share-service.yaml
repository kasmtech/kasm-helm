{{/*
Deploy the Share if .Values.components.share.enabled set to true
*/}}
{{- $constants := (include "kasm.constants" . | fromYaml) -}}
{{- if eq .Values.components.share.enabled true }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $constants.share.svc }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $constants.share.svc }}-svc
    app.kubernetes.io/component: {{ $constants.share.component }}
    {{- include "kasm.defaultLabels" . | indent 4 }}
    {{- with $.Values.components.share.labels }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $.Values.extraLabels.service }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- with $.Values.labels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- with $.Values.annotations.service }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: {{ $constants.share.name }}
  ports:
    - name: {{ printf "%s-svc-%s" $constants.share.svc ($constants.share.port | toString) }}
      protocol: TCP
      port: {{ $constants.share.port }}
{{- end }}