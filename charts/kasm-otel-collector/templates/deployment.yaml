{{/*
  The collector Deployment.

  The pod carries a checksum/config annotation over the rendered config.yaml, so
  editing any exporter/receiver/processor value rolls the pods - the collector
  does not watch its config file, and a ConfigMap-only change would otherwise be
  silently ignored until something else restarted the pod.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kasmOtelCollector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kasmOtelCollector.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kasmOtelCollector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* Merged rather than concatenated so a podAnnotations/commonAnnotations key that collides
             with one of the chart's own cannot emit a duplicate YAML key. The chart's own keys win,
             then podAnnotations, then commonAnnotations.

             kasm.com/security and kasm.com/healthcheck are the opt-in markers the repository's
             Kyverno gates (tests/kyverno/pod-security.baseline.yaml, tests/kyverno/probes.required.yaml)
             key off: a pod template without them is skipped by those policies entirely. This pod
             template is unconditionally hardened (podSecurityContext/securityContext defaults are
             restricted-compatible) and unconditionally probed (liveness + readiness on the
             health-check port), so the markers are emitted unconditionally too - there is no
             unhardened variant of this Deployment to exempt. Removing them, or letting a values
             key overwrite them, silently drops this workload out of both gates. */}}
      annotations:
        {{- $annotations := merge
              (dict
                "kasm.com/security" "true"
                "kasm.com/healthcheck" "true"
                "checksum/config" (include "kasmOtelCollector.config" . | sha256sum))
              (deepCopy (.Values.podAnnotations | default dict))
              (deepCopy (.Values.commonAnnotations | default dict)) }}
        {{- toYaml $annotations | nindent 8 }}
      labels:
        {{- include "kasmOtelCollector.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kasmOtelCollector.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel-collector
          image: {{ include "kasmOtelCollector.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: health-check
              containerPort: 13133
              protocol: TCP
          {{- if or .Values.exporters.clickhouse.enabled .Values.extraEnv }}
          env:
            {{- if .Values.exporters.clickhouse.enabled }}
            # The clickhouse exporter resolves ${env:CLICKHOUSE_PASSWORD} at
            # startup and refuses to start when it is unset.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exporters.clickhouse.existingSecret }}
                  key: {{ .Values.exporters.clickhouse.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: health-check
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: health-check
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "kasmOtelCollector.fullname" . }}-config
