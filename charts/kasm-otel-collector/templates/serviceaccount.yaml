{{/*
  The identity the collector pod runs as. The k8s_events receiver reads Events
  through it, so role.yaml/rolebinding.yaml bind it when that receiver is on.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kasmOtelCollector.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kasmOtelCollector.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
