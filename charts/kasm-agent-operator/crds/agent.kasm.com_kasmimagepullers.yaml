                    NodeStagingStatus is one targeted node's view: its budget, what it holds,
                    what it is pulling, and what it cannot fit.
                  properties:
                    budgetBytes:
                      description: |-
                        BudgetBytes is what the controller will still pull into: capacity less
                        the eviction threshold, the reserve and current usage, plus what the
                        kubelet can reclaim. Negative means the node is over its reserve.
                      format: int64
                      type: integer
                    capacityBytes:
                      description: CapacityBytes is the node's ephemeral-storage capacity.
                      format: int64
                      type: integer
                    holderReady:
                      description: HolderReady is whether the node's holder pod is
                        Running.
                      type: boolean
                    node:
                      type: string
                    pulling:
                      description: Pulling is the image the node's pull pod is fetching,
                        if any.
                      items:
                        type: string
                      type: array
                    skipped:
                      description: Skipped are the images this node is not pulling
                        for lack of budget.
                      items:
                        description: SkippedImage is an image a node is not pulling,
                          and why.
                        properties:
                          image:
                            type: string
                          message:
                            type: string
                          reason:
                            description: Reason is InsufficientStorage, SizeUnknown
                              or ImageListTruncated.
                            type: string
                          shortfallBytes:
                            description: |-
                              ShortfallBytes is how much the image exceeds the budget by, for
                              InsufficientStorage.
                            format: int64
                            type: integer
                        required:
                        - image
                        - reason
                        type: object
                      type: array
                    staged:
                      description: |-
                        Staged are the images the controller has pulled onto this node and
                        the holder pod pins.
                      items:
                        description: StagedImage records an image the controller pulled
                          onto a node.
                        properties:
                          at:
                            description: At is when the pull completed.
                            format: date-time
                            type: string
                          digest:
                            description: Digest is the image ID the kubelet reported
                              for the pull.
                            type: string
                          image:
                            type: string
                          refreshBucket:
                            description: |-
                              RefreshBucket is the scheduled-refresh bucket the image was last
                              pulled in; empty with no refresh interval.
                            type: string
                          sizeBytes:
                            description: SizeBytes is the unpacked size the node reports,
                              once it does.
                            format: int64
                            type: integer
                        required:
                        - image
                        type: object
                      type: array
                    yieldingTo:
                      description: |-
                        YieldingTo is the workspace pod the controller is waiting on before
                        starting the next pull, so a session's own image pull is not queued
                        behind a pre-pull on the node's serialized kubelet.
                      type: string
                  required:
                  - node
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              pullFailures:
                description: PullFailures are the pulls waiting out a back-off.
                items:
                  description: |-
                    PullFailure records a pull that failed, and when it will be retried. Node
                    is empty for a failure the registry answered (bad credentials, a missing
                    manifest), which no node can get past.
                  properties:
                    count:
                      description: Count is how many consecutive attempts have failed
                        this way.
                      format: int32
                      type: integer
                    image:
                      type: string
                    message:
                      type: string
                    node:
                      type: string
                    reason:
                      description: Reason is Registry, Disk, Transient or Holder.
                      type: string
                    retryAfter:
                      description: RetryAfter is when the next attempt may start.
                      format: date-time
                      type: string
                  required:
                  - image
                  - reason
                  - retryAfter
                  type: object
                type: array
              pulledImages:
                items:
                  description: |-
                    PulledImageStatus is per-image availability aggregated across nodes. This is
                    what the agent surfaces as docker_images in its heartbeat.
                  properties:
                    message:
                      description: Message is the last registry or pull error for
                        the image, if any.
                      type: string
                    name:
                      type: string
                    nodesAvailable:
                      format: int32
                      type: integer
                    nodesDesired:
                      format: int32
                      type: integer
                    repoDigests:
                      description: RepoDigests are the sha256 repo digests reported
                        by the runtime (imageID).
                      items:
                        type: string
                      type: array
                    sizeBytes:
                      description: |-
                        SizeBytes is the image's best known unpacked size: the runtime's
                        figure from a node that holds it, else the registry estimate.
                      format: int64
                      type: integer
                    status:
                      description: |-
                        Status is "pulled" once any targeted node holds the image, "failed"
                        when the registry refused it (bad credentials, missing manifest) so
                        no node can get it, and "unknown" otherwise (not pulled yet, or
                        skipped everywhere for lack of space).
                      enum:
                      - pulled
                      - failed
                      - unknown
                      type: string
                    tags:
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
              summary:
                description: ImagePullerSummary is a quick rollup for the printer
                  columns.
                properties:
                  failures:
                    format: int32
                    type: integer
                  imagesCount:
                    format: int32
                    type: integer
                  imagesSkipped:
                    description: |-
                      ImagesSkipped counts images that at least one targeted node has
                      skipped for lack of storage budget (or an unknown size).
                    format: int32
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
