{{/*
  The kasm-agent-operator controller-manager.

  Translated from config/manager/manager.yaml in the kasm-agent-operator repo. The container name,
  command, probe ports and timings, security contexts, and termination grace period are kept identical
  to the deployed manifest so a cluster converting from kustomize/Tilt to Helm sees no behavior change.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kasmAgentOperator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kasmAgentOperator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "kasmAgentOperator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* Merged rather than concatenated so a podAnnotations/podLabels key that collides with one
             of the chart's own cannot emit a duplicate YAML key. The chart's own keys win.

             kasm.com/security and kasm.com/healthcheck are the opt-in markers the repository's
             Kyverno gates (tests/kyverno/pod-security.baseline.yaml, tests/kyverno/probes.required.yaml)
             key off: a pod template without them is skipped by those policies entirely. This pod
             template is unconditionally hardened (restricted-compatible pod and container
             securityContext below) and unconditionally probed (liveness + readiness on :8081), so
             the markers are emitted unconditionally too - there is no unhardened variant of this
             Deployment to exempt. Removing them silently drops this workload out of both gates. */}}
      annotations:
        {{- $annotations := merge (dict "kubectl.kubernetes.io/default-container" "manager" "kasm.com/security" "true" "kasm.com/healthcheck" "true") (deepCopy (.Values.podAnnotations | default dict)) }}
        {{- toYaml $annotations | nindent 8 }}
      labels:
        {{- $labels := merge (include "kasmAgentOperator.labels" . | fromYaml) (deepCopy (.Values.podLabels | default dict)) }}
        {{- toYaml $labels | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # No fsGroup is set, so this only ever costs a no-op on startup; it is stated explicitly
        # because the restricted-PSS Kyverno gate requires it on every pod template it covers.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: manager
          image: {{ include "kasmAgentOperator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
          {{- if or .Values.otel.enabled .Values.extraEnv }}
          env:
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "kasmAgentOperator.otelEndpoint" . | quote }}
            # Prometheus's OTLP receiver silently drops delta points and this SDK defaults to delta,
            # so the operator is pinned to cumulative temporality.
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # Restated at container scope (the pod securityContext above already sets both) so the
            # container is restricted-compatible when read on its own, which is what both the
            # Pod Security admission controller and the repository's Kyverno gate check.
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
