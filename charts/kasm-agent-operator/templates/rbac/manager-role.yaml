{{/*
  Translated from config/rbac/role.yaml and config/rbac/role_binding.yaml in the kasm-agent-operator
  repo. The `manager-role` / `manager-rolebinding` names are kept verbatim rather than fullname-prefixed
  so a cluster converting from the kustomize deployment to this chart keeps the same objects.

  These are cluster-scoped, so only one release of this chart can own them per cluster.

  Synced 2026-09-14 with the operator build that adds the node-exhaustion eviction/OOM backoff
  (nodes: get, widened here to get/list/watch for the cached client, see the rule) and one deliberate difference: no secrets rule at all (see the comment on that rule
  below). Requires that operator build or newer; an older operator's Secret informer needs
  cluster-wide list/watch and will fail its cache sync under this role. Rule order is otherwise the
  generator's.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
  labels:
    {{- include "kasmAgentOperator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - pods
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Read-only: checked when a per-node eviction/OOM backoff window closes, before re-including the
# node in a workspace/image-puller pod's affinity, so a replacement pod isn't scheduled back onto a
# node still under DiskPressure/MemoryPressure/PIDPressure (see internal/scheduling). The operator
# reads the Node through controller-runtime's cached client, which starts a Node informer on first
# use, so list and watch are needed alongside get: with get alone the informer's list is forbidden,
# the read blocks on a cache that never syncs, and every reconcile of a workspace whose backoff
# window just closed hangs (seen live 2026-09-14 on a CRI-O cluster: status stuck at Pending with the
# replacement pod Running until the operator was restarted).
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
# PersistentVolumes are created and deleted by name and never watched, so the operator carries no
# list/watch on them. Cluster-scoped by nature, so this rule cannot move to a namespaced Role.
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - create
  - delete
  - get
  - update
# No secrets rule, deliberately. The operator needs Secret access only inside the namespaces that hold
# an Agent (it gets, creates and updates the per-workspace storage-mapping Secret by name, never lists
# or watches Secrets, and never deletes them: owner references do). That grant comes from the
# kasm-agent-instance chart, which stamps a namespaced Role + RoleBinding for this ServiceAccount
# wherever it installs an Agent. The operator's generated config/rbac/role.yaml keeps a cluster-wide
# secrets get/create/update for its kustomize deployment; this chart is the one place that drops it.
- apiGroups:
  - agent.kasm.com
  resources:
  - agents
  - kasmimagepullers
  - kasmworkspaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agent.kasm.com
  resources:
  - agents/finalizers
  - kasmimagepullers/finalizers
  - kasmworkspaces/finalizers
  verbs:
  - update
- apiGroups:
  - agent.kasm.com
  resources:
  - agents/status
  - kasmimagepullers/status
  - kasmworkspaces/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - tlsroutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pools.kasm.ai
  resources:
  - warmpoolinstances
  - warmpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pools.kasm.ai
  resources:
  - warmpoolinstances/finalizers
  - warmpools/finalizers
  verbs:
  - update
- apiGroups:
  - pools.kasm.ai
  resources:
  - warmpoolinstances/status
  - warmpools/status
  verbs:
  - get
  - patch
  - update
# The per-Agent ClusterRoleBinding is created, updated and deleted by a name the operator computes
# itself; it never lists or patches bindings. The per-Agent RoleBinding is owned by the Agent and
# garbage-collected, so no delete verb is needed on rolebindings.
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - create
  - delete
  - get
  - update
# The operator holds only `bind` on these two ClusterRoles, not the permissions they grant. It creates
# the per-Agent bindings that reference them by name, so the names below must match the ClusterRoles in
# kasm-agent-clusterrole.yaml and kasm-nginx-sidecar-clusterrole.yaml exactly.
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - kasm-agent
  - kasm-nginx-sidecar
  resources:
  - clusterroles
  verbs:
  - bind
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-rolebinding
  labels:
    {{- include "kasmAgentOperator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
