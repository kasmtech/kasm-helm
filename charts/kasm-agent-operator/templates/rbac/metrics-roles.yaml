{{/*
  RBAC protecting the controller-manager metrics endpoint with authn/authz, plus the `metrics-reader`
  ClusterRole a scraper can be bound to. Translated from config/rbac/metrics_auth_role.yaml,
  config/rbac/metrics_auth_role_binding.yaml, and config/rbac/metrics_reader_role.yaml in the
  kasm-agent-operator repo. See https://book.kubebuilder.io/reference/metrics.html
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-auth-role
  labels:
    {{- include "kasmAgentOperator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-auth-rolebinding
  labels:
    {{- include "kasmAgentOperator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-auth-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-reader
  labels:
    {{- include "kasmAgentOperator.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
