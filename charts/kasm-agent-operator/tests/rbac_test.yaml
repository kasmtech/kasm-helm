suite: operator rbac

templates:
  - templates/rbac/service-account.yaml
  - templates/rbac/manager-role.yaml
  - templates/rbac/leader-election-role.yaml
  - templates/rbac/metrics-roles.yaml
  - templates/rbac/kasm-agent-clusterrole.yaml
  - templates/rbac/kasm-nginx-sidecar-clusterrole.yaml
  - templates/rbac/kasm-seccomp-installer-clusterrole.yaml
  - templates/rbac/kasm-agent-seccomp-spo-clusterrole.yaml
  - templates/rbac/aggregate-roles.yaml

tests:
  # ---------- service account ----------
  - it: creates the controller-manager service account in the release namespace
    template: templates/rbac/service-account.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: controller-manager
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - notExists:
          path: metadata.annotations

  - it: honors serviceAccount.name and serviceAccount.annotations
    template: templates/rbac/service-account.yaml
    set:
      serviceAccount:
        name: kasm-operator-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/example
    asserts:
      - equal:
          path: metadata.name
          value: kasm-operator-sa
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::000000000000:role/example

  - it: skips the service account when serviceAccount.create is false
    template: templates/rbac/service-account.yaml
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  # ---------- manager role ----------
  - it: keeps the kustomize-source names for the manager role and binding
    template: templates/rbac/manager-role.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: manager-role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: manager-rolebinding
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: manager-role
        documentIndex: 1

  - it: binds the manager role to the service account in the release namespace
    template: templates/rbac/manager-role.yaml
    documentIndex: 1
    set:
      serviceAccount:
        name: kasm-operator-sa
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: kasm-operator-sa
            namespace: NAMESPACE

  - it: grants the manager bind on the runtime-bound cluster roles only
    template: templates/rbac/manager-role.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resourceNames:
              - kasm-agent
              - kasm-agent-seccomp-spo
              - kasm-nginx-sidecar
              - kasm-seccomp-installer
            resources:
              - clusterroles
            verbs:
              - bind
      - contains:
          path: rules
          content:
            apiGroups:
              - security-profiles-operator.x-k8s.io
            resources:
              - seccompprofiles
            verbs:
              - delete
              - list

  - it: grants the manager the custom resource groups it reconciles
    template: templates/rbac/manager-role.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - agent.kasm.com
            resources:
              - agents
              - kasmimagepullers
              - kasmworkspaces
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  # ---------- leader election ----------
  - it: scopes the leader election role and binding to the release namespace
    template: templates/rbac/leader-election-role.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: leader-election-role
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentIndex: 0
      - equal:
          path: metadata.name
          value: leader-election-rolebinding
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentIndex: 1

  - it: grants leases and configmaps for the leader election lease
    template: templates/rbac/leader-election-role.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # ---------- metrics ----------
  - it: ships the metrics auth role, its binding, and the metrics reader role
    template: templates/rbac/metrics-roles.yaml
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: metrics-auth-role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: metrics-auth-rolebinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: metrics-reader
        documentIndex: 2
      - contains:
          path: rules
          content:
            nonResourceURLs:
              - /metrics
            verbs:
              - get
        documentIndex: 2

  # ---------- runtime-bound cluster roles ----------
  - it: names the agent cluster role kasm-agent verbatim
    template: templates/rbac/kasm-agent-clusterrole.yaml
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: kasm-agent
      - contains:
          path: rules
          content:
            apiGroups:
              - metrics.k8s.io
            resources:
              - nodes
              - pods
            verbs:
              - get
              - list

  - it: lets the agent write its own ImagesWithheld status and Events
    template: templates/rbac/kasm-agent-clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - agent.kasm.com
            resources:
              - agents
            verbs:
              - get
      - contains:
          path: rules
          content:
            apiGroups:
              - agent.kasm.com
            resources:
              - agents/status
            verbs:
              - get
              - update
              - patch
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - events
            verbs:
              - create
              - patch

  - it: names the sidecar cluster role kasm-nginx-sidecar verbatim
    template: templates/rbac/kasm-nginx-sidecar-clusterrole.yaml
    asserts:
      - equal:
          path: metadata.name
          value: kasm-nginx-sidecar
      - contains:
          path: rules
          content:
            apiGroups:
              - agent.kasm.com
            resources:
              - kasmworkspaces
            verbs:
              - get
              - list
              - watch

  - it: lets the sidecar watch workspace pods, and grants it nothing but reads
    template: templates/rbac/kasm-nginx-sidecar-clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - get
              - list
              - watch
      - lengthEqual:
          path: rules
          count: 3
      - notContains:
          path: rules[*].verbs
          content: create
      - notContains:
          path: rules[*].verbs
          content: update
      - notContains:
          path: rules[*].verbs
          content: delete

  - it: names the seccomp installer cluster role kasm-seccomp-installer verbatim, reads only
    template: templates/rbac/kasm-seccomp-installer-clusterrole.yaml
    asserts:
      - equal:
          path: metadata.name
          value: kasm-seccomp-installer
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
            verbs:
              - get
              - list
              - watch
      - lengthEqual:
          path: rules
          count: 1
      - notContains:
          path: rules[*].verbs
          content: create

  - it: names the spo cluster role kasm-agent-seccomp-spo verbatim, seccompprofiles only
    template: templates/rbac/kasm-agent-seccomp-spo-clusterrole.yaml
    asserts:
      - equal:
          path: metadata.name
          value: kasm-agent-seccomp-spo
      - contains:
          path: rules
          content:
            apiGroups:
              - security-profiles-operator.x-k8s.io
            resources:
              - seccompprofiles
            verbs:
              - get
              - list
              - watch
              - create
              - delete
      - lengthEqual:
          path: rules
          count: 1

  - it: leaves the runtime-bound cluster role names untouched by nameOverride
    set:
      nameOverride: something-else
      fullnameOverride: something-else
    asserts:
      - equal:
          path: metadata.name
          value: kasm-agent
        template: templates/rbac/kasm-agent-clusterrole.yaml
      - equal:
          path: metadata.name
          value: kasm-nginx-sidecar
        template: templates/rbac/kasm-nginx-sidecar-clusterrole.yaml
      - equal:
          path: metadata.name
          value: kasm-seccomp-installer
        template: templates/rbac/kasm-seccomp-installer-clusterrole.yaml
      - equal:
          path: metadata.name
          value: kasm-agent-seccomp-spo
        template: templates/rbac/kasm-agent-seccomp-spo-clusterrole.yaml
      - equal:
          path: metadata.name
          value: manager-role
        template: templates/rbac/manager-role.yaml
        documentIndex: 0

  # ---------- aggregate convenience roles ----------
  - it: renders the nine convenience roles by default
    template: templates/rbac/aggregate-roles.yaml
    asserts:
      - hasDocuments:
          count: 9

  - it: gives the admin tier full verbs and the viewer tier read-only verbs
    template: templates/rbac/aggregate-roles.yaml
    asserts:
      - equal:
          path: metadata.name
          value: agent-agent-admin-role
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - agent.kasm.com
            resources:
              - agents
            verbs:
              - "*"
        documentIndex: 0
      - equal:
          path: metadata.name
          value: agent-agent-viewer-role
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups:
              - agent.kasm.com
            resources:
              - agents
            verbs:
              - get
              - list
              - watch
        documentIndex: 2
      - equal:
          path: metadata.name
          value: agent-kasmworkspace-viewer-role
        documentIndex: 8

  - it: removes the convenience roles when rbac.aggregateRoles is false
    template: templates/rbac/aggregate-roles.yaml
    set:
      rbac:
        aggregateRoles: false
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the operator rbac when rbac.aggregateRoles is false
    set:
      rbac:
        aggregateRoles: false
    asserts:
      - hasDocuments:
          count: 2
        template: templates/rbac/manager-role.yaml
      - equal:
          path: metadata.name
          value: manager-role
        template: templates/rbac/manager-role.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: kasm-agent
        template: templates/rbac/kasm-agent-clusterrole.yaml
      - equal:
          path: metadata.name
          value: kasm-nginx-sidecar
        template: templates/rbac/kasm-nginx-sidecar-clusterrole.yaml
      - hasDocuments:
          count: 1
        template: templates/rbac/service-account.yaml

  # ---------- labels ----------
  - it: labels every rbac object with the chart label set
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kasm-ai
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator

  - it: grants the manager no secrets access at all; that comes per namespace from the instance chart
    template: templates/rbac/manager-role.yaml
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - create
              - get
              - update
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
              - persistentvolumeclaims
              - persistentvolumes
              - pods
              - secrets
              - serviceaccounts
              - services
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: keeps persistentvolumes and clusterrolebindings to get, create, update and delete by name, and endpointslices/nodes read-only
    template: templates/rbac/manager-role.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - persistentvolumes
            verbs:
              - create
              - delete
              - get
              - update
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - get
              - list
              - watch
      - contains:
          path: rules
          content:
            apiGroups:
              - discovery.k8s.io
            resources:
              - endpointslices
            verbs:
              - get
              - list
              - watch
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - endpoints
            verbs:
              - get
              - list
              - watch
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
            verbs:
              - create
              - delete
              - get
              - update
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - rolebindings
            verbs:
              - create
              - get
              - list
              - patch
              - update
              - watch
      - contains:
          path: rules
          content:
            apiGroups:
              - policy
            resources:
              - poddisruptionbudgets
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
      - lengthEqual:
          path: rules
          count: 15

