suite: controller-manager deployment

templates:
  - templates/deployment.yaml

tests:
  # ---------- identity and labels ----------
  - it: names the deployment from the release and chart name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kasm-agent-operator
      - equal:
          path: spec.template.spec.containers[0].name
          value: manager

  - it: honors fullnameOverride
    set:
      fullnameOverride: kasm-operator
    asserts:
      - equal:
          path: metadata.name
          value: kasm-operator

  - it: selects on name, instance, and component only
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: kasm-agent-operator
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: operator

  - it: sets the default container annotation on the pod
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: manager

  # tests/kyverno/pod-security.baseline.yaml and tests/kyverno/probes.required.yaml only inspect a pod
  # template that carries these two markers -- a template without them is skipped by both policies and
  # silently leaves the gate. Pinned here (and unconditionally, with no `set:`) so dropping either
  # annotation fails CI instead of quietly disabling the hardening and probe gates for the operator.
  - it: always marks the pod template as hardened and health-checked for the Kyverno gates
    asserts:
      - equal:
          path: spec.template.metadata.annotations["kasm.com/security"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["kasm.com/healthcheck"]
          value: "true"

  - it: does not let podAnnotations overwrite the Kyverno gate markers
    set:
      podAnnotations:
        example.com/scrape: "true"
        kasm.com/security: "false"
        kasm.com/healthcheck: "false"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["kasm.com/security"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["kasm.com/healthcheck"]
          value: "true"

  - it: merges podAnnotations and podLabels without dropping the chart's own
    set:
      podAnnotations:
        example.com/scrape: "true"
      podLabels:
        example.com/tier: control-plane
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: manager
      - equal:
          path: spec.template.metadata.labels["example.com/tier"]
          value: control-plane
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: operator

  # ---------- image ----------
  - it: falls back to the chart appVersion when image.tag is empty
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/kasmweb/agent-operator:develop

  - it: joins registry, repository, and tag into the image reference
    set:
      image:
        registry: registry.example.test
        repository: kasm/kasm-agent-operator
        tag: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.test/kasm/kasm-agent-operator:1.2.3

  - it: omits the registry prefix when image.registry is empty
    set:
      image:
        registry: ""
        tag: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: kasmweb/agent-operator:1.2.3

  - it: honors image.pullPolicy
    set:
      image:
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  # ---------- args ----------
  - it: runs /manager with the health probe bind address
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /manager
      - contains:
          path: spec.template.spec.containers[0].args
          content: --health-probe-bind-address=:8081

  - it: passes --leader-elect by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect

  - it: omits --leader-elect when leaderElect is false
    set:
      leaderElect: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --health-probe-bind-address=:8081

  # ---------- otel env ----------
  - it: points the otlp exporter at the release's collector by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://RELEASE-NAME-kasm-otel-collector:4318
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
            value: cumulative

  - it: honors an explicit otel.endpoint
    set:
      otel:
        endpoint: http://otel-collector.observability:4318
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector.observability:4318

  - it: drops the otlp env entirely when otel is disabled
    set:
      otel:
        enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: appends extraEnv after the otlp variables
    set:
      extraEnv:
        - name: LOG_LEVEL
          value: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: debug
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: OTEL_EXPORTER_OTLP_ENDPOINT

  - it: still renders extraEnv when otel is disabled
    set:
      otel:
        enabled: false
      extraEnv:
        - name: LOG_LEVEL
          value: debug
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: LOG_LEVEL
              value: debug

  # ---------- probes ----------
  - it: probes healthz and readyz on the probe port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8081
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 20
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8081
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10

  # ---------- resources ----------
  - it: always renders cpu and memory requests and limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi

  - it: honors overridden resources
    set:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m

  # ---------- security context ----------
  - it: runs as non-root under the runtime default seccomp profile
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            fsGroupChangePolicy: OnRootMismatch
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

  # ---------- pod placement and misc ----------
  - it: uses the configured service account and grace period
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: controller-manager
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 10
      - equal:
          path: spec.replicas
          value: 1

  - it: honors serviceAccount.name and replicas overrides
    set:
      replicas: 2
      serviceAccount:
        name: kasm-operator-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: kasm-operator-sa
      - equal:
          path: spec.replicas
          value: 2

  - it: omits imagePullSecrets by default
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: renders imagePullSecrets when set
    set:
      imagePullSecrets:
        - name: kasm-ai
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: kasm-ai

  - it: omits scheduling constraints by default
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity

  - it: renders nodeSelector, tolerations, and affinity when set
    set:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: node-role.kubernetes.io/control-plane
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/arch
