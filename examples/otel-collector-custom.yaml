# Apply with:  kubectl apply -n <namespace> -f examples/otel-collector-custom.yaml
# Then set:    observability.collector.gateway.existingConfigMap: kasm-otel-gateway-custom
#
# Starting point for taking full ownership of the gateway Collector's config. The gateway is
# the tier that makes the trace-sampling decision and is the only writer to ClickHouse — the
# per-zone forwarder tier (services and nginx export to it) has its own, separate
# `observability.collector.forwarder.existingConfigMap` and does not need any of this.
#
# This is the chart's own rendered gateway config, byte-for-byte, as a starting point so you
# can edit it rather than write one from scratch. The values the chart normally substitutes
# here (and that you now own, since the chart renders no config once existingConfigMap is set):
#
#   ${env:OTEL_BEARER_TOKEN}     -- forwarder -> gateway auth token. Supplied by the chart's
#                                   Deployment from the `otel-bearer-token` Secret key. If you
#                                   run this ConfigMap outside the chart's Deployment (e.g. your
#                                   own gateway), you must set OTEL_BEARER_TOKEN in that
#                                   container's environment yourself, or drop `bearertokenauth`
#                                   entirely and accept unauthenticated forwarder traffic.
#   ${env:CLICKHOUSE_PASSWORD}   -- ClickHouse credential. Supplied by the chart's Deployment
#                                   from `observability.clickhouse.existingSecret` (or the
#                                   chart-generated `clickhouse-password` key). Same caveat as
#                                   above if this ConfigMap runs outside the chart's Deployment.
#   ttl: 720h / 168h / 2160h     -- from observability.clickhouse.retention.{logsDays,
#                                   tracesDays,metricsDays} x 24. Edit these directly here once
#                                   you own the config; the chart's retention values no longer
#                                   apply.
#   sampling_percentage: 10      -- from observability.collector.tailSamplePercentage. Edit
#                                   directly here once you own the config.
#   endpoint: tcp://...:9440     -- ClickHouse native DSN, normally built from
#                                   observability.clickhouse.{nativeEndpoint,tls}. Point this at
#                                   whatever ClickHouse you want once you own the config.
#
# The env-var references above only resolve because the chart's own gateway Deployment injects
# OTEL_BEARER_TOKEN and CLICKHOUSE_PASSWORD into the container. If you deploy this ConfigMap for
# use by a Collector this chart does not manage, you are responsible for supplying those two
# environment variables yourself.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-otel-gateway-custom
data:
  config.yaml: |
    extensions:
      bearertokenauth/server:
        token: "${env:OTEL_BEARER_TOKEN}"

      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      # The forwarders and the host-log DaemonSet are this receiver's only clients. Nothing
      # addresses the gateway directly: no otlp/local (4318), no otlp/nginx (4316).
      otlp/remote:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            auth:
              authenticator: bearertokenauth/server

    processors:
      batch:
        send_batch_size: 5000
        timeout: 10s

      memory_limiter:
        check_interval: 5s
        limit_mib: 512
        spike_limit_mib: 128

      # Tail sampling is applied to the traces pipeline only. The collector buffers spans per
      # trace for decision_wait before making a keep/drop decision.
      tail_sampling:
        decision_wait: 30s
        num_traces: 50000
        expected_new_traces_per_sec: 100
        policies:
          # Always keep traces that contain at least one ERROR-status span.
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          # Always keep traces whose observed duration is >= 1000 ms.
          - name: keep-slow
            type: latency
            latency:
              threshold_ms: 1000
          # Retain this percentage of all remaining traces.
          - name: probabilistic-sample
            type: probabilistic
            probabilistic:
              sampling_percentage: 10

    exporters:
      # Three named ClickHouse exporter instances -- one per signal -- so each can carry an
      # independent TTL.
      clickhouse/logs:
        endpoint: "tcp://kasm-clickhouse:9440?secure=true&skip_verify=true&dial_timeout=10s"
        database: kasm_otel
        username: kasm_otel
        password: "${env:CLICKHOUSE_PASSWORD}"
        logs_table_name: otel_logs
        ttl: 720h
        create_schema: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      clickhouse/traces:
        endpoint: "tcp://kasm-clickhouse:9440?secure=true&skip_verify=true&dial_timeout=10s"
        database: kasm_otel
        username: kasm_otel
        password: "${env:CLICKHOUSE_PASSWORD}"
        traces_table_name: otel_traces
        ttl: 168h
        create_schema: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      clickhouse/metrics:
        endpoint: "tcp://kasm-clickhouse:9440?secure=true&skip_verify=true&dial_timeout=10s"
        database: kasm_otel
        username: kasm_otel
        password: "${env:CLICKHOUSE_PASSWORD}"
        metrics_table_name: otel_metrics
        ttl: 2160h
        create_schema: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

    service:
      extensions: [bearertokenauth/server, health_check]

      pipelines:
        logs:
          receivers: [otlp/remote]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/logs]

        traces:
          receivers: [otlp/remote]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [clickhouse/traces]

        metrics:
          receivers: [otlp/remote]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/metrics]

      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
