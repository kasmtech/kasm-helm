# Apply with:  kubectl apply -n <namespace> -f examples/otel-collector-custom.yaml
# Then set:    observability.collector.gateway.existingConfigMap: kasm-otel-gateway-custom
#
# Starting point for taking full ownership of the gateway Collector's config. The gateway is
# the only OTel Collector tier in the chart: every Kasm service, every Collector sidecar, and
# any out-of-cluster sender exports straight to it, and it is the only writer to ClickHouse.
# There is no forwarder tier and no `observability.collector.forwarder.*` values — those keys
# were removed and are now rejected by the values schema.
#
# Keep BOTH ingest protocols on `otlp/remote` below: api exports over OTLP/HTTP to
# :4318, the Collector sidecars over gRPC to :4317. Dropping either one silently blackholes
# that half of your telemetry — there is no render-time error for it.
#
# This is a gateway-shaped starting point so you can edit it rather than write one from
# scratch; its tuning values are illustrative rather than preset-derived. The values the chart
# normally substitutes here (and that you now own, since the chart renders no config once
# existingConfigMap is set):
#
#   ${env:OTEL_BEARER_TOKEN}     -- sender -> gateway auth token. Supplied by the chart's
#                                   Deployment from the `otel-bearer-token` Secret key. If you
#                                   run this ConfigMap outside the chart's Deployment (e.g. your
#                                   own gateway), you must set OTEL_BEARER_TOKEN in that
#                                   container's environment yourself, or drop `bearertokenauth`
#                                   entirely and accept unauthenticated ingest traffic.
#   ${env:CLICKHOUSE_PASSWORD}   -- ClickHouse credential. Supplied by the chart's Deployment
#                                   from `observability.clickhouse.existingSecret` (or the
#                                   chart-generated `clickhouse-password` key). Same caveat as
#                                   above if this ConfigMap runs outside the chart's Deployment.
#   ttl: 720h / 168h / 2160h     -- from observability.clickhouse.retention.{logsDays,
#                                   tracesDays,metricsDays} x 24. Edit these directly here once
#                                   you own the config; the chart's retention values no longer
#                                   apply.
#   sampling_percentage: 10      -- from observability.collector.tailSamplePercentage. Edit
#                                   directly here once you own the config.
#   endpoint: tcp://...:9440     -- ClickHouse native DSN, normally built from
#                                   observability.clickhouse.{nativeEndpoint,tls}. Point this at
#                                   whatever ClickHouse you want once you own the config.
#
# The env-var references above only resolve because the chart's own gateway Deployment injects
# OTEL_BEARER_TOKEN and CLICKHOUSE_PASSWORD into the container. If you deploy this ConfigMap for
# use by a Collector this chart does not manage, you are responsible for supplying those two
# environment variables yourself.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-otel-gateway-custom
data:
  config.yaml: |
    extensions:
      bearertokenauth/server:
        token: "${env:OTEL_BEARER_TOKEN}"

      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      # Every sender in the release addresses this receiver: api over HTTP :4318,
      # the Collector sidecars over gRPC :4317. The sidecars' own otlp/local and otlp/nginx
      # listeners are loopback-bound and pod-internal — they are not this tier's concern.
      otlp/remote:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            auth:
              authenticator: bearertokenauth/server
          # Kasm's api service exports over OTLP/HTTP, the Collector sidecars over
          # gRPC. Both protocols must stay enabled or that service's telemetry is silently
          # dropped — the chart sends it to :4318.
          http:
            endpoint: "0.0.0.0:4318"
            auth:
              authenticator: bearertokenauth/server

    processors:
      batch:
        send_batch_size: 5000
        timeout: 10s

      memory_limiter:
        check_interval: 5s
        limit_mib: 512
        spike_limit_mib: 128

      # Emitters disagree on severity spelling: Python logs WARNING, Go logs lowercase, the nginx
      # access parser passes a raw status through when it has no mapping. The Admin UI's level
      # cascade compares the Python names, so normalise here.
      transform/severity:
        log_statements:
          - context: log
            statements:
              - set(severity_text, ConvertCase(severity_text, "upper")) where severity_text != nil
              - set(severity_text, "WARNING") where severity_text == "WARN"
              - set(severity_text, "CRITICAL") where severity_text == "FATAL"
              - set(severity_text, "ERROR") where IsMatch(severity_text, "^5[0-9][0-9]$")
              - set(severity_text, "WARNING") where IsMatch(severity_text, "^4[0-9][0-9]$")
              - set(severity_text, "INFO") where IsMatch(severity_text, "^[0-9]+$")

      # Successful readiness polls are a large share of log volume on an idle cluster and never
      # useful in a search. Failed probes stay: a 502 on the healthcheck is the clearest sign the
      # API was down. Both the nginx access row and the API's own access log line are covered.
      filter/healthcheck:
        error_mode: ignore
        logs:
          log_record:
            - 'attributes["url.path"] == "/api/__healthcheck" and attributes["http.response.status_code"] == "200"'
            - 'resource.attributes["service.name"] == "kasm-api" and IsMatch(body, "/api/__healthcheck HTTP/1\\.[01]. 200 ")'

      # ngx_otel_module's http.target/http.url span attributes carry the raw query string (JWTs and
      # session passwords have been observed in it). Strip it before tail sampling buffers the span.
      transform/nginx_scrub:
        trace_statements:
          - context: span
            statements:
              - replace_pattern(attributes["http.target"], "\\?.*$", "") where resource.attributes["service.name"] == "kasm-proxy" and attributes["http.target"] != nil
              - replace_pattern(attributes["http.url"], "\\?.*$", "") where resource.attributes["service.name"] == "kasm-proxy" and attributes["http.url"] != nil

      # Tail sampling is applied to the traces pipeline only. The collector buffers spans per
      # trace for decision_wait before making a keep/drop decision.
      tail_sampling:
        decision_wait: 30s
        num_traces: 50000
        expected_new_traces_per_sec: 100
        policies:
          # Always keep traces that contain at least one ERROR-status span.
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          # Always keep traces whose observed duration is >= 1000 ms.
          - name: keep-slow
            type: latency
            latency:
              threshold_ms: 1000
          # Retain this percentage of all remaining traces.
          - name: probabilistic-sample
            type: probabilistic
            probabilistic:
              sampling_percentage: 10

    exporters:
      # Three named ClickHouse exporter instances -- one per signal -- so each can carry an
      # independent TTL.
      clickhouse/logs:
        endpoint: "tcp://kasm-clickhouse:9440?secure=true&skip_verify=true&dial_timeout=10s"
        database: kasm_otel
        username: kasm_otel
        password: "${env:CLICKHOUSE_PASSWORD}"
        logs_table_name: otel_logs
        ttl: 720h
        create_schema: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      clickhouse/traces:
        endpoint: "tcp://kasm-clickhouse:9440?secure=true&skip_verify=true&dial_timeout=10s"
        database: kasm_otel
        username: kasm_otel
        password: "${env:CLICKHOUSE_PASSWORD}"
        traces_table_name: otel_traces
        ttl: 168h
        create_schema: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      clickhouse/metrics:
        endpoint: "tcp://kasm-clickhouse:9440?secure=true&skip_verify=true&dial_timeout=10s"
        database: kasm_otel
        username: kasm_otel
        password: "${env:CLICKHOUSE_PASSWORD}"
        metrics_table_name: otel_metrics
        ttl: 2160h
        create_schema: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

    service:
      extensions: [bearertokenauth/server, health_check]

      pipelines:
        logs:
          receivers: [otlp/remote]
          processors: [memory_limiter, transform/severity, filter/healthcheck, batch]
          exporters: [clickhouse/logs]

        traces:
          receivers: [otlp/remote]
          processors: [memory_limiter, transform/nginx_scrub, tail_sampling, batch]
          exporters: [clickhouse/traces]

        metrics:
          receivers: [otlp/remote]
          processors: [memory_limiter, batch]
          exporters: [clickhouse/metrics]

      telemetry:
        logs:
          level: info
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
