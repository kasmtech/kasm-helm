# kasm-agent values for the two-namespace, single-cluster layout: the control plane (kasm-helm)
# in namespace `kasm`, this agent in namespace `kasm-agent`, DIRECT connections. The other half
# is examples/kasm-agent/single-cluster-control-plane-values.yaml. The layout and its trade-offs:
# docs/how-to/install/two-namespaces.md.
#
# Two namespaces keeps the blast radii apart: the `privileged` Pod Security Standard that
# nodePrep / videoDevicePlugin / egressInstaller need stays confined to THIS namespace, and the
# umbrella's baseline NetworkPolicies can be enforced here (below) without cutting off the
# control plane.
#
# Install order (control plane first: the agent needs its zone and token):
#
#   # 1. Control plane
#   helm install kasm oci://registry-1.docker.io/kasmweb/kasm-helm -n kasm --create-namespace \
#     -f examples/kasm-agent/single-cluster-control-plane-values.yaml
#
#   # 2. Copy the registration token across (Secrets do not cross namespaces)
#   kubectl create namespace kasm-agent
#   kubectl create secret generic kasm-manager-token -n kasm-agent \
#     --from-literal=token="$(kubectl get secret kasm-secrets -n kasm \
#       -o jsonpath='{.data.manager-token}' | base64 -d)"
#
#   # 3. The agent (this file)
#   helm install kasm-agent oci://registry-1.docker.io/kasmweb/kasm-agent -n kasm-agent \
#     -f examples/kasm-agent/single-cluster-agent-values.yaml
#
#   (From a checkout: `make deps-agent` first, then charts/kasm-helm and charts/kasm-agent in
#   place of the OCI references.)
#
# Out-of-chart prerequisites: an ingress controller (traefik below), DNS for
# sessions.example.com pointing at it, and a kubernetes.io/tls Secret `kasm-agent-public-tls`
# in namespace kasm-agent for that hostname (or cert-manager). The `kasm.com/role=manager` label
# on the control plane's namespace is optional and only needed for direct manager->workspace
# ingress.
#
# Placeholders: every example.com hostname and the TLS Secret name.
#
# Hostname plan, both under ONE parent domain (the control-plane values seed kasm_auth_domain
# to that parent, so the session cookie reaches both):
#   control plane UI/API:  kasm.example.com        (that file's publicAddr)
#   agent session proxy:   sessions.example.com    (agent.publicHostname here)

agent:
  manager:
    # The control plane's publicAddr. Leave pathPrefix at its /manager_api default.
    hostname: kasm.example.com
    # The Secret created in step 2 of the install order above.
    existingTokenSecret: kasm-manager-token
    tokenSecretKey: token

  # Must differ from the control plane's publicAddr and share its parent domain.
  publicHostname: sessions.example.com

  # The zone this agent registers into; the control-plane values preseed exactly this
  # one, with direct connections enabled.
  zone: default

  sessionProxy:
    # The session proxy's own TLS Secret. The chart generates a self-signed one at this
    # name unless a Secret of that name already exists; with the Ingress below
    # terminating TLS, browsers never see it. Pre-create it, or uncomment the
    # certificate block, for a real one.
    certSecretName: kasm-session-proxy-tls
    # certificate:
    #   enabled: true
    #   issuerRef:
    #     name: letsencrypt
    #     kind: ClusterIssuer

  # Expose the session proxy on publicHostname. Exactly ONE of ingress / httpRoute /
  # route (OpenShift) / tlsRoute / gatewayRoute may be enabled; the chart refuses to
  # render more than one. Kasm sessions are long-lived websockets: the controller must
  # allow upgrades and use read/send timeouts of at least 3600s.
  ingress:
    enabled: true
    className: traefik
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      - secretName: kasm-agent-public-tls
        hosts:
          - sessions.example.com

# In a dedicated namespace the baseline NetworkPolicies are safe to enforce — they
# model exactly this stack's traffic (OTLP, session-proxy ingress, manager egress,
# DNS) and nothing else shares the namespace. This is one of the two reasons the
# two-namespace layout is recommended.
networkPolicies:
  enabled: true
  manager:
    # LIVE-VERIFIED GOTCHA: with hostPort/ServiceLB-style ingress (k3s + traefik), the
    # node DNATs :443 to the ingress controller's backend port BEFORE NetworkPolicy
    # evaluation — so reaching an in-cluster manager through its public hostname needs
    # that backend port allowed as well (traefik's websecure is 8443). Symptom if
    # missing: agent heartbeats fail with "connection refused" and the manager reports
    # "No Agent slots available". Drop 8443 if your manager is reached through an
    # external LB that terminates before the node.
    ports: [443, 80, 8443]

# Optional per-feature infrastructure, all off by default. Enabling nodePrep or
# videoDevicePlugin requires the `privileged` Pod Security Standard on THIS namespace
# only — the control-plane namespace is unaffected (the other reason this layout is
# recommended):
#
#   kubectl label namespace kasm-agent pod-security.kubernetes.io/enforce=privileged
#
# nodePrep:
#   enabled: true              # kernel modules (v4l2loopback for webcam) + node tuning
#   tuning:
#     sysctls:
#       enabled: true          # desktop-density inotify limits
#     swap:
#       enabled: true          # requires kubelet fail-swap-on=false first; see
#                              # docs/how-to/nodes/tuning-and-swap.md
# videoDevicePlugin:
#   enabled: true              # advertises /dev/video* as kasm.com/video
# csiRclone:
#   enabled: true              # cloud storage mappings (pair with agent.storageMappings)
# nfs-server-provisioner:
#   enabled: true              # in-cluster RWX StorageClass for shared profiles
