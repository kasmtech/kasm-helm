# kasm-helm (control plane) values for the two-namespace, single-cluster layout: this release in
# namespace `kasm`, the agent in namespace `kasm-agent` (examples/kasm-agent/single-cluster-agent-values.yaml,
# whose header carries the install order), DIRECT connections. For everything in ONE namespace
# and one release instead, use examples/kasm-agent/platform-values.yaml with the kasm-platform
# chart. The layout and its trade-offs: docs/how-to/install/two-namespaces.md.
#
# Out-of-chart prerequisites: an ingress controller (traefik below), DNS for kasm.example.com
# pointing at it, and a kubernetes.io/tls Secret `kasm-tls` in namespace kasm for that hostname
# (or cert-manager).
#
# Placeholders: every example.com hostname, the manager token and the TLS Secret name.
# NOTHING HERE IS A REAL SECRET.
#
# Hostname plan (both under ONE parent domain; the auth cookie must cover both):
#   control plane UI/API:  kasm.example.com        (publicAddr here)
#   agent session proxy:   sessions.example.com    (agent.publicHostname in the agent chart)
#   auth cookie domain:    example.com             (kasm_auth_domain below)

deploymentSize: small
publicAddr: kasm.example.com

# ClusterIP + the chart's own Ingress: the Ingress owns the external address.
# A LoadBalancer here is a second, differently-configured door onto the same
# Service, and on k3s ServiceLB it collides with the controller's :443.
proxyService:
  type: ClusterIP
ingress:
  enabled: true
  ingressClassName: traefik
  backendProtocol: http

certificate:
  # A kubernetes.io/tls Secret for publicAddr; issue it with cert-manager or supply
  # your own. Users' browsers must trust it.
  secretName: kasm-tls

kasmSecrets:
  passwords:
    # Pinning the manager token here means the agent chart can reference a known
    # value instead of reading it back after install:
    #   kubectl create secret generic kasm-manager-token -n kasm-agent \
    #     --from-literal=token='<the same value>'
    # Leave the other passwords unset so they stay randomly generated.
    manager-token: "change-me-agent-registration-token"

# The relayed default needs none of the settings below: browsers talk only to the
# control plane, whose proxy reaches the agent's session proxy inside the cluster.
# This file switches the zone to DIRECT connections, where browsers reach the
# session proxy on its own hostname (what the agent chart's ingress / httpRoute /
# route / tlsRoute / gatewayRoute publish). All three settings are preseeded on a
# FRESH database only; on an EXISTING control plane change them in the admin UI
# (Infrastructure -> Zones; Settings -> Auth) instead.
kasmZones:
  - name: default
    proxyAddress: kasm.example.com
    # Browsers connect to the agent's hostname instead of being relayed through the
    # control-plane proxy.
    proxy_connections: false
    # Where the agent-side session proxy validates sessions: the control plane's
    # publicAddr, not the $request_host$ default (the agent's own hostname).
    upstream_auth_address: kasm.example.com

kasmConfig:
  # Required for the kasmZones above to reach the database: the preseed is generated
  # only when this is true, and only applies on a fresh install.
  generatePreseed: true

  # The "Kasm Authorization Domain" (kasm_auth_domain) global setting: the PARENT
  # domain covering both hostnames, so the session cookie reaches the agent's
  # hostname. The $request_host$ default pins it to the control-plane hostname and
  # every direct session connection fails with a 401. Applied last, against the
  # finished seed file, so it wins over kasmConfig.config.settings and over
  # existingDefaultPropertiesSecret.
  authDomain: example.com
