# kasm-platform values: the control plane and the Kubernetes agent as ONE release in ONE
# namespace, switched from the relayed default to DIRECT connections (browsers reach the
# session proxy on its own hostname). The relayed default needs no values at all; that install
# is docs/tutorials/get-started.md. This layout and its trade-offs: docs/how-to/install/one-cluster.md.
#
#   helm install kasm oci://registry-1.docker.io/kasmweb/kasm-platform -n kasm --create-namespace \
#     -f examples/kasm-agent/platform-values.yaml --timeout 20m
#
# (From a checkout: `make deps-agent` first, then charts/kasm-platform in place of the OCI
# reference.) The `--timeout 20m` covers database initialization and the first image pulls on a
# cold cluster.
#
# Out-of-chart prerequisites: an ingress controller (traefik below), DNS for both hostnames
# pointing at it, and two kubernetes.io/tls Secrets in namespace kasm, `kasm-tls` for
# kasm.example.com and `kasm-agent-public-tls` for sessions.example.com (or cert-manager for
# both). The `kasm.com/role=manager` namespace label is optional and only needed for direct
# manager->workspace ingress.
#
# Placeholders: every example.com hostname, the manager token, and the TLS Secret names.
# NOTHING HERE IS A REAL SECRET. Everything under `kasm-helm:` is a charts/kasm-helm value and
# everything under `kasm-agent:` a charts/kasm-agent value; their READMEs are the value references.
#
# Hostname plan, both under ONE parent domain (the session cookie has to reach both):
#   control plane UI/API:  kasm.example.com        (kasm-helm.publicAddr)
#   agent session proxy:   sessions.example.com    (kasm-agent.agent.publicHostname)
#   auth cookie domain:    example.com             (kasm-helm.kasmConfig.authDomain)

# ---------------------------------------------------------------------------------------------
# The umbrella's own values
# ---------------------------------------------------------------------------------------------

# This chart owns no values of its own beyond `extraObjects`; everything below belongs to one of
# the two dependencies. The auth cookie domain is set with `kasm-helm.kasmConfig.authDomain`, in
# the control-plane block.

# ---------------------------------------------------------------------------------------------
# The control plane (charts/kasm-helm)
# ---------------------------------------------------------------------------------------------
kasm-helm:
  enabled: true

  deploymentSize: small
  publicAddr: kasm.example.com

  # ClusterIP plus the chart's own Ingress: the Ingress owns the external address. A LoadBalancer
  # here would be a second door onto the same Service carrying none of the Ingress's TLS, timeouts
  # or host routing — and on host-networked load balancers (k3s ServiceLB) it collides with the
  # controller's :443 outright. The chart rejects the combination.
  proxyService:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    backendProtocol: http

  certificate:
    # A kubernetes.io/tls Secret covering publicAddr. Issue it with cert-manager or supply your own;
    # users' browsers must trust it.
    secretName: kasm-tls

  kasmSecrets:
    passwords:
      # Pinning the manager token means the agent half of this same release can reference it
      # without anyone reading it back after install. Leave the other four keys unset so they stay
      # randomly generated; read admin-password back out of the "<release>-secrets" Secret this
      # block creates when you first sign in.
      manager-token: "change-me-agent-registration-token"

  # The relayed default needs none of the zone settings below: browsers talk only to the control
  # plane, whose proxy reaches the session proxy inside the cluster. This file switches the zone
  # to DIRECT connections, where browsers reach the session proxy on its own hostname. Both
  # settings are preseeded on a FRESH database only; on an existing control plane make the same
  # two changes in the admin UI under Infrastructure -> Zones.
  #   proxy_connections: false      browsers connect to the agent's hostname instead of being
  #                                 relayed through the control-plane proxy.
  #   upstream_auth_address         where the agent-side session proxy validates sessions: the
  #                                 control plane's publicAddr, not the $request_host$ default.
  kasmZones:
    - name: default
      proxy_hostname: kasm.example.com
      proxy_connections: false
      upstream_auth_address: kasm.example.com

  kasmConfig:
    # Required for the kasmZones above to reach the database.
    generatePreseed: true

    # The PARENT domain of publicAddr and kasm-agent.agent.publicHostname. It scopes the Kasm
    # session cookie (kasm_auth_domain) so the cookie reaches both hostnames; only direct
    # connections need it. Applied at database initialization, so fresh installs only: on an
    # existing database set it in the admin UI (Settings -> Auth). It is applied last, against
    # the finished seed file, so it wins over kasmConfig.config.settings and over
    # existingDefaultPropertiesSecret.
    authDomain: example.com

    # Optionally seed workspace images at database initialization too, so the library is
    # not empty on first login (a fresh Kasm database seeds no workspaces). Uncomment and
    # adapt; the full field reference is in docs/reference/preseed.md:
    # config:
    #   images:
    #     - name: kasmweb/doom:develop
    #       friendly_name: Doom
    #       description: Doom via KasmVNC
    #       image_type: Container
    #       enabled: true
    #       cores: 1
    #       memory_bytes: 1610612736
    #       docker_registry: https://kcr.kasmweb.com/v1/
    #       categories:
    #         - Games

# ---------------------------------------------------------------------------------------------
# The Kubernetes agent (charts/kasm-agent)
# ---------------------------------------------------------------------------------------------
kasm-agent:
  enabled: true

  agent:
    manager:
      # The control plane's publicAddr. /manager_api is the path its proxy routes to the manager,
      # and is the chart default — do not empty it unless addressing the manager Service directly.
      hostname: kasm.example.com
      # One namespace, one release: the agent reads the control plane's own Secret directly. No
      # copying, no second Secret to keep in sync. (Across namespaces, copy the value into the
      # agent's namespace instead — Secrets do not cross namespaces.)
      existingTokenSecret: kasm-secrets
      tokenSecretKey: manager-token

    # Must differ from kasm-helm.publicAddr, and share its parent domain.
    publicHostname: sessions.example.com

    # The zone the agent registers into. It must already exist on the control plane; the kasmZones
    # block above seeds exactly this one.
    zone: default

    sessionProxy:
      # The session proxy's own TLS Secret. The chart generates a self-signed one at this name
      # unless a Secret of that name already exists; with the Ingress below terminating TLS,
      # browsers never see it. Pre-create it, or enable sessionProxy.certificate, for a real one.
      certSecretName: kasm-session-proxy-tls
      # certificate:
      #   enabled: true
      #   issuerRef:
      #     name: letsencrypt
      #     kind: ClusterIssuer

    # Expose the session proxy on publicHostname. Exactly ONE of ingress / httpRoute / route /
    # tlsRoute / gatewayRoute may be enabled; the chart refuses to render more than one. Kasm
    # sessions are long-lived websockets: the controller must allow upgrades and use read and
    # send timeouts of at least 3600s, or sessions are cut off mid-use.
    ingress:
      enabled: true
      className: traefik
      tls:
        - secretName: kasm-agent-public-tls
          hosts:
            - sessions.example.com

  # The umbrella's baseline NetworkPolicies model only the agent stack's traffic. In a shared
  # namespace they would cut the control plane off, so leave them disabled here.
  networkPolicies:
    enabled: false

  # Off by default and left off: both need the namespace to permit the `privileged` Pod Security
  # Standard, which in a shared namespace then also covers the control-plane pods.
  nodePrep:
    enabled: false
  videoDevicePlugin:
    enabled: false
