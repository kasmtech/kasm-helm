# Node-side kubelet configuration for Kasm workspace nodes on k3s.
#
# ============================================================================================
# NOTHING IN THIS FILE IS APPLIED BY THE HELM CHART.
#
# These are node files. Copy them onto every workspace node, restart k3s, and only then enable
# `nodePrep.tuning.swap` in the chart's values. A Helm chart cannot configure a kubelet: the
# kubelet is what runs the chart's pods, and its configuration lives on the node's disk.
#
# ORDER MATTERS. A kubelet running with the default `failSwapOn: true` REFUSES TO START while
# the node has swap active. Turning on swap first looks fine until the next kubelet restart or
# node reboot, at which point the node goes NotReady -- possibly weeks later, during unrelated
# maintenance. `kasm-node-prep` guards against exactly this: it will not create a swapfile until
# it can read `fail-swap-on=false` out of /etc/rancher/k3s/config.yaml (or `failSwapOn: false`
# out of /var/lib/kubelet/config.yaml), so applying this file is the step that unblocks it.
# ============================================================================================
#
# Procedure, per node:
#
#   1. Write the two files below to their paths on the node (see the headers of each part).
#   2. Restart k3s:            sudo systemctl restart k3s          # server nodes
#                              sudo systemctl restart k3s-agent    # agent nodes
#   3. Confirm the kubelet came back with the settings live:
#        kubectl get --raw "/api/v1/nodes/<node>/proxy/configz" | jq .
#        kubectl get node <node>          # must be Ready before continuing
#   4. Only now enable the chart feature:
#        helm upgrade ... --set nodePrep.enabled=true --set nodePrep.tuning.swap.enabled=true
#   5. Watch it land:
#        kubectl logs -l app.kubernetes.io/component=node-prep -f | grep -i swap
#        # then on the node:  swapon --show
#
# Requires cgroup v2 (the unified hierarchy) and Kubernetes >= 1.30 for LimitedSwap in beta;
# NodeSwap is stable as of 1.36. k3s ships cgroup v2 on every current distribution.

# --------------------------------------------------------------------------------------------
# PART 1 -- /etc/rancher/k3s/config.yaml
# --------------------------------------------------------------------------------------------
# Merge these keys into whatever that file already holds; k3s reads it at startup and passes
# `kubelet-arg` entries straight through to the kubelet it embeds. `config=` points the kubelet
# at the component config in PART 2 -- that indirection exists because most of the settings
# below have no command-line flag any more.
#
# k3s also reads /etc/rancher/k3s/config.yaml.d/*.yaml, so this can equally be dropped in as
# e.g. /etc/rancher/k3s/config.yaml.d/10-kasm-workspace-node.yaml, which is tidier when the
# node is otherwise managed by something else. kasm-node-prep's safety check reads both.

kubelet-arg:
  # The prerequisite. Without it the kubelet refuses to start once swap is active.
  - fail-swap-on=false
  # Everything else lives in the KubeletConfiguration file in PART 2.
  - config=/etc/rancher/k3s/kubelet.yaml

# --------------------------------------------------------------------------------------------
# PART 2 -- /etc/rancher/k3s/kubelet.yaml
# --------------------------------------------------------------------------------------------
# A standalone KubeletConfiguration object. Write it as its own file at the path referenced
# above -- it is shown here in the same example for convenience, but the two are separate files.
#
# ---
# apiVersion: kubelet.config.k8s.io/v1beta1
# kind: KubeletConfiguration
#
# # Repeated here so the two sources agree; the kubelet-arg above is what k3s acts on.
# failSwapOn: false
#
# # Without this the kubelet tolerates node swap but grants no pod any of it, and enabling swap
# # buys nothing. LimitedSwap gives each *Burstable* pod a share proportional to its memory
# # request:
# #
# #     pod swap limit = (pod memory request / node MemTotal) x total node swap
# #
# # A default Kasm workspace (2768Mi) on a 16 GiB node with an 8 GiB swapfile therefore gets
# # 2768 / 16384 x 8192 MiB ~= 1384 MiB. Guaranteed pods (memory request == limit) and
# # BestEffort pods get zero -- do not pin workspace memory requests to their limits if you
# # want sessions to benefit from this.
# memorySwap:
#   swapBehavior: LimitedSwap
#
# # --- Image garbage collection -------------------------------------------------------------
# # Kasm workspace images are multi-GB. The stock high threshold of 85% starts evicting them
# # while the node is still healthy, and every eviction is paid back as a multi-GB re-pull the
# # next time a user launches that workspace. 90/80 matches the `disk_usage_limit: 0.90` that
# # the Kasm agent itself uses as its image-pull guard, so the two agree on when disk is full.
# imageGCHighThresholdPercent: 90
# imageGCLowThresholdPercent: 80
#
# # --- Container logs -----------------------------------------------------------------------
# # Desktop sessions are chatty (Xorg, the desktop environment, the browser). The default 10Mi
# # cap with 5 rotations bounds each container at ~50Mi; set both explicitly so a log-storm in
# # one session cannot fill the disk the images above are being kept on.
# containerLogMaxSize: 10Mi
# containerLogMaxFiles: 5
#
# # --- PID limits ---------------------------------------------------------------------------
# # A single Kasm session is a desktop environment plus a browser, and a browser alone is
# # dozens of processes and hundreds of threads. The kubelet's default podPidsLimit of -1
# # (unlimited, bounded only by the node) lets one runaway session exhaust the node's PIDs;
# # a generous explicit per-pod cap contains that without tripping normal use.
# podPidsLimit: 8192
#
# # --- Eviction -----------------------------------------------------------------------------
# # Optional. Workspace pods use a memory-backed emptyDir for /dev/shm (2Gi by default), which
# # counts against the pod's memory and toward node memory pressure. If you see sessions
# # evicted under load before the node is genuinely out of memory, raise the reserve rather
# # than lowering the threshold.
# # systemReserved:
# #   memory: 1Gi
# # kubeReserved:
# #   memory: 1Gi

# --------------------------------------------------------------------------------------------
# ROLLING IT BACK
# --------------------------------------------------------------------------------------------
# Order matters here too, in reverse:
#
#   1. Set nodePrep.tuning.swap.enabled=false and upgrade the release, so the reconcile loop
#      stops re-activating swap.
#   2. On each node:  sudo swapoff /var/lib/kasm-node-prep/kasm.swap
#                     sudo rm -f  /var/lib/kasm-node-prep/kasm.swap
#      (The chart never writes /etc/fstab, so there is nothing to edit back.)
#   3. Only then remove `fail-swap-on=false` and restart k3s.
#
# Removing the kubelet setting while swap is still active is the same footgun in reverse: the
# kubelet will not come back up.
