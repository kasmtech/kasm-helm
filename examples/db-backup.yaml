---
# Kasm DB Backup Job
#
# Use this to take a one-off backup of the Kasm PostgreSQL database into a PVC:
# before a manual migration, before a restore rehearsal, or before an uninstall
# (the database PVC is deleted with the release unless
# database.storage.retentionPolicy.whenDeleted is Retain).
#
# Note: a chart upgrade (dbManagement.upgrade.enable=true) takes its own
#       pre-upgrade backup; this Job is not needed for that path.
#
# Prerequisites:
#   - This job must be deployed in the same namespace as your Kasm Helm release.
#
# Field reference:
#   POSTGRES_HOST       — DB service name, {RELEASE_NAME}-db for the bundled database.
#                         Retrieve with: kubectl -n {NAMESPACE} get service
#   POSTGRES_DB         — Defaults to kasm. Only change if you overrode database.kasmDbName in my-values.yaml.
#   POSTGRES_USER       — Defaults to kasmapp. Only change if you overrode database.kasmDbUser in my-values.yaml.
#   secretKeyRef.name   — Must be {RELEASE_NAME}-secrets, where {RELEASE_NAME} is your Helm release name.
#   secretKeyRef.key    — The key storing the DB password. Auto-generated by the Helm chart; defaults to db-password.
#   image               — Any Kasm api image; the version only has to ship pg_dump.
#   storageClassName    — Storage class for the backup PVC. Commented out by default to use the namespace
#                         default. Uncomment and set a value to use a specific storage class.
#
# Before applying:
#   1. Replace all values marked with # <-- REPLACE
#   2. Apply with:  kubectl apply -n {NAMESPACE} -f examples/db-backup.yaml
#   3. Monitor completion with: kubectl logs -f job/backup -n {NAMESPACE}
#   4. Verify the dump was created (the log ends with an ls of kasm_dump.tar).
#
apiVersion: batch/v1
kind: Job
metadata:
  name: backup
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: OnFailure
      initContainers:
        - name: db-is-ready
          image: kasmweb/api:1.19.0  # <-- REPLACE with your Kasm version
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              value: "POSTGRES_HOST"   # <-- REPLACE with your DB service name ({RELEASE_NAME}-db)
            - name: POSTGRES_PORT
              value: "5432"
          command:
            - "/bin/bash"
            - "-c"
          args:
            - |
              while ! pg_isready -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -t 10; do echo "Waiting for DB..."; sleep 5; done
      containers:
        - name: kasm-old-db-backup-container
          image: kasmweb/api:1.19.0  # <-- REPLACE with your Kasm version
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              value: "POSTGRES_HOST"   # <-- REPLACE with your DB service name ({RELEASE_NAME}-db)
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: kasm
            - name: POSTGRES_USER
              value: kasmapp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: db-password
                  name: kasm-secrets  # <-- REPLACE with {RELEASE_NAME}-secrets
          command:
            - "/bin/bash"
            - "-c"
          args:
            - |
              export PGPASSWORD=$POSTGRES_PASSWORD;
              echo "Creating DB Backup..."
              pg_dump -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -d $POSTGRES_DB -Ft > /data/kasm-db-dump/kasm_dump.tar;
              ls -lah /data/kasm-db-dump/kasm_dump.tar;
          volumeMounts:
            - name: kasm-db-dump
              mountPath: /data/kasm-db-dump
              readOnly: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: kasm-db-dump
          persistentVolumeClaim:
            claimName: kasm-db-dump-pvc
---
# PVC definition
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kasm-db-dump-pvc
spec:
  # storageClassName: ""  # <-- Uncomment and set to use a specific storage class. Leave commented to use the namespace default.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
